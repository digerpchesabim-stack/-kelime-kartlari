<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d94f4f">
<title>Kelime Kartları</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f0ea;--card:#fffdfa;--ink:#23262f;--mute:#7a7f8c;--line:#e8e3da;--red:#e07a68;--red-soft:#fcebe6;--ok:#4f9b86;--ok-soft:#e2f1ec;--bad:#cf6457;--bad-soft:#fbe5e1;--blue:#6f80d0;--blue-soft:#e8ebfa;--amber:#c99530;--amber-soft:#fbf1da;--shadow:0 1px 2px rgba(40,30,20,.05),0 8px 24px rgba(40,30,20,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--card:#1e2027;--ink:#ecebe8;--mute:#9a9ea9;--line:#2c2f38;--red:#ee8e7c;--red-soft:#39282a;--ok:#6fc0a8;--ok-soft:#1d3530;--bad:#ef8174;--bad-soft:#3a2522;--blue:#93a3f0;--blue-soft:#262a45;--amber:#e3b455;--amber-soft:#3b3220;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:22px 18px 110px}
h1{font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:2px 0 16px}h2{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:20px 0 8px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}.mute{color:var(--mute);font-size:14px}
.btn{appearance:none;border:1px solid var(--line);border-radius:18px;padding:15px 18px;font:700 16px inherit;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer;width:100%;text-align:center;transition:transform .12s}
.btn.primary{background:linear-gradient(135deg,#ec9080,#df7664);color:#fff;border:0;box-shadow:0 8px 20px rgba(224,122,104,.35)}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:active,.tile:active{transform:scale(.97)}.btn[disabled]{opacity:.45}.btn.opt[disabled]{opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center}.stat b{display:block;font-size:30px;font-weight:800;color:var(--ink);line-height:1.1}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ee9a8a,#e07a68);border-radius:6px}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--red);font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.mute{background:var(--line);color:var(--mute)}.badge.hard{background:var(--amber-soft);color:var(--amber)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(40,30,20,.06);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:flex;width:100%;max-width:560px;padding:8px 6px 6px}nav button{flex:1;background:none;border:0;padding:2px 0;color:var(--mute);font:700 12px inherit;font-family:inherit}
nav .pill{display:grid;place-items:center;width:60px;height:34px;border-radius:17px;margin:0 auto 3px;transition:background .15s}
nav button.on{color:var(--red)}nav button.on .pill{background:var(--red-soft)}nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(135deg,var(--red-soft),var(--blue-soft));border-radius:28px;padding:20px;margin-bottom:16px;display:flex;gap:18px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.tile{display:flex;gap:16px;align-items:center;padding:18px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:transform .12s;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.tile .ib{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}.tile .mute{display:block;margin-top:1px}.tile[disabled]{opacity:.5}
.tile.sm{flex-direction:column;align-items:flex-start;gap:12px;margin:0}.tile.sm b{font-size:18px}
.t-red .ib{background:var(--red-soft);color:var(--red)}.t-ok .ib{background:var(--ok-soft);color:var(--ok)}.t-blue .ib{background:var(--blue-soft);color:var(--blue)}.t-amber .ib{background:var(--amber-soft);color:var(--amber)}
.tile.feat{padding:22px}.tile.feat.t-red{background:linear-gradient(135deg,var(--red-soft),var(--card) 70%)}.tile.feat.t-ok{background:linear-gradient(135deg,var(--ok-soft),var(--card) 70%)}
.fc{min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;border-radius:30px;padding:28px}
.fc .w{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0;word-break:break-word}.fc .ipa{color:var(--mute);font-size:19px}
.fc .tr{font-size:30px;font-weight:800;color:var(--red)}.fc .en{font-size:19px;margin-top:14px}.fc .en b{color:var(--red)}.fc .sentr{color:var(--mute);margin-top:4px}
.fc .tip{margin-top:14px;font-size:14px;background:var(--red-soft);padding:10px 12px;border-radius:14px;text-align:left}
.sp{border:0;background:var(--red-soft);color:var(--red);border-radius:50%;width:48px;height:48px;font-size:20px;margin-top:6px}
.prog{display:flex;gap:8px;align-items:center;margin-bottom:12px}.prog .bar{flex:1}
.opt{margin-bottom:10px}.opt.right{background:var(--ok);color:#fff;border-color:transparent}.opt.wrong{background:var(--bad);color:#fff;border-color:transparent}
.q{font-size:23px;line-height:1.55;margin:6px 0 4px}.q u{display:inline-block;min-width:80px;border-bottom:3px solid var(--red);text-decoration:none;color:var(--red);text-align:center;font-weight:800}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt .btn{padding:16px 8px;font-size:15px}
.mt .btn.sel{outline:3px solid var(--blue)}.mt .btn.done{visibility:hidden}.mt .btn.shake{background:var(--bad-soft)}
.list .it{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}.list .it .n{font-weight:700}
input[type=search],input[type=text],select{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px}.hdr b{font-size:21px;font-weight:800}.hdr .back{background:var(--card);border:0;border-radius:50%;width:42px;height:42px;font-size:22px;color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#2b2d35;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30}
.center{text-align:center}.big{font-size:54px}.tiny{font-size:12px}
.tx p{font-size:20px;line-height:1.85;margin:0 0 14px}.tx p.trp{font-size:15px;line-height:1.55;color:var(--mute);margin:-6px 0 14px;padding-left:10px;border-left:3px solid var(--line)}
.tk{cursor:pointer;border-radius:5px;padding:0 1px}.tk.l{background:var(--ok-soft)}.tk.a{background:var(--red-soft)}.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--red-soft);overflow:hidden;flex:none;line-height:1}.av img{width:100%;height:100%;object-fit:cover}.avb{border:0;background:none;padding:0;cursor:pointer}
.emg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 0}.emb{border:2px solid transparent;background:var(--card);border-radius:18px;font-size:32px;padding:10px 0;box-shadow:var(--shadow)}.emb.on{border-color:var(--red);background:var(--red-soft)}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}.upd{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));z-index:60;background:var(--ink);color:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-weight:700}.upd span{flex:1}.upd button{border:0;border-radius:12px;padding:9px 14px;background:var(--red);color:#fff;font:800 14px inherit;font-family:inherit}
@media print{nav,.no-print,#sheet,.toast,.upd{display:none!important}body{background:#fff!important}main{padding-bottom:0!important}.card{box-shadow:none!important;border:1px solid #ddd;break-inside:avoid}}
.tk.rd{background:var(--blue-soft);border-radius:4px}.tk.rw{background:var(--red);color:#fff;border-radius:4px}
.ch{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:700 14px inherit;font-family:inherit}.ch.on{background:var(--red);border-color:var(--red);color:#fff}
.lgb{border:0;border-radius:10px;padding:6px 12px;font:700 13px inherit;font-family:inherit;color:var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12px;font-weight:600}.lg span{padding:3px 10px;border-radius:8px}
.sbg{position:fixed;inset:0;background:rgba(20,15,10,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.sheet .ctx{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div id="sheet"></div><div id="root"><main id="app"></main>
<nav><div class="in"></div></nav></div>
<script>
/* ===== DATA ===== */
const WORDS = /*WORDS_JSON*/;
const TEXTS = /*TEXTS_JSON*/;
/* ===== StorageService ===== */
const StorageService=(()=>{let K=null;let mem=null;
 const base=()=>({v:1,progress:{},settings:{activeSize:10},stats:{last:'',streak:0,today:{d:'',n:0}}});
 return{use(k){K=k;mem=null},base,load(){if(!K)return base();try{const s=localStorage.getItem(K);if(s){const o=JSON.parse(s);if(o&&o.v===1)return o}}catch(e){}return mem||base()},
  save(st){if(!K)return;mem=st;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}},
  reset(){mem=null;try{if(K)localStorage.removeItem(K)}catch(e){}return base()},drop(k){try{localStorage.removeItem(k)}catch(e){}}}})();
let S=StorageService.base();
const save=()=>StorageService.save(S);
/* ===== profiles ===== */
const LEGACY='kelime_state_v1';
const PS=(()=>{const K='kelime_profiles_v1';let m={v:1,active:null,list:[]};try{const s=localStorage.getItem(K);if(s){const o=JSON.parse(s);if(o&&o.v===1&&Array.isArray(o.list))m=o}}catch(e){}
 return{m:()=>m,save(){try{localStorage.setItem(K,JSON.stringify(m))}catch(e){}}}})();
const curP=()=>PS.m().list.find(x=>x.id===PS.m().active)||null;
function bootProfile(){const p=curP();if(p){StorageService.use(p.key);S=StorageService.load()}else{StorageService.use(null);S=StorageService.base()}}
function mkProfile(name,av){const m=PS.m(),id='p'+Date.now().toString(36);let legacy=false;try{legacy=localStorage.getItem(LEGACY)!==null}catch(e){}
 const key=(legacy&&!m.list.some(x=>x.key===LEGACY))?LEGACY:'kelime_p_'+id;
 m.list.push({id,name:(name||'').trim().slice(0,24)||'Ben',av,key,created:Date.now()});m.active=id;PS.save();bootProfile();reloadCustom();ensureActive()}
function switchP(id){PS.m().active=id;PS.save();bootProfile();reloadCustom();ensureActive()}
function delP(id){const m=PS.m(),p=m.list.find(x=>x.id===id);if(!p)return;StorageService.drop(p.key);m.list=m.list.filter(x=>x.id!==id);if(m.active===id)m.active=m.list[0]?m.list[0].id:null;PS.save();bootProfile();reloadCustom();if(curP())ensureActive()}
bootProfile();
/* ===== sound ===== */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,d,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol||.15,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.03)}
function sfx(k){if(S.settings&&S.settings.sound===false)return;
 if(k==='ok'){tone(659,0,.12,'sine',.2);tone(880,.09,.22,'sine',.2)}
 else if(k==='bad'){tone(233,0,.16,'triangle',.22);tone(175,.12,.28,'triangle',.22);try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}}
 else if(k==='tap'){tone(1100,0,.04,'square',.035)}
 else if(k==='done'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.24,'sine',.17))}}
/* ===== helpers ===== */
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',texts:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',cards:'<rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',fire:'<path d="M12 22c4 0 7-3 7-7 0-3-2-5-3-7-1 2-2 3-3 3 0-3-1-6-4-8 0 4-4 6-4 12 0 4 3 7 7 7z"/>'};
const ic=(n,c)=>`<svg class="ico ${c||''}" viewBox="0 0 24 24">${IC[n]}</svg>`;
document.querySelector('nav .in').innerHTML=[['home','Ana'],['list','Kelimeler'],['texts','Metin'],['hard','Listeler'],['settings','Ayarlar']].map(([k,l])=>`<button data-nav="${k}"><span class="pill">${ic(k==='hard'?'star':k==='settings'?'cog':k)}</span>${l}</button>`).join('');

const $=s=>document.querySelector(s);const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wre=w=>escRe(w).replace(/\\\(([^)]*?)\\\)/g,'(?:$1)?');
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const byId={};WORDS.forEach(w=>byId[w.id]=w);
const hasData=w=>!!w.tr;
const P=id=>S.progress[id]||{status:'unseen',mastery:0,isHard:false,seen:0,ok:0,bad:0,hardOk:0};
const PW=id=>S.progress[id]||(S.progress[id]={status:'unseen',mastery:0,isHard:false,seen:0,ok:0,bad:0,hardOk:0});
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>dkey(new Date());
function showUpd(){if(document.getElementById('upd'))return;const d=document.createElement('div');d.id='upd';d.className='upd';d.innerHTML='<span>Yeni sürüm hazır</span><button onclick="location.reload()">Yenile</button>';document.body.appendChild(d)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
/* ===== logic ===== */
const activeIds=()=>WORDS.filter(w=>hasData(w)&&P(w.id).status==='active').map(w=>w.id);
const setIds=()=>WORDS.filter(w=>hasData(w)&&P(w.id).status==='active'&&P(w.id).via!=='list').map(w=>w.id);
const learnedIds=()=>WORDS.filter(w=>P(w.id).status==='learned').map(w=>w.id);
const hardIds=()=>(getList('main')?getList('main').ids:[]).filter(id=>byId[id]&&hasData(byId[id]));
function orderIds(){const o=S.order||[],have=new Set(o);const add=WORDS.map(w=>w.id).filter(i=>!have.has(i));if(add.length||!S.order){S.order=o.concat(shuffle(add))}return S.order}
function migrate(){if(!curP()||(S.mig||0)>=2)return;S.mig=2;for(const id in S.progress){const p=S.progress[id],w=byId[id];if(p.status==='unseen'&&w&&hasData(w)&&(p.ok||0)>0){p.status='active';p.via='list';p.mastery=Math.min(3,Math.max(0,(p.ok||0)-(p.bad||0)));if(p.mastery>=3)learn(id)}}save()}
function ensureActive(){migrate();let n=setIds().length;for(const w of orderIds().map(i=>byId[i]).filter(Boolean)){if(n>=S.settings.activeSize)break;if(hasData(w)&&P(w.id).status==='unseen'){const p=PW(w.id);p.status='active';p.mastery=0;n++}}save()}
function bumpDay(){const t=today(),st=S.stats;st.hist=st.hist||{};st.hist[t]=(st.hist[t]||0)+1;const hk=Object.keys(st.hist).sort();while(hk.length>40)delete st.hist[hk.shift()];if(st.today.d!==t)st.today={d:t,n:0};st.today.n++;
 if(st.last!==t){const y=dkey(new Date(Date.now()-864e5));st.streak=(st.last===y)?st.streak+1:1;st.last=t}}
const SRI=[0,1,2,4,7,15,30];
const dueOf=p=>p.status==='learned'?(p.due||((p.learnedAt||0)+2*864e5)):Infinity;
const dueIds=()=>WORDS.filter(w=>hasData(w)&&dueOf(P(w.id))<=Date.now()).map(w=>w.id);
function learn(id){const p=PW(id);if(!p.due||p.due<Date.now()){p.step=Math.max(p.step||0,2);p.due=Date.now()+SRI[p.step]*864e5}p.status='learned';p.mastery=3;p.learnedAt=Date.now();ensureActive()}
function grade(id,ok,hardMode){const p=PW(id),w=byId[id];p.seen++;bumpDay();
 if(p.status==='unseen'&&w&&hasData(w)){p.status='active';p.mastery=0;p.via=p.via||'list'}
 p.step=ok?Math.min(6,(p.step||0)+1):0;p.due=Date.now()+SRI[p.step]*864e5;
 if(ok){p.ok++;if(p.isHard){p.hardOk=(p.hardOk||0)+1;if(p.hardOk>=3){p.isHard=false;p.hardOk=0;p.wr=0}}
  if(p.status==='active'){p.mastery=Math.min(3,p.mastery+1);if(p.mastery>=3)learn(id)}}
 else{p.bad++;p.hardOk=0;p.wr=(p.wr||0)+1;if(p.wr>=2)p.isHard=true;
  if(p.status==='learned'){p.status='active';p.mastery=1;p.lapses=(p.lapses||0)+1;p.due=Date.now()}
  else if(p.status==='active')p.mastery=Math.max(0,p.mastery-1)}
 save()}
/* ===== views ===== */
