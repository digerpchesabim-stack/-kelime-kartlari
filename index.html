.","ipa":"/ˈlɪt.əl/","tip":"'A little' = biraz; 'little' = küçük."},{"id":"live","word":"live","pos":"verb","tr":"yaşamak, oturmak (ikamet etmek)","en":"My parents live in a small house.","entr":"Anne ve babam küçük bir evde yaşıyor.","ipa":"/lɪv/","tip":"Fiil /lɪv/ (yaşamak); sıfat /laɪv/ (canlı yayın)."},{"id":"liver","word":"liver","pos":"noun","tr":"karaciğer","en":"The doctor checked the patient's liver carefully.","entr":"Doktor hastanın karaciğerini dikkatlice kontrol etti.","ipa":"/ˈlɪv.ər/","tip":"Ciğer; 'live' (yaşamak) ile karıştırma."},{"id":"lives","word":"lives","pos":"noun","tr":"hayatlar, yaşamlar (life kelimesinin çoğulu)","en":"Seat belts save many lives every year.","entr":"Emniyet kemerleri her yıl birçok hayat kurtarır.","ipa":"/laɪvz/","tip":"Life (hayat) kelimesinin çoğul halidir."},{"id":"loaf","word":"loaf","pos":"noun","tr":"somun (ekmek)","en":"He bought a fresh loaf of bread.","entr":"Taze bir somun ekmek satın aldı.","ipa":"/ləʊf/","tip":"A loaf of bread = bir somun ekmek. Çoğulu 'loaves'."},{"id":"local","word":"local","pos":"adjective","tr":"yerel, yöresel, mahalli","en":"We buy cheese from the local market.","entr":"Peyniri yerel pazardan satın alırız.","ipa":"/ˈləʊ.kəl/","tip":"Türkçede de kullanılan 'lokal' (yerel) kelimesiyle aynıdır."},{"id":"lock","word":"lock","pos":"verb","tr":"kilitlemek, kilit","en":"Always lock the front door at night.","entr":"Geceleri ön kapıyı her zaman kilitle.","ipa":"/lɒk/","tip":"Klavyedeki 'Caps Lock' (büyük harf kilidi) tuşundan hatırlanabilir."},{"id":"long","word":"long","pos":"adjective","tr":"uzun","en":"We walked along the long sandy beach.","entr":"Uzun kumlu plaj boyunca yürüdük.","ipa":"/lɒŋ/","tip":"Zıttı 'short'. 'How long?' = Ne kadar süre?"},{"id":"lose","word":"lose","pos":"verb","tr":"kaybetmek, yitirmek","en":"Put your ticket in your wallet, do not lose it.","entr":"Biletini cüzdanına koy, onu kaybetme.","ipa":"/luːz/","tip":"Lose → lost → lost. 'Loose' (bol) ile karıştırma."},{"id":"loss","word":"loss","pos":"noun","tr":"kayıp, zarar","en":"The company reported a financial loss this year.","entr":"Şirket bu yıl mali bir zarar bildirdi.","ipa":"/lɒs/","tip":"Lose (kaybetmek) fiilinin isim halidir."},{"id":"lot","word":"lot","pos":"noun","tr":"çok, pek çok (a lot of)","en":"There are a lot of books here.","entr":"Burada pek çok kitap var.","ipa":"/lɒt/","tip":"'A lot of' = çok: a lot of people."},{"id":"love","word":"love","pos":"verb","tr":"çok sevmek, sevgi, aşk","en":"Children love playing in the snow.","entr":"Çocuklar karda oynamayı çok sever.","ipa":"/lʌv/","tip":"'I love you' = seni seviyorum."},{"id":"low","word":"low","pos":"adjective","tr":"düşük, alçak","en":"The garden has a low wooden fence.","entr":"Bahçenin alçak bir ahşap çiti var.","ipa":"/ləʊ/","tip":"Telefon şarjı azaldığında çıkan 'Low Battery' (Düşük Pil) uyarısı."},{"id":"luck","word":"luck","pos":"noun","tr":"şans, talih","en":"I wish you good luck in the exam.","entr":"Sınavda sana iyi şanslar dilerim.","ipa":"/lʌk/","tip":"'Good luck!' (İyi şanslar!) ifadesinden hatırlanabilir."},{"id":"luggage","word":"luggage","pos":"noun","tr":"bagaj, valiz, bavul","en":"Put your heavy luggage in the car boot.","entr":"Ağır bavulunu arabanın bagajına koy.","ipa":"/ˈlʌɡ.ɪdʒ/","tip":"Sayılamaz: a piece of luggage."},{"id":"lunch","word":"lunch","pos":"noun","tr":"öğle yemeği","en":"We eat lunch at twelve thirty every day.","entr":"Her gün saat on iki buçukta öğle yemeği yeriz.","ipa":"/lʌntʃ/","tip":"Lunch break = öğle arası."},{"id":"lung","word":"lung","pos":"noun","tr":"akciğer","en":"Fresh mountain air is good for your lung health.","entr":"Temiz dağ havası akciğer sağlığınız için iyidir.","ipa":"/lʌŋ/","tip":"İki akciğerimiz var: lungs."},{"id":"machine","word":"machine","pos":"noun","tr":"makine","en":"Put the dirty shirts in the washing machine.","entr":"Kirli gömlekleri çamaşır makinesine koy.","ipa":"/məˈʃiːn/","tip":"Türkçedeki 'makine' kelimesiyle aynıdır."},{"id":"mad","word":"mad","pos":"adjective","tr":"kızgın, öfkeli, deli","en":"My mother was mad about the broken vase.","entr":"Annem kırılan vazo yüzünden kızgındı.","ipa":"/mæd/","tip":"Hem kızgın (angry) hem deli anlamında."},{"id":"madam","word":"madam","pos":"noun","tr":"hanımefendi, bayan","en":"Can I help you with your bag, madam?","entr":"Çantanız için size yardım edebilir miyim hanımefendi?","ipa":"/ˈmæd.əm/","tip":"Türkçede de bilinen 'madam' (hanımefendi) kelimesidir."},{"id":"made","word":"made","pos":"verb","tr":"yaptı, yapılmış (make fiilinin 2. ve 3. hali)","en":"This table is made of solid oak wood.","entr":"Bu masa sağlam meşe ağacından yapılmıştır.","ipa":"/meɪd/","tip":"Ürünlerin üzerindeki 'Made in Turkey' (Türkiye'de yapılmıştır) yazısı."},{"id":"main","word":"main","pos":"adjective","tr":"ana, esas, temel","en":"The bank is on the main street.","entr":"Banka ana cadde üzerindedir.","ipa":"/meɪn/","tip":"Main road = ana yol, main course = ana yemek."},{"id":"make","word":"make","pos":"verb","tr":"yapmak, üretmek","en":"I will make fresh coffee for us.","entr":"Bizim için taze kahve yapacağım.","ipa":"/meɪk/","tip":"Make → made → made. 'Make a cake' = kek yapmak."},{"id":"man","word":"man","pos":"noun","tr":"adam, erkek, insan","en":"An old man sat on the park bench.","entr":"Yaşlı bir adam park bankında oturdu.","ipa":"/mæn/","tip":"Spider-Man (Örümcek Adam) gibi isimlerdeki 'adam' kelimesidir."},{"id":"manage","word":"manage","pos":"verb","tr":"yönetmek, idare etmek, başarmak","en":"She can manage this large hotel easily.","entr":"O, bu büyük oteli kolayca yönetebilir.","ipa":"/ˈmæn.ɪdʒ/","tip":"Menajer (yönetici) kelimesi bu fiilden türemiştir."},{"id":"management","word":"management","pos":"noun","tr":"yönetim, idare","en":"The hotel has a new management team.","entr":"Otelin yeni bir yönetim ekibi var.","ipa":"/ˈmæn.ɪdʒ.mənt/","tip":"Manage (yönetmek) + -ment (iş/eylem) = yönetim."},{"id":"manager","word":"manager","pos":"noun","tr":"müdür, yönetici","en":"I want to speak to the manager, please.","entr":"Lütfen müdürle konuşmak istiyorum.","ipa":"/ˈmæn.ɪ.dʒər/","tip":"Manage (yönetmek) + -er (yapan kişi) = yöneten kişi, müdür."},{"id":"many","word":"many","pos":"determiner","tr":"çok, birçok (sayılabilen)","en":"There are many books in our school library.","entr":"Okul kütüphanemizde birçok kitap var.","ipa":"/ˈmen.i/","tip":"Sayılabilenler için 'many', sayılamayanlar için 'much': many books, much water."},{"id":"march","word":"March","pos":"noun","tr":"mart","en":"Spring starts in March.","entr":"Bahar martta başlar.","ipa":"/mɑːtʃ/","tip":"Ay adları İngilizcede her zaman büyük harfle başlar: March."},{"id":"market","word":"market","pos":"noun","tr":"pazar, çarşı","en":"My mother buys fresh vegetables at the market.","entr":"Annem taze sebzeleri pazardan alır.","ipa":"/ˈmɑː.kɪt/","tip":"Türkçedeki 'market' ile aynı köken; İngilizcede daha çok açık pazar demektir."},{"id":"material","word":"material","pos":"noun","tr":"malzeme, madde, kumaş","en":"This bag is made of a strong material.","entr":"Bu çanta sağlam bir malzemeden yapılmış.","ipa":"/məˈtɪə.ri.əl/","tip":"Türkçedeki 'materyal' kelimesiyle aynıdır."},{"id":"matter","word":"matter","pos":"verb","tr":"önemli olmak","en":"It doesn't matter if you are late.","entr":"Geç kalman önemli değil.","ipa":"/ˈmæt.ər/","tip":"'It doesn't matter' = önemli değil, fark etmez. Çok sık kullanılır."},{"id":"maximum","word":"maximum","pos":"adjective","tr":"en fazla, azami","en":"The maximum speed on this road is 90 km.","entr":"Bu yolda azami hız 90 km'dir.","ipa":"/ˈmæk.sɪ.məm/","tip":"Türkçedeki 'maksimum' ile aynıdır; zıttı 'minimum'."},{"id":"may","word":"may","pos":"verb","tr":"-ebilir, izin vermek (kibar)","en":"May I open the window?","entr":"Pencereyi açabilir miyim?","ipa":"/meɪ/","tip":"'May I...?' izin istemenin en kibar yoludur. Ay adı olan May (mayıs) ise büyük harfle yazılır."},{"id":"maybe","word":"maybe","pos":"adverb","tr":"belki","en":"Maybe it will rain tomorrow.","entr":"Belki yarın yağmur yağar.","ipa":"/ˈmeɪ.bi/","tip":"May (olabilir) + be (olmak) = belki olur, belki."},{"id":"me","word":"me","pos":"pronoun","tr":"beni, bana","en":"Can you help me with my homework?","entr":"Ödevimde bana yardım edebilir misin?","ipa":"/miː/","tip":"'I' cümlenin öznesidir, 'me' ise nesnesi: I see him, he sees me."},{"id":"mean","word":"mean","pos":"verb","tr":"anlamına gelmek, kastetmek","en":"What does this word mean?","entr":"Bu kelime ne anlama geliyor?","ipa":"/miːn/","tip":"'What does it mean?' = Ne demek? Anlamadığın kelimeyi sormanın kalıbı."},{"id":"meaning","word":"meaning","pos":"noun","tr":"anlam","en":"I looked up the meaning in the dictionary.","entr":"Anlamına sözlükten baktım.","ipa":"/ˈmiː.nɪŋ/","tip":"Mean (anlamına gelmek) + -ing = anlam."},{"id":"meant","word":"meant","pos":"verb","tr":"kastetti, demek istedi (mean fiilinin geçmiş hâli)","en":"Sorry, I meant Tuesday, not Thursday.","entr":"Pardon, perşembe değil salı demek istedim.","ipa":"/ment/","tip":"Mean → meant → meant. Yazılışı 'mean'e benzer ama /ment/ okunur."},{"id":"mechanic","word":"mechanic","pos":"noun","tr":"tamirci, makinist","en":"The mechanic repaired our car in one hour.","entr":"Tamirci arabamızı bir saatte onardı.","ipa":"/məˈkæn.ɪk/","tip":"Türkçedeki 'mekanik' ile aynı kökten; makineyle uğraşan kişi."},{"id":"meeting","word":"meeting","pos":"noun","tr":"toplantı, buluşma","en":"We have a teachers' meeting after school.","entr":"Okuldan sonra öğretmenler toplantımız var.","ipa":"/ˈmiː.tɪŋ/","tip":"Meet (buluşmak) + -ing = buluşma, toplantı. Türkçede de 'miting' olarak geçer."},{"id":"melon","word":"melon","pos":"noun","tr":"kavun","en":"We ate a sweet melon after dinner.","entr":"Akşam yemeğinden sonra tatlı bir kavun yedik.","ipa":"/ˈmel.ən/","tip":"Watermelon = su + kavun = karpuz. Melon tek başına kavundur."},{"id":"member","word":"member","pos":"noun","tr":"üye","en":"My brother is a member of the football club.","entr":"Kardeşim futbol kulübünün üyesi.","ipa":"/ˈmem.bər/","tip":"Ailenin bir 'member'ı = aile üyesi. Membership = üyelik."},{"id":"membership","word":"membership","pos":"noun","tr":"üyelik","en":"The gym membership costs 500 lira a month.","entr":"Spor salonu üyeliği aylık 500 lira.","ipa":"/ˈmem.bə.ʃɪp/","tip":"Member (üye) + -ship (durum) = üyelik. Friend → friendship gibi."},{"id":"memory","word":"memory","pos":"noun","tr":"hafıza, anı","en":"My grandfather has a very good memory.","entr":"Dedemin hafızası çok iyidir.","ipa":"/ˈmem.ər.i/","tip":"Bu kelimenin kendisi 'memoryTip' içinde geçiyor: hafıza ipucu!"},{"id":"men","word":"men","pos":"noun","tr":"adamlar, erkekler (man kelimesinin çoğulu)","en":"Two men are waiting at the bus stop.","entr":"Otobüs durağında iki adam bekliyor.","ipa":"/men/","tip":"Düzensiz çoğul: one man, two men. -s almaz."},{"id":"mention","word":"mention","pos":"verb","tr":"bahsetmek, söz etmek","en":"She didn't mention the exam in her message.","entr":"Mesajında sınavdan bahsetmedi.","ipa":"/ˈmen.ʃən/","tip":"'Don't mention it' = rica ederim, lafı bile olmaz."},{"id":"message","word":"message","pos":"noun","tr":"mesaj, ileti","en":"I sent you a message this morning.","entr":"Bu sabah sana bir mesaj gönderdim.","ipa":"/ˈmes.ɪdʒ/","tip":"Türkçedeki 'mesaj' ile aynıdır."},{"id":"met","word":"met","pos":"verb","tr":"tanıştı, buluştu (meet fiilinin geçmiş hâli)","en":"I met my best friend at primary school.","entr":"En iyi arkadaşımla ilkokulda tanıştım.","ipa":"/met/","tip":"Meet → met → met. 'Nice to meet you' tanışırken, 'I met him' tanıştım."},{"id":"method","word":"method","pos":"noun","tr":"yöntem, metot","en":"This is an easy method for learning new words.","entr":"Bu, yeni kelimeler öğrenmek için kolay bir yöntem.","ipa":"/ˈmeθ.əd/","tip":"Türkçedeki 'metot' ile aynıdır."},{"id":"midday","word":"midday","pos":"noun","tr":"öğle vakti, öğlen","en":"The shop closes at midday on Saturdays.","entr":"Dükkân cumartesileri öğlen kapanır.","ipa":"/ˌmɪdˈdeɪ/","tip":"Mid (orta) + day (gün) = günün ortası, öğlen."},{"id":"middle","word":"middle","pos":"noun","tr":"orta","en":"There is a big tree in the middle of the garden.","entr":"Bahçenin ortasında büyük bir ağaç var.","ipa":"/ˈmɪd.əl/","tip":"'In the middle of' = ...nın ortasında."},{"id":"might","word":"might","pos":"verb","tr":"-ebilir (olasılık)","en":"Take an umbrella; it might rain.","entr":"Şemsiye al, yağmur yağabilir.","ipa":"/maɪt/","tip":"Might, may'den biraz daha zayıf bir olasılıktır: belki, olabilir."},{"id":"mine","word":"mine","pos":"pronoun","tr":"benimki","en":"This pen is not mine.","entr":"Bu kalem benim değil.","ipa":"/maɪn/","tip":"My book = benim kitabım; the book is mine = kitap benimki. 'Mine'dan sonra isim gelmez."},{"id":"minimum","word":"minimum","pos":"adjective","tr":"en az, asgari","en":"The minimum age for this course is sixteen.","entr":"Bu kurs için en düşük yaş on altıdır.","ipa":"/ˈmɪn.ɪ.məm/","tip":"Türkçedeki 'minimum' ile aynıdır; zıttı 'maximum'."},{"id":"minister","word":"minister","pos":"noun","tr":"bakan","en":"The minister visited our city yesterday.","entr":"Bakan dün şehrimizi ziyaret etti.","ipa":"/ˈmɪn.ɪ.stər/","tip":"Prime minister = başbakan."},{"id":"minus","word":"minus","pos":"preposition","tr":"eksi","en":"Ten minus four is six.","entr":"On eksi dört altı eder.","ipa":"/ˈmaɪ.nəs/","tip":"Matematikte '−' işareti; zıttı 'plus' (+)."},{"id":"minute","word":"minute","pos":"noun","tr":"dakika","en":"Wait a minute, I am coming.","entr":"Bir dakika bekle, geliyorum.","ipa":"/ˈmɪn.ɪt/","tip":"'Wait a minute' = bir dakika bekle."},{"id":"miss","word":"Miss","pos":"noun","tr":"Bayan (evlenmemiş kadınlar için hitap)","en":"Our English teacher is Miss Brown.","entr":"İngilizce öğretmenimiz Bayan Brown.","ipa":"/mɪs/","tip":"Miss + soyadı. Fiil olan 'miss' ise özlemek ya da kaçırmak demektir."},{"id":"missing","word":"missing","pos":"adjective","tr":"kayıp, eksik","en":"One page of my book is missing.","entr":"Kitabımın bir sayfası eksik.","ipa":"/ˈmɪs.ɪŋ/","tip":"Bir şey 'missing' ise yerinde yoktur: kayıp ya da eksik."},{"id":"mistake","word":"mistake","pos":"noun","tr":"hata, yanlış","en":"I made a mistake in the second question.","entr":"İkinci soruda bir hata yaptım.","ipa":"/mɪˈsteɪk/","tip":"'Make a mistake' = hata yapmak (do değil, make)."},{"id":"mixture","word":"mixture","pos":"noun","tr":"karışım","en":"Pour the mixture into the cake tin.","entr":"Karışımı kek kalıbına dök.","ipa":"/ˈmɪks.tʃər/","tip":"Mix (karıştırmak) + -ture = karışım. Mikser de aynı kökten."},{"id":"modern","word":"modern","pos":"adjective","tr":"modern, çağdaş","en":"Our school has a modern computer room.","entr":"Okulumuzun modern bir bilgisayar odası var.","ipa":"/ˈmɒd.ən/","tip":"Türkçedeki 'modern' ile aynıdır."},{"id":"moment","word":"moment","pos":"noun","tr":"an","en":"Please wait a moment.","entr":"Lütfen bir dakika bekleyin.","ipa":"/ˈməʊ.mənt/","tip":"'At the moment' = şu anda. 'Just a moment' = bir saniye."},{"id":"monday","word":"Monday","pos":"noun","tr":"pazartesi","en":"School starts again on Monday.","entr":"Okul pazartesi yeniden başlıyor.","ipa":"/ˈmʌn.deɪ/","tip":"Moon (ay) + day = Ay'ın günü. Günler büyük harfle yazılır."},{"id":"money","word":"money","pos":"noun","tr":"para","en":"I don't have much money in my pocket.","entr":"Cebimde fazla para yok.","ipa":"/ˈmʌn.i/","tip":"Sayılamaz bir isimdir: much money (many money değil)."},{"id":"month","word":"month","pos":"noun","tr":"ay (takvim)","en":"My birthday is next month.","entr":"Doğum günüm gelecek ay.","ipa":"/mʌnθ/","tip":"Moon (ay, gökyüzündeki) ile aynı kökten: ayın dönüşü bir 'month'."},{"id":"mosque","word":"mosque","pos":"noun","tr":"cami","en":"There is an old mosque near the market.","entr":"Pazarın yakınında eski bir cami var.","ipa":"/mɒsk/","tip":"Sondaki -que okunmaz gibi kısa söylenir: /mɒsk/."},{"id":"most","word":"most","pos":"determiner","tr":"en çok, çoğu","en":"Most students in my class like football.","entr":"Sınıfımdaki öğrencilerin çoğu futbolu sever.","ipa":"/məʊst/","tip":"Many/much → more → most: çok → daha çok → en çok."},{"id":"mother","word":"mother","pos":"noun","tr":"anne","en":"My mother is a nurse.","entr":"Annem hemşiredir.","ipa":"/ˈmʌð.ər/","tip":"Mum ya da mummy daha samimi söylenişidir."},{"id":"mother-in-law","word":"mother-in-law","pos":"noun","tr":"kayınvalide, kaynana","en":"My mother-in-law makes delicious dolma.","entr":"Kayınvalidem çok lezzetli dolma yapar.","ipa":"/ˈmʌð.ər.ɪn.lɔː/","tip":"Mother + in law (yasaya göre) = evlilikle gelen anne."},{"id":"motorway","word":"motorway","pos":"noun","tr":"otoyol","en":"We drove to Ankara on the motorway.","entr":"Ankara'ya otoyoldan gittik.","ipa":"/ˈməʊ.tə.weɪ/","tip":"Motor + way (yol) = motorlu araçların yolu. Amerikan İngilizcesinde 'highway'."},{"id":"mountain","word":"mountain","pos":"noun","tr":"dağ","en":"Ağrı is the highest mountain in Türkiye.","entr":"Ağrı, Türkiye'nin en yüksek dağıdır.","ipa":"/ˈmaʊn.tɪn/","tip":"Mount (tırmanmak) ile aynı kökten: tırmanılan yer, dağ."},{"id":"mouse","word":"mouse","pos":"noun","tr":"fare","en":"The cat is running after a mouse.","entr":"Kedi bir farenin peşinden koşuyor.","ipa":"/maʊs/","tip":"Bilgisayar faresi de 'mouse'tur. Çoğulu düzensiz: mice."},{"id":"mouth","word":"mouth","pos":"noun","tr":"ağız","en":"Don't speak with your mouth full.","entr":"Ağzın doluyken konuşma.","ipa":"/maʊθ/","tip":"Mouse (fare) ile karıştırma: mouth sonunda 'th' sesi var."},{"id":"move","word":"move","pos":"verb","tr":"hareket etmek, taşınmak","en":"We will move to a new flat next month.","entr":"Gelecek ay yeni bir daireye taşınacağız.","ipa":"/muːv/","tip":"Movie (film) = hareketli resimler; ikisi de 'move'dan gelir."},{"id":"movement","word":"movement","pos":"noun","tr":"hareket","en":"Every movement of the dancer was perfect.","entr":"Dansçının her hareketi kusursuzdu.","ipa":"/ˈmuːv.mənt/","tip":"Move (hareket etmek) + -ment = hareket."},{"id":"movie","word":"movie","pos":"noun","tr":"film","en":"We watched a funny movie last night.","entr":"Dün gece komik bir film izledik.","ipa":"/ˈmuː.vi/","tip":"Move (hareket) kökünden: hareketli resim. İngiliz İngilizcesinde 'film' de denir."},{"id":"mr","word":"Mr","pos":"noun","tr":"Bay (erkekler için hitap)","en":"Mr Yılmaz is our new school principal.","entr":"Bay Yılmaz yeni okul müdürümüz.","ipa":"/ˈmɪs.tər/","tip":"'Mister'ın kısaltmasıdır; soyadından önce kullanılır."},{"id":"mrs","word":"Mrs","pos":"noun","tr":"Bayan (evli kadınlar için hitap)","en":"Mrs Kaya teaches us history.","entr":"Bayan Kaya bize tarih öğretiyor.","ipa":"/ˈmɪs.ɪz/","tip":"Evli kadın için Mrs, evlenmemiş için Miss, ikisi için de Ms kullanılır."},{"id":"much","word":"much","pos":"determiner","tr":"çok (sayılamayan)","en":"How much is this bread?","entr":"Bu ekmek ne kadar?","ipa":"/mʌtʃ/","tip":"'How much?' = Ne kadar? Fiyat sorarken kullanılır."},{"id":"multiply","word":"multiply","pos":"verb","tr":"çarpmak (matematik)","en":"Multiply five by three and you get fifteen.","entr":"Beşi üçle çarparsan on beş elde edersin.","ipa":"/ˈmʌl.tɪ.plaɪ/","tip":"Multi (çok) kökünden: bir sayıyı çoğaltmak, çarpmak."},{"id":"mummy","word":"mummy","pos":"noun","tr":"anneciğim, anne (çocuk dilinde)","en":"The little girl is crying for her mummy.","entr":"Küçük kız annesi için ağlıyor.","ipa":"/ˈmʌm.i/","tip":"Çocukların anneye seslenişidir. Aynı kelime 'mumya' anlamına da gelir."},{"id":"my","word":"my","pos":"determiner","tr":"benim","en":"This is my new bike.","entr":"Bu benim yeni bisikletim.","ipa":"/maɪ/","tip":"My + isim: my bag (benim çantam). İsimsiz kullanımı 'mine'."},{"id":"myself","word":"myself","pos":"pronoun","tr":"kendim, kendimi","en":"I made this cake myself.","entr":"Bu keki kendim yaptım.","ipa":"/maɪˈself/","tip":"My + self (kendi) = kendim."},{"id":"name","word":"name","pos":"noun","tr":"isim, ad","en":"What is your name?","entr":"Adın ne?","ipa":"/neɪm/","tip":"First name = ad, surname = soyad."},{"id":"napkin","word":"napkin","pos":"noun","tr":"peçete","en":"Can I have a napkin, please?","entr":"Bir peçete alabilir miyim, lütfen?","ipa":"/ˈnæp.kɪn/","tip":"Nap (kısa uyku) ile karıştırma; masada ağız silinen kâğıt."},{"id":"national","word":"national","pos":"adjective","tr":"ulusal, milli","en":"23 April is a national holiday in Türkiye.","entr":"23 Nisan Türkiye'de ulusal bir bayramdır.","ipa":"/ˈnæʃ.ən.əl/","tip":"Nation (ulus, millet) + -al = ulusal, milli."},{"id":"nature","word":"nature","pos":"noun","tr":"doğa","en":"We should protect nature.","entr":"Doğayı korumalıyız.","ipa":"/ˈneɪ.tʃər/","tip":"Natural (doğal) bu kelimeden gelir."},{"id":"near","word":"near","pos":"preposition","tr":"yakın, yakınında","en":"Our house is near the school.","entr":"Evimiz okula yakın.","ipa":"/nɪər/","tip":"Zıttı 'far' (uzak). 'Near here' = buralarda."},{"id":"necessarily","word":"necessarily","pos":"adverb","tr":"zorunlu olarak, illa ki","en":"Expensive things are not necessarily better.","entr":"Pahalı şeyler illa ki daha iyi değildir.","ipa":"/ˌnes.əˈser.əl.i/","tip":"Genelde 'not necessarily' = her zaman değil, şart değil."},{"id":"necessary","word":"necessary","pos":"adjective","tr":"gerekli","en":"Water is necessary for life.","entr":"Su yaşam için gereklidir.","ipa":"/ˈnes.ə.ser.i/","tip":"Yazımı: bir 'c', iki 's' (ne-c-e-ss-ary)."},{"id":"need","word":"need","pos":"verb","tr":"ihtiyacı olmak, gerekmek","en":"I need a new pair of shoes.","entr":"Yeni bir çift ayakkabıya ihtiyacım var.","ipa":"/niːd/","tip":"'I need help' = yardıma ihtiyacım var."},{"id":"needle","word":"needle","pos":"noun","tr":"iğne","en":"My grandmother sews with a needle and thread.","entr":"Babaannem iğne iplikle dikiş diker.","ipa":"/ˈniː.dəl/","tip":"Dikiş iğnesi de enjeksiyon iğnesi de 'needle'dır."},{"id":"never","word":"never","pos":"adverb","tr":"asla, hiç","en":"I have never been to London.","entr":"Hiç Londra'ya gitmedim.","ipa":"/ˈnev.ər/","tip":"Not + ever (hiç) = never. Cümlede ayrıca 'not' kullanılmaz."},{"id":"new","word":"new","pos":"adjective","tr":"yeni","en":"I bought a new phone yesterday.","entr":"Dün yeni bir telefon aldım.","ipa":"/njuː/","tip":"Zıttı 'old' (eski). 'Knew' (bildi) ile aynı okunur."},{"id":"news","word":"news","pos":"noun","tr":"haber, haberler","en":"My father watches the news every evening.","entr":"Babam her akşam haberleri izler.","ipa":"/njuːz/","tip":"Sonunda -s olsa da tekil sayılır: The news is good."},{"id":"newspaper","word":"newspaper","pos":"noun","tr":"gazete","en":"He reads the newspaper with his breakfast.","entr":"Kahvaltıda gazete okur.","ipa":"/ˈnjuːzˌpeɪ.pər/","tip":"News (haber) + paper (kâğıt) = haber kâğıdı, gazete."},{"id":"next","word":"next","pos":"adjective","tr":"sonraki, gelecek","en":"See you next week!","entr":"Gelecek hafta görüşürüz!","ipa":"/nekst/","tip":"'Next to' = yanında: next to the door (kapının yanında)."},{"id":"nice","word":"nice","pos":"adjective","tr":"güzel, hoş, kibar","en":"Nice to meet you.","entr":"Tanıştığıma memnun oldum.","ipa":"/naɪs/","tip":"'Nice to meet you' tanışırken söylenen kalıptır."},{"id":"night","word":"night","pos":"noun","tr":"gece","en":"I go to bed at ten every night.","entr":"Her gece onda yatarım.","ipa":"/naɪt/","tip":"'gh' okunmaz: /naɪt/. 'Good night' = iyi geceler."},{"id":"no","word":"no","pos":"determiner","tr":"hayır; hiç","en":"There is no milk in the fridge.","entr":"Buzdolabında hiç süt yok.","ipa":"/nəʊ/","tip":"'Hayır' anlamının yanında 'no + isim' = hiç ... yok."},{"id":"no one","word":"no one","pos":"pronoun","tr":"hiç kimse","en":"No one was at home when I called.","entr":"Aradığımda evde kimse yoktu.","ipa":"/ˈnəʊ wʌn/","tip":"'Nobody' ile aynı anlam. Fiil tekil olur: No one is here."},{"id":"nobody","word":"nobody","pos":"pronoun","tr":"hiç kimse","en":"Nobody knows the answer.","entr":"Cevabı kimse bilmiyor.","ipa":"/ˈnəʊ.bə.di/","tip":"No (hiç) + body (kimse) = hiç kimse. Cümlede ayrıca 'not' gelmez."},{"id":"none","word":"none","pos":"pronoun","tr":"hiçbiri","en":"None of my friends came to the party.","entr":"Arkadaşlarımdan hiçbiri partiye gelmedi.","ipa":"/nʌn/","tip":"'None of...' = ...ların hiçbiri. 'No one' gibi okunur: /nʌn/."},{"id":"noon","word":"noon","pos":"noun","tr":"öğle, öğle vakti (12.00)","en":"We have lunch at noon.","entr":"Öğlen yemek yeriz.","ipa":"/nuːn/","tip":"Afternoon = after (sonra) + noon (öğle) = öğleden sonra."},{"id":"normal","word":"normal","pos":"adjective","tr":"normal, olağan","en":"It's normal to feel nervous before an exam.","entr":"Sınavdan önce gergin hissetmek normaldir.","ipa":"/ˈnɔː.məl/","tip":"Türkçedeki 'normal' ile aynıdır."},{"id":"normally","word":"normally","pos":"adverb","tr":"normalde, genellikle","en":"I normally walk to school.","entr":"Normalde okula yürüyerek giderim.","ipa":"/ˈnɔː.mə.li/","tip":"Normal + -ly = normalde."},{"id":"north","word":"north","pos":"noun","tr":"kuzey","en":"Samsun is in the north of Türkiye.","entr":"Samsun, Türkiye'nin kuzeyindedir.","ipa":"/nɔːθ/","tip":"Pusulada N harfi 'north' demektir."},{"id":"not","word":"not","pos":"adverb","tr":"değil, -me/-ma","en":"I am not hungry now.","entr":"Şu an aç değilim.","ipa":"/nɒt/","tip":"Kısaltması n't: is not = isn't, do not = don't."},{"id":"note","word":"note","pos":"noun","tr":"not, kısa yazı","en":"I left a note on the kitchen table.","entr":"Mutfak masasına bir not bıraktım.","ipa":"/nəʊt/","tip":"'Take notes' = not almak. Okul notu ise 'mark' ya da 'grade'dir."},{"id":"notebook","word":"notebook","pos":"noun","tr":"defter","en":"Write the new words in your notebook.","entr":"Yeni kelimeleri defterine yaz.","ipa":"/ˈnəʊt.bʊk/","tip":"Note (not) + book (kitap) = not kitabı, defter."},{"id":"nothing","word":"nothing","pos":"pronoun","tr":"hiçbir şey","en":"There is nothing in the box.","entr":"Kutuda hiçbir şey yok.","ipa":"/ˈnʌθ.ɪŋ/","tip":"No + thing (şey) = hiçbir şey. Ayrıca 'not' kullanılmaz."},{"id":"notice","word":"notice","pos":"verb","tr":"fark etmek","en":"Did you notice her new haircut?","entr":"Yeni saç kesimini fark ettin mi?","ipa":"/ˈnəʊ.tɪs/","tip":"İsim olarak 'duyuru, ilan' demektir: a notice on the board."},{"id":"noun","word":"noun","pos":"noun","tr":"isim (dil bilgisi)","en":"'Table' is a noun.","entr":"'Table' bir isimdir.","ipa":"/naʊn/","tip":"Name (ad) ile aynı kökten: bir şeyin adı olan kelime."},{"id":"november","word":"November","pos":"noun","tr":"kasım","en":"Teachers' Day is on 24 November in Türkiye.","entr":"Türkiye'de Öğretmenler Günü 24 Kasım'dadır.","ipa":"/nəʊˈvem.bər/","tip":"Ay adları büyük harfle yazılır: November."},{"id":"now","word":"now","pos":"adverb","tr":"şimdi, şu an","en":"I am doing my homework now.","entr":"Şu an ödevimi yapıyorum.","ipa":"/naʊ/","tip":"'Right now' = hemen şimdi."},{"id":"number","word":"number","pos":"noun","tr":"sayı, numara","en":"What is your phone number?","entr":"Telefon numaran ne?","ipa":"/ˈnʌm.bər/","tip":"Kısaltması 'No.' olarak yazılır: Room No. 5."},{"id":"nurse","word":"nurse","pos":"noun","tr":"hemşire","en":"The nurse gave me some medicine.","entr":"Hemşire bana biraz ilaç verdi.","ipa":"/nɜːs/","tip":"Hem kadın hem erkek hemşire için 'nurse' kullanılır."},{"id":"nut","word":"nut","pos":"noun","tr":"kabuklu yemiş, fındık, ceviz","en":"This chocolate has a nut inside.","entr":"Bu çikolatanın içinde bir fındık var.","ipa":"/nʌt/","tip":"Hazelnut = fındık, walnut = ceviz; hepsi 'nut' ailesinden."},{"id":"o'clock","word":"o'clock","pos":"adverb","tr":"saat (tam saatlerde)","en":"The lesson starts at nine o'clock.","entr":"Ders saat dokuzda başlıyor.","ipa":"/əˈklɒk/","tip":"Yalnızca tam saatlerde: nine o'clock (9.00). 9.30 için kullanılmaz."},{"id":"obviously","word":"obviously","pos":"adverb","tr":"açıkça, belli ki","en":"She was obviously tired after the long trip.","entr":"Uzun yolculuktan sonra belli ki yorgundu.","ipa":"/ˈɒb.vi.əs.li/","tip":"Obvious (apaçık) + -ly = açıkça, besbelli."},{"id":"occasion","word":"occasion","pos":"noun","tr":"durum, fırsat, özel gün","en":"A wedding is a special occasion.","entr":"Düğün özel bir gündür.","ipa":"/əˈkeɪ.ʒən/","tip":"Yazımı: iki 'c', bir 's' (o-cc-a-s-ion)."},{"id":"ocean","word":"ocean","pos":"noun","tr":"okyanus","en":"Whales live in the ocean.","entr":"Balinalar okyanusta yaşar.","ipa":"/ˈəʊ.ʃən/","tip":"'c' burada /ʃ/ (ş) gibi okunur: /ˈəʊ.ʃən/."},{"id":"october","word":"October","pos":"noun","tr":"ekim","en":"Republic Day is on 29 October.","entr":"Cumhuriyet Bayramı 29 Ekim'dedir.","ipa":"/ɒkˈtəʊ.bər/","tip":"Octo (sekiz) kökünden: eski Roma takviminin sekizinci ayıydı."},{"id":"of","word":"of","pos":"preposition","tr":"-nın, -nin; -den (aitlik, parça)","en":"I'd like a glass of water, please.","entr":"Bir bardak su istiyorum, lütfen.","ipa":"/ɒv/","tip":"A cup of tea = bir fincan çay. 'Of' ölçüyle şeyi bağlar."},{"id":"of course","word":"of course","pos":"adverb","tr":"tabii ki, elbette","en":"Can I borrow your pen? Of course!","entr":"Kalemini ödünç alabilir miyim? Tabii ki!","ipa":"/əv ˈkɔːs/","tip":"Bir isteğe 'evet' demenin kibar ve sıcak yolu."},{"id":"offer","word":"offer","pos":"verb","tr":"teklif etmek, sunmak","en":"Can I offer you a cup of tea?","entr":"Size bir fincan çay ikram edebilir miyim?","ipa":"/ˈɒf.ər/","tip":"Mağazada 'special offer' = özel teklif, kampanya."},{"id":"office","word":"office","pos":"noun","tr":"ofis, büro","en":"My father works in an office in the city centre.","entr":"Babam şehir merkezinde bir ofiste çalışıyor.","ipa":"/ˈɒf.ɪs/","tip":"Türkçedeki 'ofis' ile aynıdır. Post office = postane."},{"id":"officer","word":"officer","pos":"noun","tr":"memur, subay, polis memuru","en":"The police officer helped the lost child.","entr":"Polis memuru kaybolan çocuğa yardım etti.","ipa":"/ˈɒf.ɪ.sər/","tip":"Office (büro) + -er = büroda görevli kişi, memur."},{"id":"often","word":"often","pos":"adverb","tr":"sık sık","en":"I often visit my grandparents at weekends.","entr":"Hafta sonları sık sık büyükannemle büyükbabamı ziyaret ederim.","ipa":"/ˈɒf.ən/","tip":"'t' genelde okunmaz: /ˈɒf.ən/. Always > usually > often > sometimes."},{"id":"ok","word":"OK","pos":"adjective","tr":"tamam, iyi","en":"Are you OK? You look tired.","entr":"İyi misin? Yorgun görünüyorsun.","ipa":"/ˌəʊˈkeɪ/","tip":"'Okay' ile aynıdır; harf harf okunur: o-key."},{"id":"okay","word":"okay","pos":"adjective","tr":"tamam, peki, iyi","en":"The food was okay, but not great.","entr":"Yemek fena değildi ama harika da değildi.","ipa":"/ˌəʊˈkeɪ/","tip":"'OK' kelimesinin uzun yazılışı; anlamları aynı."},{"id":"old","word":"old","pos":"adjective","tr":"yaşlı, eski","en":"How old are you?","entr":"Kaç yaşındasın?","ipa":"/əʊld/","tip":"'How old...?' = Kaç yaşında? Zıttı: young (genç), new (yeni)."},{"id":"olive","word":"olive","pos":"noun","tr":"zeytin","en":"I eat cheese and an olive or two for breakfast.","entr":"Kahvaltıda peynir ve bir iki zeytin yerim.","ipa":"/ˈɒl.ɪv/","tip":"Olive oil = zeytinyağı."},{"id":"on","word":"on","pos":"preposition","tr":"üstünde; -de (gün)","en":"Your keys are on the table.","entr":"Anahtarların masanın üstünde.","ipa":"/ɒn/","tip":"Günlerle de kullanılır: on Monday (pazartesi günü)."},{"id":"once","word":"once","pos":"adverb","tr":"bir kez; bir zamanlar","en":"I go swimming once a week.","entr":"Haftada bir kez yüzmeye giderim.","ipa":"/wʌns/","tip":"Once (bir kez), twice (iki kez), three times (üç kez)."},{"id":"one","word":"one","pos":"number","tr":"bir (sayı)","en":"I have one brother and two sisters.","entr":"Bir erkek kardeşim ve iki kız kardeşim var.","ipa":"/wʌn/","tip":"'Won' (kazandı) ile aynı okunur: /wʌn/."},{"id":"only","word":"only","pos":"adverb","tr":"sadece, yalnızca","en":"I only have ten lira.","entr":"Sadece on liram var.","ipa":"/ˈəʊn.li/","tip":"'Only child' = tek çocuk."},{"id":"open","word":"open","pos":"verb","tr":"açmak; açık","en":"Please open your books to page twenty.","entr":"Lütfen kitaplarınızı yirminci sayfada açın.","ipa":"/ˈəʊ.pən/","tip":"Zıttı 'close' (kapatmak). Dükkân kapısında 'OPEN' = açık."},{"id":"operation","word":"operation","pos":"noun","tr":"ameliyat; işlem","en":"My uncle had an operation on his knee.","entr":"Amcam dizinden ameliyat oldu.","ipa":"/ˌɒp.ərˈeɪ.ʃən/","tip":"Türkçedeki 'operasyon' ile aynı kökten; hastanede ameliyat demek."},{"id":"opinion","word":"opinion","pos":"noun","tr":"fikir, görüş","en":"In my opinion, this book is very good.","entr":"Bence bu kitap çok iyi.","ipa":"/əˈpɪn.jən/","tip":"'In my opinion' = bence, bana göre."},{"id":"opportunity","word":"opportunity","pos":"noun","tr":"fırsat","en":"This job is a great opportunity for you.","entr":"Bu iş senin için harika bir fırsat.","ipa":"/ˌɒp.əˈtʃuː.nə.ti/","tip":"Kapı açılması gibi düşün: 'opportunity knocks' = fırsat kapıyı çalar."},{"id":"or","word":"or","pos":"conjunction","tr":"veya, ya da","en":"Would you like tea or coffee?","entr":"Çay mı yoksa kahve mi istersin?","ipa":"/ɔːr/","tip":"Sorularda 'mı ... yoksa ... mı' anlamı verir."},{"id":"orange","word":"orange","pos":"noun","tr":"portakal; turuncu","en":"I drink a glass of orange juice every morning.","entr":"Her sabah bir bardak portakal suyu içerim.","ipa":"/ˈɒr.ɪndʒ/","tip":"Hem meyvenin hem rengin adı: portakal ve turuncu."},{"id":"order","word":"order","pos":"verb","tr":"sipariş vermek; emretmek","en":"Let's order pizza for dinner.","entr":"Akşam yemeği için pizza sipariş edelim.","ipa":"/ˈɔː.dər/","tip":"İsim olarak 'sıra, düzen' de demektir: in alphabetical order."},{"id":"organize","word":"organize","pos":"verb","tr":"düzenlemek, organize etmek","en":"Our class will organize a trip to the museum.","entr":"Sınıfımız müzeye bir gezi düzenleyecek.","ipa":"/ˈɔː.ɡən.aɪz/","tip":"Türkçedeki 'organize etmek' ile aynıdır. İngiliz yazımında 'organise' de görülür."},{"id":"original","word":"original","pos":"adjective","tr":"orijinal, asıl, özgün","en":"This is the original painting, not a copy.","entr":"Bu bir kopya değil, orijinal tablo.","ipa":"/əˈrɪdʒ.ən.əl/","tip":"Türkçedeki 'orijinal' ile aynıdır."},{"id":"other","word":"other","pos":"determiner","tr":"diğer, başka","en":"Where are the other students?","entr":"Diğer öğrenciler nerede?","ipa":"/ˈʌð.ər/","tip":"'Each other' = birbirini: They help each other."},{"id":"our","word":"our","pos":"determiner","tr":"bizim","en":"Our teacher is very kind.","entr":"Öğretmenimiz çok nazik.","ipa":"/aʊər/","tip":"Our + isim: our house (bizim evimiz). 'Hour' (saat) ile aynı okunur."},{"id":"ours","word":"ours","pos":"pronoun","tr":"bizimki","en":"That red car is ours.","entr":"O kırmızı araba bizimki.","ipa":"/aʊəz/","tip":"Our car = bizim arabamız; the car is ours = araba bizimki."},{"id":"ourselves","word":"ourselves","pos":"pronoun","tr":"kendimiz, kendimizi","en":"We painted the room ourselves.","entr":"Odayı kendimiz boyadık.","ipa":"/ˌaʊəˈselvz/","tip":"Our + selves (kendiler) = kendimiz."},{"id":"out","word":"out","pos":"adverb","tr":"dışarı, dışarıda","en":"My mother is out at the moment.","entr":"Annem şu an dışarıda.","ipa":"/aʊt/","tip":"Zıttı 'in'. 'Go out' = dışarı çıkmak."},{"id":"outdoors","word":"outdoors","pos":"adverb","tr":"dışarıda, açık havada","en":"Children love playing outdoors in summer.","entr":"Çocuklar yazın açık havada oynamayı sever.","ipa":"/ˌaʊtˈdɔːz/","tip":"Out (dış) + doors (kapılar) = kapıların dışında."},{"id":"outside","word":"outside","pos":"adverb","tr":"dışarıda, dışında","en":"It's cold outside; wear your coat.","entr":"Dışarısı soğuk, montunu giy.","ipa":"/ˌaʊtˈsaɪd/","tip":"Out (dış) + side (taraf) = dış taraf. Zıttı 'inside'."},{"id":"over","word":"over","pos":"preposition","tr":"üzerinde, üstünden; bitmiş","en":"The plane flew over our house.","entr":"Uçak evimizin üstünden geçti.","ipa":"/ˈəʊ.vər/","tip":"'The game is over' = oyun bitti."},{"id":"own","word":"own","pos":"adjective","tr":"kendi, kendine ait","en":"I have my own room now.","entr":"Artık kendi odam var.","ipa":"/əʊn/","tip":"Hep 'my/your/his own' şeklinde kullanılır."},{"id":"p.m.","word":"p.m.","pos":"abbreviation","tr":"öğleden sonra (saat)","en":"The film starts at 8 p.m.","entr":"Film akşam 8'de başlıyor.","ipa":"/ˌpiːˈem/","tip":"a.m. = öğleden önce, p.m. = öğleden sonra. 8 p.m. = 20.00."},{"id":"page","word":"page","pos":"noun","tr":"sayfa","en":"Please turn to the next page.","entr":"Lütfen bir sonraki sayfaya geçin.","ipa":"/peɪdʒ/","tip":"Web sayfası da 'web page'dir."},{"id":"painter","word":"painter","pos":"noun","tr":"ressam; boyacı","en":"Osman Hamdi Bey was a famous painter.","entr":"Osman Hamdi Bey ünlü bir ressamdı.","ipa":"/ˈpeɪn.tər/","tip":"Paint (boyamak) + -er = boyayan kişi, ressam."},{"id":"paper","word":"paper","pos":"noun","tr":"kâğıt; gazete","en":"Can you give me a piece of paper?","entr":"Bana bir parça kâğıt verebilir misin?","ipa":"/ˈpeɪ.pər/","tip":"Sayılamaz: a piece of paper (bir parça kâğıt)."},{"id":"paragraph","word":"paragraph","pos":"noun","tr":"paragraf","en":"Read the first paragraph aloud.","entr":"İlk paragrafı yüksek sesle oku.","ipa":"/ˈpær.ə.ɡrɑːf/","tip":"Türkçedeki 'paragraf' ile aynıdır; 'ph' /f/ okunur."},{"id":"parent","word":"parent","pos":"noun","tr":"ebeveyn, anne ya da baba","en":"Every parent wants the best for their child.","entr":"Her ebeveyn çocuğu için en iyisini ister.","ipa":"/ˈpeə.rənt/","tip":"Anne ya da babadan biri: a parent."},{"id":"parents","word":"parents","pos":"noun","tr":"anne baba, ebeveynler","en":"My parents are teachers.","entr":"Annem ve babam öğretmen.","ipa":"/ˈpeə.rənts/","tip":"Parent'ın çoğulu: anne ile baba birlikte."},{"id":"park","word":"park","pos":"noun","tr":"park","en":"We had a picnic in the park.","entr":"Parkta piknik yaptık.","ipa":"/pɑːk/","tip":"Fiil olarak 'park etmek' demektir: park the car."},{"id":"part","word":"part","pos":"noun","tr":"parça, bölüm","en":"The first part of the film was boring.","entr":"Filmin ilk bölümü sıkıcıydı.","ipa":"/pɑːt/","tip":"'Take part in' = katılmak: take part in a race."},{"id":"particular","word":"particular","pos":"adjective","tr":"belirli, özel","en":"Is there a particular book you want?","entr":"İstediğin belirli bir kitap var mı?","ipa":"/pəˈtɪk.jə.lər/","tip":"'In particular' = özellikle."},{"id":"particularly","word":"particularly","pos":"adverb","tr":"özellikle","en":"I like fruit, particularly cherries.","entr":"Meyveyi severim, özellikle kirazı.","ipa":"/pəˈtɪk.jə.lə.li/","tip":"Particular + -ly = özellikle. 'Especially' ile benzer."},{"id":"party","word":"party","pos":"noun","tr":"parti, eğlence","en":"We are having a birthday party on Saturday.","entr":"Cumartesi doğum günü partisi veriyoruz.","ipa":"/ˈpɑː.ti/","tip":"Siyasi parti de 'party'dir."},{"id":"pass","word":"pass","pos":"verb","tr":"geçmek; uzatmak","en":"I hope I pass the exam.","entr":"Umarım sınavı geçerim.","ipa":"/pɑːs/","tip":"'Pass the salt, please' = tuzu uzatır mısın?"},{"id":"past","word":"past","pos":"noun","tr":"geçmiş; geçe (saat)","en":"It's ten past three.","entr":"Saat üçü on geçiyor.","ipa":"/pɑːst/","tip":"Saatte 'past' = geçe, 'to' = kala."},{"id":"path","word":"path","pos":"noun","tr":"patika, yol","en":"Follow this path to the lake.","entr":"Göle gitmek için bu patikayı takip et.","ipa":"/pɑːθ/","tip":"Türkçedeki 'patika' kelimesine benzer."},{"id":"pay","word":"pay","pos":"verb","tr":"ödemek","en":"Can I pay by card?","entr":"Kartla ödeyebilir miyim?","ipa":"/peɪ/","tip":"Pay → paid → paid. 'Pay attention' = dikkat etmek."},{"id":"payment","word":"payment","pos":"noun","tr":"ödeme","en":"The payment is due on Friday.","entr":"Ödemenin son günü cuma.","ipa":"/ˈpeɪ.mənt/","tip":"Pay (ödemek) + -ment = ödeme."},{"id":"peanut","word":"peanut","pos":"noun","tr":"yer fıstığı","en":"My little brother is allergic to peanut butter.","entr":"Küçük kardeşimin fıstık ezmesine alerjisi var.","ipa":"/ˈpiː.nʌt/","tip":"Pea (bezelye) + nut (yemiş): bezelye gibi kabukta büyüyen fıstık."},{"id":"pen","word":"pen","pos":"noun","tr":"tükenmez kalem, dolma kalem","en":"Can I borrow your pen?","entr":"Kalemini ödünç alabilir miyim?","ipa":"/pen/","tip":"Mürekkepli kalem 'pen', kurşun kalem 'pencil'."},{"id":"pencil","word":"pencil","pos":"noun","tr":"kurşun kalem","en":"Write your name with a pencil.","entr":"Adını kurşun kalemle yaz.","ipa":"/ˈpen.səl/","tip":"Pencil case = kalem kutusu."},{"id":"penguin","word":"penguin","pos":"noun","tr":"penguen","en":"A penguin can swim but it cannot fly.","entr":"Penguen yüzebilir ama uçamaz.","ipa":"/ˈpeŋ.ɡwɪn/","tip":"Türkçedeki 'penguen' ile neredeyse aynı."},{"id":"penny","word":"penny","pos":"noun","tr":"peni (İngiliz bozuk parası)","en":"This sweet costs only one penny.","entr":"Bu şeker sadece bir peni.","ipa":"/ˈpen.i/","tip":"100 pence = 1 pound (sterlin). Çoğulu 'pence'."},{"id":"people","word":"people","pos":"noun","tr":"insanlar","en":"Many people live in Istanbul.","entr":"İstanbul'da çok insan yaşıyor.","ipa":"/ˈpiː.pəl/","tip":"Person'ın çoğulu gibi kullanılır ve fiil çoğul olur: People are..."},{"id":"perhaps","word":"perhaps","pos":"adverb","tr":"belki","en":"Perhaps we can meet tomorrow.","entr":"Belki yarın buluşabiliriz.","ipa":"/pəˈhæps/","tip":"'Maybe' ile aynı anlam, biraz daha resmi."},{"id":"person","word":"person","pos":"noun","tr":"kişi, insan","en":"She is a very kind person.","entr":"O çok nazik bir insan.","ipa":"/ˈpɜː.sən/","tip":"Tekil: one person; çoğul: two people."},{"id":"personal","word":"personal","pos":"adjective","tr":"kişisel, özel","en":"Please don't read my personal letters.","entr":"Lütfen kişisel mektuplarımı okuma.","ipa":"/ˈpɜː.sən.əl/","tip":"Person (kişi) + -al = kişisel."},{"id":"pharmacy","word":"pharmacy","pos":"noun","tr":"eczane","en":"I bought some medicine at the pharmacy.","entr":"Eczaneden biraz ilaç aldım.","ipa":"/ˈfɑː.mə.si/","tip":"'ph' /f/ okunur. Farmasi, farmakoloji ile aynı kökten."},{"id":"phone","word":"phone","pos":"noun","tr":"telefon","en":"My phone is on the table.","entr":"Telefonum masanın üstünde.","ipa":"/fəʊn/","tip":"Telephone kelimesinin kısa hâli."},{"id":"phonecard","word":"phonecard","pos":"noun","tr":"telefon kartı","en":"In the past, people used a phonecard to call from the street.","entr":"Eskiden insanlar sokaktan aramak için telefon kartı kullanırdı.","ipa":"/ˈfəʊn.kɑːd/","tip":"Phone (telefon) + card (kart) = telefon kartı."},{"id":"photographer","word":"photographer","pos":"noun","tr":"fotoğrafçı","en":"The photographer took a picture of our class.","entr":"Fotoğrafçı sınıfımızın fotoğrafını çekti.","ipa":"/fəˈtɒɡ.rə.fər/","tip":"Vurgu ikinci hecede: pho-TO-grapher."},{"id":"piano","word":"piano","pos":"noun","tr":"piyano","en":"My sister plays the piano very well.","entr":"Kız kardeşim çok iyi piyano çalar.","ipa":"/piˈæn.əʊ/","tip":"Çalgılarla 'the' kullanılır: play the piano."},{"id":"pick","word":"pick","pos":"verb","tr":"seçmek, toplamak","en":"Pick a card, any card.","entr":"Bir kart seç, herhangi birini.","ipa":"/pɪk/","tip":"'Pick up' = yerden almak ya da birini arabayla almak."},{"id":"picnic","word":"picnic","pos":"noun","tr":"piknik","en":"Let's have a picnic by the river.","entr":"Nehrin kenarında piknik yapalım.","ipa":"/ˈpɪk.nɪk/","tip":"Türkçedeki 'piknik' ile aynıdır."},{"id":"picture","word":"picture","pos":"noun","tr":"resim, fotoğraf","en":"She drew a picture of her cat.","entr":"Kedisinin resmini çizdi.","ipa":"/ˈpɪk.tʃər/","tip":"'Take a picture' = fotoğraf çekmek."},{"id":"piece","word":"piece","pos":"noun","tr":"parça, dilim","en":"Would you like a piece of cake?","entr":"Bir dilim kek ister misin?","ipa":"/piːs/","tip":"'Peace' (barış) ile aynı okunur: /piːs/."},{"id":"pig","word":"pig","pos":"noun","tr":"domuz","en":"There is a pig on the farm.","entr":"Çiftlikte bir domuz var.","ipa":"/pɪɡ/","tip":"Domuz eti 'pork' olarak adlandırılır."},{"id":"pin","word":"pin","pos":"noun","tr":"toplu iğne; şifre (PIN)","en":"She fixed the paper to the board with a pin.","entr":"Kâğıdı panoya bir raptiyeyle tutturdu.","ipa":"/pɪn/","tip":"Kart şifresi 'PIN number' olarak da geçer."},{"id":"ping-pong","word":"ping-pong","pos":"noun","tr":"masa tenisi, pinpon","en":"We play ping-pong in the school hall.","entr":"Okul salonunda pinpon oynarız.","ipa":"/ˈpɪŋ.pɒŋ/","tip":"Topun çıkardığı sesten gelir. 'Table tennis' ile aynı."},{"id":"place","word":"place","pos":"noun","tr":"yer, mekân","en":"This is a beautiful place for a holiday.","entr":"Burası tatil için güzel bir yer.","ipa":"/pleɪs/","tip":"'Take place' = gerçekleşmek, olmak."},{"id":"plan","word":"plan","pos":"noun","tr":"plan","en":"What is your plan for the weekend?","entr":"Hafta sonu için planın ne?","ipa":"/plæn/","tip":"Türkçedeki 'plan' ile aynıdır. Fiil: plan → planned."},{"id":"play","word":"play","pos":"verb","tr":"oynamak; çalmak (çalgı)","en":"The children play football after school.","entr":"Çocuklar okuldan sonra futbol oynar.","ipa":"/pleɪ/","tip":"Hem oyun oynamak hem çalgı çalmak: play the guitar."},{"id":"player","word":"player","pos":"noun","tr":"oyuncu","en":"He is the best player in our team.","entr":"O, takımımızın en iyi oyuncusu.","ipa":"/ˈpleɪ.ər/","tip":"Play (oynamak) + -er = oyuncu."},{"id":"please","word":"please","pos":"adverb","tr":"lütfen","en":"Close the door, please.","entr":"Kapıyı kapat, lütfen.","ipa":"/pliːz/","tip":"Kibar ricaların sihirli kelimesi; cümlenin başında ya da sonunda olabilir."},{"id":"pleased","word":"pleased","pos":"adjective","tr":"memnun","en":"I'm pleased to meet you.","entr":"Tanıştığıma memnun oldum.","ipa":"/pliːzd/","tip":"'Pleased to meet you' = 'Nice to meet you' ile aynı."},{"id":"plenty","word":"plenty","pos":"pronoun","tr":"bol, çok, yeterince","en":"Don't hurry; we have plenty of time.","entr":"Acele etme, bol vaktimiz var.","ipa":"/ˈplen.ti/","tip":"'Plenty of' = bol bol, gereğinden fazla."},{"id":"plural","word":"plural","pos":"noun","tr":"çoğul","en":"The plural of 'child' is 'children'.","entr":"'Child' kelimesinin çoğulu 'children'dır.","ipa":"/ˈplʊə.rəl/","tip":"Zıttı 'singular' (tekil)."},{"id":"plus","word":"plus","pos":"preposition","tr":"artı","en":"Two plus three equals five.","entr":"İki artı üç beş eder.","ipa":"/plʌs/","tip":"Matematikte '+' işareti; zıttı 'minus'."},{"id":"point","word":"point","pos":"noun","tr":"nokta; puan; amaç","en":"Our team won by one point.","entr":"Takımımız bir sayı farkla kazandı.","ipa":"/pɔɪnt/","tip":"Fiil olarak 'işaret etmek': point at the board."},{"id":"police","word":"police","pos":"noun","tr":"polis","en":"Call the police!","entr":"Polisi ara!","ipa":"/pəˈliːs/","tip":"Türkiye'de polis numarası 155, acil çağrı ise 112."},{"id":"policeman","word":"policeman","pos":"noun","tr":"polis memuru (erkek)","en":"A policeman showed us the way.","entr":"Bir polis memuru bize yolu gösterdi.","ipa":"/pəˈliːs.mən/","tip":"Police + man (adam) = erkek polis. Kadın için 'policewoman'."},{"id":"policewoman","word":"policewoman","pos":"noun","tr":"kadın polis memuru","en":"The policewoman stopped the traffic.","entr":"Kadın polis trafiği durdurdu.","ipa":"/pəˈliːsˌwʊm.ən/","tip":"Police + woman (kadın) = kadın polis."},{"id":"pool","word":"pool","pos":"noun","tr":"havuz","en":"The hotel has a big pool.","entr":"Otelin büyük bir havuzu var.","ipa":"/puːl/","tip":"Swimming pool = yüzme havuzu."},{"id":"poor","word":"poor","pos":"adjective","tr":"fakir, yoksul; zavallı","en":"We collected clothes for poor families.","entr":"Yoksul aileler için kıyafet topladık.","ipa":"/pɔːr/","tip":"Zıttı 'rich' (zengin). 'Poor thing!' = zavallıcık!"},{"id":"popcorn","word":"popcorn","pos":"noun","tr":"patlamış mısır","en":"We always eat popcorn at the cinema.","entr":"Sinemada hep patlamış mısır yeriz.","ipa":"/ˈpɒp.kɔːn/","tip":"Pop (patlamak) + corn (mısır) = patlamış mısır."},{"id":"pork","word":"pork","pos":"noun","tr":"domuz eti","en":"This sausage has no pork in it.","entr":"Bu sosiste domuz eti yok.","ipa":"/pɔːk/","tip":"Hayvan 'pig', eti 'pork'. Beef (sığır eti) gibi."},{"id":"possible","word":"possible","pos":"adjective","tr":"mümkün, olası","en":"Is it possible to finish today?","entr":"Bugün bitirmek mümkün mü?","ipa":"/ˈpɒs.ə.bəl/","tip":"Zıttı 'impossible' (imkânsız). 'As soon as possible' = en kısa sürede."},{"id":"possibly","word":"possibly","pos":"adverb","tr":"muhtemelen, belki","en":"He will possibly come later.","entr":"Muhtemelen daha sonra gelecek.","ipa":"/ˈpɒs.ə.bli/","tip":"Possible + -ly = muhtemelen."},{"id":"post office","word":"post office","pos":"noun","tr":"postane","en":"I sent the letter from the post office.","entr":"Mektubu postaneden gönderdim.","ipa":"/ˈpəʊst ˌɒf.ɪs/","tip":"Post (posta) + office (büro) = postane, Türkiye'de PTT."},{"id":"postcard","word":"postcard","pos":"noun","tr":"kartpostal","en":"She sent me a postcard from Antalya.","entr":"Bana Antalya'dan bir kartpostal gönderdi.","ipa":"/ˈpəʊst.kɑːd/","tip":"Post (posta) + card (kart) = kartpostal."},{"id":"pot","word":"pot","pos":"noun","tr":"tencere, çömlek, saksı","en":"Put the rice in a pot of water.","entr":"Pirinci su dolu bir tencereye koy.","ipa":"/pɒt/","tip":"Teapot = çaydanlık, flowerpot = saksı."},{"id":"potato","word":"potato","pos":"noun","tr":"patates","en":"I'd like a baked potato with cheese.","entr":"Peynirli fırın patates istiyorum.","ipa":"/pəˈteɪ.təʊ/","tip":"Çoğulu -es alır: potatoes."},{"id":"pound","word":"pound","pos":"noun","tr":"sterlin; libre (yaklaşık 450 gram)","en":"A loaf of bread costs about one pound in London.","entr":"Londra'da bir somun ekmek yaklaşık bir sterlin.","ipa":"/paʊnd/","tip":"İngiliz parası £ işaretiyle gösterilir."},{"id":"power","word":"power","pos":"noun","tr":"güç, enerji, elektrik","en":"There was no power during the storm.","entr":"Fırtına sırasında elektrik yoktu.","ipa":"/ˈpaʊ.ər/","tip":"Powerbank = taşınabilir şarj aleti, güç deposu."},{"id":"practice","word":"practice","pos":"noun","tr":"alıştırma, pratik, antrenman","en":"Football practice is on Tuesday.","entr":"Futbol antrenmanı salı günü.","ipa":"/ˈpræk.tɪs/","tip":"İngiliz yazımında isim 'practice' (c ile), fiil 'practise' (s ile)."},{"id":"practise","word":"practise","pos":"verb","tr":"pratik yapmak, alıştırma yapmak","en":"I practise English every day.","entr":"Her gün İngilizce pratik yapıyorum.","ipa":"/ˈpræk.tɪs/","tip":"Fiil s ile: practise. İsim c ile: practice. Okunuşları aynı."},{"id":"prepare","word":"prepare","pos":"verb","tr":"hazırlamak, hazırlanmak","en":"My mother is preparing dinner; I want to prepare the salad.","entr":"Annem akşam yemeğini hazırlıyor; ben salatayı hazırlamak istiyorum.","ipa":"/prɪˈpeər/","tip":"Pre (önce) + pare (hazırlamak) = önceden hazırlamak."},{"id":"preposition","word":"preposition","pos":"noun","tr":"edat, ilgeç","en":"'In' and 'on' are prepositions; 'under' is a preposition too.","entr":"'In' ve 'on' edattır; 'under' da bir edattır.","ipa":"/ˌprep.əˈzɪʃ.ən/","tip":"Pre (önce) + position (konum): ismin önüne gelip yer bildiren kelime."},{"id":"press","word":"press","pos":"verb","tr":"basmak, bastırmak","en":"Press the green button to start.","entr":"Başlamak için yeşil düğmeye bas.","ipa":"/pres/","tip":"İsim olarak 'basın' demektir: the press (gazeteciler)."},{"id":"pressure","word":"pressure","pos":"noun","tr":"basınç, baskı","en":"Students feel a lot of pressure before exams.","entr":"Öğrenciler sınavlardan önce çok baskı hisseder.","ipa":"/ˈpreʃ.ər/","tip":"Press (bastırmak) + -ure = baskı, basınç. Blood pressure = tansiyon."},{"id":"previous","word":"previous","pos":"adjective","tr":"önceki","en":"I met her on the previous day.","entr":"Onunla bir önceki gün tanıştım.","ipa":"/ˈpriː.vi.əs/","tip":"Pre (önce) kökünden: bir önceki."},{"id":"price","word":"price","pos":"noun","tr":"fiyat","en":"What is the price of this jacket?","entr":"Bu ceketin fiyatı ne?","ipa":"/praɪs/","tip":"Prize (ödül) ile karıştırma: price = fiyat."},{"id":"priest","word":"priest","pos":"noun","tr":"rahip, papaz","en":"The priest spoke in the old church.","entr":"Rahip eski kilisede konuştu.","ipa":"/priːst/","tip":"Kilisede görev yapan din adamı."},{"id":"private","word":"private","pos":"adjective","tr":"özel, kişiye ait","en":"This is a private beach.","entr":"Burası özel bir plaj.","ipa":"/ˈpraɪ.vət/","tip":"Türkçedeki 'privat/özel' anlamı; zıttı 'public' (kamuya açık)."},{"id":"probably","word":"probably","pos":"adverb","tr":"muhtemelen","en":"It will probably snow tonight.","entr":"Bu gece muhtemelen kar yağacak.","ipa":"/ˈprɒb.ə.bli/","tip":"Probable (olası) + -ly. 'Maybe'den daha güçlü bir ihtimal."},{"id":"problem","word":"problem","pos":"noun","tr":"sorun, problem","en":"No problem, I can help you.","entr":"Sorun değil, sana yardım edebilirim.","ipa":"/ˈprɒb.ləm/","tip":"'No problem' = sorun değil, rica ederim."},{"id":"produce","word":"produce","pos":"verb","tr":"üretmek","en":"Bees produce honey.","entr":"Arılar bal üretir.","ipa":"/prəˈdjuːs/","tip":"Product (ürün) ve production (üretim) aynı aileden."},{"id":"product","word":"product","pos":"noun","tr":"ürün","en":"This product is made in Türkiye.","entr":"Bu ürün Türkiye'de üretilmiştir.","ipa":"/ˈprɒd.ʌkt/","tip":"Produce (üretmek) fiilinden: üretilen şey, ürün."},{"id":"production","word":"production","pos":"noun","tr":"üretim, yapım","en":"Car production is high in Bursa.","entr":"Bursa'da otomobil üretimi yüksektir.","ipa":"/prəˈdʌk.ʃən/","tip":"Türkçedeki 'prodüksiyon' ile aynı kökten."},{"id":"profit","word":"profit","pos":"noun","tr":"kâr, kazanç","en":"The shop made a good profit this year.","entr":"Dükkân bu yıl iyi kâr etti.","ipa":"/ˈprɒf.ɪt/","tip":"Zıttı 'loss' (zarar)."},{"id":"programme","word":"programme","pos":"noun","tr":"program","en":"My favourite TV programme starts at eight.","entr":"En sevdiğim TV programı sekizde başlıyor.","ipa":"/ˈprəʊ.ɡræm/","tip":"İngiliz yazımı 'programme'; bilgisayar programı ise 'program' yazılır."},{"id":"project","word":"project","pos":"noun","tr":"proje","en":"We are working on a science project.","entr":"Bir fen projesi üzerinde çalışıyoruz.","ipa":"/ˈprɒdʒ.ekt/","tip":"Türkçedeki 'proje' ile aynıdır."},{"id":"pronounce","word":"pronounce","pos":"verb","tr":"telaffuz etmek, söylemek","en":"How do you pronounce this word?","entr":"Bu kelimeyi nasıl telaffuz edersin?","ipa":"/prəˈnaʊns/","tip":"Bu uygulamadaki /.../ işaretleri kelimenin nasıl 'pronounce' edildiğini gösterir."},{"id":"proud","word":"proud","pos":"adjective","tr":"gururlu, gurur duyan","en":"My parents are proud of me.","entr":"Annemle babam benimle gurur duyuyor.","ipa":"/praʊd/","tip":"'Be proud of' = ...ile gurur duymak."},{"id":"provide","word":"provide","pos":"verb","tr":"sağlamak, temin etmek","en":"The school will provide lunch for all students.","entr":"Okul tüm öğrencilere öğle yemeği sağlayacak.","ipa":"/prəˈvaɪd/","tip":"'Provide something for someone' = birine bir şey sağlamak."},{"id":"public","word":"public","pos":"adjective","tr":"kamu, halka açık","en":"You can't smoke in a public place.","entr":"Halka açık bir yerde sigara içemezsin.","ipa":"/ˈpʌb.lɪk/","tip":"Public transport = toplu taşıma. Zıttı 'private'."},{"id":"pull","word":"pull","pos":"verb","tr":"çekmek","en":"Pull the door to open it.","entr":"Açmak için kapıyı çek.","ipa":"/pʊl/","tip":"Kapılarda PULL = çekiniz, PUSH = itiniz."},{"id":"pullover","word":"pullover","pos":"noun","tr":"kazak, süveter","en":"Wear a pullover; it's cold today.","entr":"Kazak giy, bugün hava soğuk.","ipa":"/ˈpʊlˌəʊ.vər/","tip":"Pull (çekmek) + over (üstünden): başın üstünden çekilerek giyilen kazak."},{"id":"puppet","word":"puppet","pos":"noun","tr":"kukla","en":"The children watched a puppet show.","entr":"Çocuklar kukla gösterisi izledi.","ipa":"/ˈpʌp.ɪt/","tip":"Karagöz ile Hacivat da birer gölge kuklasıdır."},{"id":"puppy","word":"puppy","pos":"noun","tr":"köpek yavrusu","en":"Our dog had a cute puppy.","entr":"Köpeğimizin sevimli bir yavrusu oldu.","ipa":"/ˈpʌp.i/","tip":"Kedi yavrusu 'kitten', köpek yavrusu 'puppy'."},{"id":"purpose","word":"purpose","pos":"noun","tr":"amaç, maksat","en":"What is the purpose of your visit?","entr":"Ziyaretinizin amacı nedir?","ipa":"/ˈpɜː.pəs/","tip":"'On purpose' = bilerek, kasten."},{"id":"push","word":"push","pos":"verb","tr":"itmek","en":"Push the button to call the lift.","entr":"Asansörü çağırmak için düğmeye bas.","ipa":"/pʊʃ/","tip":"Zıttı 'pull' (çekmek)."},{"id":"put","word":"put","pos":"verb","tr":"koymak","en":"Put your bag under the desk.","entr":"Çantanı sıranın altına koy.","ipa":"/pʊt/","tip":"Put → put → put; üç hâli de aynı. 'Put on' = giymek."},{"id":"quality","word":"quality","pos":"noun","tr":"kalite, nitelik","en":"These shoes are of good quality.","entr":"Bu ayakkabılar kaliteli.","ipa":"/ˈkwɒl.ə.ti/","tip":"Türkçedeki 'kalite' ile aynı kökten."},{"id":"quarter","word":"quarter","pos":"noun","tr":"çeyrek","en":"It's a quarter past five.","entr":"Saat beşi çeyrek geçiyor.","ipa":"/ˈkwɔː.tər/","tip":"Saatte 'quarter past' = çeyrek geçe, 'quarter to' = çeyrek kala."},{"id":"question","word":"question","pos":"noun","tr":"soru","en":"Can I ask a question?","entr":"Bir soru sorabilir miyim?","ipa":"/ˈkwes.tʃən/","tip":"Soru işareti 'question mark' (?)."},{"id":"queue","word":"queue","pos":"noun","tr":"kuyruk, sıra","en":"There is a long queue at the bank.","entr":"Bankada uzun bir kuyruk var.","ipa":"/kjuː/","tip":"Yalnızca ilk harf okunur gibi: /kjuː/ (Q harfiyle aynı ses)."},{"id":"quick","word":"quick","pos":"adjective","tr":"hızlı, çabuk","en":"Let's have a quick lunch.","entr":"Hızlıca bir öğle yemeği yiyelim.","ipa":"/kwɪk/","tip":"Zıttı 'slow' (yavaş). Zarf hâli 'quickly'."},{"id":"quickly","word":"quickly","pos":"adverb","tr":"hızlıca, çabucak","en":"Come quickly; the bus is here!","entr":"Çabuk gel, otobüs geldi!","ipa":"/ˈkwɪk.li/","tip":"Quick (hızlı) + -ly = hızlıca."},{"id":"quite","word":"quite","pos":"adverb","tr":"oldukça, epey","en":"The test was quite easy.","entr":"Sınav oldukça kolaydı.","ipa":"/kwaɪt/","tip":"'Quiet' (sessiz) ile karıştırma: quite = oldukça."},{"id":"radio","word":"radio","pos":"noun","tr":"radyo","en":"I listen to the radio in the car.","entr":"Arabada radyo dinlerim.","ipa":"/ˈreɪ.di.əʊ/","tip":"İngilizcede /ˈreɪ.di.əʊ/ diye 'rey' ile başlar."},{"id":"rain","word":"rain","pos":"noun","tr":"yağmur","en":"We stayed at home because of the rain.","entr":"Yağmur yüzünden evde kaldık.","ipa":"/reɪn/","tip":"Fiil olarak da kullanılır: It's raining (yağmur yağıyor)."},{"id":"raincoat","word":"raincoat","pos":"noun","tr":"yağmurluk","en":"Take your raincoat with you.","entr":"Yağmurluğunu yanına al.","ipa":"/ˈreɪŋ.kəʊt/","tip":"Rain (yağmur) + coat (palto) = yağmurluk."},{"id":"rainy","word":"rainy","pos":"adjective","tr":"yağmurlu","en":"It was a cold and rainy day.","entr":"Soğuk ve yağmurlu bir gündü.","ipa":"/ˈreɪ.ni/","tip":"Rain + -y = yağmurlu. Sunny, windy, cloudy gibi."},{"id":"ran","word":"ran","pos":"verb","tr":"koştu (run fiilinin geçmiş hâli)","en":"The boy ran to the bus stop.","entr":"Çocuk otobüs durağına koştu.","ipa":"/ræn/","tip":"Run → ran → run."},{"id":"range","word":"range","pos":"noun","tr":"çeşit, yelpaze; aralık","en":"The shop has a wide range of toys.","entr":"Dükkânda çok çeşitli oyuncak var.","ipa":"/reɪndʒ/","tip":"'A wide range of' = geniş bir yelpaze, çok çeşitli."},{"id":"rat","word":"rat","pos":"noun","tr":"sıçan, iri fare","en":"We saw a rat near the rubbish bin.","entr":"Çöp kutusunun yanında bir sıçan gördük.","ipa":"/ræt/","tip":"Mouse küçük fare, rat iri sıçan."},{"id":"rate","word":"rate","pos":"noun","tr":"oran, hız, ücret","en":"The exchange rate changes every day.","entr":"Döviz kuru her gün değişir.","ipa":"/reɪt/","tip":"Exchange rate = döviz kuru. Heart rate = nabız."},{"id":"rather","word":"rather","pos":"adverb","tr":"oldukça; tercihen","en":"I'd rather stay at home tonight.","entr":"Bu akşam evde kalmayı tercih ederim.","ipa":"/ˈrɑː.ðər/","tip":"'I'd rather...' = ...yı tercih ederim."},{"id":"reach","word":"reach","pos":"verb","tr":"ulaşmak, yetişmek","en":"I can't reach the top shelf.","entr":"En üst rafa uzanamıyorum.","ipa":"/riːtʃ/","tip":"Hem bir yere varmak hem de elle uzanmak anlamında."},{"id":"read","word":"read","pos":"verb","tr":"okumak","en":"I read a book before bed.","entr":"Yatmadan önce kitap okurum.","ipa":"/riːd/","tip":"Read → read → read; yazılışı aynı ama geçmiş hâli /red/ okunur."},{"id":"reader","word":"reader","pos":"noun","tr":"okur, okuyucu","en":"My sister is a fast reader.","entr":"Kız kardeşim hızlı okur.","ipa":"/ˈriː.dər/","tip":"Read (okumak) + -er = okuyan kişi."},{"id":"ready","word":"ready","pos":"adjective","tr":"hazır","en":"Dinner is ready!","entr":"Yemek hazır!","ipa":"/ˈred.i/","tip":"'Are you ready?' = Hazır mısın?"},{"id":"real","word":"real","pos":"adjective","tr":"gerçek","en":"Is this a real diamond?","entr":"Bu gerçek bir elmas mı?","ipa":"/rɪəl/","tip":"Türkçedeki 'reel' ile aynı kökten."},{"id":"realize","word":"realize","pos":"verb","tr":"farkına varmak, anlamak","en":"I didn't realize it was so late.","entr":"Bu kadar geç olduğunu fark etmedim.","ipa":"/ˈrɪə.laɪz/","tip":"Real (gerçek) + -ize: bir şeyin gerçek olduğunu kavramak."},{"id":"really","word":"really","pos":"adverb","tr":"gerçekten, çok","en":"I really like this song.","entr":"Bu şarkıyı gerçekten seviyorum.","ipa":"/ˈrɪə.li/","tip":"'Really?' tek başına 'Sahi mi?' demektir."},{"id":"reason","word":"reason","pos":"noun","tr":"sebep, neden","en":"What is the reason for your absence?","entr":"Devamsızlığının sebebi ne?","ipa":"/ˈriː.zən/","tip":"'The reason why...' = ...nın nedeni."},{"id":"reasonable","word":"reasonable","pos":"adjective","tr":"makul, mantıklı, uygun (fiyat)","en":"The prices in this café are reasonable.","entr":"Bu kafedeki fiyatlar makul.","ipa":"/ˈriː.zən.ə.bəl/","tip":"Reason (neden, akıl) + -able = akla uygun, makul."},{"id":"receive","word":"receive","pos":"verb","tr":"almak, teslim almak","en":"Did you receive my email?","entr":"E-postamı aldın mı?","ipa":"/rɪˈsiːv/","tip":"Yazım kuralı: c'den sonra 'ei' gelir (rec-ei-ve)."},{"id":"recently","word":"recently","pos":"adverb","tr":"son zamanlarda, yakın zamanda","en":"Have you seen any good films recently?","entr":"Son zamanlarda iyi bir film izledin mi?","ipa":"/ˈriː.sənt.li/","tip":"Recent (yakın zamanda olan) + -ly."},{"id":"reception","word":"reception","pos":"noun","tr":"resepsiyon, karşılama","en":"Please leave your key at reception.","entr":"Lütfen anahtarınızı resepsiyona bırakın.","ipa":"/rɪˈsep.ʃən/","tip":"Türkçedeki 'resepsiyon' ile aynıdır."},{"id":"recognize","word":"recognize","pos":"verb","tr":"tanımak","en":"I didn't recognize you with your new glasses.","entr":"Yeni gözlüklerinle seni tanıyamadım.","ipa":"/ˈrek.əɡ.naɪz/","tip":"Re (yeniden) + cognize (bilmek): daha önce bildiğini yeniden tanımak."},{"id":"record","word":"record","pos":"noun","tr":"kayıt; rekor","en":"She broke the school record in running.","entr":"Koşuda okul rekorunu kırdı.","ipa":"/ˈrek.ɔːd/","tip":"Fiil olarak vurgu değişir: re-CORD (kaydetmek)."},{"id":"red","word":"red","pos":"adjective","tr":"kırmızı","en":"Stop when the traffic light is red.","entr":"Trafik ışığı kırmızıyken dur.","ipa":"/red/","tip":"Bu uygulamadaki kelimeler kitabın 'red' (kırmızı) listesinden!"},{"id":"reduce","word":"reduce","pos":"verb","tr":"azaltmak, düşürmek","en":"We should reduce plastic waste.","entr":"Plastik atığı azaltmalıyız.","ipa":"/rɪˈdjuːs/","tip":"Geri dönüşümün 3 kuralı: reduce, reuse, recycle."},{"id":"refer","word":"refer","pos":"verb","tr":"değinmek, başvurmak","en":"Please refer to the dictionary for help.","entr":"Yardım için lütfen sözlüğe başvurun.","ipa":"/rɪˈfɜːr/","tip":"Türkçedeki 'referans' bu kelimeden gelir."},{"id":"referee","word":"referee","pos":"noun","tr":"hakem","en":"The referee showed him a yellow card.","entr":"Hakem ona sarı kart gösterdi.","ipa":"/ˌref.əˈriː/","tip":"Vurgu son hecede: refe-REE."},{"id":"refuse","word":"refuse","pos":"verb","tr":"reddetmek, geri çevirmek","en":"I can't refuse your kind offer.","entr":"Nazik teklifini geri çeviremem.","ipa":"/rɪˈfjuːz/","tip":"Zıttı 'accept' (kabul etmek)."},{"id":"region","word":"region","pos":"noun","tr":"bölge","en":"The Black Sea region gets a lot of rain.","entr":"Karadeniz bölgesi çok yağmur alır.","ipa":"/ˈriː.dʒən/","tip":"Türkiye'nin 7 bölgesi: seven regions."},{"id":"relationship","word":"relationship","pos":"noun","tr":"ilişki","en":"I have a good relationship with my brother.","entr":"Kardeşimle iyi bir ilişkim var.","ipa":"/rɪˈleɪ.ʃən.ʃɪp/","tip":"Relation (bağ) + -ship (durum) = ilişki."},{"id":"remain","word":"remain","pos":"verb","tr":"kalmak, durmak","en":"Please remain in your seats.","entr":"Lütfen yerlerinizde kalın.","ipa":"/rɪˈmeɪn/","tip":"'Stay' ile benzer, daha resmi."},{"id":"remember","word":"remember","pos":"verb","tr":"hatırlamak","en":"I can't remember his name.","entr":"Adını hatırlayamıyorum.","ipa":"/rɪˈmem.bər/","tip":"Re (yeniden) + member: aklına yeniden getirmek. Zıttı 'forget'."},{"id":"remind","word":"remind","pos":"verb","tr":"hatırlatmak","en":"Please remind me to call my mother.","entr":"Lütfen annemi aramamı bana hatırlat.","ipa":"/rɪˈmaɪnd/","tip":"Re (yeniden) + mind (akıl): birinin aklına getirmek."},{"id":"report","word":"report","pos":"noun","tr":"rapor, haber; karne","en":"I got a good school report this year.","entr":"Bu yıl iyi bir karne aldım.","ipa":"/rɪˈpɔːt/","tip":"Türkçedeki 'rapor' ile aynı kökten. Reporter = muhabir."},{"id":"require","word":"require","pos":"verb","tr":"gerektirmek, istemek","en":"This job may require some experience.","entr":"Bu iş biraz deneyim gerektirebilir.","ipa":"/rɪˈkwaɪər/","tip":"'Need' ile benzer ama daha resmi."},{"id":"respect","word":"respect","pos":"noun","tr":"saygı","en":"We should show respect to older people.","entr":"Yaşlılara saygı göstermeliyiz.","ipa":"/rɪˈspekt/","tip":"Türkçedeki 'respekt'e benzer; fiil olarak 'saygı duymak'."},{"id":"response","word":"response","pos":"noun","tr":"cevap, tepki","en":"I am still waiting for a response.","entr":"Hâlâ bir cevap bekliyorum.","ipa":"/rɪˈspɒns/","tip":"'Answer' ile benzer; daha resmi."},{"id":"rest","word":"rest","pos":"noun","tr":"dinlenme; geri kalan","en":"You look tired; take a rest.","entr":"Yorgun görünüyorsun, biraz dinlen.","ipa":"/rest/","tip":"'The rest' = geri kalanı: the rest of the day."},{"id":"result","word":"result","pos":"noun","tr":"sonuç","en":"The exam result will be ready next week.","entr":"Sınav sonucu gelecek hafta hazır olacak.","ipa":"/rɪˈzʌlt/","tip":"\"As a result\" = sonuç olarak. Sınav sonucu: exam result."},{"id":"rich","word":"rich","pos":"adjective","tr":"zengin","en":"He is rich, but he is not happy.","entr":"Zengin ama mutlu değil.","ipa":"/rɪtʃ/","tip":"Zıttı 'poor' (fakir)."},{"id":"right","word":"right","pos":"adjective","tr":"doğru; sağ","en":"Turn right at the traffic lights.","entr":"Trafik ışıklarından sağa dön.","ipa":"/raɪt/","tip":"İki anlamı var: sağ (right hand) ve doğru (the right answer)."},{"id":"ring","word":"ring","pos":"noun","tr":"yüzük; zil sesi","en":"She wears a gold ring.","entr":"Altın bir yüzük takıyor.","ipa":"/rɪŋ/","tip":"Fiil olarak 'çalmak, telefon etmek': ring → rang → rung."},{"id":"risk","word":"risk","pos":"noun","tr":"risk, tehlike","en":"Driving fast is a big risk.","entr":"Hızlı araba sürmek büyük bir risktir.","ipa":"/rɪsk/","tip":"Türkçedeki 'risk' ile aynıdır."},{"id":"road","word":"road","pos":"noun","tr":"yol","en":"Look both ways before you cross the road.","entr":"Yolu geçmeden önce iki tarafa da bak.","ipa":"/rəʊd/","tip":"Şehir içindeki ana yol 'street', şehirler arası 'road'."},{"id":"room","word":"room","pos":"noun","tr":"oda; yer","en":"My room is on the second floor.","entr":"Odam ikinci katta.","ipa":"/ruːm/","tip":"Bathroom, bedroom, classroom: hepsi 'room' içerir."},{"id":"ruler","word":"ruler","pos":"noun","tr":"cetvel; hükümdar","en":"Draw a line with your ruler.","entr":"Cetvelinle bir çizgi çiz.","ipa":"/ˈruː.lər/","tip":"Rule (kural, yönetmek) + -er: çizgiyi 'yöneten' cetvel ya da ülkeyi yöneten hükümdar."},{"id":"run","word":"run","pos":"verb","tr":"koşmak; işletmek","en":"I run in the park every morning.","entr":"Her sabah parkta koşarım.","ipa":"/rʌn/","tip":"Run → ran → run. 'Run a shop' = dükkân işletmek."},{"id":"rung","word":"rung","pos":"verb","tr":"çalmış (ring fiilinin üçüncü hâli)","en":"Has the bell rung yet?","entr":"Zil çaldı mı?","ipa":"/rʌŋ/","tip":"Ring → rang → rung. 'Has/have' ile kullanılır."},{"id":"sad","word":"sad","pos":"adjective","tr":"üzgün","en":"Why are you sad today?","entr":"Bugün neden üzgünsün?","ipa":"/sæd/","tip":"Zıttı 'happy' (mutlu)."},{"id":"said","word":"said","pos":"verb","tr":"dedi, söyledi (say fiilinin geçmiş hâli)","en":"The teacher said, 'Open your books.'","entr":"Öğretmen 'Kitaplarınızı açın' dedi.","ipa":"/sed/","tip":"Say → said → said. Yazılışına rağmen /sed/ okunur."},{"id":"salad","word":"salad","pos":"noun","tr":"salata","en":"I'd like a green salad, please.","entr":"Yeşil salata istiyorum, lütfen.","ipa":"/ˈsæl.əd/","tip":"Türkçedeki 'salata' ile aynı kökten."},{"id":"salary","word":"salary","pos":"noun","tr":"maaş","en":"She gets her salary at the end of the month.","entr":"Maaşını ay sonunda alıyor.","ipa":"/ˈsæl.ər.i/","tip":"Latince 'sal' (tuz) kökünden: eski Roma'da askerlere tuz parası verilirdi."},{"id":"same","word":"same","pos":"adjective","tr":"aynı","en":"We are in the same class.","entr":"Aynı sınıftayız.","ipa":"/seɪm/","tip":"Her zaman 'the same' şeklinde kullanılır. Zıttı 'different'."},{"id":"sang","word":"sang","pos":"verb","tr":"şarkı söyledi (sing fiilinin geçmiş hâli)","en":"We sang the national anthem together.","entr":"İstiklal Marşı'nı hep birlikte söyledik.","ipa":"/sæŋ/","tip":"Sing → sang → sung."},{"id":"sat","word":"sat","pos":"verb","tr":"oturdu (sit fiilinin geçmiş hâli)","en":"She sat next to me on the bus.","entr":"Otobüste yanıma oturdu.","ipa":"/sæt/","tip":"Sit → sat → sat."},{"id":"saturday","word":"Saturday","pos":"noun","tr":"cumartesi","en":"We go to the market on Saturday.","entr":"Cumartesi günü pazara gideriz.","ipa":"/ˈsæt.ə.deɪ/","tip":"Saturn (Satürn) + day: Satürn'ün günü."},{"id":"save","word":"save","pos":"verb","tr":"kurtarmak; biriktirmek; kaydetmek","en":"I want to save money for a new bike.","entr":"Yeni bir bisiklet için para biriktirmek istiyorum.","ipa":"/seɪv/","tip":"Bilgisayarda 'save' = kaydet. Hayat kurtarmak da 'save a life'."},{"id":"say","word":"say","pos":"verb","tr":"söylemek, demek","en":"What did you say?","entr":"Ne dedin?","ipa":"/seɪ/","tip":"Say ne söylendiğine, tell kime söylendiğine odaklanır: tell me."},{"id":"scheme","word":"scheme","pos":"noun","tr":"plan, program, proje","en":"The city has a new recycling scheme.","entr":"Şehrin yeni bir geri dönüşüm programı var.","ipa":"/skiːm/","tip":"'ch' burada /k/ okunur: /skiːm/. Şema kelimesine benzer."},{"id":"school","word":"school","pos":"noun","tr":"okul","en":"I walk to school with my friends.","entr":"Okula arkadaşlarımla yürüyerek giderim.","ipa":"/skuːl/","tip":"'ch' /k/ okunur. 'Go to school' derken 'the' gelmez."},{"id":"science","word":"science","pos":"noun","tr":"bilim, fen","en":"Science is my favourite lesson.","entr":"Fen en sevdiğim ders.","ipa":"/ˈsaɪ.əns/","tip":"Scientist = bilim insanı."},{"id":"sea","word":"sea","pos":"noun","tr":"deniz","en":"Türkiye is surrounded by sea on three sides.","entr":"Türkiye üç tarafı denizlerle çevrili bir ülkedir.","ipa":"/siː/","tip":"'See' (görmek) ile aynı okunur: /siː/."},{"id":"season","word":"season","pos":"noun","tr":"mevsim; sezon","en":"Spring is my favourite season.","entr":"İlkbahar en sevdiğim mevsim.","ipa":"/ˈsiː.zən/","tip":"Türkçedeki 'sezon' ile aynı kökten."},{"id":"seat","word":"seat","pos":"noun","tr":"koltuk, oturacak yer","en":"Is this seat free?","entr":"Bu koltuk boş mu?","ipa":"/siːt/","tip":"Sit (oturmak) ile akraba: oturulan yer. Seat belt = emniyet kemeri."},{"id":"second","word":"second","pos":"noun","tr":"saniye; ikinci","en":"Wait a second, please.","entr":"Bir saniye bekleyin, lütfen.","ipa":"/ˈsek.ənd/","tip":"İki anlamı var: saniye ve ikinci (first, second, third)."},{"id":"secret","word":"secret","pos":"noun","tr":"sır","en":"Can you keep a secret?","entr":"Sır tutabilir misin?","ipa":"/ˈsiː.krət/","tip":"'Keep a secret' = sır tutmak."},{"id":"section","word":"section","pos":"noun","tr":"bölüm, kısım","en":"The sports section is at the back of the newspaper.","entr":"Spor bölümü gazetenin arkasındadır.","ipa":"/ˈsek.ʃən/","tip":"Türkçedeki 'seksiyon' ile aynı kökten: bölüm."},{"id":"sector","word":"sector","pos":"noun","tr":"sektör, alan","en":"Tourism is an important sector in Antalya.","entr":"Turizm Antalya'da önemli bir sektördür.","ipa":"/ˈsek.tər/","tip":"Türkçedeki 'sektör' ile aynıdır."},{"id":"security","word":"security","pos":"noun","tr":"güvenlik","en":"There is a security check at the airport.","entr":"Havalimanında güvenlik kontrolü var.","ipa":"/sɪˈkjʊə.rə.ti/","tip":"Secure (güvenli) + -ity = güvenlik."},{"id":"see","word":"see","pos":"verb","tr":"görmek","en":"I can see the sea from my window.","entr":"Penceremden denizi görebiliyorum.","ipa":"/siː/","tip":"See → saw → seen. 'See you!' = görüşürüz."},{"id":"seek","word":"seek","pos":"verb","tr":"aramak, peşinde olmak","en":"Many young people seek jobs in big cities.","entr":"Birçok genç büyük şehirlerde iş arar.","ipa":"/siːk/","tip":"Hide and seek = saklambaç (saklan ve ara)."},{"id":"seem","word":"seem","pos":"verb","tr":"gibi görünmek","en":"You seem tired today.","entr":"Bugün yorgun görünüyorsun.","ipa":"/siːm/","tip":"'It seems...' = ...gibi görünüyor."},{"id":"seen","word":"seen","pos":"verb","tr":"görmüş (see fiilinin üçüncü hâli)","en":"Have you seen my keys?","entr":"Anahtarlarımı gördün mü?","ipa":"/siːn/","tip":"See → saw → seen. 'Have/has' ile kullanılır."},{"id":"sell","word":"sell","pos":"verb","tr":"satmak","en":"They sell fresh bread at this bakery.","entr":"Bu fırında taze ekmek satıyorlar.","ipa":"/sel/","tip":"Sell → sold → sold. Zıttı 'buy' (satın almak)."},{"id":"send","word":"send","pos":"verb","tr":"göndermek","en":"Can you send me the photos?","entr":"Fotoğrafları bana gönderebilir misin?","ipa":"/send/","tip":"Send → sent → sent."},{"id":"sense","word":"sense","pos":"noun","tr":"duyu; anlam; his","en":"Dogs have a good sense of smell.","entr":"Köpeklerin koku alma duyusu iyidir.","ipa":"/sens/","tip":"'It makes sense' = mantıklı. 'Sense of humour' = mizah anlayışı."},{"id":"sent","word":"sent","pos":"verb","tr":"gönderdi (send fiilinin geçmiş hâli)","en":"I sent a birthday card to my aunt.","entr":"Teyzeme bir doğum günü kartı gönderdim.","ipa":"/sent/","tip":"Send → sent → sent."},{"id":"sentence","word":"sentence","pos":"noun","tr":"cümle","en":"Write a sentence with this word.","entr":"Bu kelimeyle bir cümle yaz.","ipa":"/ˈsen.təns/","tip":"Bu kartlardaki örnekler birer 'sentence'tır."},{"id":"september","word":"September","pos":"noun","tr":"eylül","en":"School starts in September.","entr":"Okul eylülde başlar.","ipa":"/sepˈtem.bər/","tip":"Septem (yedi) kökünden: eski Roma takviminin yedinci ayı."},{"id":"serious","word":"serious","pos":"adjective","tr":"ciddi","en":"Are you joking or serious?","entr":"Şaka mı yapıyorsun, ciddi misin?","ipa":"/ˈsɪə.ri.əs/","tip":"'Seriously?' = Ciddi misin?"},{"id":"serve","word":"serve","pos":"verb","tr":"servis etmek, hizmet etmek","en":"They serve breakfast until ten o'clock.","entr":"Saat ona kadar kahvaltı servis ediyorlar.","ipa":"/sɜːv/","tip":"Türkçedeki 'servis' bu kelimeden gelir."},{"id":"service","word":"service","pos":"noun","tr":"hizmet, servis","en":"The service in this restaurant is very good.","entr":"Bu restoranın hizmeti çok iyi.","ipa":"/ˈsɜː.vɪs/","tip":"Türkçedeki 'servis' ile aynıdır."},{"id":"set","word":"set","pos":"verb","tr":"kurmak, ayarlamak; takım","en":"I set my alarm for seven o'clock.","entr":"Alarmımı saat yediye kurdum.","ipa":"/set/","tip":"Set → set → set. 'Set the table' = sofrayı kurmak."},{"id":"several","word":"several","pos":"determiner","tr":"birkaç, çeşitli","en":"I have read this book several times.","entr":"Bu kitabı birkaç kez okudum.","ipa":"/ˈsev.ər.əl/","tip":"'A few'dan biraz fazlası: birkaç tane."},{"id":"sex","word":"sex","pos":"noun","tr":"cinsiyet","en":"Write your name, age and sex on the form.","entr":"Forma adını, yaşını ve cinsiyetini yaz.","ipa":"/seks/","tip":"Formlarda 'sex: male / female' = cinsiyet: erkek / kadın."},{"id":"shall","word":"shall","pos":"verb","tr":"-elim mi?, -ecek (öneri)","en":"Shall we go to the cinema?","entr":"Sinemaya gidelim mi?","ipa":"/ʃæl/","tip":"'Shall we...?' = ...yapalım mı? Öneri yapmanın kalıbı."},{"id":"share","word":"share","pos":"verb","tr":"paylaşmak","en":"I share a room with my brother.","entr":"Kardeşimle aynı odayı paylaşıyorum.","ipa":"/ʃeər/","tip":"Sosyal medyada 'share' = paylaş düğmesi."},{"id":"she","word":"she","pos":"pronoun","tr":"o (kadın)","en":"She is my best friend.","entr":"O benim en iyi arkadaşım.","ipa":"/ʃiː/","tip":"Kadınlar için 'she', erkekler için 'he'."},{"id":"shoe","word":"shoe","pos":"noun","tr":"ayakkabı","en":"I can't find my left shoe.","entr":"Sol ayakkabımı bulamıyorum.","ipa":"/ʃuː/","tip":"Genelde çift olarak kullanılır: a pair of shoes."},{"id":"shop","word":"shop","pos":"noun","tr":"dükkân, mağaza","en":"There is a small shop on the corner.","entr":"Köşede küçük bir dükkân var.","ipa":"/ʃɒp/","tip":"Fiil olarak 'go shopping' = alışverişe gitmek."},{"id":"shopkeeper","word":"shopkeeper","pos":"noun","tr":"esnaf, dükkân sahibi","en":"The shopkeeper gave me my change.","entr":"Dükkân sahibi para üstümü verdi.","ipa":"/ˈʃɒpˌkiː.pər/","tip":"Shop (dükkân) + keeper (tutan, bakan) = dükkân sahibi."},{"id":"short","word":"short","pos":"adjective","tr":"kısa","en":"My sister has short hair.","entr":"Kız kardeşimin saçı kısa.","ipa":"/ʃɔːt/","tip":"Zıttı 'long' (uzun) ve boy için 'tall' (uzun boylu)."},{"id":"should","word":"should","pos":"verb","tr":"-meli, -malı (tavsiye)","en":"You should drink more water.","entr":"Daha çok su içmelisin.","ipa":"/ʃʊd/","tip":"'l' okunmaz: /ʃʊd/. Tavsiye vermek için kullanılır."},{"id":"show","word":"show","pos":"verb","tr":"göstermek; gösteri","en":"Can you show me the way to the station?","entr":"Bana istasyonun yolunu gösterebilir misin?","ipa":"/ʃəʊ/","tip":"Türkçedeki 'şov' bu kelimeden gelir."},{"id":"shut","word":"shut","pos":"verb","tr":"kapatmak","en":"Please shut the window; it's cold.","entr":"Lütfen pencereyi kapat, hava soğuk.","ipa":"/ʃʌt/","tip":"Shut → shut → shut. 'Close' ile aynı anlam."},{"id":"sick","word":"sick","pos":"adjective","tr":"hasta","en":"I was sick, so I didn't go to school.","entr":"Hastaydım, o yüzden okula gitmedim.","ipa":"/sɪk/","tip":"'Ill' ile benzer. 'Feel sick' = midesi bulanmak."},{"id":"side","word":"side","pos":"noun","tr":"taraf, yan","en":"The bank is on the other side of the road.","entr":"Banka yolun öbür tarafında.","ipa":"/saɪd/","tip":"Inside (iç taraf), outside (dış taraf), beside (yanında)."},{"id":"similar","word":"similar","pos":"adjective","tr":"benzer","en":"Your bag is similar to mine.","entr":"Çantan benimkine benziyor.","ipa":"/ˈsɪm.ɪ.lər/","tip":"'Similar to' = ...ya benzer."},{"id":"simple","word":"simple","pos":"adjective","tr":"basit, sade","en":"The answer is very simple.","entr":"Cevap çok basit.","ipa":"/ˈsɪm.pəl/","tip":"Türkçedeki 'simple/sade'; zıttı 'difficult'."},{"id":"simply","word":"simply","pos":"adverb","tr":"basitçe, sadece","en":"Simply press this button.","entr":"Sadece bu düğmeye bas.","ipa":"/ˈsɪm.pli/","tip":"Simple + -ly = basitçe."},{"id":"since","word":"since","pos":"preposition","tr":"-den beri","en":"I have lived here since 2015.","entr":"2015'ten beri burada yaşıyorum.","ipa":"/sɪns/","tip":"Since + başlangıç zamanı (since Monday); for + süre (for two days)."},{"id":"sing","word":"sing","pos":"verb","tr":"şarkı söylemek","en":"She likes to sing in the shower.","entr":"Duşta şarkı söylemeyi sever.","ipa":"/sɪŋ/","tip":"Sing → sang → sung."},{"id":"singer","word":"singer","pos":"noun","tr":"ş
