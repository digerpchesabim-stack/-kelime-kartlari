üzikteki 'cover' (şarkıyı yeniden yorumlama) veya kitap kapağı."},{"id":"cow","word":"cow","pos":"noun","tr":"inek","en":"The brown cow eats grass in the field.","entr":"Kahverengi inek tarlada ot yiyor.","ipa":"/kaʊ/","tip":"Kovboy (cowboy) kelimesindeki 'cow' (inek/sığır)."},{"id":"crab","word":"crab","pos":"noun","tr":"yengeç","en":"We saw a small crab on the beach.","entr":"Kumsalda küçük bir yengeç gördük.","ipa":"/kræb/","tip":"Yan yan yürüyen deniz hayvanı."},{"id":"cream","word":"cream","pos":"noun","tr":"krema, krem","en":"She put some cream on her dry hands.","entr":"Kuru ellerine biraz krem sürdü.","ipa":"/kriːm/","tip":"Türkçedeki 'krem' ve 'krema' kelimesiyle aynıdır."},{"id":"create","word":"create","pos":"verb","tr":"yaratmak, oluşturmak","en":"You can create a new folder on the computer.","entr":"Bilgisayarda yeni bir klasör oluşturabilirsiniz.","ipa":"/kriˈeɪt/","tip":"Türkçedeki 'kreatif' (yaratıcı) kelimesi buradan gelir."},{"id":"cucumber","word":"cucumber","pos":"noun","tr":"salatalık, hıyar","en":"Chop a fresh cucumber for the green salad.","entr":"Yeşil salata için taze bir salatalık doğra.","ipa":"/ˈkjuː.kʌm.bər/","tip":"Cacık yapılan sebze: salatalık."},{"id":"cup","word":"cup","pos":"noun","tr":"fincan, kupa","en":"Would you like a cup of hot tea?","entr":"Bir fincan sıcak çay ister misiniz?","ipa":"/kʌp/","tip":"Türkçedeki 'kupa' (kupa bardak, şampiyonluk kupası) kelimesidir."},{"id":"current","word":"current","pos":"adjective","tr":"mevcut, şimdiki, akım","en":"What is your current home address?","entr":"Mevcut ev adresiniz nedir?","ipa":"/ˈkʌr.ənt/","tip":"Şu anki, güncel: current news."},{"id":"customer","word":"customer","pos":"noun","tr":"müşteri","en":"The shop assistant helped the new customer.","entr":"Tezgahtar yeni müşteriye yardım etti.","ipa":"/ˈkʌs.tə.mər/","tip":"'Customer service' (müşteri hizmetleri) ifadesinden hatırlanabilir."},{"id":"cut","word":"cut","pos":"verb","tr":"kesmek","en":"Cut the paper with sharp scissors.","entr":"Kağıdı keskin makasla kes.","ipa":"/kʌt/","tip":"Bilgisayardaki 'Cut / Copy / Paste' (Kes / Kopyala / Yapıştır) komutu."},{"id":"dad","word":"dad","pos":"noun","tr":"baba","en":"My dad cooks dinner on Friday evenings.","entr":"Babam cuma akşamları akşam yemeği pişirir.","ipa":"/dæd/","tip":"Daddy daha samimi hâlidir."},{"id":"daddy","word":"daddy","pos":"noun","tr":"babacığım, baba","en":"The little girl ran to her daddy.","entr":"Küçük kız babasına doğru koştu.","ipa":"/ˈdæd.i/","tip":"Dad (baba) kelimesinin çocuk dilindeki sevimli hali."},{"id":"daily","word":"daily","pos":"adjective","tr":"günlük, her günkü","en":"Walking is part of my daily routine.","entr":"Yürüyüş yapmak günlük rutinimin bir parçasıdır.","ipa":"/ˈdeɪ.li/","tip":"Day (gün) kelimesinden türemiştir; daily = günlük."},{"id":"dark","word":"dark","pos":"adjective","tr":"karanlık, koyu","en":"The streets get dark early in winter.","entr":"Kışın sokaklar erken kararır.","ipa":"/dɑːk/","tip":"Telefonlardaki 'Dark Mode' (Karanlık/Koyu Mod) ayarı."},{"id":"data","word":"data","pos":"noun","tr":"veri, bilgi","en":"Save all the important data on your computer.","entr":"Tüm önemli verileri bilgisayarına kaydet.","ipa":"/ˈdeɪ.tə/","tip":"Türkçede de bilişimde kullanılan 'data' (veri) kelimesidir."},{"id":"date","word":"date","pos":"noun","tr":"tarih, randevu, hurma","en":"Write today's date at the top.","entr":"En üste bugünün tarihini yaz.","ipa":"/deɪt/","tip":"Hem tarih (What's the date?) hem hurma meyvesi."},{"id":"daughter","word":"daughter","pos":"noun","tr":"kız evlat","en":"Their daughter studies medicine in Istanbul.","entr":"Onların kızı İstanbul'da tıp okuyor.","ipa":"/ˈdɔː.tər/","tip":"'gh' okunmaz: /ˈdɔː.tər/. Erkek evlat 'son'."},{"id":"day","word":"day","pos":"noun","tr":"gün, gündüz","en":"Have a nice day at work today.","entr":"Bugün işte iyi günler dilerim.","ipa":"/deɪ/","tip":"Sunday, Monday gibi tüm gün isimlerinin sonundaki 'gün' kelimesi."},{"id":"dead","word":"dead","pos":"adjective","tr":"ölü, cansız, bitmiş","en":"My phone battery is completely dead now.","entr":"Telefonumun şarjı şu an tamamen bitmiş.","ipa":"/ded/","tip":"Zıttı 'alive' (canlı)."},{"id":"deal","word":"deal","pos":"noun","tr":"anlaşma, fırsat","en":"The two companies made a good deal.","entr":"İki şirket iyi bir anlaşma yaptı.","ipa":"/diːl/","tip":"'It's a deal!' = Anlaştık!"},{"id":"dear","word":"dear","pos":"adjective","tr":"sevgili, değerli, canım","en":"She wrote a letter to her dear friend.","entr":"Sevgili arkadaşına bir mektup yazdı.","ipa":"/dɪər/","tip":"Mektuplarda 'Dear Ali' = Sevgili Ali."},{"id":"death","word":"death","pos":"noun","tr":"ölüm","en":"The book tells the story after the king's death.","entr":"Kitap, kralın ölümünden sonraki hikayeyi anlatıyor.","ipa":"/deθ/","tip":"Dead (ölü) ile aynı kökten."},{"id":"debate","word":"debate","pos":"noun","tr":"tartışma, müzakere, münazara","en":"We watched a television debate last night.","entr":"Dün gece televizyonda bir tartışma programı izledik.","ipa":"/dɪˈbeɪt/","tip":"Türkçedeki 'münazara' anlamında da kullanılır."},{"id":"december","word":"December","pos":"noun","tr":"Aralık (ayı)","en":"It snows a lot here in December.","entr":"Burada Aralık ayında çok kar yağar.","ipa":"/dɪˈsem.bər/","tip":"Decem (on) kökünden: eski Roma takviminin onuncu ayı."},{"id":"decide","word":"decide","pos":"verb","tr":"karar vermek","en":"We must decide on the holiday hotel soon.","entr":"Tatil oteline yakında karar vermeliyiz.","ipa":"/dɪˈsaɪd/","tip":"Decision (karar) bu kelimeden gelir."},{"id":"decision","word":"decision","pos":"noun","tr":"karar","en":"Buying this house was a good decision.","entr":"Bu evi satın almak iyi bir karardı.","ipa":"/dɪˈsɪʒ.ən/","tip":"Decide (karar vermek) fiilinin isim halidir."},{"id":"deep","word":"deep","pos":"adjective","tr":"derin","en":"Take a deep breath and relax now.","entr":"Şimdi derin bir nefes al ve rahatla.","ipa":"/diːp/","tip":"'Deep freeze' = derin dondurucu."},{"id":"definitely","word":"definitely","pos":"adverb","tr":"kesinlikle, şüphesiz","en":"I will definitely call you tomorrow morning.","entr":"Yarın sabah seni kesinlikle arayacağım.","ipa":"/ˈdef.ɪ.nət.li/","tip":"Kesin bir 'evet' için: Definitely!"},{"id":"demand","word":"demand","pos":"noun","tr":"talep, istek, talep etmek","en":"There is a high demand for cold drinks.","entr":"Soğuk içeceklere yüksek bir talep var.","ipa":"/dɪˈmɑːnd/","tip":"Fiil olarak 'talep etmek', isim olarak 'talep'."},{"id":"dentist","word":"dentist","pos":"noun","tr":"diş hekimi, dişçi","en":"Visit the dentist twice a year.","entr":"Yılda iki kez diş hekimini ziyaret edin.","ipa":"/ˈden.tɪst/","tip":"Dental (diş ile ilgili) kelimesiyle aynı kökten."},{"id":"depend","word":"depend","pos":"verb","tr":"bağlı olmak, güvenmek","en":"Our picnic plans depend on the weather.","entr":"Piknik planlarımız havaya bağlıdır.","ipa":"/dɪˈpend/","tip":"'It depends' = duruma bağlı. 'Depend on' = ...a bağlı olmak."},{"id":"describe","word":"describe","pos":"verb","tr":"tarif etmek, betimlemek, tanımlamak","en":"Can you describe the lost bag to me?","entr":"Kayıp çantayı bana tarif edebilir misin?","ipa":"/dɪˈskraɪb/","tip":"Description = tarif, betimleme."},{"id":"determine","word":"determine","pos":"verb","tr":"belirlemek, saptamak","en":"Exams determine the students' final grades.","entr":"Sınavlar öğrencilerin son notlarını belirler.","ipa":"/dɪˈtɜː.mɪn/","tip":"Türkçedeki 'determine etmek' ile aynı: belirlemek."},{"id":"development","word":"development","pos":"noun","tr":"gelişim, gelişme, kalkınma","en":"Healthy food is important for child development.","entr":"Sağlıklı besin çocuk gelişimi için önemlidir.","ipa":"/dɪˈvel.əp.mənt/","tip":"Develop (geliştirmek) fiilinden türeyen 'gelişim' ismi."},{"id":"dialogue","word":"dialogue","pos":"noun","tr":"diyalog, karşılıklı konuşma","en":"Read the short dialogue on page ten.","entr":"Sayfa ondaki kısa diyaloğu okuyun.","ipa":"/ˈdaɪ.ə.lɒɡ/","tip":"Türkçedeki 'diyalog' kelimesiyle aynıdır."},{"id":"dictionary","word":"dictionary","pos":"noun","tr":"sözlük","en":"Look up the new word in a dictionary.","entr":"Yeni kelimeye sözlükten bak.","ipa":"/ˈdɪk.ʃən.ər.i/","tip":"Türkçedeki 'diksiyon' (söz söyleme sanatı) ile aynı 'söz' kökünden gelir."},{"id":"did","word":"did","pos":"verb","tr":"yaptı (do fiilinin geçmiş zamanı)","en":"She did her housework before noon.","entr":"Öğleden önce ev işlerini yaptı.","ipa":"/dɪd/","tip":"Do → did → done. Geçmiş zaman sorularında: Did you go?"},{"id":"difference","word":"difference","pos":"noun","tr":"fark, ayrım","en":"There is a big price difference between them.","entr":"Aralarında büyük bir fiyat farkı var.","ipa":"/ˈdɪf.ər.əns/","tip":"Different (farklı) sıfatının isim halidir."},{"id":"different","word":"different","pos":"adjective","tr":"farklı, değişik","en":"The two brothers wear different shirt colours.","entr":"İki erkek kardeş farklı gömlek renkleri giyer.","ipa":"/ˈdɪf.ər.ənt/","tip":"'Different from' = ...dan farklı. Zıttı 'same'."},{"id":"difficult","word":"difficult","pos":"adjective","tr":"zor, güç","en":"The last question in the test was difficult.","entr":"Testteki son soru zordu.","ipa":"/ˈdɪf.ɪ.kəlt/","tip":"Zıttı 'easy' (kolay)."},{"id":"difficulty","word":"difficulty","pos":"noun","tr":"zorluk, güçlük","en":"He found the address without any difficulty.","entr":"Adresi hiçbir zorluk çekmeden buldu.","ipa":"/ˈdɪf.ɪ.kəl.ti/","tip":"Difficult (zor) sıfatından türeyen 'zorluk' ismi."},{"id":"dinner","word":"dinner","pos":"noun","tr":"akşam yemeği","en":"We eat dinner together at seven o'clock.","entr":"Saat yedide birlikte akşam yemeği yeriz.","ipa":"/ˈdɪn.ər/","tip":"Günün ana yemeği; genelde akşam yenir."},{"id":"direction","word":"direction","pos":"noun","tr":"yön, taraf, tarif","en":"The bus went in the wrong direction.","entr":"Otobüs yanlış yöne gitti.","ipa":"/daɪˈrek.ʃən/","tip":"Direksiyon (araca yön veren parça) kelimesiyle aynı köktendir."},{"id":"director","word":"director","pos":"noun","tr":"müdür, yönetmen, direktör","en":"She spoke with the company director today.","entr":"Bugün şirket müdürüyle konuştu.","ipa":"/daɪˈrek.tər/","tip":"Türkçedeki 'direktör' (yönetici/müdür) kelimesiyle aynıdır."},{"id":"dirty","word":"dirty","pos":"adjective","tr":"kirli, pis","en":"Put your dirty clothes in the basket.","entr":"Kirli kıyafetlerini sepete koy.","ipa":"/ˈdɜː.ti/","tip":"Dirt (kir) + -y = kirli. Zıttı 'clean'."},{"id":"discussion","word":"discussion","pos":"noun","tr":"tartışma, görüşme","en":"We had a useful discussion about the project.","entr":"Proje hakkında faydalı bir görüşme yaptık.","ipa":"/dɪˈskʌʃ.ən/","tip":"Discuss (tartışmak) + -ion = tartışma."},{"id":"disease","word":"disease","pos":"noun","tr":"hastalık, rahatsızlık","en":"Clean water protects people from disease.","entr":"Temiz su insanları hastalıktan korur.","ipa":"/dɪˈziːz/","tip":"Dis- (olumsuzluk eki) + ease (rahatlık) = rahatsızlık, hastalık."},{"id":"divide","word":"divide","pos":"verb","tr":"bölmek, ayırmak","en":"Divide the apple cake into four pieces.","entr":"Elmalı keki dört parçaya böl.","ipa":"/dɪˈvaɪd/","tip":"Matematikte bölme: 10 divided by 2 is 5."},{"id":"do","word":"do","pos":"verb","tr":"yapmak","en":"What do you usually do on Sundays?","entr":"Pazar günleri genellikle ne yaparsın?","ipa":"/duː/","tip":"Yapılacaklar listesi 'To-do list' ifadesindeki 'yapmak' fiili."},{"id":"doctor","word":"doctor","pos":"noun","tr":"doktor, hekim","en":"The doctor examined the patient carefully.","entr":"Doktor hastayı dikkatlice muayene etti.","ipa":"/ˈdɒk.tər/","tip":"Türkçedeki 'doktor' kelimesiyle aynıdır."},{"id":"dog","word":"dog","pos":"noun","tr":"köpek","en":"Our dog sleeps in the garden house.","entr":"Köpeğimiz bahçedeki kulübede uyur.","ipa":"/dɒɡ/","tip":"Köpek yavrusu 'puppy'."},{"id":"dollar","word":"dollar","pos":"noun","tr":"dolar","en":"A bus ticket costs one dollar.","entr":"Otobüs bileti bir dolar.","ipa":"/ˈdɒl.ər/","tip":"Türkçedeki 'dolar' para birimiyle aynıdır."},{"id":"donkey","word":"donkey","pos":"noun","tr":"eşek","en":"The grey donkey carried wood to the village.","entr":"Boz eşek köye odun taşıdı.","ipa":"/ˈdɒŋ.ki/","tip":"Nasreddin Hoca'nın eşeği: Nasreddin Hodja's donkey."},{"id":"door","word":"door","pos":"noun","tr":"kapı","en":"Please close the front door quietly.","entr":"Lütfen ön kapıyı sessizce kapat.","ipa":"/dɔːr/","tip":"'Knock on the door' = kapıyı çalmak."},{"id":"double","word":"double","pos":"adjective","tr":"çift, iki kat, iki kişilik","en":"We booked a double room at the hotel.","entr":"Otelde iki kişilik bir oda ayırttık.","ipa":"/ˈdʌb.əl/","tip":"Türkçede 'duble yol' veya 'duble çay' (çift/iki kat) olarak kullanılır."},{"id":"doubt","word":"doubt","pos":"noun","tr":"şüphe, kuşku","en":"There is no doubt about his honesty.","entr":"Onun dürüstlüğü hakkında hiçbir şüphe yok.","ipa":"/daʊt/","tip":"'b' okunmaz: /daʊt/."},{"id":"down","word":"down","pos":"adverb","tr":"aşağı, aşağıya","en":"Sit down on this comfortable sofa.","entr":"Bu rahat koltuğa otur.","ipa":"/daʊn/","tip":"İnternetten dosya indirmek 'download' (aşağı yüklemek) demektir."},{"id":"drank","word":"drank","pos":"verb","tr":"içti (drink fiilinin geçmiş zamanı)","en":"He drank a glass of cold milk.","entr":"Bir bardak soğuk süt içti.","ipa":"/dræŋk/","tip":"Drink → drank → drunk."},{"id":"draw","word":"draw","pos":"verb","tr":"çizmek, çekmek","en":"Can you draw a map of the street?","entr":"Sokağın bir haritasını çizebilir misin?","ipa":"/drɔː/","tip":"Draw → drew → drawn. Kalemle resim çizmek."},{"id":"drawn","word":"drawn","pos":"verb","tr":"çizilmiş, çekilmiş (draw fiilinin 3. hali)","en":"This picture was drawn by a young artist.","entr":"Bu resim genç bir ressam tarafından çizildi.","ipa":"/drɔːn/","tip":"Draw → drew → drawn."},{"id":"drink","word":"drink","pos":"verb","tr":"içmek, içecek","en":"I drink two litres of water every day.","entr":"Her gün iki litre su içerim.","ipa":"/drɪŋk/","tip":"Drink → drank → drunk."},{"id":"drive","word":"drive","pos":"verb","tr":"sürmek, araba kullanmak","en":"Do not drive fast on rainy roads.","entr":"Yağmurlu yollarda hızlı araba sürme.","ipa":"/draɪv/","tip":"Bilgisayardaki 'sürücü' (Google Drive, flash drive) buradan gelir."},{"id":"driver","word":"driver","pos":"noun","tr":"şoför, sürücü","en":"The bus driver waited for the old man.","entr":"Otobüs şoförü yaşlı adamı bekledi.","ipa":"/ˈdraɪ.vər/","tip":"Drive (sürmek) + -er (yapan kişi eki) = sürücü, şoför."},{"id":"drove","word":"drove","pos":"verb","tr":"sürdü (drive fiilinin geçmiş zamanı)","en":"She drove her car to Izmir yesterday.","entr":"Dün arabasını İzmir'e sürdü.","ipa":"/drəʊv/","tip":"Drive → drove → driven."},{"id":"drunk","word":"drunk","pos":"verb","tr":"içilmiş (drink fiilinin 3. hali), sarhoş","en":"Who has drunk all the orange juice?","entr":"Bütün portakal suyunu kim içmiş?","ipa":"/drʌŋk/","tip":"Drink → drank → drunk."},{"id":"due to","word":"due to","pos":"preposition","tr":"-den dolayı, nedeniyle","en":"The train was late due to heavy snow.","entr":"Tren yoğun kar yağışı nedeniyle gecikti.","ipa":"/ˈdjuː tuː/","tip":"'Because of' ile aynı: due to the rain = yağmur yüzünden."},{"id":"during","word":"during","pos":"preposition","tr":"sırasında, boyunca","en":"Turn off your phone during the film.","entr":"Film sırasında telefonunu kapat.","ipa":"/ˈdjʊə.rɪŋ/","tip":"During the lesson = ders sırasında."},{"id":"duty","word":"duty","pos":"noun","tr":"görev, vazife, gümrük vergisi","en":"Helping patients is a nurse's main duty.","entr":"Hastalara yardım etmek hemşirenin ana görevidir.","ipa":"/ˈdjuː.ti/","tip":"Havalimanlarındaki 'Duty Free' (gümrük vergisinden muaf) mağazalar."},{"id":"e-mail","word":"e-mail","pos":"noun","tr":"e-posta, elektronik posta","en":"Send me the meeting details by e-mail.","entr":"Toplantı detaylarını bana e-posta ile gönder.","ipa":"/ˈiː.meɪl/","tip":"Türkçede de günlük hayatta 'e-mail' veya 'e-posta' olarak kullanılır."},{"id":"each","word":"each","pos":"determiner","tr":"her bir, her","en":"Each student has a separate desk here.","entr":"Burada her bir öğrencinin ayrı bir sırası var.","ipa":"/iːtʃ/","tip":"Her biri ayrı ayrı: each student has a book."},{"id":"ear","word":"ear","pos":"noun","tr":"kulak","en":"She whispered the secret into my ear.","entr":"Sırrı kulağıma fısıldadı.","ipa":"/ɪər/","tip":"Earring = küpe (kulak halkası)."},{"id":"early","word":"early","pos":"adverb","tr":"erken","en":"My mother wakes up early every morning.","entr":"Annem her sabah erken uyanır.","ipa":"/ˈɜː.li/","tip":"Zıttı 'late' (geç)."},{"id":"earring","word":"earring","pos":"noun","tr":"küpe","en":"She lost her silver earring at the party.","entr":"Partide gümüş küpesini kaybetti.","ipa":"/ˈɪə.rɪŋ/","tip":"Ear (kulak) + ring (halka/yüzük) = kulak halkası, küpe."},{"id":"easily","word":"easily","pos":"adverb","tr":"kolayca, rahatlıkla","en":"You can find the station easily on foot.","entr":"İstasyonu yürüyerek kolayca bulabilirsin.","ipa":"/ˈiː.zɪ.li/","tip":"Easy (kolay) + -ly (zarf eki) = kolayca."},{"id":"easy","word":"easy","pos":"adjective","tr":"kolay, rahat","en":"This soup recipe is very easy.","entr":"Bu çorba tarifi çok kolaydır.","ipa":"/ˈiː.zi/","tip":"Easy → easier → easiest. Zıttı 'difficult'."},{"id":"eat","word":"eat","pos":"verb","tr":"yemek (eylem)","en":"We eat fresh fruit after dinner.","entr":"Akşam yemeğinden sonra taze meyve yeriz.","ipa":"/iːt/","tip":"Eat → ate → eaten."},{"id":"education","word":"education","pos":"noun","tr":"eğitim, öğrenim","en":"Good education opens many doors in life.","entr":"İyi bir eğitim hayatta birçok kapı açar.","ipa":"/ˌedʒ.uˈkeɪ.ʃən/","tip":"Special education = özel eğitim."},{"id":"effect","word":"effect","pos":"noun","tr":"etki, sonuç","en":"Hot tea has a calming effect.","entr":"Sıcak çayın sakinleştirici bir etkisi vardır.","ipa":"/ɪˈfekt/","tip":"Türkçedeki 'efekt' (ses veya görüntü etkisi) kelimesidir."},{"id":"effort","word":"effort","pos":"noun","tr":"çaba, gayret, efor","en":"Learning a language takes time and effort.","entr":"Bir dil öğrenmek zaman ve çaba gerektirir.","ipa":"/ˈef.ət/","tip":"Türkçedeki 'efor' (efor sarf etmek, efor testi) kelimesiyle aynıdır."},{"id":"egg","word":"egg","pos":"noun","tr":"yumurta","en":"Boil the egg for five minutes.","entr":"Yumurtayı beş dakika haşla.","ipa":"/eɡ/","tip":"Boiled egg = haşlanmış yumurta."},{"id":"either","word":"either","pos":"determiner","tr":"her iki, ya ... ya da, de/da (olumsuz)","en":"You can park on either side of the road.","entr":"Yolun her iki tarafına da park edebilirsin.","ipa":"/ˈaɪ.ðər/","tip":"'Either ... or' = ya ... ya da."},{"id":"else","word":"else","pos":"adverb","tr":"başka, diğer","en":"Would you like anything else from the market?","entr":"Marketten başka bir şey ister misin?","ipa":"/els/","tip":"'Anything else?' = Başka bir şey?"},{"id":"employer","word":"employer","pos":"noun","tr":"işveren, patron","en":"Her employer pays salaries on the first day.","entr":"Onun işvereni maaşları ilk gün öder.","ipa":"/ɪmˈplɔɪ.ər/","tip":"Employ (işe almak) + -er = işveren. Çalışan 'employee'."},{"id":"employment","word":"employment","pos":"noun","tr":"iş, istihdam, çalışma","en":"He found full-time employment at a factory.","entr":"Bir fabrikada tam zamanlı iş buldu.","ipa":"/ɪmˈplɔɪ.mənt/","tip":"Employ + -ment = istihdam, iş."},{"id":"empty","word":"empty","pos":"adjective","tr":"boş","en":"Put the empty bottle into the bin.","entr":"Boş şişeyi çöp kutusuna at.","ipa":"/ˈemp.ti/","tip":"Zıttı 'full' (dolu)."},{"id":"end","word":"end","pos":"noun","tr":"son, uç, bitmek","en":"Wait until the end of the song.","entr":"Şarkının sonuna kadar bekle.","ipa":"/end/","tip":"Filmlerin sonunda çıkan 'The End' (Son) yazısı."},{"id":"energy","word":"energy","pos":"noun","tr":"enerji, güç","en":"A good breakfast gives you energy.","entr":"İyi bir kahvaltı size enerji verir.","ipa":"/ˈen.ə.dʒi/","tip":"Türkçedeki 'enerji' kelimesiyle aynıdır."},{"id":"engine","word":"engine","pos":"noun","tr":"motor","en":"The mechanic checked the car engine carefully.","entr":"Tamirci arabanın motorunu dikkatlice kontrol etti.","ipa":"/ˈen.dʒɪn/","tip":"Türkçedeki 'motor' anlamı; engineer = mühendis."},{"id":"english","word":"English","pos":"noun","tr":"İngilizce, İngiliz","en":"She practices English for twenty minutes daily.","entr":"Her gün yirmi dakika İngilizce pratik yapıyor.","ipa":"/ˈɪŋ.ɡlɪʃ/","tip":"Dil ve millet adları büyük harfle yazılır."},{"id":"enjoy","word":"enjoy","pos":"verb","tr":"keyif almak, tadını çıkarmak, sevmek","en":"We enjoy walking by the sea.","entr":"Deniz kenarında yürümekten keyif alırız.","ipa":"/ɪnˈdʒɔɪ/","tip":"'Enjoy your meal' = afiyet olsun."},{"id":"enough","word":"enough","pos":"determiner","tr":"yeterli, yeterince","en":"There is enough bread for everyone.","entr":"Herkes için yeterli ekmek var.","ipa":"/ɪˈnʌf/","tip":"'gh' /f/ okunur: /ɪˈnʌf/."},{"id":"enter","word":"enter","pos":"verb","tr":"girmek, giriş yapmak","en":"Knock on the door before you enter.","entr":"İçeri girmeden önce kapıyı çal.","ipa":"/ˈen.tər/","tip":"Bilgisayar klavyesindeki 'Enter' (giriş/onay) tuşu."},{"id":"environment","word":"environment","pos":"noun","tr":"çevre, ortam","en":"Keep the natural environment clean and green.","entr":"Doğal çevreyi temiz ve yeşil tutun.","ipa":"/ɪnˈvaɪ.rən.mənt/","tip":"Çevreyi koru: protect the environment."},{"id":"equal","word":"equal","pos":"adjective","tr":"eşit, denk","en":"Cut the pizza into six equal slices.","entr":"Pizzayı altı eşit dilime kes.","ipa":"/ˈiː.kwəl/","tip":"Matematikte '=' işareti 'equals'."},{"id":"especially","word":"especially","pos":"adverb","tr":"özellikle, bilhassa","en":"I love fruit, especially sweet strawberries.","entr":"Meyveyi, özellikle tatlı çileği çok severim.","ipa":"/ɪˈspeʃ.əl.i/","tip":"Special (özel) kelimesinden türemiştir; especially = özellikle."},{"id":"even","word":"even","pos":"adverb","tr":"bile, hatta","en":"Even a child can solve this puzzle.","entr":"Bir çocuk bile bu bulmacayı çözebilir.","ipa":"/ˈiː.vən/","tip":"Even numbers = çift sayılar."},{"id":"evening","word":"evening","pos":"noun","tr":"akşam","en":"We watch television together in the evening.","entr":"Akşamları birlikte televizyon izleriz.","ipa":"/ˈiːv.nɪŋ/","tip":"'Good evening' = iyi akşamlar."},{"id":"event","word":"event","pos":"noun","tr":"olay, etkinlik, organizasyon","en":"The music festival is a popular summer event.","entr":"Müzik festivali popüler bir yaz etkinliğidir.","ipa":"/ɪˈvent/","tip":"Türkçedeki 'etkinlik' anlamında: school event."},{"id":"eventually","word":"eventually","pos":"adverb","tr":"sonunda, nihayetinde","en":"He looked everywhere and eventually found his keys.","entr":"Her yere baktı ve sonunda anahtarlarını buldu.","ipa":"/ɪˈven.tʃu.ə.li/","tip":"Event kökünden: sonunda, nihayet."},{"id":"ever","word":"ever","pos":"adverb","tr":"hiç, şimdiye kadar, her zaman","en":"Have you ever eaten sushi before?","entr":"Daha önce hiç suşi yedin mi?","ipa":"/ˈev.ər/","tip":"'Have you ever...?' = Hiç ... yaptın mı?"},{"id":"every","word":"every","pos":"determiner","tr":"her","en":"I brush my teeth every morning.","entr":"Her sabah dişlerimi fırçalarım.","ipa":"/ˈev.ri/","tip":"Every day = her gün."},{"id":"everybody","word":"everybody","pos":"pronoun","tr":"herkes","en":"Everybody enjoyed the warm soup at dinner.","entr":"Akşam yemeğinde herkes sıcak çorbayı beğendi.","ipa":"/ˈev.riˌbɒd.i/","tip":"Every (her) + body (beden/kişi) = herkes."},{"id":"everyone","word":"everyone","pos":"pronoun","tr":"herkes","en":"Everyone in the office arrived on time.","entr":"Ofisteki herkes zamanında geldi.","ipa":"/ˈev.ri.wʌn/","tip":"Every (her) + one (bir/kişi) = herkes."},{"id":"everything","word":"everything","pos":"pronoun","tr":"her şey","en":"Everything in this small shop is fresh.","entr":"Bu küçük dükkandaki her şey taze.","ipa":"/ˈev.ri.θɪŋ/","tip":"Every (her) + thing (şey) = her şey."},{"id":"everywhere","word":"everywhere","pos":"adverb","tr":"her yer, her yerde","en":"We saw green trees everywhere in the village.","entr":"Köyde her yerde yeşil ağaçlar gördük.","ipa":"/ˈev.ri.weər/","tip":"Every (her) + where (yer) = her yer."},{"id":"exactly","word":"exactly","pos":"adverb","tr":"tam olarak, kesinlikle","en":"The train left at exactly nine o'clock.","entr":"Tren tam olarak saat dokuzda kalktı.","ipa":"/ɪɡˈzækt.li/","tip":"Exact (tam) + -ly. 'Exactly!' = Aynen öyle!"},{"id":"exam","word":"exam","pos":"noun","tr":"sınav, imtihan","en":"She studied hard for her English exam.","entr":"İngilizce sınavı için sıkı çalıştı.","ipa":"/ɪɡˈzæm/","tip":"Examination kelimesinin kısaltması."},{"id":"example","word":"example","pos":"noun","tr":"örnek, misal","en":"Can you give me a simple example?","entr":"Bana basit bir örnek verebilir misin?","ipa":"/ɪɡˈzɑːm.pəl/","tip":"'For example' = örneğin. Kısaltması 'e.g.'."},{"id":"excellent","word":"excellent","pos":"adjective","tr":"mükemmel, harika","en":"The restaurant serves excellent fish soup.","entr":"Restoran mükemmel balık çorbası servis ediyor.","ipa":"/ˈek.səl.ənt/","tip":"Okulda en iyi not: excellent (pekiyi)."},{"id":"exercise","word":"exercise","pos":"noun","tr":"egzersiz, alıştırma","en":"Morning exercise is good for your heart.","entr":"Sabah egzersizi kalbiniz için iyidir.","ipa":"/ˈek.sə.saɪz/","tip":"Türkçedeki 'egzersiz' kelimesiyle aynıdır."},{"id":"expect","word":"expect","pos":"verb","tr":"beklemek, ummak","en":"We expect rain this afternoon.","entr":"Bu öğleden sonra yağmur bekliyoruz.","ipa":"/ɪkˈspekt/","tip":"Beklemek, ummak: I expect good results."},{"id":"experience","word":"experience","pos":"noun","tr":"deneyim, tecrübe","en":"He has ten years of teaching experience.","entr":"Onun on yıllık öğretmenlik deneyimi var.","ipa":"/ɪkˈspɪə.ri.əns/","tip":"Deneyim; work experience = iş deneyimi."},{"id":"explain","word":"explain","pos":"verb","tr":"açıklamak, izah etmek","en":"The teacher will explain the new rule.","entr":"Öğretmen yeni kuralı açıklayacak.","ipa":"/ɪkˈspleɪn/","tip":"Explanation = açıklama."},{"id":"extra","word":"extra","pos":"adjective","tr":"ekstra, fazladan, ilave","en":"Bring an extra blanket for the guest.","entr":"Misafir için fazladan bir battaniye getir.","ipa":"/ˈek.strə/","tip":"Türkçedeki 'ekstra' kelimesiyle aynıdır."},{"id":"extremely","word":"extremely","pos":"adverb","tr":"son derece, aşırı","en":"The weather is extremely hot today.","entr":"Hava bugün son derece sıcak.","ipa":"/ɪkˈstriːm.li/","tip":"Türkçedeki 'ekstrem' (aşırı/uç) kelimesinden türemiştir."},{"id":"eye","word":"eye","pos":"noun","tr":"göz","en":"Close your left eye and read this.","entr":"Sol gözünü kapat ve bunu oku.","ipa":"/aɪ/","tip":"Eyebrow = kaş, eyelash = kirpik."},{"id":"eyebrow","word":"eyebrow","pos":"noun","tr":"kaş","en":"He raised one eyebrow in surprise.","entr":"Şaşkınlıkla tek kaşını kaldırdı.","ipa":"/ˈaɪ.braʊ/","tip":"Eye (göz) + brow (kaş/alın) = göz kaşı."},{"id":"eyelash","word":"eyelash","pos":"noun","tr":"kirpik","en":"There is an eyelash on your cheek.","entr":"Yanağında bir kirpik var.","ipa":"/ˈaɪ.læʃ/","tip":"Eye (göz) kelimesiyle başlayan kirpik."},{"id":"eyelid","word":"eyelid","pos":"noun","tr":"göz kapağı","en":"Her right eyelid felt heavy and tired.","entr":"Sağ göz kapağı ağır ve yorgun hissetti.","ipa":"/ˈaɪ.lɪd/","tip":"Eye (göz) + lid (kapak) = göz kapağı."},{"id":"face","word":"face","pos":"noun","tr":"yüz, surat","en":"Wash your face with cold water.","entr":"Yüzünü soğuk suyla yıka.","ipa":"/feɪs/","tip":"Facebook (yüz kitabı) kelimesindeki 'face' (yüz)."},{"id":"fact","word":"fact","pos":"noun","tr":"gerçek, olgu","en":"It is a known fact to everyone.","entr":"Bu herkes tarafından bilinen bir gerçektir.","ipa":"/fækt/","tip":"'In fact' = aslında."},{"id":"fair","word":"fair","pos":"adjective","tr":"adil, dürüst, açık renkli, fuar","en":"The referee made a fair decision.","entr":"Hakem adil bir karar verdi.","ipa":"/feər/","tip":"Spordaki 'Fair Play' (adil ve dürüst oyun) kavramından hatırlanabilir."},{"id":"fairly","word":"fairly","pos":"adverb","tr":"oldukça, adilce","en":"The exam questions were fairly easy.","entr":"Sınav soruları oldukça kolaydı.","ipa":"/ˈfeə.li/","tip":"'Quite' ile benzer: fairly easy = oldukça kolay."},{"id":"fall","word":"fall","pos":"verb","tr":"düşmek, sonbahar","en":"Dry leaves fall from the trees.","entr":"Kuru yapraklar ağaçlardan düşer.","ipa":"/fɔːl/","tip":"Fall → fell → fallen. Amerikan İngilizcesinde 'sonbahar'."},{"id":"family","word":"family","pos":"noun","tr":"aile","en":"We visit our family every weekend.","entr":"Her hafta sonu ailemizi ziyaret ederiz.","ipa":"/ˈfæm.əl.i/","tip":"Türkçede de eskiden kullanılan 'familya' (aile/soy) kelimesidir."},{"id":"far","word":"far","pos":"adverb","tr":"uzak, uzakta","en":"Is the airport far from the hotel?","entr":"Havalimanı otelden uzak mı?","ipa":"/fɑːr/","tip":"Araba 'far'ı uzağı aydınlatır."},{"id":"father","word":"father","pos":"noun","tr":"baba","en":"My father reads the newspaper after breakfast.","entr":"Babam kahvaltıdan sonra gazete okur.","ipa":"/ˈfɑː.ðər/","tip":"Dad, daddy daha samimi hâlleridir."},{"id":"father-in-law","word":"father-in-law","pos":"noun","tr":"kayınpeder","en":"His father-in-law lives in a coastal town.","entr":"Onun kayınpederi bir sahil kasabasında yaşıyor.","ipa":"/ˈfɑː.ðər.ɪn.lɔː/","tip":"Father (baba) + in-law (evlilik yoluyla akraba) = kayınpeder."},{"id":"fault","word":"fault","pos":"noun","tr":"hata, kusur, suç","en":"The late arrival was not your fault.","entr":"Geç varış senin hatan değildi.","ipa":"/fɔːlt/","tip":"'It's my fault' = benim hatam."},{"id":"favour","word":"favour","pos":"noun","tr":"iyilik, rica","en":"Can you do me a small favour?","entr":"Bana küçük bir iyilik yapabilir misin?","ipa":"/ˈfeɪ.vər/","tip":"Türkçedeki 'favori' kelimesiyle aynı kökten gelir."},{"id":"february","word":"February","pos":"noun","tr":"Şubat","en":"February is the shortest month of the year.","entr":"Şubat yılın en kısa ayıdır.","ipa":"/ˈfeb.ru.ər.i/","tip":"İlk 'r' çoğu zaman okunmaz: /ˈfeb.ru.ər.i/."},{"id":"feed","word":"feed","pos":"verb","tr":"beslemek","en":"We feed the street cats every morning.","entr":"Her sabah sokak kedilerini besleriz.","ipa":"/fiːd/","tip":"Feed → fed → fed. 'Feed the cat' = kediyi besle."},{"id":"feel","word":"feel","pos":"verb","tr":"hissetmek","en":"I feel much better after a rest.","entr":"Dinlendikten sonra çok daha iyi hissediyorum.","ipa":"/fiːl/","tip":"Feel → felt → felt. 'How do you feel?' = Nasıl hissediyorsun?"},{"id":"feeling","word":"feeling","pos":"noun","tr":"his, duygu","en":"Happiness is a wonderful feeling.","entr":"Mutluluk harika bir duygudur.","ipa":"/ˈfiː.lɪŋ/","tip":"Feel (hissetmek) fiilinden türeyen 'his, duygu' ismi."},{"id":"feet","word":"feet","pos":"noun","tr":"ayaklar","en":"Put warm socks on your cold feet.","entr":"Soğuk ayaklarına sıcak çoraplar giy.","ipa":"/fiːt/","tip":"Foot (ayak) kelimesinin çoğul halidir."},{"id":"felt","word":"felt","pos":"verb","tr":"hissetti (feel fiilinin geçmiş zamanı)","en":"She felt tired after the long trip.","entr":"Uzun yolculuktan sonra yorgun hissetti.","ipa":"/felt/","tip":"Feel → felt → felt."},{"id":"ferry","word":"ferry","pos":"noun","tr":"feribot, arabalı vapur","en":"We took the morning ferry across the sea.","entr":"Denizin karşısına sabah feribotuyla geçtik.","ipa":"/ˈfer.i/","tip":"Türkçedeki 'feribot' (ferryboat) kelimesinin ilk kısmıdır."},{"id":"few","word":"few","pos":"determiner","tr":"az, birkaç","en":"Only a few people waited at the stop.","entr":"Durakta sadece birkaç kişi bekledi.","ipa":"/fjuː/","tip":"'A few' = birkaç; 'few' = çok az."},{"id":"field","word":"field","pos":"noun","tr":"tarla, alan, saha","en":"Farmers planted wheat in the large field.","entr":"Çiftçiler geniş tarlaya buğday ekti.","ipa":"/fiːld/","tip":"Football field = futbol sahası."},{"id":"fig","word":"fig","pos":"noun","tr":"incir","en":"My grandmother picked a sweet fig from the tree.","entr":"Anneannem ağaçtan tatlı bir incir kopardı.","ipa":"/fɪɡ/","tip":"Aydın inciri ünlüdür."},{"id":"fight","word":"fight","pos":"verb","tr":"kavga etmek, dövüşmek, mücadele etmek","en":"The two cats did not fight in the garden.","entr":"İki kedi bahçede kavga etmedi.","ipa":"/faɪt/","tip":"Fight → fought → fought. 'gh' okunmaz."},{"id":"figure","word":"figure","pos":"noun","tr":"rakam, sayı, şekil, figür","en":"Write the total figure in the box.","entr":"Toplam rakamı kutunun içine yaz.","ipa":"/ˈfɪɡ.ər/","tip":"Türkçedeki 'figür' (şekil) kelimesiyle aynıdır."},{"id":"file","word":"file","pos":"noun","tr":"dosya, klasör","en":"Put these papers into the blue file.","entr":"Bu kağıtları mavi dosyaya koy.","ipa":"/faɪl/","tip":"Bilgisayarda dosya da 'file'dır."},{"id":"fill","word":"fill","pos":"verb","tr":"doldurmak","en":"Please fill the glass with cold water.","entr":"Lütfen bardağı soğuk suyla doldur.","ipa":"/fɪl/","tip":"Full (dolu) kelimesiyle aynı kökten gelir."},{"id":"film","word":"film","pos":"noun","tr":"film","en":"We watched an old comedy film tonight.","entr":"Bu akşam eski bir komedi filmi izledik.","ipa":"/fɪlm/","tip":"Türkçedeki 'film' kelimesiyle tamamen aynıdır."},{"id":"final","word":"final","pos":"adjective","tr":"son, final","en":"Tomorrow is the final day of the course.","entr":"Yarın kursun son günüdür.","ipa":"/ˈfaɪ.nəl/","tip":"Türkçedeki 'final' (son maç, son sınav) kelimesiyle aynıdır."},{"id":"find","word":"find","pos":"verb","tr":"bulmak","en":"Did you find your lost wallet?","entr":"Kayıp cüzdanını buldun mu?","ipa":"/faɪnd/","tip":"Find → found → found."},{"id":"fine","word":"fine","pos":"adjective","tr":"iyi, güzel, para cezası","en":"The weather is fine for a walk.","entr":"Hava yürüyüş için güzel.","ipa":"/faɪn/","tip":"'I am fine' (İyiyim) cümlesinden hatırlanabilir."},{"id":"finger","word":"finger","pos":"noun","tr":"parmak (el parmağı)","en":"She wore a gold ring on her finger.","entr":"Parmağına altın bir yüzük taktı.","ipa":"/ˈfɪŋ.ɡər/","tip":"Ayak parmağı 'toe'."},{"id":"finish","word":"finish","pos":"verb","tr":"bitirmek, bitmek, bitiş","en":"I will finish my work before six.","entr":"İşimi saat altıdan önce bitireceğim.","ipa":"/ˈfɪn.ɪʃ/","tip":"Yarışlardaki 'finiş' (bitiş çizgisi) kelimesiyle aynıdır."},{"id":"fire","word":"fire","pos":"noun","tr":"ateş, yangın","en":"We sat around the warm camp fire.","entr":"Sıcak kamp ateşinin etrafında oturduk.","ipa":"/faɪər/","tip":"Fire brigade = itfaiye."},{"id":"firm","word":"firm","pos":"noun","tr":"firma, şirket, sıkı, sert","en":"He works for an engineering firm.","entr":"Bir mühendislik firmasında çalışıyor.","ipa":"/fɜːm/","tip":"Türkçedeki 'firma' (şirket) kelimesiyle aynıdır."},{"id":"first","word":"first","pos":"determiner","tr":"ilk, birinci","en":"Take the first street on the left.","entr":"Soldaki ilk sokağa sap.","ipa":"/fɜːst/","tip":"'First Class' (birinci sınıf) ifadesinden hatırlanabilir."},{"id":"firstly","word":"firstly","pos":"adverb","tr":"ilk olarak, öncelikle","en":"Firstly, wash the vegetables in clean water.","entr":"İlk olarak sebzeleri temiz suda yıkayın.","ipa":"/ˈfɜːst.li/","tip":"First (ilk/birinci) + -ly = ilk olarak."},{"id":"fish","word":"fish","pos":"noun","tr":"balık","en":"My uncle caught a big fish today.","entr":"Amcam bugün büyük bir balık tuttu.","ipa":"/fɪʃ/","tip":"Çoğulu genelde yine 'fish'."},{"id":"fit","word":"fit","pos":"adjective","tr":"zinde, formda, uymak (beden)","en":"This blue jacket does not fit me.","entr":"Bu mavi ceket bana uymuyor.","ipa":"/fɪt/","tip":"Türkçede de 'fit olmak' (formda olmak) şeklinde kullanılır."},{"id":"flag","word":"flag","pos":"noun","tr":"bayrak, flama","en":"The Turkish flag is red and white.","entr":"Türk bayrağı kırmızı ve beyazdır.","ipa":"/flæɡ/","tip":"Türkçedeki 'flama' kelimesiyle benzerdir."},{"id":"floor","word":"floor","pos":"noun","tr":"yer, zemin, kat","en":"Our office is on the third floor.","entr":"Ofisimiz üçüncü kattadır.","ipa":"/flɔːr/"," d (arkadaş) + -ship (lık/lik eki) = arkadaşlık."},{"id":"from","word":"from","pos":"preposition","tr":"-den, -dan","en":"The bus comes from the city center.","entr":"Otobüs şehir merkezinden geliyor.","ipa":"/frɒm/","tip":"'Where are you from?' = Nerelisin?"},{"id":"front","word":"front","pos":"noun","tr":"ön, ön taraf","en":"Wait for me in front of the bank.","entr":"Bankanın önünde beni bekle.","ipa":"/frʌnt/","tip":"'In front of' = önünde."},{"id":"full","word":"full","pos":"adjective","tr":"dolu, tok","en":"The bus is full of passengers this morning.","entr":"Bu sabah otobüs yolcularla dolu.","ipa":"/fʊl/","tip":"Zıttı 'empty' (boş). 'I'm full' = doydum."},{"id":"fun","word":"fun","pos":"noun","tr":"eğlence, keyif","en":"The children had great fun at the beach.","entr":"Çocuklar plajda çok eğlendi.","ipa":"/fʌn/","tip":"'Have fun!' = İyi eğlenceler!"},{"id":"funny","word":"funny","pos":"adjective","tr":"komik, eğlenceli, tuhaf","en":"My uncle told us a funny story.","entr":"Amcam bize komik bir hikaye anlattı.","ipa":"/ˈfʌn.i/","tip":"Fun (eğlence) kelimesinden türemiştir; funny = komik, eğlenceli."},{"id":"further","word":"further","pos":"adverb","tr":"daha uzak, daha ileri, ek","en":"Call the office for further information.","entr":"Daha fazla bilgi için ofisi arayın.","ipa":"/ˈfɜː.ðər/","tip":"Far (uzak) kelimesinin 'daha uzak / daha ileri' derecesidir."},{"id":"future","word":"future","pos":"noun","tr":"gelecek, istikbal","en":"They are saving money for the future.","entr":"Gelecek için para biriktiriyorlar.","ipa":"/ˈfjuː.tʃər/","tip":"Zıttı 'past' (geçmiş)."},{"id":"game","word":"game","pos":"noun","tr":"oyun, maç","en":"Let us play a board game together.","entr":"Birlikte bir kutu oyunu oynayalım.","ipa":"/ɡeɪm/","tip":"Oyunlardaki 'Game Over' (Oyun Bitti) yazısından hatırlanabilir."},{"id":"garden","word":"garden","pos":"noun","tr":"bahçe","en":"My mother grows tomatoes in our garden.","entr":"Annem bahçemizde domates yetiştirir.","ipa":"/ˈɡɑː.dən/","tip":"Gardener = bahçıvan."},{"id":"gardener","word":"gardener","pos":"noun","tr":"bahçıvan","en":"The gardener watered the trees this morning.","entr":"Bahçıvan bu sabah ağaçları suladı.","ipa":"/ˈɡɑː.dən.ər/","tip":"Garden (bahçe) + -er (yapan kişi) = bahçıvan."},{"id":"garlic","word":"garlic","pos":"noun","tr":"sarımsak","en":"Add one clove of garlic to the sauce.","entr":"Sosa bir diş sarımsak ekle.","ipa":"/ˈɡɑː.lɪk/","tip":"Kastamonu sarımsağı ünlüdür."},{"id":"gas","word":"gas","pos":"noun","tr":"gaz, doğal gaz, benzin","en":"Turn off the kitchen gas after cooking.","entr":"Yemek pişirdikten sonra mutfak gazını kapat.","ipa":"/ɡæs/","tip":"Türkçedeki 'gaz' kelimesiyle aynıdır."},{"id":"gasoline","word":"gasoline","pos":"noun","tr":"benzin","en":"We stopped to buy gasoline for the car.","entr":"Arabaya benzin almak için durduk.","ipa":"/ˈɡæs.ə.liːn/","tip":"Gas (gaz/yakıt) kelimesinden türeyen 'benzin'."},{"id":"gave","word":"gave","pos":"verb","tr":"verdi (give fiilinin geçmiş zamanı)","en":"She gave me a nice birthday present.","entr":"Bana güzel bir doğum günü hediyesi verdi.","ipa":"/ɡeɪv/","tip":"Give → gave → given."},{"id":"geese","word":"geese","pos":"noun","tr":"kazlar (goose kelimesinin çoğulu)","en":"White geese swam across the village pond.","entr":"Beyaz kazlar köy göletinde karşıya yüzdü.","ipa":"/ɡiːs/","tip":"Düzensiz çoğul: one goose, two geese."},{"id":"general","word":"general","pos":"adjective","tr":"genel, yaygın, general","en":"We talked about general health rules.","entr":"Genel sağlık kuralları hakkında konuştuk.","ipa":"/ˈdʒen.ər.əl/","tip":"Türkçedeki 'genel' ve 'general' kelimeleriyle aynı köktendir."},{"id":"generally","word":"generally","pos":"adverb","tr":"genellikle, genel olarak","en":"I generally drink tea without sugar.","entr":"Çayı genellikle şekersiz içerim.","ipa":"/ˈdʒen.ər.əl.i/","tip":"General (genel) + -ly = genellikle."},{"id":"get","word":"get","pos":"verb","tr":"almak, elde etmek, ulaşmak, olmak","en":"Did you get my message this morning?","entr":"Bu sabah mesajımı aldın mı?","ipa":"/ɡet/","tip":"Get → got → got. Çok anlamlı: almak, olmak, varmak."},{"id":"giant","word":"giant","pos":"adjective","tr":"dev, devasa, çok büyük","en":"There is a giant tree in the park.","entr":"Parkta devasa bir ağaç var.","ipa":"/ˈdʒaɪ.ənt/","tip":"Türkçedeki 'dev' anlamı; giant panda = dev panda."},{"id":"gift","word":"gift","pos":"noun","tr":"hediye, armağan","en":"He wrapped the gift in colourful paper.","entr":"Hediyeyi renkli kağıda sardı.","ipa":"/ɡɪft/","tip":"Mağazalardaki 'Gift Card' (hediye kartı) ifadesinden hatırlanabilir."},{"id":"girl","word":"girl","pos":"noun","tr":"kız, kız çocuk","en":"The little girl rode her new bicycle.","entr":"Küçük kız yeni bisikletine bindi.","ipa":"/ɡɜːl/","tip":"Erkek çocuk 'boy'."},{"id":"give","word":"give","pos":"verb","tr":"vermek","en":"Please give this book to your brother.","entr":"Lütfen bu kitabı erkek kardeşine ver.","ipa":"/ɡɪv/","tip":"Give → gave → given."},{"id":"glass","word":"glass","pos":"noun","tr":"bardak, cam","en":"He drank a glass of fresh water.","entr":"Bir bardak taze su içti.","ipa":"/ɡlɑːs/","tip":"Hem cam hem bardak. Glasses = gözlük."},{"id":"glasses","word":"glasses","pos":"noun","tr":"gözlük, bardaklar","en":"I need my reading glasses for this book.","entr":"Bu kitap için okuma gözlüğüme ihtiyacım var.","ipa":"/ˈɡlɑː.sɪz/","tip":"İki camdan (glass) oluştuğu için çoğul ekiyle 'gözlük' demektir."},{"id":"glove","word":"glove","pos":"noun","tr":"eldiven","en":"I dropped one winter glove on the stairs.","entr":"Merdivende kışlık eldivenimin tekini düşürdüm.","ipa":"/ɡlʌv/","tip":"Genelde çift: a pair of gloves."},{"id":"go","word":"go","pos":"verb","tr":"gitmek","en":"We go to the park every Sunday.","entr":"Her pazar parka gideriz.","ipa":"/ɡəʊ/","tip":"Go → went → gone."},{"id":"goal","word":"goal","pos":"noun","tr":"gol, hedef, amaç","en":"Our team scored a great goal tonight.","entr":"Takımımız bu akşam harika bir gol attı.", ek için yeşil ışığı bekle.","ipa":"/ɡriːn/","tip":"Yeşil; Green Bursa = Yeşil Bursa."},{"id":"greengrocer","word":"greengrocer","pos":"noun","tr":"manav","en":"Buy some fresh apples from the greengrocer.","entr":"Manavdan biraz taze elma al.","ipa":"/ˈɡriːnˌɡrəʊ.sər/","tip":"Green (yeşil sebze/meyve) satan dükkan, yani manav."},{"id":"greeting","word":"greeting","pos":"noun","tr":"selam, selamlama, kutlama","en":"He sent a warm greeting to us.","entr":"Bize sıcak bir selam gönderdi.","ipa":"/ˈɡriː.tɪŋ/","tip":"Greet (selamlamak) + -ing = selamlama."},{"id":"grew","word":"grew","pos":"verb","tr":"büyüdü, yetiştirdi (grow fiilinin geçmiş zamanı)","en":"My grandmother grew roses in her garden.","entr":"Anneannem bahçesinde gül yetiştirdi.","ipa":"/ɡruː/","tip":"Grow → grew → grown."},{"id":"ground","word":"ground","pos":"noun","tr":"yer, zemin, toprak","en":"The ripe apple fell to the ground.","entr":"Olgun elma yere düştü.","ipa":"/ɡraʊnd/","tip":"Zemin, toprak; playground = oyun alanı."},{"id":"group","word":"group","pos":"noun","tr":"grup, küme, topluluk","en":"A group of tourists visited the museum.","entr":"Bir grup turist müzeyi ziyaret etti.","ipa":"/ɡruːp/","tip":"Türkçedeki 'grup' kelimesiyle aynıdır."},{"id":"grow","word":"grow","pos":"verb","tr":"büyümek, yetişmek, yetiştirmek","en":"These trees grow fast in warm weather.","entr":"Bu ağaçlar sıcak havada hızlı büyür.","ipa":"/ɡrəʊ/","tip":"Grow → grew → grown. 'Grow up' = büyümek (çocuk)."},{"id":"guess","word":"guess","pos":"verb","tr":"tahmin etmek, tahmin","en":"Can you guess the price of this watch?","entr":"Bu saatin fiyatını tahmin edebilir misin?","ipa":"/ɡes/","tip":"'u' okunmaz: /ɡes/."},{"id":"had","word":"had","pos":"verb","tr":"sahipti, vardı (have fiilinin geçmiş zamanı)","en":"We had a small garden last year.","entr":"Geçen yıl küçük bir bahçemiz vardı.","ipa":"/hæd/","tip":"Have → had → had."},{"id":"hair","word":"hair","pos":"noun","tr":"saç, tüy","en":"She brushes her long hair every morning.","entr":"Her sabah uzun saçını tarar.","ipa":"/heər/","tip":"Sayılamaz: my hair is long (hairs değil)."},{"id":"hairdresser","word":"hairdresser","pos":"noun","tr":"kuaför, berber","en":"My mother went to the hairdresser today.","entr":"Annem bugün kuaföre gitti.","ipa":"/ˈheəˌdres.ər/","tip":"Hair (saç) yapan/düzenleyen kişi, yani kuaför."},{"id":"half","word":"half","pos":"noun","tr":"yarım, yarı","en":"Eat half of the sandwich now.","entr":"Sandviçin yarısını şimdi ye.","ipa":"/hɑːf/","tip":"'l' okunmaz: /hɑːf/. Half past two = iki buçuk."},{"id":"hall","word":"hall","pos":"noun","tr":"hol, koridor, salon","en":"Leave your wet shoes in the hall.","entr":"Islak ayakkabılarını holde bırak.","ipa":"/hɔːl/","tip":"Türkçede de ev girişi için kullanılan 'hol' kelimesidir."},{"id":"hallo","word":"hallo","pos":"interjection","tr":"merhaba, alo","en":"She smiled and said hallo to us.","entr":"Gülümsedi ve bize merhaba dedi.","ipa":"/həˈləʊ/","tip":"Hello ve telefondaki 'alo' sözüyle benzerdir."},{"id":"hamburger","word":"hamburger","pos":"noun","tr":"hamburger","en":"He ate a hot hamburger for lunch.","entr":"Öğle yemeğinde sıcak bir hamburger yedi.","ipa":"/ˈhæmˌbɜː.ɡər/","tip":"Türkçedeki 'hamburger' kelimesiyle tamamen aynıdır."},{"id":"hand","word":"hand","pos":"noun","tr":"el","en":"Hold the child's hand on the street.","entr":"Sokakta çocuğun elini tut.","ipa":"/hænd/","tip":"Hentbol (handball = el topu) kelimesindeki 'hand' (el)."},{"id":"handkerchief","word":"handkerchief","pos":"noun","tr":"mendil","en":"He keeps a clean handkerchief in his pocket.","entr":"Cebinde temiz bir mendil taşır.","ipa":"/ˈhæŋ.kə.tʃiːf/","tip":"Hand (el) kelimesiyle başlayan el mendili."},{"id":"handsome","word":"handsome","pos":"adjective","tr":"yakışıklı","en":"The young actor is a handsome man.","entr":"Genç oyuncu yakışıklı bir adamdır.","ipa":"/ˈhæn.səm/","tip":"Erkekler için 'yakışıklı'; kadınlar için 'beautiful'."},{"id":"hang","word":"hang","pos":"verb","tr":"asmak, sarkmak","en":"Please hang your coat behind the door.","entr":"Lütfen paltonu kapının arkasına as.","ipa":"/hæŋ/","tip":"Hang → hung → hung."},{"id":"happen","word":"happen","pos":"verb","tr":"olmak, meydana gelmek","en":"Accidents can happen on icy winter roads.","entr":"Buzlu kış yollarında kazalar meydana gelebilir.","ipa":"/ˈhæp.ən/","tip":"'What happened?' = Ne oldu?"},{"id":"happiness","word":"happiness","pos":"noun","tr":"mutluluk","en":"Good health brings happiness to our lives.","entr":"İyi sağlık hayatımıza mutluluk getirir.","ipa":"/ˈhæp.i.nəs/","tip":"Happy (mutlu) + -ness (lık/luk isim eki) = mutluluk."},{"id":"happy","word":"happy","pos":"adjective","tr":"mutlu, sevinçli","en":"The children are happy in the park.","entr":"Çocuklar parkta mutlular.","ipa":"/ˈhæp.i/","tip":"'Happy Birthday' (Mutlu Yıllar) şarkısından hatırlanabilir."},{"id":"hard","word":"hard","pos":"adjective","tr":"zor, sert, sıkı","en":"This wooden chair is very hard.","entr":"Bu ahşap sandalye çok sert.","ipa":"/hɑːd/","tip":"Bilgisayardaki 'hard disk' (sabit/sert disk) ifadesinden hatırlanabilir."},{"id":"has","word":"has","pos":"verb","tr":"sahiptir, var (have fiilinin tekil şahıs hali)","en":"Our flat has a sunny balcony.","entr":"Dairemizin güneşli bir balkonu var.","ipa":"/hæz/","tip":"He/she/it ile kullanılır: She has a cat."},{"id":"hat","word":"hat","pos":"noun","tr":"şapka","en":"Wear a warm hat in cold weather.","entr":"Soğuk havada sıcak bir şapka tak.","ipa":"/hæt/","tip":"Şapka; 'hut' (kulübe) ile karıştırma."},{"id":"hate","word":"hate","pos":"verb","tr":"nefret etmek, hiç sevmemek","en":"I hate waiting in long bank queues.","entr":"Uzun banka kuyruklarında beklemekten nefret ederim.","ipa":"/heɪt/","tip":"Zıttı 'love'."},{"id":"have","word":"have","pos":"verb","tr":"sahip olmak, var olmak","en":"Do you have a spare pen here?","entr":"Burada yedek bir kalemin var mı?","ipa":"/hæv/","tip":"I/you/we/they have; he/she/it has."},{"id":"have got","word":"have got","pos":"verb","tr":"sahip olmak, var","en":"I have got two tickets for tonight.","entr":"Bu akşam için iki biletim var.","ipa":"/hæv ˈɡɒt/","tip":"İngiliz İngilizcesinde 'have' yerine: I've got a sister."},{"id":"hazelnut","word":"hazelnut","pos":"noun","tr":"fındık","en":"This chocolate cake has hazelnut inside.","entr":"Bu çikolatalı kekin içinde fındık var.","ipa":"/ˈheɪ.zəl.nʌt/","tip":"Nut (kabuklu yemiş/fındık) kelimesiyle biter."},{"id":"he","word":"he","pos":"pronoun","tr":"o (erkek)","en":"He works as a nurse in Ankara.","entr":"O, Ankara'da hemşire olarak çalışıyor.","ipa":"/hiː/","tip":"Erkekler için 'he', kadınlar için 'she'."},{"id":"head","word":"head","pos":"noun","tr":"baş, kafa","en":"Put the soft pillow under your head.","entr":"Yumuşak yastığı başının altına koy.","ipa":"/hed/","tip":"Headache = baş ağrısı."},{"id":"headmaster","word":"headmaster","pos":"noun","tr":"okul müdürü (erkek)","en":"The headmaster spoke to the new students.","entr":"Okul müdürü yeni öğrencilerle konuştu.","ipa":"/ˌhedˈmɑː.stər/","tip":"Head (baş) + master (usta/öğretmen) = başöğretmen, okul müdürü."},{"id":"headmistress","word":"headmistress","pos":"noun","tr":"okul müdürü (kadın), müdire","en":"Our headmistress opened the school library today.","entr":"Okul müdiremiz bugün okul kütüphanesini açtı.","ipa":"/ˌhedˈmɪs.trəs/","tip":"Head (baş) + mistress (kadın yönetici/öğretmen) = kadın okul müdürü."},{"id":"hear","word":"hear","pos":"verb","tr":"duymak, işitmek","en":"Can you hear the birds outside?","entr":"Dışarıdaki kuşları duyabiliyor musun?","ipa":"/hɪər/","tip":"İçinde 'ear' (kulak) kelimesi gizlidir; kulakla duymak."},{"id":"heart","word":"heart","pos":"noun","tr":"kalp, yürek","en":"Swimming is very good for your heart.","entr":"Yüzmek kalbiniz için çok iyidir.","ipa":"/hɑːt/","tip":"Kalp; 'learn by heart' = ezberlemek."},{"id":"heavy","word":"heavy","pos":"adjective","tr":"ağır, yoğun","en":"This suitcase is too heavy to carry.","entr":"Bu valiz taşımak için fazla ağır.","ipa":"/ˈhev.i/","tip":"Zıttı 'light' (hafif)."},{"id":"heel","word":"heel","pos":"noun","tr":"topuk, ökçe","en":"The back heel of my shoe broke.","entr":"Ayakkabımın arka topuğu kırıldı.","ipa":"/hiːl/","tip":"High heels = topuklu ayakkabı."},{"id":"hell","word":"hell","pos":"noun","tr":"cehennem","en":"The summer traffic in the city is hell.","entr":"Şehirdeki yaz trafiği tam bir cehennem.","ipa":"/hel/","tip":"Zıttı 'heaven' (cennet)."},{"id":"hello","word":"hello","pos":"interjection","tr":"merhaba, selam","en":"Say hello to your family for me.","entr":"Ailene benden selam söyle.","ipa":"/heˈləʊ/","tip":"Telefonda da 'Hello?' = Alo?"},{"id":"help","word":"help","pos":"verb","tr":"yardım etmek, yardım","en":"Can you help me with these boxes?","entr":"Bu kutular için bana yardım edebilir misin?","ipa":"/help/","tip":"Bilgisayar ve telefonlardaki 'Help' (Yardım) menüsü."},{"id":"hen","word":"hen","pos":"noun","tr":"tavuk (dişi)","en":"The brown hen laid an egg today.","entr":"Kahverengi tavuk bugün bir yumurta yumurtladı.","ipa":"/hen/","tip":"Dişi tavuk 'hen', horoz 'cock' ya da 'rooster'."},{"id":"her","word":"her","pos":"determiner","tr":"onun, ona (kadın)","en":"She left her umbrella on the bus.","entr":"Şemsiyesini otobüste bıraktı.","ipa":"/hɜːr/","tip":"Hem 'onun' (her book) hem 'onu' (I see her)."},{"id":"here","word":"here","pos":"adverb","tr":"burada, buraya","en":"Please sit here and drink your tea.","entr":"Lütfen buraya otur ve çayını iç.","ipa":"/hɪər/","tip":"Zıttı 'there' (orada). 'Come here!' = Buraya gel!"},{"id":"herself","word":"herself","pos":"pronoun","tr":"kendisi, kendini (kadın)","en":"She painted the bedroom walls by herself.","entr":"Yatak odasının duvarlarını tek başına boyadı.","ipa":"/hɜːˈself/","tip":"Her (o/kadın) + self (kendi) = kendisi."},{"id":"hi","word":"hi","pos":"interjection","tr":"selam, merhaba","en":"My neighbour waved and said hi.","entr":"Komşum el salladı ve selam dedi.","ipa":"/haɪ/","tip":"'Hello'nun daha samimi kısa hâli."},{"id":"high","word":"high","pos":"adjective","tr":"yüksek","en":"There is a high wall around the garden.","entr":"Bahçenin etrafında yüksek bir duvar var.","ipa":"/haɪ/","tip":"'gh' okunmaz: /haɪ/. Zıttı 'low' (alçak)."},{"id":"him","word":"him","pos":"pronoun","tr":"onu, ona (erkek)","en":"I gave him the new office key.","entr":"Ona yeni ofis anahtarını verdim.","ipa":"/hɪm/","tip":"'He' öznedir, 'him' nesne: I know him."},{"id":"himself","word":"himself","pos":"pronoun","tr":"kendisi, kendini (erkek)","en":"He cooked dinner for himself last night.","entr":"Dün gece kendisi için akşam yemeği pişirdi.","ipa":"/hɪmˈself/","tip":"Him (o/erkek) + self (kendi) = kendisi."},{"id":"hire","word":"hire","pos":"verb","tr":"kiralamak, işe almak","en":"We want to hire a car tomorrow.","entr":"Yarın bir araba kiralamak istiyoruz.","ipa":"/haɪər/","tip":"'Rent' ile benzer: hire a car = araba kiralamak."},{"id":"his","word":"his","pos":"determiner","tr":"onun (erkek)","en":"Ali washed his hands before lunch.","entr":"Ali öğle yemeğinden önce ellerini yıkadı.","ipa":"/hɪz/","tip":"Erkek için 'his', kadın için 'her': his bag, her bag."},{"id":"hit","word":"hit","pos":"verb","tr":"vurmak, çarpmak","en":"The ball hit the classroom window.","entr":"Top sınıfın penceresine çarptı.","ipa":"/hɪt/","tip":"En çok dinlenen 'hit şarkılar' (vuran/ses getiren) ifadesi."},{"id":"hold","word":"hold","pos":"verb","tr":"tutmak, bekletmek","en":"Please hold this bag for a minute.","entr":"Lütfen bir dakika bu çantayı tut.","ipa":"/həʊld/","tip":"Hold → held → held. 'Hold on!' = Bekle!"},{"id":"hole","word":"hole","pos":"noun","tr":"delik, çukur","en":"There is a small hole in my sock.","entr":"Çorabımda küçük bir delik var.","ipa":"/həʊl/","tip":"'w' olmadan yazılır ama 'whole' ile aynı okunur."},{"id":"home","word":"home","pos":"noun","tr":"ev, yuva, eve","en":"I usually arrive home at six o'clock.","entr":"Genellikle saat altıda eve varırım.","ipa":"/həʊm/","tip":"Home office (ev ofisi) ifadesindeki 'ev' kelimesidir."},{"id":"homeless","word":"homeless","pos":"adjective","tr":"evsiz","en":"The charity gives warm food to homeless people.","entr":"Yardım kuruluşu evsiz insanlara sıcak yemek veriyor.","ipa":"/ˈhəʊm.ləs/","tip":"Home (ev) + -less (-sız/-siz eki) = evsiz."},{"id":"homework","word":"homework","pos":"noun","tr":"ev ödevi","en":"The boy finished his homework before dinner.","entr":"Çocuk akşam yemeğinden önce ev ödevini bitirdi.","ipa":"/ˈhəʊm.wɜːk/","tip":"Home (ev) + work (iş/çalışma) = ev ödevi."},{"id":"honest","word":"honest","pos":"adjective","tr":"dürüst, doğru sözlü","en":"Everyone trusts him because he is honest.","entr":"Dürüst olduğu için herkes ona güvenir.","ipa":"/ˈɒn.ɪst/","tip":"'h' okunmaz: /ˈɒn.ɪst/."},{"id":"hope","word":"hope","pos":"verb","tr":"ummak, ümit etmek, umut","en":"I hope the weather stays sunny tomorrow.","entr":"Umarım yarın hava güneşli kalır.","ipa":"/həʊp/","tip":"'I hope so' = umarım öyledir."},{"id":"hopeful","word":"hopeful","pos":"adjective","tr":"umutlu, ümitli","en":"She is hopeful about the job interview.","entr":"İş görüşmesi konusunda umutlu.","ipa":"/ˈhəʊp.fəl/","tip":"Hope (umut) + -ful (-lı/-lu eki) = umutlu."},{"id":"horse","word":"horse","pos":"noun","tr":"at","en":"A white horse ran across the green field.","entr":"Beyaz bir at yeşil tarlada koştu.","ipa":"/hɔːs/","tip":"Horse riding = ata binme."},{"id":"hose","word":"hose","pos":"noun","tr":"hortum (su hortumu)","en":"Water the flowers with the garden hose.","entr":"Çiçekleri bahçe hortumuyla sula.","ipa":"/həʊz/","tip":"Bahçeyi sulamak için hortum."},{"id":"hospital","word":"hospital","pos":"noun","tr":"hastane","en":"My aunt works at the city hospital.","entr":"Teyzem şehir hastanesinde çalışıyor.","ipa":"/ˈhɒs.pɪ.təl/","tip":"Hospital ile hostel aynı kökten: misafir kabul edilen yer."},{"id":"hot","word":"hot","pos":"adjective","tr":"sıcak, acı (baharatlı)","en":"Be careful, the soup plate is very hot.","entr":"Dikkatli ol, çorba tabağı çok sıcak.","ipa":"/hɒt/","tip":"Hot → hotter → hottest."},{"id":"hot dog","word":"hot dog","pos":"noun","tr":"sosisli sandviç","en":"He bought a hot dog from the stand.","entr":"Büfeden bir sosisli sandviç aldı.","ipa":"/ˈhɒt ˌdɒɡ/","tip":"Hot (sıcak) + dog (köpek) ama anlamı sosisli sandviç!"},{"id":"hotel","word":"hotel","pos":"noun","tr":"otel","en":"Our hotel is near the sea beach.","entr":"Otelimiz deniz plajının yakınındadır.","ipa":"/həʊˈtel/","tip":"Türkçedeki 'otel' kelimesiyle aynıdır."},{"id":"hour","word":"hour","pos":"noun","tr":"saat (60 dakikalık süre)","en":"The flight to Ankara takes one hour.","entr":"Ankara uçuşu bir saat sürer.","ipa":"/aʊər/","tip":"'h' okunmaz: /aʊər/. 'Our' ile aynı okunur."},{"id":"house","word":"house","pos":"noun","tr":"ev, konut","en":"They painted their house white last summer.","entr":"Geçen yaz evlerini beyaza boyadılar.","ipa":"/haʊs/","tip":"Home 'yuva' duygusu, house ise bina olarak ev."},{"id":"how","word":"how","pos":"adverb","tr":"nasıl, ne kadar","en":"How do you go to work every day?","entr":"Her gün işe nasıl gidiyorsun?","ipa":"/haʊ/","tip":"'How are you?' (Nasılsın?) sorusundan hatırlanabilir."},{"id":"how many","word":"how many","pos":"determiner","tr":"kaç tane, ne kadar (sayılabilen)","en":"How many chairs are in the room?","entr":"Odada kaç tane sandalye var?","ipa":"/ˌhaʊ ˈmen.i/","tip":"How (ne kadar) + many (çok/sayılabilen) = kaç tane."},{"id":"how much","word":"how much","pos":"determiner","tr":"ne kadar, kaç para (sayılamayan)","en":"How much milk do we need for cake?","entr":"Kek için ne kadar süte ihtiyacımız var?","ipa":"/ˌhaʊ ˈmʌtʃ/","tip":"How (ne kadar) + much (çok/miktar) = ne kadar."},{"id":"hung","word":"hung","pos":"verb","tr":"astı (hang fiilinin geçmiş zamanı)","en":"She hung the clean wet clothes outside.","entr":"Temiz ıslak çamaşırları dışarıya astı.","ipa":"/hʌŋ/","tip":"Hang → hung → hung."},{"id":"hungry","word":"hungry","pos":"adjective","tr":"aç, acıkmış","en":"I am hungry, let us eat lunch.","entr":"Karnım aç, hadi öğle yemeği yiyelim.","ipa":"/ˈhʌŋ.ɡri/","tip":"'I'm hungry' = açım. Thirsty = susamış."},{"id":"husband","word":"husband","pos":"noun","tr":"koca, eş (erkek)","en":"Her husband cooks delicious pasta on Sundays.","entr":"Onun eşi pazar günleri lezzetli makarna pişirir.","ipa":"/ˈhʌz.bənd/","tip":"Kadın eş 'wife'."},{"id":"hut","word":"hut","pos":"noun","tr":"kulübe, baraka","en":"The fisherman keeps his nets in a hut.","entr":"Balıkçı ağlarını bir kulübede saklar.","ipa":"/hʌt/","tip":"Pizza Hut (Pizza Kulübesi) isminden ve çatı logosundan hatırlanabilir."},{"id":"idea","word":"idea","pos":"noun","tr":"fikir, düşünce","en":"Going for a walk is a good idea.","entr":"Yürüyüşe çıkmak iyi bir fikirdir.","ipa":"/aɪˈdɪə/","tip":"Türkçedeki 'ideal' kelimesiyle benzerdir."},{"id":"identify","word":"identify","pos":"verb","tr":"tanımlamak, teşhis etmek, kimliğini belirlemek","en":"Can you identify your bag among these?","entr":"Bunların arasında kendi çantanı teşhis edebilir misin?","ipa":"/aɪˈden.tɪ.faɪ/","tip":"Kimlik kartı anlamındaki 'ID' bu kelimenin ilk iki harfidir."},{"id":"important","word":"important","pos":"adjective","tr":"önemli, mühim","en":"Sleep is very important for good health.","entr":"İyi bir sağlık için uyku çok önemlidir.","ipa":"/ɪmˈpɔː.tənt/","tip":"Importance = önem."},{"id":"in","word":"in","pos":"preposition","tr":"içinde, -de, -da","en":"The keys are in my coat pocket.","entr":"Anahtarlar palto cebimin içindedir.","ipa":"/ɪn/","tip":"In the box = kutunun içinde. Aylarla: in May."},{"id":"income","word":"income","pos":"noun","tr":"gelir, kazanç","en":"The family has a regular monthly income.","entr":"Ailenin düzenli bir aylık geliri var.","ipa":"/ˈɪn.kʌm/","tip":"In (içeri) + come (gelmek) = içeri gelen para, yani gelir."},{"id":"indeed","word":"indeed","pos":"adverb","tr":"gerçekten, doğrusu, hakikaten","en":"The homemade bread was very tasty indeed.","entr":"Ev yapımı ekmek gerçekten çok lezzetliydi.","ipa":"/ɪnˈdiːd/","tip":"'Very ... indeed' = gerçekten çok."},{"id":"indicate","word":"indicate","pos":"verb","tr":"göstermek, işaret etmek, belirtmek","en":"Dark clouds indicate rain this evening.","entr":"Koyu bulutlar bu akşam yağmura işaret ediyor.","ipa":"/ˈɪn.dɪ.keɪt/","tip":"Türkçedeki 'endikasyon' ile aynı kökten: göstermek."},{"id":"industrial","word":"industrial","pos":"adjective","tr":"endüstriyel, sanayi ile ilgili","en":"Bursa is a large industrial city.","entr":"Bursa büyük bir sanayi şehridir.","ipa":"/ɪnˈdʌs.tri.əl/","tip":"Türkçedeki 'endüstriyel' (sanayi tipi) kelimesiyle aynıdır."},{"id":"information","word":"information","pos":"noun","tr":"bilgi, danışma","en":"Ask the desk for train ticket information.","entr":"Tren bileti bilgisi için danışmaya sorun.","ipa":"/ˌɪn.fəˈmeɪ.ʃən/","tip":"Danışma masalarında yazan 'Information' kelimesidir."},{"id":"ink","word":"ink","pos":"noun","tr":"mürekkep","en":"Please write your name in blue ink.","entr":"Lütfen adınızı mavi mürekkeple yazın.","ipa":"/ɪŋk/","tip":"Dolma kalem mürekkebi."},{"id":"instead","word":"instead","pos":"adverb","tr":"yerine, onun yerine","en":"We had no coffee, so I drank tea instead.","entr":"Kahvemiz yoktu, bu yüzden onun yerine çay içtim.","ipa":"/ɪnˈsted/","tip":"'Instead of' = ...nın yerine."},{"id":"institution","word":"institution","pos":"noun","tr":"kurum, kuruluş, enstitü","en":"A university is an important educational institution.","entr":"Üniversite önemli bir eğitim kurumudur.","ipa":"/ˌɪn.stɪˈtjuː.ʃən/","tip":"Türkçedeki 'enstitü' (kurum) kelimesidir."},{"id":"intend","word":"intend","pos":"verb","tr":"niyet etmek, planlamak, düşünmek","en":"We intend to visit Antalya next month.","entr":"Gelecek ay Antalya'yı ziyaret etmeyi planlıyoruz.","ipa":"/ɪnˈtend/","tip":"Intention = niyet."},{"id":"interested","word":"interested","pos":"adjective","tr":"ilgili, meraklı","en":"My brother is interested in old cars.","entr":"Erkek kardeşim eski arabalara ilgi duyuyor.","ipa":"/ˈɪn.trə.stɪd/","tip":"'Interested in' = ...ile ilgili: I'm interested in music."},{"id":"interesting","word":"interesting","pos":"adjective","tr":"ilginç, ilgi çekici","en":"I read an interesting article in the newspaper.","entr":"Gazetede ilginç bir makale okudum.","ipa":"/ˈɪn.trə.stɪŋ/","tip":"Türkçedeki 'enteresan' (ilginç) kelimesiyle benzerdir."},{"id":"international","word":"international","pos":"adjective","tr":"uluslararası","en":"Planes land at the new international airport.","entr":"Uçaklar yeni uluslararası havalimanına iniyor.","ipa":"/ˌɪn.təˈnæʃ.ən.əl/","tip":"Inter- (arası) + national (ulusal) = uluslararası."},{"id":"internet","word":"internet","pos":"noun","tr":"internet, genel ağ","en":"You can pay your bills on the internet.","entr":"Faturalarınızı internet üzerinden ödeyebilirsiniz.","ipa":"/ˈɪn.tə.net/","tip":"Türkçedeki 'internet' kelimesiyle tamamen aynıdır."},{"id":"interrupt","word":"interrupt","pos":"verb","tr":"sözünü kesmek, bölmek","en":"Please do not interrupt me while I speak.","entr":"Lütfen ben konuşurken sözümü kesmeyin.","ipa":"/ˌɪn.təˈrʌpt/","tip":"Inter (arasına) + rupt (kırmak) = sözün arasına girmek."},{"id":"into","word":"into","pos":"preposition","tr":"içine, içeriye","en":"Pour the hot tea into the glass.","entr":"Sıcak çayı bardağın içine dök.","ipa":"/ˈɪn.tuː/","tip":"In (iç) + to (-e/-a yönelme) = içine doğru."},{"id":"introduce","word":"introduce","pos":"verb","tr":"tanıştırmak, tanıtmak","en":"Let me introduce my friend to you.","entr":"Arkadaşımı seninle tanıştırayım.","ipa":"/ˌɪn.trəˈdjuːs/","tip":"Intro (içeri) + duce (getirmek) = birini tanıştırmak."},{"id":"invention","word":"invention","pos":"noun","tr":"icat, buluş","en":"The telephone was an important invention.","entr":"Telefon önemli bir icattı.","ipa":"/ɪnˈven.ʃən/","tip":"Invent (icat etmek) + -ion = icat."},{"id":"inventor","word":"inventor","pos":"noun","tr":"mucit","en":"The young inventor made a new machine.","entr":"Genç mucit yeni bir makine yaptı.","ipa":"/ɪnˈven.tər/","tip":"Invention (icat) yapan kişi, yani mucit."},{"id":"investment","word":"investment","pos":"noun","tr":"yatırım","en":"Buying land is a good long-term investment.","entr":"Arsa almak iyi bir uzun vadeli yatırımdır.","ipa":"/ɪnˈvest.mənt/","tip":"Invest (yatırım yapmak) + -ment = yatırım."},{"id":"irregular","word":"irregular","pos":"adjective","tr":"düzensiz, kuralsız","en":"Write the irregular verbs in your notebook.","entr":"Düzensiz fiilleri defterine yaz.","ipa":"/ɪˈreɡ.jə.lər/","tip":"Ir- (olumsuzluk eki) + regular (düzenli) = düzensiz."},{"id":"item","word":"item","pos":"noun","tr":"madde, parça, ürün","en":"Check every item on the shopping list.","entr":"Alışveriş listesindeki her ürünü kontrol et.","ipa":"/ˈaɪ.təm/","tip":"Oyunlarda da eşya/parça anlamında 'item' olarak kullanılır."},{"id":"its","word":"its","pos":"determiner","tr":"onun (cansız ve hayvan)","en":"The cat drank all its milk quickly.","entr":"Kedi bütün sütünü hızlıca içti.","ipa":"/ɪts/","tip":"It (o) + -s (iyelik eki) = onun."},{"id":"itself","word":"itself","pos":"pronoun","tr":"kendisi, kendini (cansız ve hayvan)","en":"The door locks itself automatically at night.","entr":"Kapı geceleri otomatik olarak kendini kilitler.","ipa":"/ɪtˈself/","tip":"It (o) + self (kendi) = kendisi."},{"id":"jacket","word":"jacket","pos":"noun","tr":"ceket, mont","en":"Take your warm jacket before going outside.","entr":"Dışarı çıkmadan önce sıcak ceketini al.","ipa":"/ˈdʒæk.ɪt/","tip":"Türkçedeki 'ceket' kelimesiyle aynıdır."},{"id":"jam","word":"jam","pos":"noun","tr":"reçel, sıkışıklık","en":"We eat strawberry jam at breakfast.","entr":"Kahvaltıda çilek reçeli yeriz.","ipa":"/dʒæm/","tip":"Traffic jam = trafik sıkışıklığı."},{"id":"january","word":"January","pos":"noun","tr":"Ocak (ayı)","en":"January is the first month of the year.","entr":"Ocak yılın ilk ayıdır.","ipa":"/ˈdʒæn.ju.ər.i/","tip":"Janus (iki yüzlü Roma tanrısı): yılın kapısı."},{"id":"jaw","word":"jaw","pos":"noun","tr":"çene","en":"My lower jaw hurts after the dentist visit.","entr":"Dişçi ziyaretinden sonra alt çenem ağrıyor.","ipa":"/dʒɔː/","tip":"Ünlü köpekbalığı filmi 'Jaws' (Çeneler) isminden hatırlanabilir."},{"id":"jazz","word":"jazz","pos":"noun","tr":"caz (müzik)","en":"They play soft jazz music in this cafe.","entr":"Bu kafede hafif caz müziği çalıyorlar.","ipa":"/dʒæz/","tip":"Türkçedeki 'caz' müziği kelimesiyle aynıdır."},{"id":"jelly","word":"jelly","pos":"noun","tr":"jöle","en":"The children ate fruit jelly after lunch.","entr":"Çocuklar öğle yemeğinden sonra meyveli jöle yedi.","ipa":"/ˈdʒel.i/","tip":"Türkçedeki 'jöle' ve 'jelibon' kelimeleriyle benzerdir."},{"id":"job","word":"job","pos":"noun","tr":"iş, meslek, görev","en":"My sister found a new job yesterday.","entr":"Kız kardeşim dün yeni bir iş buldu.","ipa":"/dʒɒb/","tip":"Sayılabilir: a job. Work ise sayılamaz."},{"id":"join","word":"join","pos":"verb","tr":"katılmak, birleştirmek","en":"Would you like to join our dinner tonight?","entr":"Bu akşam yemeğimize katılmak ister misin?","ipa":"/dʒɔɪn/","tip":"'Join us!' = Bize katıl!"},{"id":"joy","word":"joy","pos":"noun","tr":"neşe, sevinç","en":"The baby brought great joy to the family.","entr":"Bebek aileye büyük bir sevinç getirdi.","ipa":"/dʒɔɪ/","tip":"Enjoy (keyif almak) içinde 'joy' var."},{"id":"jug","word":"jug","pos":"noun","tr":"sürahi","en":"Put a jug of cold water on the table.","entr":"Masaya bir sürahi soğuk su koy.","ipa":"/dʒʌɡ/","tip":"Su sürahisi: a jug of water."},{"id":"juice","word":"juice","pos":"noun","tr":"meyve suyu","en":"I drink fresh orange juice every morning.","entr":"Her sabah taze portakal suyu içerim.","ipa":"/dʒuːs/","tip":"Orange juice = portakal suyu."},{"id":"july","word":"July","pos":"noun","tr":"Temmuz","en":"The weather is very hot here in July.","entr":"Temmuz ayında burada hava çok sıcaktır.","ipa":"/dʒuˈlaɪ/","tip":"Julius Caesar'ın adından gelir."},{"id":"june","word":"June","pos":"noun","tr":"Haziran","en":"Schools close for summer holiday in June.","entr":"Okullar Haziran ayında yaz tatili için kapanır.","ipa":"/dʒuːn/","tip":"Juno (Roma tanrıçası) adından gelir."},{"id":"jungle","word":"jungle","pos":"noun","tr":"tropikal orman, balta girmemiş orman","en":"Monkeys live in the deep green jungle.","entr":"Maymunlar sık yeşil ormanda yaşar.","ipa":"/ˈdʒʌŋ.ɡəl/","tip":"Hint dilinden gelen kelime: sık orman."},{"id":"just","word":"just","pos":"adverb","tr":"sadece, yalnızca, az önce","en":"Wait just five minutes at the door.","entr":"Kapıda sadece beş dakika bekle.","ipa":"/dʒʌst/","tip":"'Just a moment' = bir saniye."},{"id":"kangaroo","word":"kangaroo","pos":"noun","tr":"kanguru","en":"A kangaroo carries its baby in a pouch.","entr":"Kanguru yavrusunu bir kesede taşır.","ipa":"/ˌkæŋ.ɡəˈruː/","tip":"Türkçedeki 'kanguru' kelimesiyle aynıdır."},{"id":"keep","word":"keep","pos":"verb","tr":"tutmak, saklamak, koruma","en":"Keep the milk in the cold fridge.","entr":"Sütü soğuk buzdolabında tut.","ipa":"/kiːp/","tip":"Keep → kept → kept. 'Keep calm' = sakin ol."},{"id":"kettle","word":"kettle","pos":"noun","tr":"su ısıtıcısı, çaydanlık","en":"Boil some water in the electric kettle.","entr":"Elektrikli su ısıtıcısında biraz su kaynat.","ipa":"/ˈket.əl/","tip":"Elektrikli su ısıtıcısı."},{"id":"key","word":"key","pos":"noun","tr":"anahtar, tuş","en":"Put the house key in your bag.","entr":"Ev anahtarını çantana koy.","ipa":"/kiː/","tip":"Klavyedeki tuşlar da 'keys'."},{"id":"kid","word":"kid","pos":"noun","tr":"çocuk, oğlak","en":"Every kid in the neighbourhood knows this game.","entr":"Mahalledeki her çocuk bu oyunu bilir.","ipa":"/kɪd/","tip":"Mağazalardaki 'Kids' (çocuk reyonu) yazısından hatırlanabilir."},{"id":"kidney","word":"kidney","pos":"noun","tr":"böbrek","en":"Drinking water is good for your kidney health.","entr":"Su içmek böbrek sağlığınız için iyidir.","ipa":"/ˈkɪd.ni/","tip":"Vücudumuzda iki böbrek var."},{"id":"kill","word":"kill","pos":"verb","tr":"öldürmek","en":"Cold winter frost can kill garden flowers.","entr":"Soğuk kış donu bahçe çiçeklerini öldürebilir.","ipa":"/kɪl/","tip":"Kill → killed."},{"id":"kilo","word":"kilo","pos":"noun","tr":"kilo","en":"Buy one kilo of tomatoes from the market.","entr":"Pazardan bir kilo domates al.","ipa":"/ˈkiː.ləʊ/","tip":"Türkçedeki 'kilo' kelimesiyle tamamen aynıdır."},{"id":"kilogram(me)","word":"kilogram(me)","pos":"noun","tr":"kilogram","en":"This bag of flour weighs one kilogram.","entr":"Bu un paketi bir kilogram ağırlığındadır.","ipa":"/ˈkɪl.ə.ɡræm/","tip":"Türkçedeki 'kilogram' kelimesiyle aynıdır."},{"id":"kilometre","word":"kilometre","pos":"noun","tr":"kilometre","en":"The beach is only one kilometre from here.","entr":"Plaj buradan sadece bir kilometre uzaklıktadır.","ipa":"/ˈkɪl.əˌmiː.tər/","tip":"Türkçedeki 'kilometre' kelimesiyle aynıdır."},{"id":"kind","word":"kind","pos":"adjective","tr":"kibar, nazik, tür, çeşit","en":"Our neighbour is a very kind woman.","entr":"Komşumuz çok kibar bir kadındır.","ipa":"/kaɪnd/","tip":"İki anlamı var: nazik (kind person) ve tür (what kind of)."},{"id":"kindergarten","word":"kindergarten","pos":"noun","tr":"anaokulu, kreş","en":"Her little son goes to kindergarten every morning.","entr":"Onun küçük oğlu her sabah anaokuluna gidiyor.","ipa":"/ˈkɪn.dəˌɡɑː.tən/","tip":"Sürpriz yumurta 'Kinder' (çocuklar) + garden (bahçe) = çocuk bahçesi, anaokulu."},{"id":"king","word":"king","pos":"noun","tr":"kral","en":"The old king lived in a stone castle.","entr":"Yaşlı kral taş bir şatoda yaşadı.","ipa":"/kɪŋ/","tip":"Burger King veya 'kral' anlamında sıkça duyulan kelime."},{"id":"kiss","word":"kiss","pos":"verb","tr":"öpmek, öpücük","en":"Mothers always kiss their babies before sleep.","entr":"Anneler uyumadan önce bebeklerini her zaman öper.","ipa":"/kɪs/","tip":"Kiss → kissed."},{"id":"kitchen","word":"kitchen","pos":"noun","tr":"mutfak","en":"My father is making tea in the kitchen.","entr":"Babam mutfakta çay demliyor.","ipa":"/ˈkɪtʃ.ən/","tip":"Mutfak; 'chicken' (tavuk) ile karıştırma."},{"id":"kite","word":"kite","pos":"noun","tr":"uçurtma","en":"The boy flew a red kite on Sunday.","entr":"Çocuk pazar günü kırmızı bir uçurtma uçurdu.","ipa":"/kaɪt/","tip":"Rüzgârlı günlerde uçurtma uçurulur: fly a kite."},{"id":"knew","word":"knew","pos":"verb","tr":"bildi, biliyordu (know fiilinin geçmiş zamanı)","en":"She knew the right answer to the question.","entr":"Sorunun doğru cevabını biliyordu.","ipa":"/njuː/","tip":"Know → knew → known. 'k' okunmaz."},{"id":"know","word":"know","pos":"verb","tr":"bilmek, tanımak","en":"Do you know the way to the station?","entr":"İstasyona giden yolu biliyor musun?","ipa":"/nəʊ/","tip":"'k' okunmaz: /nəʊ/. 'No' ile aynı okunur."},{"id":"knowledge","word":"knowledge","pos":"noun","tr":"bilgi, birikim","en":"Reading books increases your general knowledge.","entr":"Kitap okumak genel bilginizi artırır.","ipa":"/ˈnɒl.ɪdʒ/","tip":"Know (bilmek) fiilinden türeyen 'bilgi' ismi."},{"id":"known","word":"known","pos":"verb","tr":"bilinen, tanınmış (know fiilinin 3. hali)","en":"Antalya is known for its sunny beaches.","entr":"Antalya güneşli plajlarıyla bilinir.","ipa":"/nəʊn/","tip":"Know (bilmek) fiilinin üçüncü halidir."},{"id":"land","word":"land","pos":"noun","tr":"kara, toprak, arazi, inmek (uçak)","en":"My grandfather owns a piece of farming land.","entr":"Dedemin bir parça tarım arazisi var.","ipa":"/lænd/","tip":"Ülke isimlerinin sonundaki 'land' (England, Finland = ülke/toprak)."},{"id":"language","word":"language","pos":"noun","tr":"dil, lisan","en":"Turkish is a rich and beautiful language.","entr":"Türkçe zengin ve güzel bir dildir.","ipa":"/ˈlæŋ.ɡwɪdʒ/","tip":"Foreign language = yabancı dil."},{"id":"large","word":"large","pos":"adjective","tr":"büyük, geniş","en":"We need a large table for ten guests.","entr":"On misafir için geniş bir masaya ihtiyacımız var.","ipa":"/lɑːdʒ/","tip":"Kıyafet bedenlerindeki 'L' (Large = büyük beden) harfidir."},{"id":"last","word":"last","pos":"determiner","tr":"son, geçen","en":"We visited our village last week.","entr":"Geçen hafta köyümüzü ziyaret ettik.","ipa":"/lɑːst/","tip":"Last week = geçen hafta. Zıttı 'first'."},{"id":"late","word":"late","pos":"adjective","tr":"geç, gecikmiş","en":"Hurry up, or we will be late.","entr":"Acele et, yoksa geç kalacağız.","ipa":"/leɪt/","tip":"'Sorry I'm late' = geç kaldığım için özür dilerim."},{"id":"later","word":"later","pos":"adverb","tr":"daha sonra, sonra","en":"I am busy now, call me later.","entr":"Şu an meşgulüm, beni daha sonra ara.","ipa":"/ˈleɪ.tər/","tip":"Late (geç) + -er (daha) = daha sonra."},{"id":"law","word":"law","pos":"noun","tr":"hukuk, yasa, kanun","en":"Her brother studies law at the university.","entr":"Onun erkek kardeşi üniversitede hukuk okuyor.","ipa":"/lɔː/","tip":"Lawyer = avukat."},{"id":"lay","word":"lay","pos":"verb","tr":"sermek, koymak, yatırmak, yumurtlamak","en":"Please lay the clean tablecloth on the table.","entr":"Lütfen temiz masa örtüsünü masaya ser.","ipa":"/leɪ/","tip":"Lay → laid → laid. 'Lay the table' = sofrayı kurmak."},{"id":"lazy","word":"lazy","pos":"adjective","tr":"tembel, üşengeç","en":"The lazy cat slept all afternoon.","entr":"Tembel kedi bütün öğleden sonra uyudu.","ipa":"/ˈleɪ.zi/","tip":"Tembel; zıttı 'hard-working'."},{"id":"learn","word":"learn","pos":"verb","tr":"öğrenmek","en":"Children learn new words very quickly.","entr":"Çocuklar yeni kelimeleri çok hızlı öğrenir.","ipa":"/lɜːn/","tip":"Learn → learnt/learned. 'Teach' (öğretmek) ile karıştırma."},{"id":"least","word":"least","pos":"determiner","tr":"en az","en":"Drink at least eight glasses of water daily.","entr":"Günde en az sekiz bardak su için.","ipa":"/liːst/","tip":"Little → less → least."},{"id":"leave","word":"leave","pos":"verb","tr":"ayrılmak, çıkmak, bırakmak","en":"What time do you leave home in the morning?","entr":"Sabahları evden saat kaçta çıkıyorsun?","ipa":"/liːv/","tip":"Leave → left → left."},{"id":"left","word":"left","pos":"adjective","tr":"sol, ayrıldı (leave fiilinin geçmiş zamanı)","en":"Write your address on the left side.","entr":"Adresini sol tarafa yaz.","ipa":"/left/","tip":"Hem 'sol' hem 'ayrıldı' (leave fiilinin geçmiş hâli)."},{"id":"left-handed","word":"left-handed","pos":"adjective","tr":"solak","en":"My brother is left-handed and writes neatly.","entr":"Erkek kardeşim solaktır ve düzgün yazar.","ipa":"/ˌleftˈhæn.dɪd/","tip":"Left (sol) + hand (el) = sol elli, yani solak."},{"id":"leg","word":"leg","pos":"noun","tr":"bacak, ayak (masa vb.)","en":"He hurt his right leg during the match.","entr":"Maç sırasında sağ bacağını incitti.","ipa":"/leɡ/","tip":"Bacak; 'egg' ile kafiyeli."},{"id":"lemon","word":"lemon","pos":"noun","tr":"limon","en":"Squeeze half a lemon into the soup.","entr":"Çorbanın içine yarım limon sık.","ipa":"/ˈlem.ən/","tip":"Türkçedeki 'limon' kelimesiyle aynıdır."},{"id":"less","word":"less","pos":"determiner","tr":"daha az","en":"Put less sugar in your hot tea.","entr":"Sıcak çayına daha az şeker koy.","ipa":"/les/","tip":"Little → less → least. Zıttı 'more'."},{"id":"lesson","word":"lesson","pos":"noun","tr":"ders","en":"Our first lesson starts at nine o'clock.","entr":"İlk dersimiz saat dokuzda başlıyor.","ipa":"/ˈles.ən/","tip":"English lesson = İngilizce dersi."},{"id":"let","word":"let","pos":"verb","tr":"izin vermek, bırakmak","en":"Let the hot soup cool for five minutes.","entr":"Sıcak çorbanın beş dakika soğumasına izin ver.","ipa":"/let/","tip":"Let → let → let. 'Let's go!' = Hadi gidelim!"},{"id":"letter","word":"letter","pos":"noun","tr":"mektup, harf","en":"There is a letter for you on the table.","entr":"Masada senin için bir mektup var.","ipa":"/ˈlet.ər/","tip":"Hem mektup hem harf: the letter A."},{"id":"level","word":"level","pos":"noun","tr":"seviye, düzey, kat","en":"She passed the first level of the course.","entr":"Kursun birinci seviyesini geçti.","ipa":"/ˈlev.əl/","tip":"Oyunlarda da 'level atlamak' (seviye geçmek) olarak kullanılır."},{"id":"library","word":"library","pos":"noun","tr":"kütüphane","en":"I borrowed two books from the city library.","entr":"Şehir kütüphanesinden iki kitap ödünç aldım.","ipa":"/ˈlaɪ.brər.i/","tip":"Kitap satılan yer 'bookshop'; library'de ödünç alınır."},{"id":"lid","word":"lid","pos":"noun","tr":"kapak (tencere, kutu vb.)","en":"Put the glass lid on the cooking pot.","entr":"Tencerenin üzerine cam kapağı kapat.","ipa":"/lɪd/","tip":"Tencerenin ya da kutunun kapağı."},{"id":"life","word":"life","pos":"noun","tr":"hayat, yaşam, ömür","en":"Village life is quiet and peaceful.","entr":"Köy hayatı sakin ve huzurludur.","ipa":"/laɪf/","tip":"Çoğulu 'lives'. 'This is life!' = İşte hayat!"},{"id":"light","word":"light","pos":"noun","tr":"ışık, lamba, hafif, açık (renk)","en":"Turn off the bedroom light before sleeping.","entr":"Uyumadan önce yatak odasının ışığını kapat.","ipa":"/laɪt/","tip":"Diyet ürünlerdeki 'light süt' (hafif süt) ifadesinden hatırlanabilir."},{"id":"line","word":"line","pos":"noun","tr":"çizgi, hat, sıra","en":"Draw a straight line with your ruler.","entr":"Cetvelinle düz bir çizgi çiz.","ipa":"/laɪn/","tip":"Online (çevrim içi / hatta) kelimesindeki 'line' (hat/çizgi)."},{"id":"list","word":"list","pos":"noun","tr":"liste","en":"Make a shopping list before going to the market.","entr":"Markete gitmeden önce bir alışveriş listesi yap.","ipa":"/lɪst/","tip":"Türkçedeki 'liste' kelimesiyle aynıdır."},{"id":"listen","word":"listen","pos":"verb","tr":"dinlemek","en":"I listen to the radio in my car.","entr":"Arabamda radyo dinlerim.","ipa":"/ˈlɪs.ən/","tip":"'t' okunmaz: /ˈlɪs.ən/. 'Listen to music' = müzik dinlemek."},{"id":"litre","word":"litre","pos":"noun","tr":"litre","en":"Buy one litre of milk from the shop.","entr":"Dükkandan bir litre süt al.","ipa":"/ˈliː.tər/","tip":"Türkçedeki 'litre' kelimesiyle tamamen aynıdır."},{"id":"little","word":"little","pos":"adjective","tr":"küçük, az, biraz","en":"A little bird sat on the window.","entr":"Pencereye küçük bir kuş kondu
