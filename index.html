<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d94f4f">
<title>Kelime Kartları</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f0ea;--card:#fffdfa;--ink:#23262f;--mute:#7a7f8c;--line:#e8e3da;--red:#e07a68;--red-soft:#fcebe6;--ok:#4f9b86;--ok-soft:#e2f1ec;--bad:#cf6457;--bad-soft:#fbe5e1;--blue:#6f80d0;--blue-soft:#e8ebfa;--amber:#c99530;--amber-soft:#fbf1da;--shadow:0 1px 2px rgba(40,30,20,.05),0 8px 24px rgba(40,30,20,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--card:#1e2027;--ink:#ecebe8;--mute:#9a9ea9;--line:#2c2f38;--red:#ee8e7c;--red-soft:#39282a;--ok:#6fc0a8;--ok-soft:#1d3530;--bad:#ef8174;--bad-soft:#3a2522;--blue:#93a3f0;--blue-soft:#262a45;--amber:#e3b455;--amber-soft:#3b3220;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:22px 18px 110px}
h1{font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:2px 0 16px}h2{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:20px 0 8px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}.mute{color:var(--mute);font-size:14px}
.btn{appearance:none;border:1px solid var(--line);border-radius:18px;padding:15px 18px;font:700 16px inherit;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer;width:100%;text-align:center;transition:transform .12s}
.btn.primary{background:linear-gradient(135deg,#ec9080,#df7664);color:#fff;border:0;box-shadow:0 8px 20px rgba(224,122,104,.35)}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:active,.tile:active{transform:scale(.97)}.btn[disabled]{opacity:.45}.btn.opt[disabled]{opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center}.stat b{display:block;font-size:30px;font-weight:800;color:var(--ink);line-height:1.1}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ee9a8a,#e07a68);border-radius:6px}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--red);font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.mute{background:var(--line);color:var(--mute)}.badge.hard{background:var(--amber-soft);color:var(--amber)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(40,30,20,.06);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:flex;width:100%;max-width:560px;padding:8px 6px 6px}nav button{flex:1;background:none;border:0;padding:2px 0;color:var(--mute);font:700 12px inherit;font-family:inherit}
nav .pill{display:grid;place-items:center;width:60px;height:34px;border-radius:17px;margin:0 auto 3px;transition:background .15s}
nav button.on{color:var(--red)}nav button.on .pill{background:var(--red-soft)}nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(135deg,var(--red-soft),var(--blue-soft));border-radius:28px;padding:20px;margin-bottom:16px;display:flex;gap:18px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.tile{display:flex;gap:16px;align-items:center;padding:18px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:transform .12s;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.tile .ib{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}.tile .mute{display:block;margin-top:1px}.tile[disabled]{opacity:.5}
.tile.sm{flex-direction:column;align-items:flex-start;gap:12px;margin:0}.tile.sm b{font-size:18px}
.t-red .ib{background:var(--red-soft);color:var(--red)}.t-ok .ib{background:var(--ok-soft);color:var(--ok)}.t-blue .ib{background:var(--blue-soft);color:var(--blue)}.t-amber .ib{background:var(--amber-soft);color:var(--amber)}
.tile.feat{padding:22px}.tile.feat.t-red{background:linear-gradient(135deg,var(--red-soft),var(--card) 70%)}.tile.feat.t-ok{background:linear-gradient(135deg,var(--ok-soft),var(--card) 70%)}
.fc{min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;border-radius:30px;padding:28px}
.fc .w{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0;word-break:break-word}.fc .ipa{color:var(--mute);font-size:19px}
.fc .tr{font-size:30px;font-weight:800;color:var(--red)}.fc .en{font-size:19px;margin-top:14px}.fc .en b{color:var(--red)}.fc .sentr{color:var(--mute);margin-top:4px}
.fc .tip{margin-top:14px;font-size:14px;background:var(--red-soft);padding:10px 12px;border-radius:14px;text-align:left}
.sp{border:0;background:var(--red-soft);color:var(--red);border-radius:50%;width:48px;height:48px;font-size:20px;margin-top:6px}
.prog{display:flex;gap:8px;align-items:center;margin-bottom:12px}.prog .bar{flex:1}
.opt{margin-bottom:10px}.opt.right{background:var(--ok);color:#fff;border-color:transparent}.opt.wrong{background:var(--bad);color:#fff;border-color:transparent}
.q{font-size:23px;line-height:1.55;margin:6px 0 4px}.q u{display:inline-block;min-width:80px;border-bottom:3px solid var(--red);text-decoration:none;color:var(--red);text-align:center;font-weight:800}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt .btn{padding:16px 8px;font-size:15px}
.mt .btn.sel{outline:3px solid var(--blue)}.mt .btn.done{visibility:hidden}.mt .btn.shake{background:var(--bad-soft)}
.list .it{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}.list .it .n{font-weight:700}
input[type=search],input[type=text],select{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px}.hdr b{font-size:21px;font-weight:800}.hdr .back{background:var(--card);border:0;border-radius:50%;width:42px;height:42px;font-size:22px;color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#2b2d35;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30}
.center{text-align:center}.big{font-size:54px}.tiny{font-size:12px}
.tx p{font-size:20px;line-height:1.85;margin:0 0 14px}.tx p.trp{font-size:15px;line-height:1.55;color:var(--mute);margin:-6px 0 14px;padding-left:10px;border-left:3px solid var(--line)}
.tk{cursor:pointer;border-radius:5px;padding:0 1px}.tk.l{background:var(--ok-soft)}.tk.a{background:var(--red-soft)}.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--red-soft);overflow:hidden;flex:none;line-height:1}.av img{width:100%;height:100%;object-fit:cover}.avb{border:0;background:none;padding:0;cursor:pointer}
.emg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 0}.emb{border:2px solid transparent;background:var(--card);border-radius:18px;font-size:32px;padding:10px 0;box-shadow:var(--shadow)}.emb.on{border-color:var(--red);background:var(--red-soft)}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}.upd{position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));z-index:60;background:var(--ink);color:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);font-weight:700}.upd span{flex:1}.upd button{border:0;border-radius:12px;padding:9px 14px;background:var(--red);color:#fff;font:800 14px inherit;font-family:inherit}
@media print{nav,.no-print,#sheet,.toast,.upd{display:none!important}body{background:#fff!important}main{padding-bottom:0!important}.card{box-shadow:none!important;border:1px solid #ddd;break-inside:avoid}}
.tk.rd{background:var(--blue-soft);border-radius:4px}.tk.rw{background:var(--red);color:#fff;border-radius:4px}
.ch{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:700 14px inherit;font-family:inherit}.ch.on{background:var(--red);border-color:var(--red);color:#fff}
.lgb{border:0;border-radius:10px;padding:6px 12px;font:700 13px inherit;font-family:inherit;color:var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12px;font-weight:600}.lg span{padding:3px 10px;border-radius:8px}
.sbg{position:fixed;inset:0;background:rgba(20,15,10,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.sheet .ctx{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div id="sheet"></div><div id="root"><main id="app"></main>
<nav><div class="in"></div></nav></div>
<script>
/* ===== DATA ===== */
const WORDS = [{"id":"a","word":"a","pos":"article","tr":"bir","en":"I bought a new coffee cup.","entr":"Yeni bir kahve fincanı aldım.","ipa":"/ə/","tip":"Tek bir harf, tek 'bir' şey demektir."},{"id":"a.m.","word":"a.m.","pos":"abbreviation","tr":"öğleden önce, sabah","en":"My work starts at 8 a.m.","entr":"İşim sabah saat 8'de başlıyor.","ipa":"/ˌeɪˈem/","tip":"a.m. = öğleden önce; \"AM\" sabah alarmı gibi düşün."},{"id":"ability","word":"ability","pos":"noun","tr":"yetenek, beceri","en":"She has great cooking ability.","entr":"Onun harika bir yemek yapma yeteneği var.","ipa":"/əˈbɪl.ə.ti/","tip":"'Aaa bilirdi!' — Çok yetenekli olduğu için her işi bilirdi."},{"id":"able","word":"able","pos":"adjective","tr":"yapabilen, -ebilir","en":"I am able to drive a car.","entr":"Araba kullanabiliyorum.","ipa":"/ˈeɪ.bəl/","tip":"\"Eybıl\" gibi okunur: \"Hey, bil!\" — yapabilen kişi bilir."},{"id":"about","word":"about","pos":"preposition","tr":"hakkında, yaklaşık","en":"We talked about our holiday plans.","entr":"Tatil planlarımız hakkında konuştuk.","ipa":"/əˈbaʊt/","tip":"\"Abaut\" — bu konu HAKKINDA konuşalım."},{"id":"absolutely","word":"absolutely","pos":"adverb","tr":"kesinlikle, tamamen","en":"This cake is absolutely delicious.","entr":"Bu pasta kesinlikle çok lezzetli.","ipa":"/ˌæb.səˈluːt.li/","tip":"Absolute (tam, mutlak) + -ly. Bir şeye güçlüce 'evet' derken: Absolutely!"},{"id":"accept","word":"accept","pos":"verb","tr":"kabul etmek","en":"We accept credit cards here.","entr":"Burada kredi kartı kabul ediyoruz.","ipa":"/əkˈsept/","tip":"'Ak cep' — Teklifi kabul edip parayı ak cebine koydu."},{"id":"accident","word":"accident","pos":"noun","tr":"kaza, tesadüf","en":"I spilled my tea by accident.","entr":"Çayımı kazara döktüm.","ipa":"/ˈæk.sɪ.dənt/","tip":"'Aksi' bir durum oldu ve kaza meydana geldi."},{"id":"achieve","word":"achieve","pos":"verb","tr":"başarmak, ulaşmak","en":"You can achieve your goals today.","entr":"Bugün hedeflerine ulaşabilirsin.","ipa":"/əˈtʃiːv/","tip":"'Aç ev' — Hedefini başardın, yeni evinin kapısını aç!"},{"id":"across","word":"across","pos":"preposition","tr":"karşısında, karşıdan karşıya","en":"The bakery is across the street.","entr":"Fırın caddenin karşısındadır.","ipa":"/əˈkrɒs/","tip":"\"Akros\" — caddenin karşısına geç."},{"id":"act","word":"act","pos":"verb","tr":"davranmak, rol yapmak","en":"We must act quickly now.","entr":"Şimdi hızlı hareket etmeliyiz.","ipa":"/ækt/","tip":"'Aktör' sahnede rol yapar ve davranır."},{"id":"action","word":"action","pos":"noun","tr":"hareket, eylem","en":"I like watching action movies.","entr":"Aksiyon filmleri izlemeyi severim.","ipa":"/ˈæk.ʃən/","tip":"Türkçedeki 'aksiyon' kelimesiyle aynı kökten gelir."},{"id":"activity","word":"activity","pos":"noun","tr":"etkinlik, faaliyet","en":"Swimming is a healthy weekend activity.","entr":"Yüzmek sağlıklı bir hafta sonu etkinliğidir.","ipa":"/ækˈtɪv.ə.ti/","tip":"Türkçedeki 'aktivite' kelimesidir."},{"id":"actually","word":"actually","pos":"adverb","tr":"aslında, gerçekten","en":"Actually, I prefer drinking hot tea.","entr":"Aslında sıcak çay içmeyi tercih ederim.","ipa":"/ˈæk.tʃu.ə.li/","tip":"'Ak çuval' — Aslında o çuval ak (beyaz) renktedir."},{"id":"add","word":"add","pos":"verb","tr":"eklemek, ilave etmek","en":"Please add some salt to the soup.","entr":"Lütfen çorbaya biraz tuz ekle.","ipa":"/æd/","tip":"'Et' — Yemeğe biraz da et ekle."},{"id":"address","word":"address","pos":"noun","tr":"adres","en":"Write your home address on paper.","entr":"Ev adresini kağıda yaz.","ipa":"/əˈdres/","tip":"Türkçedeki 'adres' kelimesiyle aynıdır."},{"id":"adjective","word":"adjective","pos":"noun","tr":"sıfat","en":"Big is an easy English adjective.","entr":"Big, kolay bir İngilizce sıfattır.","ipa":"/ˈædʒ.ek.tɪv/","tip":"İsmi niteleyen kelime: a big house'daki 'big' bir adjective'dir."},{"id":"advantage","word":"advantage","pos":"noun","tr":"avantaj, fayda","en":"Knowing English is a big advantage.","entr":"İngilizce bilmek büyük bir avantajdır.","ipa":"/ədˈvɑːn.tɪdʒ/","tip":"Türkçedeki 'avantaj' kelimesidir."},{"id":"aerial","word":"aerial","pos":"noun","tr":"anten","en":"The television aerial is on the roof.","entr":"Televizyon anteni çatıdadır.","ipa":"/ˈeə.ri.əl/","tip":"Air (hava) kökünden: havadaki sinyali yakalayan anten."},{"id":"aeroplane","word":"aeroplane","pos":"noun","tr":"uçak","en":"The aeroplane landed at the airport.","entr":"Uçak havalimanına indi.","ipa":"/ˈeə.rə.pleɪn/","tip":"'Aero' hava demektir, havada süzülen uçak."},{"id":"affect","word":"affect","pos":"verb","tr":"etkilemek","en":"Cold weather can affect your health.","entr":"Soğuk hava sağlığınızı etkileyebilir.","ipa":"/əˈfekt/","tip":"Film 'efekt'leri izleyicileri çok etkiler."},{"id":"afraid","word":"afraid","pos":"adjective","tr":"korkmuş, korkan","en":"My cat is afraid of dogs.","entr":"Kedim köpeklerden korkar.","ipa":"/əˈfreɪd/","tip":"'Efrat' — Evdeki efrat karanlıktan korktu."},{"id":"after","word":"after","pos":"preposition","tr":"sonra, -den sonra","en":"I drink coffee after breakfast.","entr":"Kahvaltıdan sonra kahve içerim.","ipa":"/ˈɑːf.tər/","tip":"'Af ter' — Spor yaptıktan sonra ter atılır."},{"id":"afternoon","word":"afternoon","pos":"noun","tr":"öğleden sonra","en":"We have a meeting this afternoon.","entr":"Bu öğleden sonra bir toplantımız var.","ipa":"/ˌɑːf.təˈnuːn/","tip":"'After' (sonra) + 'noon' (öğle) = öğleden sonra."},{"id":"again","word":"again","pos":"adverb","tr":"tekrar, yine","en":"Please read this short sentence again.","entr":"Lütfen bu kısa cümleyi tekrar oku.","ipa":"/əˈɡen/","tip":"'Eee gene' mi aynı şey oldu? Tekrar, yine!"},{"id":"against","word":"against","pos":"preposition","tr":"karşı, zıt","en":"Put the table against the wall.","entr":"Masayı duvara yasla.","ipa":"/əˈɡenst/","tip":"Spor maçlarında 'Türkiye against Italy' = Türkiye–İtalya karşılaşması."},{"id":"age","word":"age","pos":"noun","tr":"yaş, çağ","en":"What is your brother's age?","entr":"Erkek kardeşinin yaşı kaç?","ipa":"/eɪdʒ/","tip":"\"Eyc!\" — Kaç yaşındasın? Yaşın = age."},{"id":"ago","word":"ago","pos":"adverb","tr":"önce","en":"The bus left ten minutes ago.","entr":"Otobüs on dakika önce kalktı.","ipa":"/əˈɡəʊ/","tip":"'Eee go (git)' — O çoktan, yıllar önce gitti."},{"id":"agree","word":"agree","pos":"verb","tr":"katılmak, aynı fikirde olmak","en":"I agree with your good idea.","entr":"Senin güzel fikrine katılıyorum.","ipa":"/əˈɡriː/","tip":"'Eee gri!' — İkimiz de rengin gri olduğunda hemfikiriz."},{"id":"agreement","word":"agreement","pos":"noun","tr":"anlaşma, sözleşme","en":"We signed the house rental agreement.","entr":"Ev kira sözleşmesini imzaladık.","ipa":"/əˈɡriː.mənt/","tip":"Agree (katılmak) kelimesinden türeyen 'anlaşma'."},{"id":"air","word":"air","pos":"noun","tr":"hava","en":"Open the window for fresh air.","entr":"Temiz hava için pencereyi aç.","ipa":"/eər/","tip":"'Eğer' temiz hava alırsan rahat nefes alırsın."},{"id":"air-conditioner","word":"air-conditioner","pos":"noun","tr":"klima","en":"Turn on the air-conditioner in summer.","entr":"Yazın klimayı aç.","ipa":"/ˈeə kənˌdɪʃ.ən.ər/","tip":"Air (hava) şartlandırıcı, yani klima."},{"id":"airhostess","word":"airhostess","pos":"noun","tr":"hostes, kabin memuru","en":"The airhostess brought water to passengers.","entr":"Hostes yolculara su getirdi.","ipa":"/ˈeəˌhəʊ.stəs/","tip":"Air (hava) + hostess (hostes) = uçak hostesi."},{"id":"airline","word":"airline","pos":"noun","tr":"havayolu","en":"This airline flies to Istanbul daily.","entr":"Bu havayolu her gün İstanbul'a uçuyor.","ipa":"/ˈeə.laɪn/","tip":"Air (hava) + line (hat) = havayolu hattı."},{"id":"airplane","word":"airplane","pos":"noun","tr":"uçak","en":"We saw a big white airplane.","entr":"Büyük beyaz bir uçak gördük.","ipa":"/ˈeə.pleɪn/","tip":"Air (hava) + plane (düzlem/kanat) = uçak."},{"id":"alike","word":"alike","pos":"adjective","tr":"benzer, aynı","en":"The two sisters look very alike.","entr":"İki kız kardeş birbirine çok benziyor.","ipa":"/əˈlaɪk/","tip":"Like (gibi/benzer) kelimesinden: birbirinin aynısı."},{"id":"alive","word":"alive","pos":"adjective","tr":"canlı, hayatta","en":"Keep the green plants alive with water.","entr":"Yeşil bitkileri suyla canlı tut.","ipa":"/əˈlaɪv/","tip":"Canlı yayınlarda 'Live' yazar; alive = canlı."},{"id":"all","word":"all","pos":"determiner","tr":"bütün, tüm, hepsi","en":"All rooms in the hotel are clean.","entr":"Oteldeki bütün odalar temiz.","ipa":"/ɔːl/","tip":"\"Ol\" gibi okunur: hepsi olsun, hepsini al."},{"id":"all right","word":"all right","pos":"adjective","tr":"iyi, tamam, pekala","en":"Everything is all right at home.","entr":"Evde her şey yolunda.","ipa":"/ˌɔːl ˈraɪt/","tip":"All (hepsi) + right (doğru/iyi) = her şey tamam."},{"id":"allow","word":"allow","pos":"verb","tr":"izin vermek","en":"They do not allow pets inside.","entr":"İçeride evcil hayvana izin vermiyorlar.","ipa":"/əˈlaʊ/","tip":"'Alev' — Kamp alanında alev yakmaya izin verdiler."},{"id":"almost","word":"almost","pos":"adverb","tr":"neredeyse, hemen hemen","en":"Dinner is almost ready on the table.","entr":"Akşam yemeği masada neredeyse hazır.","ipa":"/ˈɔːl.məʊst/","tip":"'Ol dost' — Neredeyse dost oluyorduk."},{"id":"alone","word":"alone","pos":"adjective","tr":"yalnız, tek başına","en":"He lives alone in a small flat.","entr":"Küçük bir dairede yalnız yaşıyor.","ipa":"/əˈləʊn/","tip":"'Al on' — Al on lirayı, tek başına sinemaya git."},{"id":"along","word":"along","pos":"preposition","tr":"boyunca","en":"We walked along the beach together.","entr":"Birlikte sahil boyunca yürüdük.","ipa":"/əˈlɒŋ/","tip":"'Long' (uzun) yol boyunca yürümek."},{"id":"aloud","word":"aloud","pos":"adverb","tr":"yüksek sesle, sesli","en":"Read the English words aloud every day.","entr":"Her gün İngilizce kelimeleri yüksek sesle oku.","ipa":"/əˈlaʊd/","tip":"'Loud' yüksek ses demektir; aloud = sesli olarak."},{"id":"alphabet","word":"alphabet","pos":"noun","tr":"alfabe","en":"The English alphabet has twenty-six letters.","entr":"İngiliz alfabesinde yirmi altı harf vardır.","ipa":"/ˈæl.fə.bet/","tip":"Türkçedeki 'alfabe' kelimesiyle aynıdır."},{"id":"already","word":"already","pos":"adverb","tr":"zaten, çoktan","en":"I have already paid the bill.","entr":"Faturayı çoktan ödedim.","ipa":"/ɔːlˈred.i/","tip":"All (tamamen) + ready (hazır) = zaten çoktan hazır!"},{"id":"also","word":"also","pos":"adverb","tr":"ayrıca, de, da","en":"She speaks Turkish and also English.","entr":"O Türkçe ve ayrıca İngilizce konuşuyor.","ipa":"/ˈɔːl.səʊ/","tip":"'Ol su' — Yemeğin yanına ayrıca su da olsun."},{"id":"although","word":"although","pos":"conjunction","tr":"-e rağmen, karşın","en":"We walked although the weather was cold.","entr":"Hava soğuk olmasına rağmen yürüdük.","ipa":"/ɔːlˈðəʊ/","tip":"İki zıt fikri bağlar: Although it was cold, we swam. 'Though' ile aynı."},{"id":"always","word":"always","pos":"adverb","tr":"her zaman, daima","en":"I always eat eggs for breakfast.","entr":"Kahvaltıda her zaman yumurta yerim.","ipa":"/ˈɔːl.weɪz/","tip":"All (tüm) + ways (yollar) = her yolda, her zaman."},{"id":"am","word":"am","pos":"verb","tr":"-im, -ım (olmak)","en":"I am a new student here.","entr":"Ben burada yeni bir öğrenciyim.","ipa":"/æm/","tip":"'I am' — Ben varım, ben ...-im."},{"id":"amateur","word":"amateur","pos":"noun","tr":"amatör","en":"He is an amateur photographer.","entr":"O amatör bir fotoğrafçıdır.","ipa":"/ˈæm.ə.tər/","tip":"Türkçedeki 'amatör' kelimesiyle aynıdır."},{"id":"among","word":"among","pos":"preposition","tr":"arasında, aralarında","en":"There is a small house among the trees.","entr":"Ağaçların arasında küçük bir ev var.","ipa":"/əˈmʌŋ/","tip":"İkiden fazla şeyin arasında: among friends. İki şey için 'between'."},{"id":"amount","word":"amount","pos":"noun","tr":"miktar, tutar","en":"Use a small amount of sugar.","entr":"Az miktarda şeker kullanın.","ipa":"/əˈmaʊnt/","tip":"Sayılamayanlar için miktar: a large amount of water."},{"id":"an","word":"an","pos":"article","tr":"bir","en":"She ate an orange for breakfast.","entr":"Kahvaltıda bir portakal yedi.","ipa":"/æn/","tip":"Sesli harfle başlayan kelimelerden önce gelen 'bir'."},{"id":"and","word":"and","pos":"conjunction","tr":"ve","en":"I bought bread and cheese.","entr":"Ekmek ve peynir aldım.","ipa":"/ænd/","tip":"İki şeyi bağlar: bread and cheese (ekmek ve peynir)."},{"id":"angry","word":"angry","pos":"adjective","tr":"kızgın, öfkeli","en":"The boss was angry about the mistake.","entr":"Patron hatadan dolayı kızgındı.","ipa":"/ˈæŋ.ɡri/","tip":"'Angry Birds' (Kızgın Kuşlar) oyunundan hatırlanabilir."},{"id":"animal","word":"animal","pos":"noun","tr":"hayvan","en":"The dog is a loyal animal.","entr":"Köpek sadık bir hayvandır.","ipa":"/ˈæn.ɪ.məl/","tip":"Belgesel kanalı 'Animal Planet' (Hayvan Gezegeni)."},{"id":"another","word":"another","pos":"determiner","tr":"başka bir, diğer","en":"Can I have another cup of tea?","entr":"Bir fincan çay daha alabilir miyim?","ipa":"/əˈnʌð.ər/","tip":"An (bir) + other (diğer) = başka bir."},{"id":"answer","word":"answer","pos":"noun","tr":"cevap, yanıt","en":"Nobody knows the right answer.","entr":"Kimse doğru cevabı bilmiyor.","ipa":"/ˈɑːn.sər/","tip":"'w' okunmaz: /ˈɑːn.sər/. Zıttı 'question' (soru)."},{"id":"ant","word":"ant","pos":"noun","tr":"karınca","en":"A small ant walked on the table.","entr":"Masada küçük bir karınca yürüdü.","ipa":"/ænt/","tip":"'Aunt' (hala, teyze) ile karıştırma; ant küçük karınca."},{"id":"any","word":"any","pos":"determiner","tr":"hiç, herhangi bir","en":"Do you have any brothers?","entr":"Hiç erkek kardeşin var mı?","ipa":"/ˈen.i/","tip":"Olumsuz ve soru cümlelerinde: Do you have any money? I don't have any."},{"id":"anybody","word":"anybody","pos":"pronoun","tr":"kimse, herhangi biri","en":"Is anybody inside the office now?","entr":"Şu anda ofisin içinde kimse var mı?","ipa":"/ˈen.iˌbɒd.i/","tip":"Any (herhangi) + body (beden/kişi) = herhangi biri."},{"id":"anyone","word":"anyone","pos":"pronoun","tr":"kimse, herhangi biri","en":"Did anyone call me today?","entr":"Bugün beni kimse aradı mı?","ipa":"/ˈen.i.wʌn/","tip":"Any (herhangi) + one (bir/kişi) = herhangi biri."},{"id":"anything","word":"anything","pos":"pronoun","tr":"hiçbir şey, herhangi bir şey","en":"I did not buy anything from the shop.","entr":"Mağazadan hiçbir şey almadım.","ipa":"/ˈen.i.θɪŋ/","tip":"Any (herhangi) + thing (şey) = herhangi bir şey."},{"id":"anyway","word":"anyway","pos":"adverb","tr":"neyse, her neyse, yine de","en":"It was raining, but we set out anyway.","entr":"Yağmur yağıyordu, yine de yola çıktık.","ipa":"/ˈen.i.weɪ/","tip":"Any (herhangi) + way (yol) = her yolla, yine de."},{"id":"anywhere","word":"anywhere","pos":"adverb","tr":"hiçbir yer, herhangi bir yer","en":"I cannot find my keys anywhere.","entr":"Anahtarlarımı hiçbir yerde bulamıyorum.","ipa":"/ˈen.i.weər/","tip":"Any (herhangi) + where (nerede/yer) = herhangi bir yer."},{"id":"appear","word":"appear","pos":"verb","tr":"görünmek, ortaya çıkmak","en":"Stars appear in the sky at night.","entr":"Yıldızlar gece gökyüzünde görünür.","ipa":"/əˈpɪər/","tip":"Ap- + pear: ortaya çıkmak. Zıttı 'disappear' (kaybolmak)."},{"id":"appetite","word":"appetite","pos":"noun","tr":"iştah","en":"Walking in the park gives me an appetite.","entr":"Parkta yürümek iştahımı açıyor.","ipa":"/ˈæp.ə.taɪt/","tip":"Türkçedeki 'apetit' ile aynı kökten. 'Bon appétit' = afiyet olsun."},{"id":"apple","word":"apple","pos":"noun","tr":"elma","en":"She cut the red apple in half.","entr":"Kırmızı elmayı ikiye böldü.","ipa":"/ˈæp.əl/","tip":"Telefon markası Apple'ın logosu ısırılmış elmadır."},{"id":"application","word":"application","pos":"noun","tr":"başvuru, uygulama","en":"He sent a job application yesterday.","entr":"Dün bir iş başvurusu gönderdi.","ipa":"/ˌæp.lɪˈkeɪ.ʃən/","tip":"Telefondaki 'App' kelimesi bu kelimenin kısaltmasıdır."},{"id":"apply","word":"apply","pos":"verb","tr":"başvurmak, uygulamak","en":"Did you apply for the new job?","entr":"Yeni işe başvurdun mu?","ipa":"/əˈplaɪ/","tip":"'Apply for a job' = işe başvurmak. Telefon uygulaması 'app' da 'application'dan gelir."},{"id":"appointment","word":"appointment","pos":"noun","tr":"randevu","en":"I have a dentist appointment tomorrow morning.","entr":"Yarın sabah dişçi randevum var.","ipa":"/əˈpɔɪnt.mənt/","tip":"Doktora ya da kuaföre gitmeden önce 'make an appointment' = randevu al."},{"id":"appropriate","word":"appropriate","pos":"adjective","tr":"uygun, yerinde","en":"Wear appropriate clothes for the cold weather.","entr":"Soğuk hava için uygun kıyafetler giyin.","ipa":"/əˈprəʊ.pri.ət/","tip":"Duruma uygun olan: appropriate clothes for school."},{"id":"apricot","word":"apricot","pos":"noun","tr":"kayısı","en":"My mother makes sweet apricot jam.","entr":"Annem tatlı kayısı reçeli yapar.","ipa":"/ˈeɪ.prɪ.kɒt/","tip":"Malatya kayısısı dünyaca ünlüdür: Malatya apricots."},{"id":"april","word":"April","pos":"noun","tr":"Nisan","en":"It often rains here in April.","entr":"Burada Nisan ayında sık sık yağmur yağar.","ipa":"/ˈeɪ.prəl/","tip":"Nisan yağmurları 'aprıl' (April) yağmurlarıdır."},{"id":"are","word":"are","pos":"verb","tr":"-yız, -sınız, -lar (olmak)","en":"We are ready for the trip.","entr":"Yolculuk için hazırız.","ipa":"/ɑːr/","tip":"You/we/they ile kullanılır: We are friends. I am, he is, they are."},{"id":"argue","word":"argue","pos":"verb","tr":"tartışmak","en":"They never argue about money.","entr":"Para konusunda asla tartışmazlar.","ipa":"/ˈɑːɡ.juː/","tip":"Tartışırken 'argüman' sunmak."},{"id":"argument","word":"argument","pos":"noun","tr":"tartışma, sav","en":"We had a short argument yesterday.","entr":"Dün kısa bir tartışma yaşadık.","ipa":"/ˈɑːɡ.jə.mənt/","tip":"Türkçedeki 'argüman' kelimesiyle aynı köktendir."},{"id":"arm","word":"arm","pos":"noun","tr":"kol","en":"He carried the box under his arm.","entr":"Kutuyu kolunun altında taşıdı.","ipa":"/ɑːm/","tip":"Armchair = kollu koltuk. Army (ordu) ile karıştırma."},{"id":"armchair","word":"armchair","pos":"noun","tr":"koltuk","en":"My grandfather sits in the big armchair.","entr":"Dedem büyük koltukta oturur.","ipa":"/ˈɑːm.tʃeər/","tip":"Arm (kol) + chair (sandalye) = kollu sandalye, koltuk."},{"id":"army","word":"army","pos":"noun","tr":"ordu","en":"His brother joined the army last year.","entr":"Erkek kardeşi geçen yıl orduya katıldı.","ipa":"/ˈɑː.mi/","tip":"Arm (silah) kökünden: silahlı kuvvet, ordu."},{"id":"around","word":"around","pos":"preposition","tr":"etrafında, çevresinde","en":"We sat around the kitchen table.","entr":"Mutfak masasının etrafında oturduk.","ipa":"/əˈraʊnd/","tip":"Round (yuvarlak/daire) kelimesinden; daire şeklinde etrafında."},{"id":"as","word":"as","pos":"preposition","tr":"olarak, gibi, kadar","en":"She works as a teacher in Ankara.","entr":"Ankara'da öğretmen olarak çalışıyor.","ipa":"/æz/","tip":"'As ... as' karşılaştırma: as tall as me (benim kadar uzun)."},{"id":"ashtray","word":"ashtray","pos":"noun","tr":"kül tablası","en":"Please put the glass ashtray on the balcony.","entr":"Lütfen cam kül tablasını balkona koy.","ipa":"/ˈæʃ.treɪ/","tip":"Ash (kül) + tray (tepsi/tabla) = kül tablası."},{"id":"ask","word":"ask","pos":"verb","tr":"sormak, istemek","en":"Can I ask you a simple question?","entr":"Sana basit bir soru sorabilir miyim?","ipa":"/ɑːsk/","tip":"Ask a question = soru sormak. Cevabı 'answer'."},{"id":"aspirin","word":"aspirin","pos":"noun","tr":"aspirin","en":"He took an aspirin for his headache.","entr":"Baş ağrısı için bir aspirin aldı.","ipa":"/ˈæs.prɪn/","tip":"Türkçedeki 'aspirin' ile tamamen aynıdır."},{"id":"assume","word":"assume","pos":"verb","tr":"varsaymak, sanmak","en":"I assume the train is on time.","entr":"Trenin zamanında geleceğini varsayıyorum.","ipa":"/əˈsjuːm/","tip":"Kanıt olmadan doğru kabul etmek: I assume you are hungry."},{"id":"astronaut","word":"astronaut","pos":"noun","tr":"astronot","en":"The astronaut travelled to space.","entr":"Astronot uzaya seyahat etti.","ipa":"/ˈæs.trə.nɔːt/","tip":"Türkçedeki 'astronot' kelimesiyle aynıdır."},{"id":"at","word":"at","pos":"preposition","tr":"-de, -da","en":"Wait for me at the bus stop.","entr":"Beni otobüs durağında bekle.","ipa":"/æt/","tip":"E-posta adreslerindeki '@' (et) işareti yer belirtir."},{"id":"ate","word":"ate","pos":"verb","tr":"yedi (eat fiilinin geçmiş zamanı)","en":"We ate fish for dinner last night.","entr":"Dün gece akşam yemeğinde balık yedik.","ipa":"/eɪt/","tip":"'Et' — Dün akşam yemekte et yedi."},{"id":"athlete","word":"athlete","pos":"noun","tr":"atlet, sporcu","en":"The young athlete runs very fast.","entr":"Genç sporcu çok hızlı koşar.","ipa":"/ˈæθ.liːt/","tip":"Türkçedeki 'atlet' (sporcu) kelimesiyle aynıdır."},{"id":"atlas","word":"atlas","pos":"noun","tr":"atlas, harita kitabı","en":"Find Turkey on the world atlas.","entr":"Dünya atlasında Türkiye'yi bul.","ipa":"/ˈæt.ləs/","tip":"Türkçedeki 'atlas' kelimesiyle tamamen aynıdır."},{"id":"attention","word":"attention","pos":"noun","tr":"dikkat, ilgi","en":"Pay attention to the traffic lights.","entr":"Trafik ışıklarına dikkat et.","ipa":"/əˈten.ʃən/","tip":"Anonslarda 'Attention please!' (Lütfen dikkat!) denir."},{"id":"attitude","word":"attitude","pos":"noun","tr":"tutum, tavır","en":"She has a positive attitude towards work.","entr":"İşe karşı olumlu bir tutumu var.","ipa":"/ˈæt.ɪ.tjuːd/","tip":"Türkçedeki 'tavır' anlamı; positive attitude = olumlu tutum."},{"id":"august","word":"August","pos":"noun","tr":"Ağustos","en":"We go on holiday every August.","entr":"Her Ağustos ayında tatile gideriz.","ipa":"/ˈɔː.ɡəst/","tip":"Türkçedeki 'Ağustos' ayının İngilizce karşılığıdır."},{"id":"aunt","word":"aunt","pos":"noun","tr":"hala, teyze","en":"My aunt lives in Izmir now.","entr":"Teyzem şimdi İzmir'de yaşıyor.","ipa":"/ɑːnt/","tip":"İngilizcede hala ve teyze için aynı kelime: aunt."},{"id":"authority","word":"authority","pos":"noun","tr":"otorite, yetki, yetkili","en":"Who is the authority in this building?","entr":"Bu binadaki yetkili kim?","ipa":"/ɔːˈθɒr.ə.ti/","tip":"Türkçedeki 'otorite' kelimesiyle aynıdır."},{"id":"automobile","word":"automobile","pos":"noun","tr":"otomobil, araba","en":"His father bought a new automobile.","entr":"Babası yeni bir otomobil satın aldı.","ipa":"/ˈɔː.tə.mə.biːl/","tip":"Türkçedeki 'otomobil' kelimesiyle aynıdır."},{"id":"autumn","word":"autumn","pos":"noun","tr":"sonbahar, güz","en":"Leaves turn yellow in autumn.","entr":"Sonbaharda yapraklar sararır.","ipa":"/ˈɔː.təm/","tip":"Sondaki 'n' okunmaz: /ˈɔː.təm/. Amerikan İngilizcesinde 'fall'."},{"id":"available","word":"available","pos":"adjective","tr":"müsait, mevcut, uygun","en":"Are there any available seats on the bus?","entr":"Otobüste hiç boş koltuk var mı?","ipa":"/əˈveɪ.lə.bəl/","tip":"Avail (kullanılabilir) + -able: elde edilebilir ya da müsait."},{"id":"average","word":"average","pos":"noun","tr":"ortalama","en":"The average of these three numbers is ten.","entr":"Bu üç sayının ortalaması ondur.","ipa":"/ˈæv.ər.ɪdʒ/","tip":"Türkçede de kullanılan 'averaj' (puan ortalaması) kelimesidir."},{"id":"awake","word":"awake","pos":"adjective","tr":"uyanık","en":"The baby is still awake in bed.","entr":"Bebek yatakta hâlâ uyanık.","ipa":"/əˈweɪk/","tip":"Wake (uyanmak) fiilinden türemiştir; awake = uyanık."},{"id":"away","word":"away","pos":"adverb","tr":"uzakta, uzağa","en":"The train station is two kilometres away.","entr":"Tren istasyonu iki kilometre uzaktadır.","ipa":"/əˈweɪ/","tip":"Way (yol) kelimesinden; yola çıkıp uzağa gitmek."},{"id":"axe","word":"axe","pos":"noun","tr":"balta","en":"He cut the dry wood with an axe.","entr":"Kuru odunu baltayla kesti.","ipa":"/æks/","tip":"Odun kesmek için kullanılan balta. Amerikan yazımı 'ax'."},{"id":"baby","word":"baby","pos":"noun","tr":"bebek","en":"The little baby is sleeping quietly.","entr":"Küçük bebek sessizce uyuyor.","ipa":"/ˈbeɪ.bi/","tip":"Türkçedeki 'bebek' kelimesine ses olarak çok benzer."},{"id":"back","word":"back","pos":"noun","tr":"sırt, arka, geri","en":"My back hurts after carrying heavy boxes.","entr":"Ağır kutuları taşıdıktan sonra sırtım ağrıyor.","ipa":"/bæk/","tip":"Futboldaki 'bek' (arka savunma) oyuncuları buradan gelir."},{"id":"bad","word":"bad","pos":"adjective","tr":"kötü","en":"We stayed home because of bad weather.","entr":"Kötü hava yüzünden evde kaldık.","ipa":"/bæd/","tip":"Bad → worse → worst. Zıttı 'good'."},{"id":"bag","word":"bag","pos":"noun","tr":"çanta, poşet","en":"She put her books into the bag.","entr":"Kitaplarını çantanın içine koydu.","ipa":"/bæɡ/","tip":"Handbag = el çantası, schoolbag = okul çantası."},{"id":"baggage","word":"baggage","pos":"noun","tr":"bagaj, valiz, eşya","en":"We waited for our baggage at the airport.","entr":"Havalimanında bagajımızı bekledik.","ipa":"/ˈbæɡ.ɪdʒ/","tip":"Türkçedeki 'bagaj' kelimesiyle aynıdır."},{"id":"balcony","word":"balcony","pos":"noun","tr":"balkon","en":"We drink tea on the balcony every evening.","entr":"Her akşam balkonda çay içeriz.","ipa":"/ˈbæl.kə.ni/","tip":"Türkçedeki 'balkon' kelimesiyle aynıdır."},{"id":"ball","word":"ball","pos":"noun","tr":"top","en":"The children played with a red ball.","entr":"Çocuklar kırmızı bir topla oynadı.","ipa":"/bɔːl/","tip":"Football (futbol) ve basketball (basketbol) kelimelerindeki 'ball' (top)."},{"id":"balloon","word":"balloon","pos":"noun","tr":"balon","en":"The child held a yellow balloon.","entr":"Çocuk sarı bir balon tuttu.","ipa":"/bəˈluːn/","tip":"Türkçedeki 'balon' kelimesiyle aynıdır."},{"id":"banana","word":"banana","pos":"noun","tr":"muz","en":"I eat a banana before morning exercise.","entr":"Sabah egzersizinden önce bir muz yerim.","ipa":"/bəˈnɑː.nə/","tip":"Üç 'a': b-a-n-a-n-a. Muzlar sarıdır: Bananas are yellow."},{"id":"bandage","word":"bandage","pos":"noun","tr":"bandaj, sargı bezi","en":"The nurse put a bandage on his knee.","entr":"Hemşire onun dizine bir bandaj sardı.","ipa":"/ˈbæn.dɪdʒ/","tip":"Türkçedeki 'bandaj' kelimesiyle aynıdır."},{"id":"bank","word":"bank","pos":"noun","tr":"banka","en":"I need to get money from the bank.","entr":"Bankadan para çekmem gerekiyor.","ipa":"/bæŋk/","tip":"Türkçedeki 'banka' kelimesiyle aynıdır."},{"id":"bar","word":"bar","pos":"noun","tr":"bar, kalıp","en":"She bought a bar of dark chocolate.","entr":"Bir kalıp bitter çikolata satın aldı.","ipa":"/bɑːr/","tip":"Chocolate bar = çikolata kalıbı. Mekân olarak bar da demektir."},{"id":"barber","word":"barber","pos":"noun","tr":"berber","en":"My father goes to the barber on Saturdays.","entr":"Babam cumartesi günleri berbere gider.","ipa":"/ˈbɑː.bər/","tip":"Türkçedeki 'berber' kelimesiyle aynıdır."},{"id":"base","word":"base","pos":"noun","tr":"taban, temel, üs","en":"The lamp has a heavy metal base.","entr":"Lambanın ağır bir metal tabanı var.","ipa":"/beɪs/","tip":"Türkçedeki 'baz' (temel almak, baz almak) kelimesidir."},{"id":"basic","word":"basic","pos":"adjective","tr":"temel, basit","en":"Rice and bread are basic foods.","entr":"Pirinç ve ekmek temel gıdalardır.","ipa":"/ˈbeɪ.sɪk/","tip":"Base (temel) kelimesinden türemiştir; basic = temel."},{"id":"basket","word":"basket","pos":"noun","tr":"sepet","en":"Put the fresh eggs into the basket.","entr":"Taze yumurtaları sepetin içine koy.","ipa":"/ˈbɑː.skɪt/","tip":"Basketbol (sepet topu) kelimesindeki 'sepet' demektir."},{"id":"basketball","word":"basketball","pos":"noun","tr":"basketbol","en":"They play basketball in the school garden.","entr":"Okul bahçesinde basketbol oynuyorlar.","ipa":"/ˈbɑː.skɪt.bɔːl/","tip":"Türkçedeki 'basketbol' kelimesiyle aynıdır."},{"id":"bathroom","word":"bathroom","pos":"noun","tr":"banyo","en":"I wash my hands in the bathroom.","entr":"Ellerimi banyoda yıkarım.","ipa":"/ˈbɑːθ.ruːm/","tip":"Bath (banyo/yıkanma) + room (oda) = banyo odası."},{"id":"be","word":"be","pos":"verb","tr":"olmak","en":"Please be quiet in the library.","entr":"Lütfen kütüphanede sessiz olun.","ipa":"/biː/","tip":"I am, you are, he is: hepsi 'be' fiilinin hâlleridir."},{"id":"bear","word":"bear","pos":"noun","tr":"ayı","en":"A brown bear eats fish and honey.","entr":"Boz ayı balık ve bal yer.","ipa":"/beər/","tip":"Oyuncak ayı 'Teddy Bear' ifadesinden hatırlanabilir."},{"id":"beautiful","word":"beautiful","pos":"adjective","tr":"güzel","en":"There are beautiful flowers in the park.","entr":"Parkta güzel çiçekler var.","ipa":"/ˈbjuː.tɪ.fəl/","tip":"Beauty (güzellik) + -ful (dolu) = güzellik dolu."},{"id":"became","word":"became","pos":"verb","tr":"oldu (become fiilinin geçmiş zamanı)","en":"The weather became cold in the evening.","entr":"Akşam hava soğudu.","ipa":"/bɪˈkeɪm/","tip":"Become → became → become."},{"id":"because","word":"because","pos":"conjunction","tr":"çünkü, -dığı için","en":"I drank water because I was thirsty.","entr":"Su içtim çünkü susamıştım.","ipa":"/bɪˈkɒz/","tip":"Bir sonucun nedenini açıklar: I'm happy because it's Friday."},{"id":"become","word":"become","pos":"verb","tr":"olmak, haline gelmek","en":"She wants to become a good doctor.","entr":"İyi bir doktor olmak istiyor.","ipa":"/bɪˈkʌm/","tip":"Become → became → become. 'I want to become a doctor.'"},{"id":"bed","word":"bed","pos":"noun","tr":"yatak","en":"I go to bed at eleven o'clock.","entr":"Saat on birde yatağa giderim.","ipa":"/bed/","tip":"'Go to bed' = yatmak. Bedroom = yatak odası."},{"id":"bedroom","word":"bedroom","pos":"noun","tr":"yatak odası","en":"The bedroom has a large window.","entr":"Yatak odasının geniş bir penceresi var.","ipa":"/ˈbed.ruːm/","tip":"Bed (yatak) + room (oda) = yatak odası."},{"id":"been","word":"been","pos":"verb","tr":"olmuş, bulunmuş (be fiilinin 3. hali)","en":"Have you ever been to Ankara?","entr":"Hiç Ankara'ya gittin mi?","ipa":"/biːn/","tip":"Be → was/were → been. 'Have you ever been to Izmir?'"},{"id":"before","word":"before","pos":"preposition","tr":"önce, -den önce","en":"Wash your hands before dinner.","entr":"Akşam yemeğinden önce ellerini yıka.","ipa":"/bɪˈfɔːr/","tip":"Öncesi-sonrası fotoğraflarındaki 'Before / After' ifadesi."},{"id":"began","word":"began","pos":"verb","tr":"başladı (begin fiilinin geçmiş zamanı)","en":"The movie began ten minutes ago.","entr":"Film on dakika önce başladı.","ipa":"/bɪˈɡæn/","tip":"Begin → began → begun."},{"id":"begin","word":"begin","pos":"verb","tr":"başlamak","en":"Lessons begin at nine every morning.","entr":"Dersler her sabah dokuzda başlar.","ipa":"/bɪˈɡɪn/","tip":"Begin → began → begun. 'Start' ile aynı anlam."},{"id":"beginning","word":"beginning","pos":"noun","tr":"başlangıç, baş","en":"We missed the beginning of the concert.","entr":"Konserin başlangıcını kaçırdık.","ipa":"/bɪˈɡɪn.ɪŋ/","tip":"Begin (başlamak) fiilinden türeyen 'başlangıç' ismi."},{"id":"begun","word":"begun","pos":"verb","tr":"başlamış (begin fiilinin 3. hali)","en":"The rain has already begun outside.","entr":"Dışarıda yağmur çoktan başladı.","ipa":"/bɪˈɡʌn/","tip":"Begin → began → begun. 'Has/have' ile: The film has begun."},{"id":"behind","word":"behind","pos":"preposition","tr":"arkasında, gerisinde","en":"The car is parked behind the house.","entr":"Araba evin arkasına park edilmiş.","ipa":"/bɪˈhaɪnd/","tip":"Zıttı 'in front of' (önünde)."},{"id":"believe","word":"believe","pos":"verb","tr":"inanmak","en":"I believe your story is true.","entr":"Hikayenin doğru olduğuna inanıyorum.","ipa":"/bɪˈliːv/","tip":"Yazım: 'i' 'e'den önce gelir: bel-ie-ve."},{"id":"best","word":"best","pos":"adjective","tr":"en iyi","en":"Ali is my best friend at work.","entr":"Ali iş yerindeki en iyi arkadaşımdır.","ipa":"/best/","tip":"Good → better → best: iyi → daha iyi → en iyi."},{"id":"bet","word":"bet","pos":"verb","tr":"bahse girmek, iddiaya girmek","en":"I bet our team will win tonight.","entr":"Bahse girerim bu akşam bizim takım kazanacak.","ipa":"/bet/","tip":"Bet → bet → bet. 'I bet...' = eminim ki, bahse girerim."},{"id":"better","word":"better","pos":"adjective","tr":"daha iyi","en":"Fresh fruit is better than candy.","entr":"Taze meyve şekerden daha iyidir.","ipa":"/ˈbet.ər/","tip":"Good → better → best. 'Get better' = iyileşmek."},{"id":"between","word":"between","pos":"preposition","tr":"arasında (iki şeyin)","en":"Sit between your mother and father.","entr":"Annenle babanın arasına otur.","ipa":"/bɪˈtwiːn/","tip":"İçindeki 'tw' harfleri 'two' (iki) kişi/şey arasını hatırlatır."},{"id":"big","word":"big","pos":"adjective","tr":"büyük, iri","en":"They live in a big white house.","entr":"Büyük beyaz bir evde yaşıyorlar.","ipa":"/bɪɡ/","tip":"Big → bigger → biggest (g harfi ikiye katlanır)."},{"id":"bill","word":"bill","pos":"noun","tr":"fatura, hesap","en":"The waiter brought the dinner bill.","entr":"Garson akşam yemeği hesabını getirdi.","ipa":"/bɪl/","tip":"Restoranda 'Can I have the bill, please?' = Hesabı alabilir miyim?"},{"id":"bird","word":"bird","pos":"noun","tr":"kuş","en":"A small bird sang in the tree.","entr":"Ağaçta küçük bir kuş öttü.","ipa":"/bɜːd/","tip":"Kuş; erken kalkan için: The early bird catches the worm."},{"id":"birthday","word":"birthday","pos":"noun","tr":"doğum günü","en":"We baked a cake for her birthday.","entr":"Onun doğum günü için pasta pişirdik.","ipa":"/ˈbɜːθ.deɪ/","tip":"Birth (doğum) + day (gün) = doğum günü."},{"id":"biscuit","word":"biscuit","pos":"noun","tr":"bisküvi","en":"He ate a biscuit with his tea.","entr":"Çayıyla birlikte bir bisküvi yedi.","ipa":"/ˈbɪs.kɪt/","tip":"Türkçedeki 'bisküvi' kelimesiyle aynıdır."},{"id":"bit","word":"bit","pos":"noun","tr":"parça, biraz","en":"Add a little bit of milk.","entr":"Birazcık süt ekle.","ipa":"/bɪt/","tip":"Bilgisayardaki en küçük veri parçası 'bit'tir."},{"id":"bite","word":"bite","pos":"verb","tr":"ısırmak","en":"Friendly dogs do not bite people.","entr":"Uysal köpekler insanları ısırmaz.","ipa":"/baɪt/","tip":"Bite → bit → bitten. 'Have a bite' = bir ısırık al."},{"id":"black","word":"black","pos":"adjective","tr":"siyah, kara","en":"He wears a black coat in winter.","entr":"Kışın siyah bir palto giyer.","ipa":"/blæk/","tip":"Zıttı 'white'. Blackboard = kara tahta."},{"id":"blackboard","word":"blackboard","pos":"noun","tr":"kara tahta, yazı tahtası","en":"The teacher wrote the date on the blackboard.","entr":"Öğretmen kara tahtaya tarihi yazdı.","ipa":"/ˈblæk.bɔːd/","tip":"Black (siyah/kara) + board (tahta) = kara tahta."},{"id":"blanket","word":"blanket","pos":"noun","tr":"battaniye","en":"Put a warm blanket on the bed.","entr":"Yatağın üzerine sıcak bir battaniye koy.","ipa":"/ˈblæŋ.kɪt/","tip":"Kışın üstümüze örttüğümüz battaniye."},{"id":"blood","word":"blood","pos":"noun","tr":"kan","en":"The nurse took a small blood sample.","entr":"Hemşire küçük bir kan örneği aldı.","ipa":"/blʌd/","tip":"'oo' burada /ʌ/ okunur: /blʌd/."},{"id":"blue","word":"blue","pos":"adjective","tr":"mavi","en":"The sky is clear and blue today.","entr":"Bugün gökyüzü açık ve mavi.","ipa":"/bluː/","tip":"'Bluetooth' simgesi mavi renklidir."},{"id":"board","word":"board","pos":"noun","tr":"tahta, pano, kurul","en":"Read the notices on the wooden board.","entr":"Ahşap panodaki duyuruları oku.","ipa":"/bɔːd/","tip":"Whiteboard = beyaz tahta, blackboard = kara tahta."},{"id":"boat","word":"boat","pos":"noun","tr":"tekne, kayık","en":"We crossed the lake in a small boat.","entr":"Küçük bir tekneyle gölü geçtik.","ipa":"/bəʊt/","tip":"Türkçede deniz taşıtı anlamında kullanılan 'bot' kelimesidir."},{"id":"body","word":"body","pos":"noun","tr":"vücut, beden","en":"Regular exercise is good for your body.","entr":"Düzenli egzersiz vücudunuz için iyidir.","ipa":"/ˈbɒd.i/","tip":"Spor salonlarındaki 'body' (vücut geliştirme) sözünden hatırlanabilir."},{"id":"book","word":"book","pos":"noun","tr":"kitap","en":"I read a good book before sleep.","entr":"Uyumadan önce iyi bir kitap okurum.","ipa":"/bʊk/","tip":"Notebook (not defteri) ve Facebook kelimelerindeki 'kitap'."},{"id":"bookshop","word":"bookshop","pos":"noun","tr":"kitapçı, kitabevi","en":"She bought a dictionary from the bookshop.","entr":"Kitapçıdan bir sözlük satın aldı.","ipa":"/ˈbʊk.ʃɒp/","tip":"Book (kitap) + shop (dükkan/mağaza) = kitapçı."},{"id":"born","word":"born","pos":"verb","tr":"doğmuş, dünyaya gelmiş","en":"My sister was born in May.","entr":"Kız kardeşim Mayıs ayında doğdu.","ipa":"/bɔːn/","tip":"'I was born in 2010' = 2010'da doğdum. 'Was/were' ile kullanılır."},{"id":"both","word":"both","pos":"determiner","tr":"her ikisi, ikisi de","en":"Hold the hot pot with both hands.","entr":"Sıcak tencereyi iki elinle birden tut.","ipa":"/bəʊθ/","tip":"İkisi birden: both of my parents (annem ve babamın ikisi de)."},{"id":"bottle","word":"bottle","pos":"noun","tr":"şişe","en":"Put a bottle of water in the fridge.","entr":"Buzdolabına bir şişe su koy.","ipa":"/ˈbɒt.əl/","tip":"A bottle of water = bir şişe su."},{"id":"bottom","word":"bottom","pos":"noun","tr":"dip, alt, taban","en":"Sign your name at the bottom of the page.","entr":"Sayfanın alt kısmına adını imzala.","ipa":"/ˈbɒt.əm/","tip":"Zıttı 'top' (tepe)."},{"id":"bought","word":"bought","pos":"verb","tr":"satın aldı (buy fiilinin geçmiş zamanı)","en":"We bought fresh bread this morning.","entr":"Bu sabah taze ekmek satın aldık.","ipa":"/bɔːt/","tip":"Buy → bought → bought. 'gh' okunmaz."},{"id":"box","word":"box","pos":"noun","tr":"kutu","en":"Keep your old photos in this box.","entr":"Eski fotoğraflarını bu kutuda sakla.","ipa":"/bɒks/","tip":"Çoğulu -es alır: boxes."},{"id":"boxer","word":"boxer","pos":"noun","tr":"boksör","en":"The young boxer trained every morning.","entr":"Genç boksör her sabah antrenman yaptı.","ipa":"/ˈbɒk.sər/","tip":"Türkçedeki 'boksör' kelimesiyle aynıdır."},{"id":"boy","word":"boy","pos":"noun","tr":"erkek çocuk, oğlan","en":"The tall boy carried the shopping bags.","entr":"Uzun boylu erkek çocuk alışveriş poşetlerini taşıdı.","ipa":"/bɔɪ/","tip":"Kovboy (cowboy) kelimesindeki 'boy' (delikanlı/çocuk)."},{"id":"branch","word":"branch","pos":"noun","tr":"dal, şube","en":"A bird sat on the tree branch.","entr":"Bir kuş ağaç dalına kondu.","ipa":"/brɑːntʃ/","tip":"Türkçedeki 'branş' (kol/dal/uzmanlık alanı) kelimesiyle aynı köktendir."},{"id":"bread","word":"bread","pos":"noun","tr":"ekmek","en":"She sliced the warm bread for breakfast.","entr":"Kahvaltı için sıcak ekmeği dilimledi.","ipa":"/bred/","tip":"'ea' burada /e/ okunur: /bred/."},{"id":"break","word":"break","pos":"verb","tr":"kırmak, mola vermek","en":"Be careful, do not break the glass.","entr":"Dikkatli ol, bardağı kırma.","ipa":"/breɪk/","tip":"Break → broke → broken. Okulda 'break time' = teneffüs."},{"id":"breakfast","word":"breakfast","pos":"noun","tr":"kahvaltı","en":"We eat cheese and olives for breakfast.","entr":"Kahvaltıda peynir ve zeytin yeriz.","ipa":"/ˈbrek.fəst/","tip":"Break (bozmak) + fast (oruç): gece açlığını bozan öğün."},{"id":"bring","word":"bring","pos":"verb","tr":"getirmek","en":"Please bring two clean plates from the kitchen.","entr":"Lütfen mutfaktan iki temiz tabak getir.","ipa":"/brɪŋ/","tip":"Bring → brought → brought. Bring = getirmek, take = götürmek."},{"id":"broke","word":"broke","pos":"verb","tr":"kırdı (break fiilinin geçmiş zamanı)","en":"He broke his glasses yesterday evening.","entr":"Dün akşam gözlüğünü kırdı.","ipa":"/brəʊk/","tip":"Break → broke → broken."},{"id":"broken","word":"broken","pos":"adjective","tr":"kırık, bozuk","en":"Do not sit on that broken chair.","entr":"O kırık sandalyeye oturma.","ipa":"/ˈbrəʊ.kən/","tip":"Break (kırmak) fiilinden türeyen 'kırık' sıfatı."},{"id":"brother","word":"brother","pos":"noun","tr":"erkek kardeş, ağabey","en":"My brother works at a bank.","entr":"Erkek kardeşim bir bankada çalışıyor.","ipa":"/ˈbrʌð.ər/","tip":"Yazıcı markası 'Brother' veya 'birader' sözünden hatırlanabilir."},{"id":"brought","word":"brought","pos":"verb","tr":"getirdi (bring fiilinin geçmiş zamanı)","en":"The postman brought a package today.","entr":"Postacı bugün bir paket getirdi.","ipa":"/brɔːt/","tip":"Bring → brought → brought. 'gh' okunmaz."},{"id":"brown","word":"brown","pos":"adjective","tr":"kahverengi","en":"She wore a pair of brown shoes.","entr":"Bir çift kahverengi ayakkabı giydi.","ipa":"/braʊn/","tip":"Çikolatalı kek 'browni' (brownie) kahverengidir."},{"id":"brush","word":"brush","pos":"noun","tr":"fırça, fırçalamak","en":"Clean the shoes with a soft brush.","entr":"Ayakkabıları yumuşak bir fırçayla temizle.","ipa":"/brʌʃ/","tip":"Toothbrush = diş fırçası, hairbrush = saç fırçası."},{"id":"bucket","word":"bucket","pos":"noun","tr":"kova","en":"Fill the plastic bucket with cold water.","entr":"Plastik kovayı soğuk suyla doldur.","ipa":"/ˈbʌk.ɪt/","tip":"Plajda kum oynarken: bucket and spade (kova ve kürek)."},{"id":"build","word":"build","pos":"verb","tr":"inşa etmek, kurmak","en":"They want to build a new school here.","entr":"Buraya yeni bir okul inşa etmek istiyorlar.","ipa":"/bɪld/","tip":"Build → built → built. 'u' okunmaz: /bɪld/."},{"id":"building","word":"building","pos":"noun","tr":"bina, yapı","en":"The post office is in that tall building.","entr":"Postane şu yüksek binanın içindedir.","ipa":"/ˈbɪl.dɪŋ/","tip":"Build (inşa etmek) fiilinden türeyen 'bina/yapı' ismi."},{"id":"built","word":"built","pos":"verb","tr":"inşa etti (build fiilinin geçmiş zamanı)","en":"My grandfather built this stone house.","entr":"Bu taş evi dedem inşa etti.","ipa":"/bɪlt/","tip":"Build → built → built."},{"id":"bus","word":"bus","pos":"noun","tr":"otobüs","en":"I go to work by bus every day.","entr":"Her gün işe otobüsle giderim.","ipa":"/bʌs/","tip":"Türkçedeki 'otobüs' ve 'minibüs' kelimelerinin son eki."},{"id":"business","word":"business","pos":"noun","tr":"iş, ticaret","en":"They opened a small family business.","entr":"Küçük bir aile işletmesi açtılar.","ipa":"/ˈbɪz.nɪs/","tip":"Uçaklardaki 'Business Class' (iş/ticaret sınıfı) bölümünden hatırlanabilir."},{"id":"businessman","word":"businessman","pos":"noun","tr":"iş adamı","en":"The businessman travelled to London for a meeting.","entr":"İş adamı bir toplantı için Londra'ya seyahat etti.","ipa":"/ˈbɪz.nɪs.mən/","tip":"Business (iş) + man (adam) = iş adamı."},{"id":"busy","word":"busy","pos":"adjective","tr":"meşgul, yoğun, işlek","en":"The main street is very busy today.","entr":"Ana cadde bugün çok işlek.","ipa":"/ˈbɪz.i/","tip":"'u' burada /ɪ/ okunur: /ˈbɪz.i/. Business (iş) aynı kökten."},{"id":"but","word":"but","pos":"conjunction","tr":"ama, fakat, ancak","en":"The car is old, but it runs well.","entr":"Araba eski ama iyi çalışıyor.","ipa":"/bʌt/","tip":"Zıt iki fikri bağlar: small but strong."},{"id":"butcher's","word":"butcher's","pos":"noun","tr":"kasap dükkanı","en":"I bought fresh meat from the butcher's.","entr":"Kasaptan taze et satın aldım.","ipa":"/ˈbʊtʃ.əz/","tip":"Butcher (kasap) + 's: kasabın dükkânı."},{"id":"butter","word":"butter","pos":"noun","tr":"tereyağı","en":"Spread some butter on the warm toast.","entr":"Sıcak kızarmış ekmeğin üzerine biraz tereyağı sür.","ipa":"/ˈbʌt.ər/","tip":"Butter (tereyağı) ile 'better' (daha iyi) karıştırma."},{"id":"buy","word":"buy","pos":"verb","tr":"satın almak","en":"Where can I buy a train ticket?","entr":"Nereden tren bileti satın alabilirim?","ipa":"/baɪ/","tip":"Buy → bought → bought. Zıttı 'sell'."},{"id":"by","word":"by","pos":"preposition","tr":"ile, tarafından, yanında","en":"We sat by the window and drank tea.","entr":"Pencerenin yanında oturduk ve çay içtik.","ipa":"/baɪ/","tip":"'By bus/by car' = otobüsle/arabayla."},{"id":"bye","word":"bye","pos":"interjection","tr":"hoşça kal, güle güle","en":"She waved her hand and said bye.","entr":"El salladı ve hoşça kal dedi.","ipa":"/baɪ/","tip":"Günlük hayatta da vedalaşırken kullandığımız 'bay bay' ifadesidir."},{"id":"cafe","word":"cafe","pos":"noun","tr":"kafe, kahvehane","en":"Let us meet at the corner cafe.","entr":"Köşedeki kafede buluşalım.","ipa":"/ˈkæf.eɪ/","tip":"Türkçedeki 'kafe' kelimesiyle aynıdır."},{"id":"cafeteria","word":"cafeteria","pos":"noun","tr":"kafeterya, yemekhane","en":"Students eat lunch in the school cafeteria.","entr":"Öğrenciler öğle yemeğini okul kafeteryasında yer.","ipa":"/ˌkæf.əˈtɪə.ri.ə/","tip":"Türkçedeki 'kafeterya' kelimesiyle aynıdır."},{"id":"cake","word":"cake","pos":"noun","tr":"pasta, kek","en":"My mother made a delicious lemon cake.","entr":"Annem lezzetli bir limonlu kek yaptı.","ipa":"/keɪk/","tip":"Türkçedeki 'kek' kelimesiyle aynıdır."},{"id":"calendar","word":"calendar","pos":"noun","tr":"takvim","en":"Mark the meeting date on the wall calendar.","entr":"Toplantı tarihini duvar takviminde işaretle.","ipa":"/ˈkæl.ən.dər/","tip":"Duvardaki takvim; Türkçede de 'kalendar' olarak bilinir."},{"id":"call","word":"call","pos":"verb","tr":"aramak, çağırmak, adlandırmak","en":"I will call my mother this evening.","entr":"Bu akşam annemi telefonla arayacağım.","ipa":"/kɔːl/","tip":"'Call center' (çağrı merkezi) ifadesinden hatırlanabilir."},{"id":"came","word":"came","pos":"verb","tr":"geldi (come fiilinin geçmiş zamanı)","en":"Our guests came at seven o'clock.","entr":"Misafirlerimiz saat yedide geldi.","ipa":"/keɪm/","tip":"Come → came → come."},{"id":"camera","word":"camera","pos":"noun","tr":"kamera, fotoğraf makinesi","en":"Take a photo with your new camera.","entr":"Yeni fotoğraf makinenle bir fotoğraf çek.","ipa":"/ˈkæm.rə/","tip":"Türkçedeki 'kamera' kelimesiyle aynıdır."},{"id":"can","word":"can","pos":"verb","tr":"-ebilmek, yapabilmek","en":"He can swim very well in the sea.","entr":"O denizde çok iyi yüzebilir.","ipa":"/kæn/","tip":"Yetenek ve izin: I can swim. Can I go?"},{"id":"candle","word":"candle","pos":"noun","tr":"mum","en":"She lit a white candle on the table.","entr":"Masanın üzerinde beyaz bir mum yaktı.","ipa":"/ˈkæn.dəl/","tip":"Türkçedeki 'kandil' kelimesine benzer."},{"id":"candy","word":"candy","pos":"noun","tr":"şeker, şekerleme","en":"The child ate a piece of sweet candy.","entr":"Çocuk bir parça tatlı şeker yedi.","ipa":"/ˈkæn.di/","tip":"Popüler telefon oyunu 'Candy Crush' (Şeker Patlatma)."},{"id":"cap","word":"cap","pos":"noun","tr":"şapka, kep, kapak","en":"He wore a blue cap in the sun.","entr":"Güneşte mavi bir şapka taktı.","ipa":"/kæp/","tip":"Türkçede de şapka anlamında kullanılan 'kep' kelimesidir."},{"id":"capital","word":"capital","pos":"noun","tr":"başkent, büyük harf, sermaye","en":"Ankara is the capital of Turkey.","entr":"Ankara Türkiye'nin başkentidir.","ipa":"/ˈkæp.ɪ.təl/","tip":"Ankara is the capital of Türkiye. Capital letter = büyük harf."},{"id":"car","word":"car","pos":"noun","tr":"araba, otomobil","en":"My father washed his car on Sunday.","entr":"Babam pazar günü arabasını yıkadı.","ipa":"/kɑːr/","tip":"Car park = otopark."},{"id":"card","word":"card","pos":"noun","tr":"kart","en":"You can pay the bill by card.","entr":"Hesabı kartla ödeyebilirsiniz.","ipa":"/kɑːd/","tip":"Türkçedeki 'kart' (kredi kartı, tebrik kartı) kelimesidir."},{"id":"care","word":"care","pos":"noun","tr":"bakım, özen, ilgi","en":"This plant needs special care in winter.","entr":"Bu bitkinin kışın özel bakıma ihtiyacı var.","ipa":"/keər/","tip":"Şampuan ve kremlerdeki 'Hair Care / Skin Care' (saç/cilt bakımı) ifadesi."},{"id":"careful","word":"careful","pos":"adjective","tr":"dikkatli, özenli","en":"Be careful when you cross the road.","entr":"Yoldan karşıya geçerken dikkatli ol.","ipa":"/ˈkeə.fəl/","tip":"Care (özen/dikkat) + full (dolu) = dikkat dolu, dikkatli."},{"id":"carpet","word":"carpet","pos":"noun","tr":"halı","en":"We bought a new carpet for the living room.","entr":"Oturma odası için yeni bir halı aldık.","ipa":"/ˈkɑː.pɪt/","tip":"Türk halısı: Turkish carpet."},{"id":"carrot","word":"carrot","pos":"noun","tr":"havuç","en":"She put a grated carrot into the salad.","entr":"Salatanın içine rendelenmiş bir havuç koydu.","ipa":"/ˈkær.ət/","tip":"Tavşanların en sevdiği sebze: havuç."},{"id":"carry","word":"carry","pos":"verb","tr":"taşımak","en":"Can you help me carry this heavy bag?","entr":"Bu ağır çantayı taşımama yardım edebilir misin?","ipa":"/ˈkær.i/","tip":"Carry → carried. Ağır bir şeyi yanında taşımak."},{"id":"case","word":"case","pos":"noun","tr":"durum, kutu, kılıf","en":"Put your glasses back in their case.","entr":"Gözlüğünü tekrar kılıfına koy.","ipa":"/keɪs/","tip":"'In case' = ihtimaline karşı. Pencil case = kalem kutusu."},{"id":"cashier","word":"cashier","pos":"noun","tr":"kasiyer, vezne","en":"Pay the money to the supermarket cashier.","entr":"Parayı süpermarket kasiyerine öde.","ipa":"/kæʃˈɪər/","tip":"Türkçedeki 'kasiyer' kelimesiyle aynıdır."},{"id":"cassette","word":"cassette","pos":"noun","tr":"kaset","en":"My father still keeps his old music cassette.","entr":"Babam eski müzik kasetini hâlâ saklıyor.","ipa":"/kəˈset/","tip":"Türkçedeki 'kaset' kelimesiyle aynıdır."},{"id":"cat","word":"cat","pos":"noun","tr":"kedi","en":"The white cat slept on the warm sofa.","entr":"Beyaz kedi sıcak koltukta uyudu.","ipa":"/kæt/","tip":"Kedi yavrusu 'kitten'."},{"id":"catch","word":"catch","pos":"verb","tr":"yakalamak, yetişmek","en":"Run fast to catch the morning bus.","entr":"Sabah otobüsüne yetişmek için hızlı koş.","ipa":"/kætʃ/","tip":"Catch → caught → caught. 'Catch a cold' = soğuk algınlığına yakalanmak."},{"id":"caught","word":"caught","pos":"verb","tr":"yakaladı (catch fiilinin geçmiş zamanı)","en":"The goalkeeper caught the ball easily.","entr":"Kaleci topu kolayca yakaladı.","ipa":"/kɔːt/","tip":"Catch → caught → caught. 'gh' okunmaz."},{"id":"cause","word":"cause","pos":"noun","tr":"neden, sebep, sebep olmak","en":"Ice on the road can cause accidents.","entr":"Yoldaki buz kazalara neden olabilir.","ipa":"/kɔːz/","tip":"Because (çünkü/sebebiyle) kelimesinin içindeki 'cause' (sebep)."},{"id":"ceiling","word":"ceiling","pos":"noun","tr":"tavan","en":"A bright lamp hangs from the ceiling.","entr":"Tavandan parlak bir lamba sarkıyor.","ipa":"/ˈsiː.lɪŋ/","tip":"Odanın üstü tavan, altı 'floor' (zemin)."},{"id":"cell","word":"cell","pos":"noun","tr":"hücre","en":"Each cell in the body is very small.","entr":"Vücuttaki her hücre çok küçüktür.","ipa":"/sel/","tip":"Turkcell isminde olduğu gibi 'cell phone' (cep telefonu/hücresel telefon) buradan gelir."},{"id":"center","word":"center","pos":"noun","tr":"merkez, orta","en":"The hotel is in the city center.","entr":"Otel şehir merkezindedir.","ipa":"/ˈsen.tər/","tip":"Alışveriş merkezlerindeki 'Shopping Center' ifadesinden hatırlanabilir."},{"id":"centigrade","word":"centigrade","pos":"noun","tr":"santigrat (derece)","en":"Water boils at one hundred degrees centigrade.","entr":"Su yüz santigrat derecede kaynar.","ipa":"/ˈsen.tɪ.ɡreɪd/","tip":"Türkçedeki 'santigrat' derece kelimesiyle aynıdır."},{"id":"central","word":"central","pos":"adjective","tr":"merkezi, ana","en":"Our flat has central heating in winter.","entr":"Dairemizde kışın merkezi ısıtma vardır.","ipa":"/ˈsen.trəl/","tip":"Center (merkez) kelimesinden türemiştir; telefon 'santral'i de buradan gelir."},{"id":"century","word":"century","pos":"noun","tr":"yüzyıl, asır","en":"This stone bridge is one century old.","entr":"Bu taş köprü yüz yıllık.","ipa":"/ˈsen.tʃər.i/","tip":"Cent (yüz) kökünden: yüz yıl."},{"id":"certain","word":"certain","pos":"adjective","tr":"kesin, emin, belirli","en":"I am certain about the meeting time.","entr":"Toplantı saatinden eminim.","ipa":"/ˈsɜː.tən/","tip":"'I'm certain' = eminim. 'Sure' ile benzer."},{"id":"certainly","word":"certainly","pos":"adverb","tr":"kesinlikle, elbette","en":"I will certainly help you tomorrow.","entr":"Yarın sana kesinlikle yardım edeceğim.","ipa":"/ˈsɜː.tən.li/","tip":"Certain (emin/kesin) + -ly (zarf eki) = kesinlikle."},{"id":"chair","word":"chair","pos":"noun","tr":"sandalye","en":"Pull up a chair to the table.","entr":"Masanın yanına bir sandalye çek.","ipa":"/tʃeər/","tip":"Armchair = koltuk (kollu sandalye)."},{"id":"chalk","word":"chalk","pos":"noun","tr":"tebeşir","en":"The teacher took a piece of white chalk.","entr":"Öğretmen bir parça beyaz tebeşir aldı.","ipa":"/tʃɔːk/","tip":"'l' okunmaz: /tʃɔːk/. Kara tahtaya yazılır."},{"id":"chance","word":"chance","pos":"noun","tr":"şans, fırsat, ihtimal","en":"Give me one more chance to try.","entr":"Denemem için bana bir şans daha ver.","ipa":"/tʃɑːns/","tip":"Türkçedeki 'şans' kelimesiyle aynıdır."},{"id":"change","word":"change","pos":"verb","tr":"değiştirmek, değişmek, para üstü","en":"I want to change my wet shirt.","entr":"Islak gömleğimi değiştirmek istiyorum.","ipa":"/tʃeɪndʒ/","tip":"Döviz bürolarında 'Exchange' (para değiştirme) yazar."},{"id":"character","word":"character","pos":"noun","tr":"karakter, kişilik","en":"Who is the main character in this book?","entr":"Bu kitaptaki ana karakter kim?","ipa":"/ˈkær.ək.tər/","tip":"Türkçedeki 'karakter' kelimesiyle aynıdır."},{"id":"charge","word":"charge","pos":"verb","tr":"ücret almak, şarj etmek","en":"I need to charge my phone battery.","entr":"Telefonumun bataryasını şarj etmem gerekiyor.","ipa":"/tʃɑːdʒ/","tip":"Türkçedeki 'şarj' (doldurma) kelimesiyle aynıdır."},{"id":"cheap","word":"cheap","pos":"adjective","tr":"ucuz","en":"Fresh vegetables are cheap at the local market.","entr":"Semt pazarında taze sebzeler ucuzdur.","ipa":"/tʃiːp/","tip":"Zıttı 'expensive' (pahalı)."},{"id":"check","word":"check","pos":"verb","tr":"kontrol etmek","en":"Please check your answers before the end.","entr":"Bitirmeden önce lütfen cevaplarınızı kontrol edin.","ipa":"/tʃek/","tip":"Hastanedeki 'check-up' (genel sağlık kontrolü) sözünden hatırlanabilir."},{"id":"cheek","word":"cheek","pos":"noun","tr":"yanak","en":"The mother kissed the baby on the cheek.","entr":"Anne bebeği yanağından öptü.","ipa":"/tʃiːk/","tip":"Yüzün iki yanı; 'chick' (civciv) ile karıştırma."},{"id":"cheerful","word":"cheerful","pos":"adjective","tr":"neşeli, keyifli","en":"Our neighbour is always a cheerful person.","entr":"Komşumuz her zaman neşeli bir insandır.","ipa":"/ˈtʃɪə.fəl/","tip":"Cheer (neşe) + -ful (dolu) = neşe dolu."},{"id":"cheese","word":"cheese","pos":"noun","tr":"peynir","en":"I like eating white cheese at breakfast.","entr":"Kahvaltıda beyaz peynir yemeyi severim.","ipa":"/tʃiːz/","tip":"Fotoğraf çekilirken gülümsemek için 'Say cheese!' (peynir de) denir."},{"id":"cheeseburger","word":"cheeseburger","pos":"noun","tr":"çizburger, peynirli hamburger","en":"He ordered a hot cheeseburger for lunch.","entr":"Öğle yemeği için sıcak bir çizburger sipariş etti.","ipa":"/ˈtʃiːzˌbɜː.ɡər/","tip":"Cheese (peynir) + burger = peynirli burger (çizburger)."},{"id":"chemist's","word":"chemist's","pos":"noun","tr":"eczane","en":"Buy the medicine from the nearest chemist's.","entr":"İlacı en yakın eczaneden al.","ipa":"/ˈkem.ɪsts/","tip":"Kimyager (chemist) kelimesinden; ilaç hazırlanan yer, eczane."},{"id":"chess","word":"chess","pos":"noun","tr":"satranç","en":"My grandfather taught me how to play chess.","entr":"Dedem bana nasıl satranç oynanacağını öğretti.","ipa":"/tʃes/","tip":"Satranç taşları: king, queen, knight..."},{"id":"chicken","word":"chicken","pos":"noun","tr":"tavuk","en":"We cooked roast chicken and rice for dinner.","entr":"Akşam yemeği için fırında tavuk ve pilav pişirdik.","ipa":"/ˈtʃɪk.ɪn/","tip":"Hem hayvan hem tavuk eti 'chicken'."},{"id":"child","word":"child","pos":"noun","tr":"çocuk","en":"Every child likes playing in the park.","entr":"Her çocuk parkta oynamayı sever.","ipa":"/tʃaɪld/","tip":"Düzensiz çoğul: one child, two children."},{"id":"children","word":"children","pos":"noun","tr":"çocuklar","en":"The children are waiting for the school bus.","entr":"Çocuklar okul otobüsünü bekliyorlar.","ipa":"/ˈtʃɪl.drən/","tip":"Child (çocuk) kelimesinin çoğul halidir."},{"id":"chimney","word":"chimney","pos":"noun","tr":"baca","en":"Smoke rose from the house chimney.","entr":"Evin bacasından duman yükseldi.","ipa":"/ˈtʃɪm.ni/","tip":"Evin çatısındaki baca; Noel Baba buradan girer."},{"id":"chips","word":"chips","pos":"noun","tr":"patates kızartması, cips","en":"The children ate fish and hot chips.","entr":"Çocuklar balık ve sıcak patates kızartması yedi.","ipa":"/tʃɪps/","tip":"Türkçeye 'cips' olarak geçmiştir."},{"id":"chocolate","word":"chocolate","pos":"noun","tr":"çikolata","en":"She drank a cup of hot chocolate.","entr":"Bir fincan sıcak çikolata içti.","ipa":"/ˈtʃɒk.lət/","tip":"Türkçedeki 'çikolata' kelimesiyle aynıdır."},{"id":"choice","word":"choice","pos":"noun","tr":"seçim, tercih, seçenek","en":"Living near work is a good choice.","entr":"İş yerine yakın yaşamak iyi bir tercihtir.","ipa":"/tʃɔɪs/","tip":"Choose (seçmek) fiilinin isim halidir."},{"id":"choose","word":"choose","pos":"verb","tr":"seçmek","en":"You can choose any book from the shelf.","entr":"Raftan herhangi bir kitabı seçebilirsin.","ipa":"/tʃuːz/","tip":"Choose → chose → chosen."},{"id":"church","word":"church","pos":"noun","tr":"kilise","en":"There is an old stone church in the square.","entr":"Meydanda eski bir taş kilise var.","ipa":"/tʃɜːtʃ/","tip":"Hristiyanların ibadet yeri; cami 'mosque'."},{"id":"cigarette","word":"cigarette","pos":"noun","tr":"sigara","en":"The sign says no cigarette smoking inside.","entr":"Tabelada içeride sigara içilmez yazıyor.","ipa":"/ˌsɪɡ.ərˈet/","tip":"Türkçedeki 'sigara' kelimesiyle aynıdır."},{"id":"cinema","word":"cinema","pos":"noun","tr":"sinema","en":"We watch a film at the cinema.","entr":"Sinemada bir film izliyoruz.","ipa":"/ˈsɪn.ə.mə/","tip":"Türkçedeki 'sinema' ile aynıdır."},{"id":"city","word":"city","pos":"noun","tr":"şehir, kent","en":"Istanbul is a very big city.","entr":"İstanbul çok büyük bir şehirdir.","ipa":"/ˈsɪt.i/","tip":"Village < town < city. Kısaltması değil: city centre = şehir merkezi."},{"id":"claim","word":"claim","pos":"verb","tr":"talep etmek, iddia etmek","en":"Can I claim my lost bag here?","entr":"Kayıp çantamı buradan talep edebilir miyim?","ipa":"/kleɪm/","tip":"Bir şeyin doğru ya da senin olduğunu söylemek: claim your bag."},{"id":"class","word":"class","pos":"noun","tr":"sınıf, ders","en":"Our English class starts at nine.","entr":"İngilizce dersimiz dokuzda başlıyor.","ipa":"/klɑːs/","tip":"Hem sınıf (oda/öğrenciler) hem ders: English class."},{"id":"classroom","word":"classroom","pos":"noun","tr":"sınıf (oda)","en":"The classroom is warm and bright.","entr":"Sınıf sıcak ve aydınlık.","ipa":"/ˈklɑːs.ruːm/","tip":"Class (sınıf) + room (oda) = sınıf odası."},{"id":"clean","word":"clean","pos":"adjective","tr":"temiz","en":"Please keep your room clean.","entr":"Lütfen odanı temiz tut.","ipa":"/kliːn/","tip":"Zıttı 'dirty' (kirli)."},{"id":"clear","word":"clear","pos":"adjective","tr":"açık, net, berrak","en":"The water in the lake is clear.","entr":"Gölün suyu berrak.","ipa":"/klɪər/","tip":"Clear sky = açık gökyüzü. 'Is that clear?' = Anlaşıldı mı?"},{"id":"clearly","word":"clearly","pos":"adverb","tr":"açıkça, net olarak","en":"Please speak slowly and clearly.","entr":"Lütfen yavaş ve net konuş.","ipa":"/ˈklɪə.li/","tip":"Clear (net) + -ly = net bir şekilde."},{"id":"close","word":"close","pos":"verb","tr":"kapatmak","en":"Please close the door quietly.","entr":"Lütfen kapıyı sessizce kapat.","ipa":"/kləʊz/","tip":"Fiil /kləʊz/ (kapatmak); sıfat /kləʊs/ (yakın)."},{"id":"closed","word":"closed","pos":"adjective","tr":"kapalı","en":"The bank is closed on Sundays.","entr":"Banka pazar günleri kapalıdır.","ipa":"/kləʊzd/","tip":"Dükkân kapısında 'CLOSED' = kapalı. Zıttı 'open'."},{"id":"cloud","word":"cloud","pos":"noun","tr":"bulut","en":"A dark cloud covered the sun.","entr":"Koyu bir bulut güneşi kapattı.","ipa":"/klaʊd/","tip":"Cloudy = bulutlu."},{"id":"cloudy","word":"cloudy","pos":"adjective","tr":"bulutlu","en":"It is cloudy and cold today.","entr":"Bugün hava bulutlu ve soğuk.","ipa":"/ˈklaʊ.di/","tip":"Cloud (bulut) + -y = bulutlu."},{"id":"club","word":"club","pos":"noun","tr":"kulüp","en":"My brother joined a football club.","entr":"Erkek kardeşim bir futbol kulübüne katıldı.","ipa":"/klʌb/","tip":"Türkçedeki 'kulüp' ile aynıdır."},{"id":"coffee","word":"coffee","pos":"noun","tr":"kahve","en":"I drink coffee every morning.","entr":"Her sabah kahve içerim.","ipa":"/ˈkɒf.i/","tip":"'Kahve' ve 'coffee' aynı kökten gelir."},{"id":"coke","word":"coke","pos":"noun","tr":"kola","en":"He ordered a coke with his pizza.","entr":"Pizzasının yanında bir kola sipariş etti.","ipa":"/kəʊk/","tip":"Coca-Cola'nın kısa adı; günlük konuşmada kola."},{"id":"cola","word":"cola","pos":"noun","tr":"kola","en":"She poured cold cola into a glass.","entr":"Bardağa soğuk kola doldurdu.","ipa":"/ˈkəʊ.lə/","tip":"Kola içeceğinin genel adı."},{"id":"cold","word":"cold","pos":"adjective","tr":"soğuk","en":"The soup is cold now.","entr":"Çorba şimdi soğuk.","ipa":"/kəʊld/","tip":"Hem 'soğuk' hem 'soğuk algınlığı': I have a cold."},{"id":"collect","word":"collect","pos":"verb","tr":"toplamak, biriktirmek","en":"My son likes to collect old stamps.","entr":"Oğlum eski pulları biriktirmeyi sever.","ipa":"/kəˈlekt/","tip":"Türkçedeki 'koleksiyon' kelimesi buradandır."},{"id":"college","word":"college","pos":"noun","tr":"kolej, yüksekokul","en":"She studies art at college.","entr":"Yüksekokulda sanat okuyor.","ipa":"/ˈkɒl.ɪdʒ/","tip":"Türkçedeki 'kolej' ile aynı kökten; İngiltere'de lise sonrası okul."},{"id":"colour","word":"colour","pos":"noun","tr":"renk","en":"Red is my favourite colour.","entr":"Kırmızı benim en sevdiğim renk.","ipa":"/ˈkʌl.ər/","tip":"İngiliz yazımı 'colour', Amerikan yazımı 'color'."},{"id":"comb","word":"comb","pos":"noun","tr":"tarak","en":"Use a comb for your hair.","entr":"Saçın için bir tarak kullan.","ipa":"/kəʊm/","tip":"Sondaki 'b' harfi okunmaz."},{"id":"come","word":"come","pos":"verb","tr":"gelmek","en":"Please come to my house tomorrow.","entr":"Lütfen yarın evime gel.","ipa":"/kʌm/","tip":"Come → came → come. Zıttı 'go'."},{"id":"commission","word":"commission","pos":"noun","tr":"komisyon, kurul","en":"The salesman gets a small commission.","entr":"Satıcı küçük bir komisyon alır.","ipa":"/kəˈmɪʃ.ən/","tip":"Türkçedeki 'komisyon' ile aynıdır."},{"id":"community","word":"community","pos":"noun","tr":"topluluk, toplum","en":"Our community helps old people.","entr":"Topluluğumuz yaşlı insanlara yardım eder.","ipa":"/kəˈmjuː.nə.ti/","tip":"Common (ortak) kökünden: ortak şeyleri paylaşan topluluk."},{"id":"company","word":"company","pos":"noun","tr":"şirket","en":"He works for a large company.","entr":"Büyük bir şirkette çalışıyor.","ipa":"/ˈkʌm.pə.ni/","tip":"Türkçedeki 'kumpanya' ile aynı kökten: şirket."},{"id":"compare","word":"compare","pos":"verb","tr":"karşılaştırmak","en":"Compare the prices before you buy.","entr":"Almadan önce fiyatları karşılaştır.","ipa":"/kəmˈpeər/","tip":"'Compare A with B' = A'yı B ile karşılaştırmak."},{"id":"competition","word":"competition","pos":"noun","tr":"yarışma, rekabet","en":"She won the swimming competition.","entr":"Yüzme yarışmasını o kazandı.","ipa":"/ˌkɒm.pəˈtɪʃ.ən/","tip":"Compete (yarışmak) + -ition = yarışma."},{"id":"completely","word":"completely","pos":"adverb","tr":"tamamen","en":"The room was completely empty.","entr":"Oda tamamen boştu.","ipa":"/kəmˈpliːt.li/","tip":"Complete (tam) + -ly = tamamen."},{"id":"computer","word":"computer","pos":"noun","tr":"bilgisayar","en":"I use a computer at work.","entr":"İşte bir bilgisayar kullanırım.","ipa":"/kəmˈpjuː.tər/","tip":"Compute (hesaplamak) + -er: hesap yapan makine."},{"id":"concern","word":"concern","pos":"noun","tr":"endişe, kaygı","en":"Her health is a big concern.","entr":"Onun sağlığı büyük bir endişe.","ipa":"/kənˈsɜːn/","tip":"'It's not your concern' = seni ilgilendirmez."},{"id":"concerned","word":"concerned","pos":"adjective","tr":"endişeli, ilgili","en":"We are concerned about the weather.","entr":"Hava durumu konusunda endişeliyiz.","ipa":"/kənˈsɜːnd/","tip":"'Concerned about' = ...dan endişeli."},{"id":"condition","word":"condition","pos":"noun","tr":"durum, koşul","en":"The car is in good condition.","entr":"Araba iyi durumda.","ipa":"/kənˈdɪʃ.ən/","tip":"Türkçedeki 'kondisyon' ile aynı kökten: durum."},{"id":"consider","word":"consider","pos":"verb","tr":"düşünmek, göz önünde bulundurmak","en":"Consider all the choices before you decide.","entr":"Karar vermeden önce tüm seçenekleri düşün.","ipa":"/kənˈsɪd.ər/","tip":"Bir şeyi dikkatlice düşünmek: consider your options."},{"id":"continue","word":"continue","pos":"verb","tr":"devam etmek","en":"Please continue reading the story.","entr":"Lütfen hikayeyi okumaya devam et.","ipa":"/kənˈtɪn.juː/","tip":"Continue → continued. 'To be continued' = devam edecek."},{"id":"control","word":"control","pos":"noun","tr":"kontrol, kumanda","en":"Use the remote control for the television.","entr":"Televizyon için uzaktan kumandayı kullan.","ipa":"/kənˈtrəʊl/","tip":"Türkçedeki 'kontrol' ile aynıdır."},{"id":"conversation","word":"conversation","pos":"noun","tr":"konuşma, sohbet","en":"We had a long conversation yesterday.","entr":"Dün uzun bir sohbet ettik.","ipa":"/ˌkɒn.vəˈseɪ.ʃən/","tip":"Converse (sohbet etmek) + -ation = sohbet, konuşma."},{"id":"copy","word":"copy","pos":"noun","tr":"kopya, nüsha","en":"Make a copy of this page.","entr":"Bu sayfanın bir kopyasını çıkar.","ipa":"/ˈkɒp.i/","tip":"Türkçedeki 'kopya' ile aynıdır."},{"id":"corner","word":"corner","pos":"noun","tr":"köşe","en":"The shop is on the corner.","entr":"Dükkan köşede.","ipa":"/ˈkɔː.nər/","tip":"'On the corner' = köşede (sokakta)."},{"id":"cornflakes","word":"cornflakes","pos":"noun","tr":"mısır gevreği","en":"I eat cornflakes with milk.","entr":"Sütle mısır gevreği yerim.","ipa":"/ˈkɔːn.fleɪks/","tip":"Corn (mısır) + flakes (gevrek) = mısır gevreği."},{"id":"cost","word":"cost","pos":"noun","tr":"fiyat, maliyet","en":"What is the cost of this bag?","entr":"Bu çantanın fiyatı nedir?","ipa":"/kɒst/","tip":"Cost → cost → cost. 'How much does it cost?' = Ne kadar?"},{"id":"cottage","word":"cottage","pos":"noun","tr":"kır evi, küçük ev","en":"They have a small cottage by the sea.","entr":"Deniz kenarında küçük bir kır evleri var.","ipa":"/ˈkɒt.ɪdʒ/","tip":"Kırsalda küçük, şirin ev."},{"id":"cotton","word":"cotton","pos":"noun","tr":"pamuk","en":"This shirt is made of cotton.","entr":"Bu gömlek pamuktandır.","ipa":"/ˈkɒt.ən/","tip":"Pamuktan yapılan kıyafetler: cotton T-shirt."},{"id":"cough","word":"cough","pos":"verb","tr":"öksürmek","en":"I cough a lot at night.","entr":"Geceleri çok öksürürüm.","ipa":"/kɒf/","tip":"'gh' burada /f/ okunur: /kɒf/."},{"id":"could","word":"could","pos":"verb","tr":"-ebilirdi, -ebilir miyim (rica)","en":"Could you open the window, please?","entr":"Pencereyi açabilir misiniz lütfen?","ipa":"/kʊd/","tip":"Can'in geçmiş hâli; kibar istek: Could you help me?"},{"id":"count","word":"count","pos":"verb","tr":"saymak","en":"Count the apples on the table.","entr":"Masadaki elmaları say.","ipa":"/kaʊnt/","tip":"Sayı saymak: count from one to ten."},{"id":"country","word":"country","pos":"noun","tr":"ülke, kır","en":"Turkey is a beautiful country.","entr":"Türkiye güzel bir ülkedir.","ipa":"/ˈkʌn.tri/","tip":"Hem ülke hem kırsal bölge: live in the country."},{"id":"couple","word":"couple","pos":"noun","tr":"çift, birkaç","en":"The old couple walks every morning.","entr":"Yaşlı çift her sabah yürür.","ipa":"/ˈkʌp.əl/","tip":"Bir çift: a couple of days = birkaç gün."},{"id":"coupon","word":"coupon","pos":"noun","tr":"kupon","en":"I have a coupon for the cafe.","entr":"Kafe için bir kuponum var.","ipa":"/ˈkuː.pɒn/","tip":"Türkçedeki 'kupon' ile aynıdır."},{"id":"course","word":"course","pos":"noun","tr":"kurs, ders","en":"She is taking a cooking course.","entr":"O bir yemek kursuna gidiyor.","ipa":"/kɔːs/","tip":"Türkçedeki 'kurs' ile aynıdır. 'Of course' = tabii ki."},{"id":"court","word":"court","pos":"noun","tr":"kort, mahkeme","en":"They play tennis on the court.","entr":"Kortta tenis oynuyorlar.","ipa":"/kɔːt/","tip":"Tenis kortu da mahkeme de 'court'tur."},{"id":"cover","word":"cover","pos":"verb","tr":"örtmek, kaplamak, kapak","en":"Please cover the hot food with a plate.","entr":"Lütfen sıcak yemeğin üzerini bir tabakla ört.","ipa":"/ˈkʌv.ər/","tip":"M
