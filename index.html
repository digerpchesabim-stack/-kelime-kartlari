arkıcı","en":"Barış Manço was a famous singer.","entr":"Barış Manço ünlü bir şarkıcıydı.","ipa":"/ˈsɪŋ.ər/","tip":"Sing (şarkı söylemek) + -er = şarkıcı."},{"id":"single","word":"single","pos":"adjective","tr":"tek; bekâr","en":"I'd like a single room, please.","entr":"Tek kişilik bir oda istiyorum, lütfen.","ipa":"/ˈsɪŋ.ɡəl/","tip":"Single room = tek kişilik oda; single ticket = tek yön bilet."},{"id":"sister","word":"sister","pos":"noun","tr":"kız kardeş, abla","en":"My sister is older than me.","entr":"Ablam benden büyük.","ipa":"/ˈsɪs.tər/","tip":"İngilizcede abla ile kız kardeş için aynı kelime: sister."},{"id":"sit","word":"sit","pos":"verb","tr":"oturmak","en":"Please sit down.","entr":"Lütfen oturun.","ipa":"/sɪt/","tip":"Sit → sat → sat. 'Sit down' = otur."},{"id":"situation","word":"situation","pos":"noun","tr":"durum","en":"This is a difficult situation.","entr":"Bu zor bir durum.","ipa":"/ˌsɪtʃ.uˈeɪ.ʃən/","tip":"Türkçedeki 'situasyon' ile aynı kökten."},{"id":"size","word":"size","pos":"noun","tr":"beden, boyut","en":"What size are your shoes?","entr":"Ayakkabı numaran kaç?","ipa":"/saɪz/","tip":"Kıyafette S, M, L harfleri 'size'ı gösterir."},{"id":"ski","word":"ski","pos":"verb","tr":"kayak yapmak","en":"We go to Uludağ to ski in winter.","entr":"Kışın kayak yapmak için Uludağ'a gideriz.","ipa":"/skiː/","tip":"Türkçedeki 'kayak' anlamı; 'skiing' = kayak sporu."},{"id":"sleep","word":"sleep","pos":"verb","tr":"uyumak","en":"I sleep eight hours every night.","entr":"Her gece sekiz saat uyurum.","ipa":"/sliːp/","tip":"Sleep → slept → slept."},{"id":"sleepy","word":"sleepy","pos":"adjective","tr":"uykulu","en":"I feel sleepy after lunch.","entr":"Öğle yemeğinden sonra uykum geliyor.","ipa":"/ˈsliː.pi/","tip":"Sleep + -y = uykulu."},{"id":"small","word":"small","pos":"adjective","tr":"küçük","en":"We live in a small village.","entr":"Küçük bir köyde yaşıyoruz.","ipa":"/smɔːl/","tip":"Zıttı 'big' ya da 'large'."},{"id":"so","word":"so","pos":"adverb","tr":"çok; bu yüzden","en":"It was raining, so we stayed inside.","entr":"Yağmur yağıyordu, bu yüzden içeride kaldık.","ipa":"/səʊ/","tip":"'So' hem 'bu yüzden' hem de 'çok' demek: so happy."},{"id":"soccer","word":"soccer","pos":"noun","tr":"futbol","en":"In America, football is called soccer.","entr":"Amerika'da futbola 'soccer' denir.","ipa":"/ˈsɒk.ər/","tip":"İngiltere'de 'football', Amerika'da 'soccer'."},{"id":"society","word":"society","pos":"noun","tr":"toplum; dernek","en":"Teachers are important for society.","entr":"Öğretmenler toplum için önemlidir.","ipa":"/səˈsaɪ.ə.ti/","tip":"Social (sosyal) ile aynı kökten."},{"id":"sock","word":"sock","pos":"noun","tr":"çorap","en":"There is a hole in my sock.","entr":"Çorabımda bir delik var.","ipa":"/sɒk/","tip":"Genelde çift: a pair of socks."},{"id":"soft","word":"soft","pos":"adjective","tr":"yumuşak","en":"This pillow is very soft.","entr":"Bu yastık çok yumuşak.","ipa":"/sɒft/","tip":"Zıttı 'hard' (sert). Soft drink = alkolsüz içecek."},{"id":"sold","word":"sold","pos":"verb","tr":"sattı (sell fiilinin geçmiş hâli)","en":"We sold our old car last week.","entr":"Geçen hafta eski arabamızı sattık.","ipa":"/səʊld/","tip":"Sell → sold → sold. 'Sold out' = tükendi."},{"id":"some","word":"some","pos":"determiner","tr":"biraz, birkaç","en":"Would you like some tea?","entr":"Biraz çay ister misin?","ipa":"/sʌm/","tip":"Olumlu cümlede 'some', olumsuz ve soruda genelde 'any'."},{"id":"somebody","word":"somebody","pos":"pronoun","tr":"birisi","en":"Somebody is knocking at the door.","entr":"Birisi kapıyı çalıyor.","ipa":"/ˈsʌm.bə.di/","tip":"'Someone' ile aynı anlam."},{"id":"someone","word":"someone","pos":"pronoun","tr":"birisi","en":"Someone left a bag in the classroom.","entr":"Birisi sınıfta bir çanta bırakmış.","ipa":"/ˈsʌm.wʌn/","tip":"Some (bir) + one (kişi) = birisi."},{"id":"something","word":"something","pos":"pronoun","tr":"bir şey","en":"I want to tell you something.","entr":"Sana bir şey söylemek istiyorum.","ipa":"/ˈsʌm.θɪŋ/","tip":"Some + thing (şey) = bir şey."},{"id":"sometimes","word":"sometimes","pos":"adverb","tr":"bazen","en":"I sometimes cook dinner for my family.","entr":"Bazen ailem için akşam yemeği pişiririm.","ipa":"/ˈsʌm.taɪmz/","tip":"Some + times (kez) = bazı kezler, bazen."},{"id":"somewhere","word":"somewhere","pos":"adverb","tr":"bir yer, bir yerde","en":"I left my glasses somewhere.","entr":"Gözlüğümü bir yerde bıraktım.","ipa":"/ˈsʌm.weər/","tip":"Some + where (nerede) = bir yerde."},{"id":"son","word":"son","pos":"noun","tr":"oğul","en":"Their son is a doctor.","entr":"Oğulları doktor.","ipa":"/sʌn/","tip":"'Sun' (güneş) ile aynı okunur: /sʌn/."},{"id":"son-in-law","word":"son-in-law","pos":"noun","tr":"damat","en":"My aunt's son-in-law is from İzmir.","entr":"Teyzemin damadı İzmirli.","ipa":"/ˈsʌn.ɪn.lɔː/","tip":"Son + in law (yasaya göre) = evlilikle gelen oğul, damat."},{"id":"soon","word":"soon","pos":"adverb","tr":"yakında, birazdan","en":"See you soon!","entr":"Yakında görüşürüz!","ipa":"/suːn/","tip":"'As soon as possible' = mümkün olan en kısa sürede."},{"id":"sorry","word":"sorry","pos":"adjective","tr":"üzgün; özür dilerim","en":"Sorry, I'm late.","entr":"Özür dilerim, geç kaldım.","ipa":"/ˈsɒr.i/","tip":"'Sorry?' soru tonuyla 'Efendim, anlamadım?' demektir."},{"id":"sort","word":"sort","pos":"noun","tr":"tür, çeşit","en":"What sort of music do you like?","entr":"Ne tür müzik seversin?","ipa":"/sɔːt/","tip":"'Kind' ile aynı: what kind of = what sort of."},{"id":"sound","word":"sound","pos":"noun","tr":"ses","en":"I heard a strange sound outside.","entr":"Dışarıda garip bir ses duydum.","ipa":"/saʊnd/","tip":"Fiil olarak 'kulağa ... gelmek': That sounds good!"},{"id":"south","word":"south","pos":"noun","tr":"güney","en":"Antalya is in the south of Türkiye.","entr":"Antalya, Türkiye'nin güneyindedir.","ipa":"/saʊθ/","tip":"Pusulada S harfi 'south' demektir."},{"id":"space","word":"space","pos":"noun","tr":"uzay; boşluk, yer","en":"There is no space for another chair.","entr":"Bir sandalye daha için yer yok.","ipa":"/speɪs/","tip":"Klavyedeki uzun tuş 'space bar'dır."},{"id":"speak","word":"speak","pos":"verb","tr":"konuşmak","en":"Do you speak English?","entr":"İngilizce konuşuyor musun?","ipa":"/spiːk/","tip":"Speak → spoke → spoken. Dil için 'speak' kullanılır."},{"id":"special","word":"special","pos":"adjective","tr":"özel","en":"Today is a special day for me.","entr":"Bugün benim için özel bir gün.","ipa":"/ˈspeʃ.əl/","tip":"Özel eğitim = special education."},{"id":"specific","word":"specific","pos":"adjective","tr":"belirli, özel, kesin","en":"Can you give me a specific date?","entr":"Bana kesin bir tarih verebilir misin?","ipa":"/spəˈsɪf.ɪk/","tip":"Türkçedeki 'spesifik' ile aynıdır."},{"id":"speed","word":"speed","pos":"noun","tr":"hız","en":"The speed limit here is 50 km an hour.","entr":"Buradaki hız sınırı saatte 50 km.","ipa":"/spiːd/","tip":"Speed limit = hız sınırı."},{"id":"spend","word":"spend","pos":"verb","tr":"harcamak; geçirmek (zaman)","en":"I like to spend time with my friends.","entr":"Arkadaşlarımla vakit geçirmeyi severim.","ipa":"/spend/","tip":"Spend → spent → spent. Para da zaman da 'spend' edilir."},{"id":"spoke","word":"spoke","pos":"verb","tr":"konuştu (speak fiilinin geçmiş hâli)","en":"I spoke to my teacher after class.","entr":"Dersten sonra öğretmenimle konuştum.","ipa":"/spəʊk/","tip":"Speak → spoke → spoken."},{"id":"spoken","word":"spoken","pos":"verb","tr":"konuşulmuş (speak fiilinin üçüncü hâli)","en":"English is spoken all over the world.","entr":"İngilizce dünyanın her yerinde konuşulur.","ipa":"/ˈspəʊ.kən/","tip":"Speak → spoke → spoken. Edilgen cümlelerde: is spoken."},{"id":"spoon","word":"spoon","pos":"noun","tr":"kaşık","en":"I need a spoon for my soup.","entr":"Çorbam için bir kaşığa ihtiyacım var.","ipa":"/spuːn/","tip":"Teaspoon = çay kaşığı. Fork = çatal, knife = bıçak."},{"id":"sport","word":"sport","pos":"noun","tr":"spor","en":"Swimming is my favourite sport.","entr":"Yüzme en sevdiğim spor.","ipa":"/spɔːt/","tip":"Türkçedeki 'spor' ile aynıdır."},{"id":"stage","word":"stage","pos":"noun","tr":"sahne; aşama","en":"The actors are on the stage.","entr":"Oyuncular sahnede.","ipa":"/steɪdʒ/","tip":"İki anlamı var: tiyatro sahnesi ve bir sürecin aşaması."},{"id":"stairs","word":"stairs","pos":"noun","tr":"merdiven","en":"The lift is broken, so take the stairs.","entr":"Asansör bozuk, merdivenleri kullan.","ipa":"/steəz/","tip":"Hep çoğul kullanılır: go up the stairs."},{"id":"stamp","word":"stamp","pos":"noun","tr":"pul; damga","en":"Put a stamp on the envelope.","entr":"Zarfın üstüne bir pul yapıştır.","ipa":"/stæmp/","tip":"Türkçedeki 'istampa/damga' ile akraba."},{"id":"stand","word":"stand","pos":"verb","tr":"ayakta durmak","en":"Please stand up when the teacher comes in.","entr":"Öğretmen girince lütfen ayağa kalkın.","ipa":"/stænd/","tip":"Stand → stood → stood. 'Stand up' = ayağa kalk."},{"id":"station","word":"station","pos":"noun","tr":"istasyon","en":"The train station is near the city centre.","entr":"Tren istasyonu şehir merkezine yakın.","ipa":"/ˈsteɪ.ʃən/","tip":"Türkçedeki 'istasyon' ile aynıdır."},{"id":"stay","word":"stay","pos":"verb","tr":"kalmak","en":"We will stay in a hotel for three nights.","entr":"Üç gece bir otelde kalacağız.","ipa":"/steɪ/","tip":"'Stay at home' = evde kal."},{"id":"still","word":"still","pos":"adverb","tr":"hâlâ","en":"Are you still at school?","entr":"Hâlâ okulda mısın?","ipa":"/stɪl/","tip":"'Still water' ise gazsız su demektir."},{"id":"stood","word":"stood","pos":"verb","tr":"durdu, ayakta durdu (stand fiilinin geçmiş hâli)","en":"We stood in the rain for an hour.","entr":"Bir saat yağmurda ayakta durduk.","ipa":"/stʊd/","tip":"Stand → stood → stood."},{"id":"stop","word":"stop","pos":"verb","tr":"durmak, durdurmak","en":"Stop talking, please.","entr":"Konuşmayı bırakın, lütfen.","ipa":"/stɒp/","tip":"Bus stop = otobüs durağı."},{"id":"store","word":"store","pos":"noun","tr":"mağaza; depo","en":"I bought this shirt at a big store.","entr":"Bu gömleği büyük bir mağazadan aldım.","ipa":"/stɔːr/","tip":"Amerikan İngilizcesinde 'shop' yerine 'store' denir."},{"id":"street","word":"street","pos":"noun","tr":"cadde, sokak","en":"I live on a quiet street.","entr":"Sessiz bir sokakta yaşıyorum.","ipa":"/striːt/","tip":"Adreslerde kısaltması 'St.' olarak yazılır."},{"id":"strong","word":"strong","pos":"adjective","tr":"güçlü, kuvvetli; sert (çay)","en":"My father is very strong.","entr":"Babam çok güçlüdür.","ipa":"/strɒŋ/","tip":"Zıttı 'weak' (zayıf). Strong tea = demli çay."},{"id":"strongly","word":"strongly","pos":"adverb","tr":"güçlü bir şekilde, kesinlikle","en":"I strongly believe you can do it.","entr":"Bunu yapabileceğine kesinlikle inanıyorum.","ipa":"/ˈstrɒŋ.li/","tip":"Strong + -ly = güçlü bir şekilde."},{"id":"student","word":"student","pos":"noun","tr":"öğrenci","en":"There are thirty students in my class, and every student has a book.","entr":"Sınıfımda otuz öğrenci var ve her öğrencinin bir kitabı var.","ipa":"/ˈstjuː.dənt/","tip":"Study (çalışmak) ile aynı kökten: ders çalışan kişi."},{"id":"success","word":"success","pos":"noun","tr":"başarı","en":"Hard work is the key to success.","entr":"Çok çalışmak başarının anahtarıdır.","ipa":"/səkˈses/","tip":"Successful = başarılı."},{"id":"such","word":"such","pos":"determiner","tr":"öyle, böyle, o kadar","en":"It was such a beautiful day.","entr":"O kadar güzel bir gündü ki.","ipa":"/sʌtʃ/","tip":"'Such a + sıfat + isim' = öyle ... bir."},{"id":"suddenly","word":"suddenly","pos":"adverb","tr":"aniden, birden","en":"Suddenly, the lights went out.","entr":"Birden ışıklar söndü.","ipa":"/ˈsʌd.ən.li/","tip":"Sudden (ani) + -ly = aniden."},{"id":"suffer","word":"suffer","pos":"verb","tr":"acı çekmek, sıkıntı çekmek","en":"Many animals suffer in hot weather.","entr":"Birçok hayvan sıcak havada acı çeker.","ipa":"/ˈsʌf.ər/","tip":"'Suffer from' = ...dan muzdarip olmak."},{"id":"suggest","word":"suggest","pos":"verb","tr":"önermek","en":"Can you suggest a good book?","entr":"İyi bir kitap önerebilir misin?","ipa":"/səˈdʒest/","tip":"Suggestion = öneri."},{"id":"suggestion","word":"suggestion","pos":"noun","tr":"öneri, tavsiye","en":"That's a good suggestion.","entr":"Bu iyi bir öneri.","ipa":"/səˈdʒes.tʃən/","tip":"Suggest (önermek) + -ion = öneri."},{"id":"summer","word":"summer","pos":"noun","tr":"yaz","en":"We go to the beach in summer.","entr":"Yazın plaja gideriz.","ipa":"/ˈsʌm.ər/","tip":"Mevsimler: spring, summer, autumn, winter."},{"id":"sun","word":"sun","pos":"noun","tr":"güneş","en":"The sun is very hot today.","entr":"Bugün güneş çok sıcak.","ipa":"/sʌn/","tip":"'Son' (oğul) ile aynı okunur: /sʌn/."},{"id":"sunday","word":"Sunday","pos":"noun","tr":"pazar (gün)","en":"We have a big breakfast on Sunday.","entr":"Pazar günü büyük bir kahvaltı yaparız.","ipa":"/ˈsʌn.deɪ/","tip":"Sun (güneş) + day = güneşin günü."},{"id":"sunflower","word":"sunflower","pos":"noun","tr":"ayçiçeği","en":"A sunflower always turns towards the sun.","entr":"Ayçiçeği hep güneşe döner.","ipa":"/ˈsʌnˌflaʊ.ər/","tip":"Sun (güneş) + flower (çiçek) = güneş çiçeği."},{"id":"sung","word":"sung","pos":"verb","tr":"söylenmiş (sing fiilinin üçüncü hâli)","en":"This song is sung at every wedding.","entr":"Bu şarkı her düğünde söylenir.","ipa":"/sʌŋ/","tip":"Sing → sang → sung."},{"id":"sunglasses","word":"sunglasses","pos":"noun","tr":"güneş gözlüğü","en":"Don't forget your sunglasses.","entr":"Güneş gözlüğünü unutma.","ipa":"/ˈsʌnˌɡlɑː.sɪz/","tip":"Sun (güneş) + glasses (gözlük). Hep çoğul kullanılır."},{"id":"sunlight","word":"sunlight","pos":"noun","tr":"güneş ışığı","en":"Plants need sunlight to grow.","entr":"Bitkilerin büyümek için güneş ışığına ihtiyacı var.","ipa":"/ˈsʌn.laɪt/","tip":"Sun (güneş) + light (ışık) = güneş ışığı."},{"id":"sunny","word":"sunny","pos":"adjective","tr":"güneşli","en":"It's a sunny day; let's go to the park.","entr":"Güneşli bir gün, hadi parka gidelim.","ipa":"/ˈsʌn.i/","tip":"Sun + -ny = güneşli."},{"id":"sunrise","word":"sunrise","pos":"noun","tr":"gün doğumu","en":"We watched the sunrise on the beach.","entr":"Plajda gün doğumunu izledik.","ipa":"/ˈsʌn.raɪz/","tip":"Sun (güneş) + rise (yükselmek) = gün doğumu. Zıttı 'sunset'."},{"id":"suppose","word":"suppose","pos":"verb","tr":"sanmak, farz etmek","en":"I suppose you are right.","entr":"Sanırım haklısın.","ipa":"/səˈpəʊz/","tip":"'Be supposed to' = ...yapması gerekmek: I'm supposed to be at home."},{"id":"sure","word":"sure","pos":"adjective","tr":"emin; tabii","en":"Are you sure about the answer?","entr":"Cevaptan emin misin?","ipa":"/ʃɔːr/","tip":"'Sure!' tek başına 'Tabii!' demektir."},{"id":"swam","word":"swam","pos":"verb","tr":"yüzdü (swim fiilinin geçmiş hâli)","en":"We swam in the sea all afternoon.","entr":"Bütün öğleden sonra denizde yüzdük.","ipa":"/swæm/","tip":"Swim → swam → swum."},{"id":"sweater","word":"sweater","pos":"noun","tr":"kazak, süveter","en":"My grandmother knitted this sweater for me.","entr":"Bu kazağı bana babaannem ördü.","ipa":"/ˈswet.ər/","tip":"Sweat (terlemek) kökünden: insanı terleten sıcak kazak."},{"id":"swim","word":"swim","pos":"verb","tr":"yüzmek","en":"Can you swim?","entr":"Yüzebilir misin?","ipa":"/swɪm/","tip":"Swim → swam → swum. Swimming = yüzme."},{"id":"swimmer","word":"swimmer","pos":"noun","tr":"yüzücü","en":"She is a very fast swimmer.","entr":"O çok hızlı bir yüzücü.","ipa":"/ˈswɪm.ər/","tip":"Swim + m + -er = yüzücü (m harfi ikiye katlanır)."},{"id":"swimming pool","word":"swimming pool","pos":"noun","tr":"yüzme havuzu","en":"Our hotel has a swimming pool.","entr":"Otelimizin yüzme havuzu var.","ipa":"/ˈswɪm.ɪŋ ˌpuːl/","tip":"Swimming (yüzme) + pool (havuz)."},{"id":"swum","word":"swum","pos":"verb","tr":"yüzmüş (swim fiilinin üçüncü hâli)","en":"Have you ever swum in a lake?","entr":"Hiç gölde yüzdün mü?","ipa":"/swʌm/","tip":"Swim → swam → swum. 'Have/has' ile kullanılır."},{"id":"system","word":"system","pos":"noun","tr":"sistem","en":"The school has a new computer system.","entr":"Okulun yeni bir bilgisayar sistemi var.","ipa":"/ˈsɪs.təm/","tip":"Türkçedeki 'sistem' ile aynıdır."},{"id":"table","word":"table","pos":"noun","tr":"masa; tablo","en":"Dinner is on the table.","entr":"Yemek masada.","ipa":"/ˈteɪ.bəl/","tip":"İki anlamı var: masa ve tablo (çizelge)."},{"id":"table tennis","word":"table tennis","pos":"noun","tr":"masa tenisi","en":"We play table tennis at break time.","entr":"Teneffüste masa tenisi oynarız.","ipa":"/ˈteɪ.bəl ˌten.ɪs/","tip":"Table (masa) + tennis = masa tenisi. 'Ping-pong' da denir."},{"id":"take","word":"take","pos":"verb","tr":"almak, götürmek; sürmek (zaman)","en":"Take an umbrella with you.","entr":"Yanına bir şemsiye al.","ipa":"/teɪk/","tip":"Take → took → taken. 'It takes 10 minutes' = 10 dakika sürer."},{"id":"talk","word":"talk","pos":"verb","tr":"konuşmak","en":"Can we talk after class?","entr":"Dersten sonra konuşabilir miyiz?","ipa":"/tɔːk/","tip":"'l' okunmaz: /tɔːk/. 'Talk to someone' = biriyle konuşmak."},{"id":"tap","word":"tap","pos":"noun","tr":"musluk; hafifçe vurmak","en":"Turn off the tap while you brush your teeth.","entr":"Dişlerini fırçalarken musluğu kapat.","ipa":"/tæp/","tip":"Telefonda 'tap' = ekrana dokunmak."},{"id":"taught","word":"taught","pos":"verb","tr":"öğretti (teach fiilinin geçmiş hâli)","en":"My mother taught me how to swim.","entr":"Annem bana yüzmeyi öğretti.","ipa":"/tɔːt/","tip":"Teach → taught → taught. 'gh' okunmaz."},{"id":"tax","word":"tax","pos":"noun","tr":"vergi","en":"The price includes tax.","entr":"Fiyata vergi dahildir.","ipa":"/tæks/","tip":"Türkiye'de KDV, İngilizcede 'VAT' olarak bilinir."},{"id":"taxi","word":"taxi","pos":"noun","tr":"taksi","en":"Let's take a taxi to the airport.","entr":"Havalimanına taksiyle gidelim.","ipa":"/ˈtæk.si/","tip":"Türkçedeki 'taksi' ile aynıdır."},{"id":"tea","word":"tea","pos":"noun","tr":"çay","en":"Turkish people drink a lot of tea.","entr":"Türkler çok çay içer.","ipa":"/tiː/","tip":"Teapot = çaydanlık, teaspoon = çay kaşığı."},{"id":"teach","word":"teach","pos":"verb","tr":"öğretmek","en":"I teach English at a primary school.","entr":"Bir ilkokulda İngilizce öğretiyorum.","ipa":"/tiːtʃ/","tip":"Teach → taught → taught. Learn (öğrenmek) ile karıştırma."},{"id":"teacher","word":"teacher","pos":"noun","tr":"öğretmen","en":"Our teacher gives us homework every day.","entr":"Öğretmenimiz bize her gün ödev verir.","ipa":"/ˈtiː.tʃər/","tip":"Teach (öğretmek) + -er = öğretmen."},{"id":"team","word":"team","pos":"noun","tr":"takım, ekip","en":"Which team do you support?","entr":"Hangi takımı tutuyorsun?","ipa":"/tiːm/","tip":"Türkçedeki 'tim' (ekip) bu kelimeden gelir."},{"id":"teapot","word":"teapot","pos":"noun","tr":"demlik, çaydanlık","en":"Put the teapot on the stove.","entr":"Demliği ocağa koy.","ipa":"/ˈtiː.pɒt/","tip":"Tea (çay) + pot (kap) = demlik."},{"id":"teeth","word":"teeth","pos":"noun","tr":"dişler (tooth kelimesinin çoğulu)","en":"Brush your teeth twice a day.","entr":"Dişlerini günde iki kez fırçala.","ipa":"/tiːθ/","tip":"Düzensiz çoğul: one tooth, two teeth."},{"id":"telegram","word":"telegram","pos":"noun","tr":"telgraf (mesajı)","en":"In the past, people sent a telegram for important news.","entr":"Eskiden insanlar önemli haberler için telgraf çekerdi.","ipa":"/ˈtel.ɪ.ɡræm/","tip":"Tele (uzak) + gram (yazı) = uzağa gönderilen yazı."},{"id":"telegraph","word":"telegraph","pos":"noun","tr":"telgraf (sistemi)","en":"The telegraph was invented in the 19th century.","entr":"Telgraf 19. yüzyılda icat edildi.","ipa":"/ˈtel.ɪ.ɡrɑːf/","tip":"Telegram mesajdır, telegraph ise onu gönderen sistem."},{"id":"telephone","word":"telephone","pos":"noun","tr":"telefon","en":"There is a telephone in the hall.","entr":"Holde bir telefon var.","ipa":"/ˈtel.ɪ.fəʊn/","tip":"Tele (uzak) + phone (ses) = uzaktan ses."},{"id":"teletext","word":"teletext","pos":"noun","tr":"teletekst (televizyonda yazılı bilgi)","en":"My grandfather checks the news on teletext.","entr":"Dedem haberlere teletekstten bakar.","ipa":"/ˈtel.ɪ.tekst/","tip":"Tele (televizyon) + text (yazı): ekranda yazılı haber."},{"id":"television","word":"television","pos":"noun","tr":"televizyon","en":"We watch television after dinner.","entr":"Akşam yemeğinden sonra televizyon izleriz.","ipa":"/ˈtel.ɪ.vɪʒ.ən/","tip":"Tele (uzak) + vision (görüntü). Kısaltması 'TV'."},{"id":"tell","word":"tell","pos":"verb","tr":"söylemek, anlatmak","en":"Tell me about your holiday.","entr":"Bana tatilini anlat.","ipa":"/tel/","tip":"Tell → told → told. Tell + kişi: tell me, tell her."},{"id":"temperature","word":"temperature","pos":"noun","tr":"sıcaklık; ateş","en":"The temperature today is 30 degrees.","entr":"Bugün sıcaklık 30 derece.","ipa":"/ˈtem.prə.tʃər/","tip":"'Have a temperature' = ateşi olmak."},{"id":"term","word":"term","pos":"noun","tr":"dönem; terim","en":"The second term starts in February.","entr":"İkinci dönem şubatta başlar.","ipa":"/tɜːm/","tip":"Okulda dönem; ders kitabında 'terim'."},{"id":"test","word":"test","pos":"noun","tr":"sınav, test","en":"We have a maths test tomorrow.","entr":"Yarın matematik sınavımız var.","ipa":"/test/","tip":"Türkçedeki 'test' ile aynıdır."},{"id":"textbook","word":"textbook","pos":"noun","tr":"ders kitabı","en":"Open your textbook to page ten.","entr":"Ders kitabınızı onuncu sayfada açın.","ipa":"/ˈtekst.bʊk/","tip":"Text (metin) + book (kitap) = ders kitabı."},{"id":"than","word":"than","pos":"conjunction","tr":"-den, -dan (karşılaştırma)","en":"My brother is taller than me.","entr":"Kardeşim benden uzun.","ipa":"/ðæn/","tip":"'Then' (sonra) ile karıştırma: than = karşılaştırma."},{"id":"thank","word":"thank","pos":"verb","tr":"teşekkür etmek","en":"Thank you for your help.","entr":"Yardımın için teşekkür ederim.","ipa":"/θæŋk/","tip":"'Thank you' = teşekkür ederim."},{"id":"thanks","word":"thanks","pos":"noun","tr":"teşekkürler, sağ ol","en":"Thanks for the lovely gift!","entr":"Güzel hediye için teşekkürler!","ipa":"/θæŋks/","tip":"'Thank you'nun daha samimi kısa hâli."},{"id":"that","word":"that","pos":"determiner","tr":"şu, o; ki","en":"Who is that man?","entr":"Şu adam kim?","ipa":"/ðæt/","tip":"Yakındaki 'this', uzaktaki 'that'. Çoğulu 'those'."},{"id":"the","word":"the","pos":"article","tr":"belirli tanımlık (o, bu belirli şey)","en":"The sun is shining.","entr":"Güneş parlıyor.","ipa":"/ðə/","tip":"Herkesin bildiği, belirli şeyler için: the sun, the door."},{"id":"theatre","word":"theatre","pos":"noun","tr":"tiyatro","en":"We went to the theatre last weekend.","entr":"Geçen hafta sonu tiyatroya gittik.","ipa":"/ˈθɪə.tər/","tip":"İngiliz yazımı 'theatre', Amerikan yazımı 'theater'."},{"id":"their","word":"their","pos":"determiner","tr":"onların","en":"The children are playing in their garden.","entr":"Çocuklar bahçelerinde oynuyor.","ipa":"/ðeər/","tip":"'There' (orada) ile aynı okunur ama anlamı 'onların'."},{"id":"theirs","word":"theirs","pos":"pronoun","tr":"onlarınki","en":"That house is theirs.","entr":"O ev onlarınki.","ipa":"/ðeəz/","tip":"Their house = onların evi; the house is theirs = ev onlarınki."},{"id":"them","word":"them","pos":"pronoun","tr":"onları, onlara","en":"I called them yesterday.","entr":"Dün onları aradım.","ipa":"/ðem/","tip":"'They' öznedir, 'them' nesne: They see me, I see them."},{"id":"themselves","word":"themselves","pos":"pronoun","tr":"kendileri, kendilerini","en":"The children made the cake themselves.","entr":"Çocuklar keki kendileri yaptı.","ipa":"/ðəmˈselvz/","tip":"Them + selves = kendileri."},{"id":"then","word":"then","pos":"adverb","tr":"sonra; o zaman","en":"First wash your hands, then sit down.","entr":"Önce ellerini yıka, sonra otur.","ipa":"/ðen/","tip":"'Than' (karşılaştırma) ile karıştırma: then = sonra."},{"id":"there","word":"there","pos":"adverb","tr":"orada, oraya; (there is) var","en":"There is a cat under the car.","entr":"Arabanın altında bir kedi var.","ipa":"/ðeər/","tip":"'There is/are' = ...var. Here (burada) ile zıt."},{"id":"thing","word":"thing","pos":"noun","tr":"şey","en":"What is that thing on the table?","entr":"Masadaki o şey ne?","ipa":"/θɪŋ/","tip":"Something, nothing, anything: hepsi 'thing' içerir."},{"id":"think","word":"think","pos":"verb","tr":"düşünmek; sanmak","en":"I think it will rain.","entr":"Bence yağmur yağacak.","ipa":"/θɪŋk/","tip":"Think → thought → thought. 'I think...' = bence."},{"id":"third","word":"third","pos":"adjective","tr":"üçüncü","en":"I live on the third floor.","entr":"Üçüncü katta oturuyorum.","ipa":"/θɜːd/","tip":"First, second, third: düzensiz sıra sayılarıdır."},{"id":"this","word":"this","pos":"determiner","tr":"bu","en":"This is my friend Ali.","entr":"Bu arkadaşım Ali.","ipa":"/ðɪs/","tip":"Yakındaki 'this', çoğulu 'these'."},{"id":"those","word":"those","pos":"determiner","tr":"şunlar, onlar","en":"Are those your shoes?","entr":"Şunlar senin ayakkabıların mı?","ipa":"/ðəʊz/","tip":"'That'in çoğulu: that book → those books."},{"id":"thought","word":"thought","pos":"verb","tr":"düşündü (think fiilinin geçmiş hâli); düşünce","en":"I thought you were at home.","entr":"Evde olduğunu düşünmüştüm.","ipa":"/θɔːt/","tip":"Think → thought → thought. 'gh' okunmaz."},{"id":"threw","word":"threw","pos":"verb","tr":"attı, fırlattı (throw fiilinin geçmiş hâli)","en":"He threw the ball to his dog.","entr":"Topu köpeğine attı.","ipa":"/θruː/","tip":"Throw → threw → thrown. 'Through' ile aynı okunur."},{"id":"through","word":"through","pos":"preposition","tr":"içinden, -den geçerek","en":"The train goes through a long tunnel.","entr":"Tren uzun bir tünelden geçiyor.","ipa":"/θruː/","tip":"'gh' okunmaz: /θruː/. Bir şeyin bir ucundan girip öbüründen çıkmak."},{"id":"throw","word":"throw","pos":"verb","tr":"atmak, fırlatmak","en":"Don't throw rubbish on the ground.","entr":"Yere çöp atma.","ipa":"/θrəʊ/","tip":"Throw → threw → thrown. 'Throw away' = çöpe atmak."},{"id":"thursday","word":"Thursday","pos":"noun","tr":"perşembe","en":"We have music lessons on Thursday.","entr":"Perşembe günü müzik dersimiz var.","ipa":"/ˈθɜːz.deɪ/","tip":"Thor (gök gürültüsü tanrısı) + day = Thor'un günü."},{"id":"thus","word":"thus","pos":"adverb","tr":"böylece, bu yüzden","en":"He studied hard and thus passed the exam.","entr":"Çok çalıştı ve böylece sınavı geçti.","ipa":"/ðʌs/","tip":"'So' ile benzer, daha resmi ve yazı dilinde kullanılır."},{"id":"ticket","word":"ticket","pos":"noun","tr":"bilet","en":"I bought a ticket for the concert.","entr":"Konser için bir bilet aldım.","ipa":"/ˈtɪk.ɪt/","tip":"Türkçedeki 'bilet'; 'etiket' kelimesiyle aynı kökten."},{"id":"till","word":"till","pos":"preposition","tr":"-e kadar","en":"The shop is open till nine.","entr":"Dükkân dokuza kadar açık.","ipa":"/tɪl/","tip":"'Until' ile aynı anlam; konuşma dilinde daha yaygın."},{"id":"time","word":"time","pos":"noun","tr":"zaman; kez","en":"What time is it?","entr":"Saat kaç?","ipa":"/taɪm/","tip":"'What time is it?' = Saat kaç? 'Three times' = üç kez."},{"id":"tire","word":"tire","pos":"verb","tr":"yorulmak, yormak","en":"Old people tire easily in hot weather.","entr":"Yaşlılar sıcak havada çabuk yorulur.","ipa":"/taɪər/","tip":"Tired (yorgun) bu fiilden gelir. Amerikan yazımında 'lastik' anlamı da var."},{"id":"tired","word":"tired","pos":"adjective","tr":"yorgun","en":"I am very tired after the long walk.","entr":"Uzun yürüyüşten sonra çok yorgunum.","ipa":"/taɪəd/","tip":"'Tired of' = ...dan bıkmış: I'm tired of waiting."},{"id":"today","word":"today","pos":"adverb","tr":"bugün","en":"Today is Monday.","entr":"Bugün pazartesi.","ipa":"/təˈdeɪ/","tip":"Yesterday (dün), today (bugün), tomorrow (yarın)."},{"id":"toe","word":"toe","pos":"noun","tr":"ayak parmağı","en":"I hurt my big toe.","entr":"Ayak başparmağımı incittim.","ipa":"/təʊ/","tip":"El parmağı 'finger', ayak parmağı 'toe'."},{"id":"together","word":"together","pos":"adverb","tr":"birlikte","en":"Let's do our homework together.","entr":"Ödevimizi birlikte yapalım.","ipa":"/təˈɡeð.ər/","tip":"To + gather (toplanmak) = bir araya gelmek, birlikte."},{"id":"tomorrow","word":"tomorrow","pos":"adverb","tr":"yarın","en":"See you tomorrow!","entr":"Yarın görüşürüz!","ipa":"/təˈmɒr.əʊ/","tip":"Yazımı: bir 'm', iki 'r' (to-m-o-rr-ow)."},{"id":"tonight","word":"tonight","pos":"adverb","tr":"bu gece, bu akşam","en":"What are you doing tonight?","entr":"Bu akşam ne yapıyorsun?","ipa":"/təˈnaɪt/","tip":"To + night (gece) = bu gece."},{"id":"too","word":"too","pos":"adverb","tr":"de, da; fazla, çok","en":"This tea is too hot to drink.","entr":"Bu çay içilemeyecek kadar sıcak.","ipa":"/tuː/","tip":"İki anlamı: 'me too' (ben de) ve 'too hot' (fazla sıcak)."},{"id":"took","word":"took","pos":"verb","tr":"aldı, götürdü (take fiilinin geçmiş hâli)","en":"I took the bus to school this morning.","entr":"Bu sabah okula otobüsle gittim.","ipa":"/tʊk/","tip":"Take → took → taken."},{"id":"tooth","word":"tooth","pos":"noun","tr":"diş","en":"The dentist pulled out my tooth.","entr":"Diş hekimi dişimi çekti.","ipa":"/tuːθ/","tip":"Düzensiz çoğul: one tooth, two teeth."},{"id":"toothache","word":"toothache","pos":"noun","tr":"diş ağrısı","en":"I have a terrible toothache.","entr":"Korkunç bir diş ağrım var.","ipa":"/ˈtuːθ.eɪk/","tip":"Tooth (diş) + ache (ağrı). Headache = baş ağrısı."},{"id":"toothbrush","word":"toothbrush","pos":"noun","tr":"diş fırçası","en":"Don't forget your toothbrush.","entr":"Diş fırçanı unutma.","ipa":"/ˈtuːθ.brʌʃ/","tip":"Tooth (diş) + brush (fırça)."},{"id":"toothpaste","word":"toothpaste","pos":"noun","tr":"diş macunu","en":"We need to buy toothpaste.","entr":"Diş macunu almamız gerek.","ipa":"/ˈtuːθ.peɪst/","tip":"Tooth (diş) + paste (macun)."},{"id":"top","word":"top","pos":"noun","tr":"tepe, üst","en":"We climbed to the top of the hill.","entr":"Tepenin zirvesine tırmandık.","ipa":"/tɒp/","tip":"Zıttı 'bottom' (dip, alt). 'On top of' = ...nın üstünde."},{"id":"total","word":"total","pos":"noun","tr":"toplam","en":"The total is 150 lira.","entr":"Toplam 150 lira.","ipa":"/ˈtəʊ.təl/","tip":"Türkçedeki 'total' ile aynıdır."},{"id":"towards","word":"towards","pos":"preposition","tr":"-e doğru","en":"The dog ran towards me.","entr":"Köpek bana doğru koştu.","ipa":"/təˈwɔːdz/","tip":"To (-e) + wards (yön) = ...ya doğru."},{"id":"town","word":"town","pos":"noun","tr":"kasaba, şehir","en":"I live in a small town near the sea.","entr":"Denize yakın küçük bir kasabada yaşıyorum.","ipa":"/taʊn/","tip":"Village (köy) < town (kasaba) < city (şehir)."},{"id":"toy","word":"toy","pos":"noun","tr":"oyuncak","en":"The baby is playing with a toy car.","entr":"Bebek oyuncak bir arabayla oynuyor.","ipa":"/tɔɪ/","tip":"Toy shop = oyuncakçı."},{"id":"traffic","word":"traffic","pos":"noun","tr":"trafik","en":"There is a lot of traffic in the morning.","entr":"Sabahları çok trafik oluyor.","ipa":"/ˈtræf.ɪk/","tip":"Traffic lights = trafik ışıkları."},{"id":"train","word":"train","pos":"noun","tr":"tren; antrenman yapmak","en":"We went to Konya by train.","entr":"Konya'ya trenle gittik.","ipa":"/treɪn/","tip":"Fiil olarak 'eğitmek, antrenman yapmak'; antrenör bu kelimeden."},{"id":"tray","word":"tray","pos":"noun","tr":"tepsi","en":"She brought the tea glasses on a tray.","entr":"Çay bardaklarını bir tepsiyle getirdi.","ipa":"/treɪ/","tip":"Çay servisinde kullanılan tepsi."},{"id":"tree","word":"tree","pos":"noun","tr":"ağaç","en":"There is an old tree in our garden.","entr":"Bahçemizde yaşlı bir ağaç var.","ipa":"/triː/","tip":"'Three' (üç) ile karıştırma: tree'de 'h' yok."},{"id":"trouble","word":"trouble","pos":"noun","tr":"sorun, dert, bela","en":"I'm in trouble; I lost my keys.","entr":"Başım dertte, anahtarlarımı kaybettim.","ipa":"/ˈtrʌb.əl/","tip":"'In trouble' = başı dertte."},{"id":"true","word":"true","pos":"adjective","tr":"doğru, gerçek","en":"Is it true that you are moving?","entr":"Taşınacağın doğru mu?","ipa":"/truː/","tip":"Testlerde 'True / False' = Doğru / Yanlış."},{"id":"truth","word":"truth","pos":"noun","tr":"gerçek, doğruluk","en":"Always tell the truth.","entr":"Her zaman doğruyu söyle.","ipa":"/truːθ/","tip":"True (doğru) + -th = gerçek."},{"id":"try","word":"try","pos":"verb","tr":"denemek, çalışmak","en":"Try this soup; it's delicious.","entr":"Bu çorbayı dene, çok lezzetli.","ipa":"/traɪ/","tip":"'Try on' = giyip denemek (kıyafet)."},{"id":"tuesday","word":"Tuesday","pos":"noun","tr":"salı","en":"We have a test on Tuesday.","entr":"Salı günü sınavımız var.","ipa":"/ˈtʃuːz.deɪ/","tip":"Haftanın ikinci günü; yazımında 'ue' var: T-ue-sday."},{"id":"turn","word":"turn","pos":"verb","tr":"dönmek, çevirmek; sıra","en":"Turn left at the bank.","entr":"Bankadan sola dön.","ipa":"/tɜːn/","tip":"'It's your turn' = sıra sende. 'Turn on/off' = açmak/kapatmak."},{"id":"tv","word":"TV","pos":"noun","tr":"televizyon","en":"Turn off the TV, please.","entr":"Televizyonu kapat, lütfen.","ipa":"/ˌtiːˈviː/","tip":"Television kelimesinin kısaltması; harf harf okunur."},{"id":"twice","word":"twice","pos":"adverb","tr":"iki kez","en":"I brush my teeth twice a day.","entr":"Dişlerimi günde iki kez fırçalarım.","ipa":"/twaɪs/","tip":"Once (bir kez), twice (iki kez), three times."},{"id":"type","word":"type","pos":"noun","tr":"tip, tür; yazmak (klavye)","en":"What type of films do you like?","entr":"Ne tür filmlerden hoşlanırsın?","ipa":"/taɪp/","tip":"Fiil olarak klavyede yazmak demektir: type a message."},{"id":"ugly","word":"ugly","pos":"adjective","tr":"çirkin","en":"The Ugly Duckling is a famous story.","entr":"Çirkin Ördek Yavrusu ünlü bir masaldır.","ipa":"/ˈʌɡ.li/","tip":"Zıttı 'beautiful' ya da 'pretty'."},{"id":"umbrella","word":"umbrella","pos":"noun","tr":"şemsiye","en":"Take your umbrella; it's raining.","entr":"Şemsiyeni al, yağmur yağıyor.","ipa":"/ʌmˈbrel.ə/","tip":"Latince 'umbra' (gölge) kökünden."},{"id":"under","word":"under","pos":"preposition","tr":"altında","en":"The cat is under the table.","entr":"Kedi masanın altında.","ipa":"/ˈʌn.dər/","tip":"Zıttı 'on' ya da 'over' (üstünde)."},{"id":"underground","word":"underground","pos":"noun","tr":"metro; yeraltı","en":"We took the underground in London.","entr":"Londra'da metroya bindik.","ipa":"/ˈʌn.də.ɡraʊnd/","tip":"Under (altında) + ground (zemin) = yeraltı treni, metro."},{"id":"understand","word":"understand","pos":"verb","tr":"anlamak","en":"I don't understand this question.","entr":"Bu soruyu anlamıyorum.","ipa":"/ˌʌn.dəˈstænd/","tip":"Understand → understood → understood."},{"id":"understanding","word":"understanding","pos":"noun","tr":"anlayış; kavrayış","en":"Thank you for your understanding.","entr":"Anlayışınız için teşekkür ederiz.","ipa":"/ˌʌn.dəˈstæn.dɪŋ/","tip":"Understand + -ing = anlayış. Sıfat olarak 'anlayışlı'."},{"id":"union","word":"union","pos":"noun","tr":"birlik; sendika","en":"The European Union has many member countries.","entr":"Avrupa Birliği'nin birçok üye ülkesi var.","ipa":"/ˈjuː.ni.ən/","tip":"Uni (bir) kökünden: bir araya gelme, birlik."},{"id":"unless","word":"unless","pos":"conjunction","tr":"-medikçe, -mezse","en":"You will be late unless you hurry.","entr":"Acele etmezsen geç kalacaksın.","ipa":"/ənˈles/","tip":"Unless = if not (eğer ... değilse)."},{"id":"until","word":"until","pos":"preposition","tr":"-e kadar","en":"Wait here until I come back.","entr":"Ben dönene kadar burada bekle.","ipa":"/ənˈtɪl/","tip":"'Till' ile aynı anlam; yazımında tek 'l' var."},{"id":"up","word":"up","pos":"adverb","tr":"yukarı, yukarıda","en":"The cat climbed up the tree.","entr":"Kedi ağaca tırmandı.","ipa":"/ʌp/","tip":"Zıttı 'down'. 'Get up' = kalkmak, 'stand up' = ayağa kalkmak."},{"id":"us","word":"us","pos":"pronoun","tr":"bizi, bize","en":"Can you help us, please?","entr":"Bize yardım edebilir misiniz, lütfen?","ipa":"/ʌs/","tip":"'We' öznedir, 'us' nesne: We like him, he likes us."},{"id":"use","word":"use","pos":"verb","tr":"kullanmak","en":"Can I use your phone?","entr":"Telefonunu kullanabilir miyim?","ipa":"/juːz/","tip":"Fiil /juːz/, isim /juːs/ okunur: the use of computers."},{"id":"useful","word":"useful","pos":"adjective","tr":"faydalı, kullanışlı","en":"This dictionary is very useful.","entr":"Bu sözlük çok kullanışlı.","ipa":"/ˈjuːs.fəl/","tip":"Use (kullanım) + -ful (dolu) = kullanışlı. Zıttı 'useless'."},{"id":"usually","word":"usually","pos":"adverb","tr":"genellikle","en":"I usually get up at seven.","entr":"Genellikle yedide kalkarım.","ipa":"/ˈjuː.ʒu.ə.li/","tip":"Always > usually > often > sometimes > never."},{"id":"various","word":"various","pos":"adjective","tr":"çeşitli, farklı","en":"The shop sells various kinds of cheese.","entr":"Dükkân çeşitli türlerde peynir satıyor.","ipa":"/ˈveə.ri.əs/","tip":"Vary (değişmek) ve variety (çeşit) ile aynı aileden."},{"id":"vase","word":"vase","pos":"noun","tr":"vazo","en":"Put the flowers in a vase.","entr":"Çiçekleri bir vazoya koy.","ipa":"/vɑːz/","tip":"Türkçedeki 'vazo' ile aynı kökten."},{"id":"verb","word":"verb","pos":"noun","tr":"fiil, eylem","en":"'Run' is a verb.","entr":"'Run' bir fiildir.","ipa":"/vɜːb/","tip":"Eylem bildiren kelime: eat, go, read."},{"id":"very","word":"very","pos":"adverb","tr":"çok","en":"The film was very good.","entr":"Film çok iyiydi.","ipa":"/ˈver.i/","tip":"Sıfattan önce gelir: very big, very happy."},{"id":"video","word":"video","pos":"noun","tr":"video","en":"We watched a video about animals.","entr":"Hayvanlar hakkında bir video izledik.","ipa":"/ˈvɪd.i.əʊ/","tip":"Türkçedeki 'video' ile aynıdır."},{"id":"view","word":"view","pos":"noun","tr":"manzara; görüş","en":"The view from the hotel is amazing.","entr":"Otelden manzara harika.","ipa":"/vjuː/","tip":"'Point of view' = bakış açısı."},{"id":"village","word":"village","pos":"noun","tr":"köy","en":"My grandparents live in a village.","entr":"Büyükannemle büyükbabam bir köyde yaşıyor.","ipa":"/ˈvɪl.ɪdʒ/","tip":"Villa kelimesiyle aynı kökten."},{"id":"wait","word":"wait","pos":"verb","tr":"beklemek","en":"Please wait for me at the door.","entr":"Lütfen beni kapıda bekle.","ipa":"/weɪt/","tip":"'Wait for someone' = birini beklemek."},{"id":"waiter","word":"waiter","pos":"noun","tr":"garson (erkek)","en":"The waiter brought our food.","entr":"Garson yemeğimizi getirdi.","ipa":"/ˈweɪ.tər/","tip":"Wait (beklemek) + -er: masada bekleyip hizmet eden kişi."},{"id":"waitress","word":"waitress","pos":"noun","tr":"garson (kadın)","en":"The waitress gave us the menu.","entr":"Kadın garson bize menüyü verdi.","ipa":"/ˈweɪ.trəs/","tip":"Waiter + -ess (kadın eki). Actor → actress gibi."},{"id":"walk","word":"walk","pos":"verb","tr":"yürümek","en":"I walk to school every day.","entr":"Her gün okula yürürüm.","ipa":"/wɔːk/","tip":"'l' okunmaz: /wɔːk/. 'Go for a walk' = yürüyüşe çıkmak."},{"id":"wall","word":"wall","pos":"noun","tr":"duvar","en":"There is a clock on the wall.","entr":"Duvarda bir saat var.","ipa":"/wɔːl/","tip":"Great Wall of China = Çin Seddi."},{"id":"want","word":"want","pos":"verb","tr":"istemek","en":"I want an ice cream.","entr":"Dondurma istiyorum.","ipa":"/wɒnt/","tip":"'Want to + fiil' = ...mak istemek: I want to go."},{"id":"warm","word":"warm","pos":"adjective","tr":"ılık, sıcak","en":"It's warm today; we don't need coats.","entr":"Bugün hava ılık, monta gerek yok.","ipa":"/wɔːm/","tip":"Hot (sıcak) ile cold (soğuk) arası: ılık."},{"id":"was","word":"was","pos":"verb","tr":"idi (be fiilinin geçmiş hâli, tekil)","en":"I was at home yesterday.","entr":"Dün evdeydim.","ipa":"/wɒz/","tip":"I/he/she/it → was; you/we/they → were."},{"id":"wash","word":"wash","pos":"verb","tr":"yıkamak","en":"Wash your hands before eating.","entr":"Yemekten önce ellerini yıka.","ipa":"/wɒʃ/","tip":"'Wash the dishes' = bulaşık yıkamak."},{"id":"washing machine","word":"washing machine","pos":"noun","tr":"çamaşır makinesi","en":"Put your clothes in the washing machine.","entr":"Kıyafetlerini çamaşır makinesine koy.","ipa":"/ˈwɒʃ.ɪŋ məˌʃiːn/","tip":"Washing (yıkama) + machine (makine)."},{"id":"watch","word":"watch","pos":"verb","tr":"izlemek, seyretmek; kol saati","en":"We watch cartoons on Saturday mornings.","entr":"Cumartesi sabahları çizgi film izleriz.","ipa":"/wɒtʃ/","tip":"İsim olarak 'kol saati': a new watch."},{"id":"water","word":"water","pos":"noun","tr":"su","en":"Drink more water in summer.","entr":"Yazın daha çok su iç.","ipa":"/ˈwɔː.tər/","tip":"Sayılamaz: a glass of water, much water."},{"id":"watermelon","word":"watermelon","pos":"noun","tr":"karpuz","en":"Diyarbakır is famous for its big watermelon.","entr":"Diyarbakır büyük karpuzuyla ünlüdür.","ipa":"/ˈwɔː.təˌmel.ən/","tip":"Water (su) + melon (kavun) = sulu kavun, karpuz."},{"id":"way","word":"way","pos":"noun","tr":"yol; yöntem","en":"Can you tell me the way to the museum?","entr":"Bana müzenin yolunu söyleyebilir misin?","ipa":"/weɪ/","tip":"'By the way' = bu arada."},{"id":"we","word":"we","pos":"pronoun","tr":"biz","en":"We usually have dinner at seven.","entr":"Genellikle yedide akşam yemeği yeriz.","ipa":"/wiː/","tip":"Nesne hâli 'us', iyelik hâli 'our'."},{"id":"wear","word":"wear","pos":"verb","tr":"giymek, takmak","en":"I wear a uniform at school.","entr":"Okulda üniforma giyerim.","ipa":"/weər/","tip":"Wear → wore → worn. Gözlük de takı da 'wear' edilir."},{"id":"weather","word":"weather","pos":"noun","tr":"hava, hava durumu","en":"The weather is lovely today.","entr":"Bugün hava çok güzel.","ipa":"/ˈweð.ər/","tip":"'Whether' (-ip -mediği) ile aynı okunur ama anlamı farklı."},{"id":"wednesday","word":"Wednesday","pos":"noun","tr":"çarşamba","en":"We have PE on Wednesday.","entr":"Çarşamba günü beden eğitimi dersimiz var.","ipa":"/ˈwenz.deɪ/","tip":"İlk 'd' okunmaz: /ˈwenz.deɪ/. Yazarken 'Wed-nes-day' diye hecele."},{"id":"week","word":"week","pos":"noun","tr":"hafta","en":"I go swimming twice a week.","entr":"Haftada iki kez yüzmeye giderim.","ipa":"/wiːk/","tip":"'Weak' (zayıf) ile aynı okunur: /wiːk/."},{"id":"weekend","word":"weekend","pos":"noun","tr":"hafta sonu","en":"What did you do at the weekend?","entr":"Hafta sonu ne yaptın?","ipa":"/ˌwiːkˈend/","tip":"Week (hafta) + end (son) = hafta sonu."},{"id":"weight","word":"weight","pos":"noun","tr":"ağırlık, kilo","en":"What is the weight of this box?","entr":"Bu kutunun ağırlığı ne kadar?","ipa":"/weɪt/","tip":"'gh' okunmaz; 'wait' ile aynı okunur."},{"id":"well","word":"well","pos":"adverb","tr":"iyi; peki","en":"She speaks English very well.","entr":"Çok iyi İngilizce konuşuyor.","ipa":"/wel/","tip":"'Good' sıfattır, 'well' zarf: a good singer, she sings well."},{"id":"went","word":"went","pos":"verb","tr":"gitti (go fiilinin geçmiş hâli)","en":"We went to the cinema last night.","entr":"Dün akşam sinemaya gittik.","ipa":"/went/","tip":"Go → went → gone. Tamamen düzensiz bir fiil."},{"id":"were","word":"were","pos":"verb","tr":"idiler, idik (be fiilinin geçmiş hâli, çoğul)","en":"We were at the park yesterday.","entr":"Dün parktaydık.","ipa":"/wɜːr/","tip":"You/we/they → were; I/he/she/it → was."},{"id":"what","word":"what","pos":"pronoun","tr":"ne","en":"What is your favourite food?","entr":"En sevdiğin yemek ne?","ipa":"/wɒt/","tip":"'What?' tek başına 'Ne?' demek; kibar hâli 'Pardon?'."},{"id":"whatever","word":"whatever","pos":"pronoun","tr":"her ne, ne olursa","en":"You can eat whatever you want.","entr":"Ne istersen yiyebilirsin.","ipa":"/wɒtˈev.ər/","tip":"What (ne) + ever (her) = her ne."},{"id":"when","word":"when","pos":"adverb","tr":"ne zaman; -dığında","en":"When is your birthday?","entr":"Doğum günün ne zaman?","ipa":"/wen/","tip":"Soru kelimesi ve bağlaç: I was happy when I saw her."},{"id":"where","word":"where","pos":"adverb","tr":"nerede, nereye","en":"Where do you live?","entr":"Nerede yaşıyorsun?","ipa":"/weər/","tip":"'Where are you from?' = Nerelisin?"},{"id":"whether","word":"whether","pos":"conjunction","tr":"-ip -mediği, olup olmadığı","en":"I don't know whether he is coming.","entr":"Gelip gelmeyeceğini bilmiyorum.","ipa":"/ˈweð.ər/","tip":"'If' gibi düşün: whether or not = ...sa da ...masa da."},{"id":"which","word":"which","pos":"pronoun","tr":"hangi, hangisi","en":"Which bag is yours?","entr":"Hangi çanta senin?","ipa":"/wɪtʃ/","tip":"Seçenekler arasından seçim yaparken: which one?"},{"id":"while","word":"while","pos":"conjunction","tr":"-iken, sırasında","en":"I listen to music while I study.","entr":"Ders çalışırken müzik dinlerim.","ipa":"/waɪl/","tip":"İsim olarak 'bir süre': wait a while."},{"id":"whistle","word":"whistle","pos":"noun","tr":"düdük; ıslık","en":"The referee blew the whistle.","entr":"Hakem düdüğü çaldı.","ipa":"/ˈwɪs.əl/","tip":"'t' okunmaz: /ˈwɪs.əl/."},{"id":"white","word":"white","pos":"adjective","tr":"beyaz","en":"Snow is white.","entr":"Kar beyazdır.","ipa":"/waɪt/","tip":"'h' okunmaz: /waɪt/. Zıttı 'black'."},{"id":"who","word":"who","pos":"pronoun","tr":"kim","en":"Who is your English teacher?","entr":"İngilizce öğretmenin kim?","ipa":"/huː/","tip":"'w' okunmaz: /huː/."},{"id":"whole","word":"whole","pos":"adjective","tr":"bütün, tüm","en":"He ate the whole pizza.","entr":"Bütün pizzayı yedi.","ipa":"/həʊl/","tip":"'Hole' (delik) ile aynı okunur; 'w' okunmaz."},{"id":"whom","word":"whom","pos":"pronoun","tr":"kimi, kime","en":"To whom did you give the letter?","entr":"Mektubu kime verdin?","ipa":"/huːm/","tip":"'Who'nun resmi nesne hâli; günlük konuşmada genelde 'who' kullanılır."},{"id":"whose","word":"whose","pos":"pronoun","tr":"kimin","en":"Whose phone is this?","entr":"Bu kimin telefonu?","ipa":"/huːz/","tip":"'Who's' (who is) ile aynı okunur ama anlamı 'kimin'."},{"id":"why","word":"why","pos":"adverb","tr":"neden, niçin","en":"Why are you late?","entr":"Neden geç kaldın?","ipa":"/waɪ/","tip":"Cevabı genelde 'because' ile başlar."},{"id":"wide","word":"wide","pos":"adjective","tr":"geniş","en":"The river is very wide here.","entr":"Nehir burada çok geniş.","ipa":"/waɪd/","tip":"Zıttı 'narrow' (dar). Worldwide = dünya çapında."},{"id":"wife","word":"wife","pos":"noun","tr":"eş (kadın), karı","en":"This is my wife, Ayşe.","entr":"Bu eşim Ayşe.","ipa":"/waɪf/","tip":"Düzensiz çoğul: one wife, two wives. Erkek eş 'husband'."},{"id":"will","word":"will","pos":"verb","tr":"-ecek, -acak (gelecek zaman)","en":"I will call you tomorrow.","entr":"Seni yarın arayacağım.","ipa":"/wɪl/","tip":"Kısaltması 'll: I will = I'll."},{"id":"win","word":"win","pos":"verb","tr":"kazanmak","en":"I hope our team will win the match.","entr":"Umarım takımımız maçı kazanır.","ipa":"/wɪn/","tip":"Win → won → won. Zıttı 'lose'."},{"id":"window","word":"window","pos":"noun","tr":"pencere","en":"Can you open the window?","entr":"Pencereyi açabilir misin?","ipa":"/ˈwɪn.dəʊ/","tip":"Wind (rüzgâr) kökünden: rüzgârın girdiği delik."},{"id":"windy","word":"windy","pos":"adjective","tr":"rüzgârlı","en":"It's very windy at the seaside today.","entr":"Bugün sahilde çok rüzgâr var.","ipa":"/ˈwɪn.di/","tip":"Wind (rüzgâr) + -y = rüzgârlı."},{"id":"wish","word":"wish","pos":"verb","tr":"dilemek","en":"I wish you a happy birthday.","entr":"Sana mutlu bir doğum günü dilerim.","ipa":"/wɪʃ/","tip":"'Best wishes' = en iyi dileklerimle."},{"id":"with","word":"with","pos":"preposition","tr":"ile, birlikte","en":"I go to school with my sister.","entr":"Okula kız kardeşimle giderim.","ipa":"/wɪð/","tip":"Zıttı 'without' (-sız)."},{"id":"without","word":"without","pos":"preposition","tr":"-sız, -meden","en":"I drink my tea without sugar.","entr":"Çayımı şekersiz içerim.","ipa":"/wɪˈðaʊt/","tip":"With (ile) + out (dışarı) = ...sız."},{"id":"wives","word":"wives","pos":"noun","tr":"eşler, karılar (wife kelimesinin çoğulu)","en":"The players and their wives came to the dinner.","entr":"Oyuncular ve eşleri yemeğe geldi.","ipa":"/waɪvz/","tip":"Wife → wives: -f, çoğulda -ves olur (knife → knives gibi)."},{"id":"woman","word":"woman","pos":"noun","tr":"kadın","en":"The woman in the red coat is my aunt.","entr":"Kırmızı paltolu kadın teyzem.","ipa":"/ˈwʊm.ən/","tip":"Çoğulu 'women' ve /ˈwɪm.ɪn/ okunur."},{"id":"won","word":"won","pos":"verb","tr":"kazandı (win fiilinin geçmiş hâli)","en":"Our class won the competition.","entr":"Sınıfımız yarışmayı kazandı.","ipa":"/wʌn/","tip":"Win → won → won. 'One' (bir) ile aynı okunur."},{"id":"wonderful","word":"wonderful","pos":"adjective","tr":"harika, muhteşem","en":"We had a wonderful holiday.","entr":"Harika bir tatil geçirdik.","ipa":"/ˈwʌn.də.fəl/","tip":"Wonder (hayret) + -ful (dolu) = hayranlık verici, harika."},{"id":"word","word":"word","pos":"noun","tr":"kelime, sözcük; söz","en":"I learn a new word every day.","entr":"Her gün yeni bir kelime öğreniyorum.","ipa":"/wɜːd/","tip":"Bu uygulamanın konusu: words! 'Keep your word' = sözünü tut."},{"id":"work","word":"work","pos":"verb","tr":"çalışmak; çalışmak (makine)","en":"My parents work in a hospital.","entr":"Annemle babam bir hastanede çalışıyor.","ipa":"/wɜːk/","tip":"'It doesn't work' = çalışmıyor, bozuk."},{"id":"working","word":"working","pos":"adjective","tr":"çalışan; çalışma ile ilgili","en":"My working hours are from nine to five.","entr":"Çalışma saatlerim dokuzdan beşe kadar.","ipa":"/ˈwɜː.kɪŋ/","tip":"Working day = iş günü."},{"id":"workman","word":"workman","pos":"noun","tr":"işçi","en":"A workman is repairing the road.","entr":"Bir işçi yolu tamir ediyor.","ipa":"/ˈwɜːk.mən/","tip":"Work (iş) + man (adam) = işçi."},{"id":"worn","word":"worn","pos":"verb","tr":"giyilmiş (wear fiilinin üçüncü hâli)","en":"I have never worn this dress.","entr":"Bu elbiseyi hiç giymedim.","ipa":"/wɔːn/","tip":"Wear → wore → worn. 'Worn out' = yıpranmış, bitkin."},{"id":"worry","word":"worry","pos":"verb","tr":"endişelenmek","en":"Don't worry; everything will be fine.","entr":"Endişelenme, her şey yoluna girecek.","ipa":"/ˈwʌr.i/","tip":"'Don't worry' = merak etme, endişelenme."},{"id":"worse","word":"worse","pos":"adjective","tr":"daha kötü","en":"The weather is worse today than yesterday.","entr":"Hava bugün dünden daha kötü.","ipa":"/wɜːs/","tip":"Bad → worse → worst: kötü → daha kötü → en kötü."},{"id":"would","word":"would","pos":"verb","tr":"-erdi, -ardı; (would like) isterim","en":"Would you like some cake?","entr":"Biraz kek ister misin?","ipa":"/wʊd/","tip":"'l' okunmaz: /wʊd/. 'Would you like...?' kibar ikram kalıbı."},{"id":"write","word":"write","pos":"verb","tr":"yazmak","en":"Write your name at the top of the page.","entr":"Adını sayfanın en üstüne yaz.","ipa":"/raɪt/","tip":"'w' okunmaz; 'right' ile aynı okunur. Write → wrote → written."},{"id":"wrong","word":"wrong","pos":"adjective","tr":"yanlış","en":"Sorry, you have the wrong number.","entr":"Üzgünüm, yanlış numarayı aradınız.","ipa":"/rɒŋ/","tip":"'w' okunmaz: /rɒŋ/. Zıttı 'right' (doğru)."},{"id":"wrote","word":"wrote","pos":"verb","tr":"yazdı (write fiilinin geçmiş hâli)","en":"I wrote a letter to my pen friend.","entr":"Mektup arkadaşıma bir mektup yazdım.","ipa":"/rəʊt/","tip":"Write → wrote → written."},{"id":"year","word":"year","pos":"noun","tr":"yıl","en":"Happy New Year!","entr":"Mutlu yıllar!","ipa":"/jɪər/","tip":"Yaş sorarken: I am ten years old."},{"id":"yellow","word":"yellow","pos":"adjective","tr":"sarı","en":"Bananas are yellow.","entr":"Muzlar sarıdır.","ipa":"/ˈjel.əʊ/","tip":"Yellow card = sarı kart."},{"id":"yes","word":"yes","pos":"adverb","tr":"evet","en":"Yes, I can help you.","entr":"Evet, sana yardım edebilirim.","ipa":"/jes/","tip":"Zıttı 'no' (hayır)."},{"id":"yesterday","word":"yesterday","pos":"adverb","tr":"dün","en":"I saw her yesterday.","entr":"Onu dün gördüm.","ipa":"/ˈjes.tə.deɪ/","tip":"Yesterday (dün) → today (bugün) → tomorrow (yarın). Fiil geçmiş zamanda olur."},{"id":"yet","word":"yet","pos":"adverb","tr":"henüz, daha","en":"I haven't finished my homework yet.","entr":"Ödevimi henüz bitirmedim.","ipa":"/jet/","tip":"Olumsuz ve soru cümlelerinin sonunda: Not yet = henüz değil."},{"id":"yoghurt","word":"yoghurt","pos":"noun","tr":"yoğurt","en":"We eat yoghurt with almost every meal.","entr":"Neredeyse her yemekle yoğurt yeriz.","ipa":"/ˈjɒɡ.ət/","tip":"Türkçe 'yoğurt' kelimesinden dünyaya yayılmıştır!"},{"id":"you","word":"you","pos":"pronoun","tr":"sen, siz; seni, sizi","en":"Thank you very much.","entr":"Çok teşekkür ederim.","ipa":"/juː/","tip":"Tekil ve çoğul için aynı: sen de siz de 'you'."},{"id":"young","word":"young","pos":"adjective","tr":"genç","en":"My grandmother looks young for her age.","entr":"Babaannem yaşına göre genç görünüyor.","ipa":"/jʌŋ/","tip":"Zıttı 'old' (yaşlı)."},{"id":"your","word":"your","pos":"determiner","tr":"senin, sizin","en":"Is this your bag?","entr":"Bu senin çantan mı?","ipa":"/jɔːr/","tip":"'You're' (you are) ile karıştırma: your = senin."},{"id":"yours","word":"yours","pos":"pronoun","tr":"seninki, sizinki","en":"Is this pen yours?","entr":"Bu kalem seninki mi?","ipa":"/jɔːz/","tip":"Mektup sonunda 'Yours sincerely' = saygılarımla."},{"id":"yourself","word":"yourself","pos":"pronoun","tr":"kendin, kendini","en":"Help yourself to some fruit.","entr":"Meyveden buyur, al.","ipa":"/jɔːˈself/","tip":"'Help yourself' = buyur, kendin al. 'Take care of yourself' = kendine iyi bak."},{"id":"yourselves","word":"yourselves","pos":"pronoun","tr":"kendiniz, kendinizi","en":"Children, please behave yourselves.","entr":"Çocuklar, lütfen uslu durun.","ipa":"/jɔːˈselvz/","tip":"Yourself'in çoğulu: birden fazla kişiye seslenirken."},{"id":"zero","word":"zero","pos":"number","tr":"sıfır","en":"The temperature fell below zero last night.","entr":"Dün gece sıcaklık sıfırın altına düştü.","ipa":"/ˈzɪə.rəʊ/","tip":"Telefon numarasında 0 bazen 'oh' diye okunur."},{"id":"zoo","word":"zoo","pos":"noun","tr":"hayvanat bahçesi","en":"We saw lions and giraffes at the zoo.","entr":"Hayvanat bahçesinde aslan ve zürafa gördük.","ipa":"/zuː/","tip":"Zoology (zooloji) kelimesinin kısaltmasından gelir."}];
const TEXTS = [{"id":"t001","title":"Republic Day","topic":"Bayram","date":"2026-10-28","paragraphs":["Tomorrow is the twenty-ninth of October. It is Republic Day in Turkey. Every school and office is closed. People put a big red flag on the balcony.","In the morning, children sing songs at school. In the evening, families walk in the city center and watch the lights. My father always says, \"This is a great day for our country.\" I love this day."],"tr":["Yarın ekimin yirmi dokuzu. Türkiye'de Cumhuriyet Bayramı. Her okul ve ofis kapalı. İnsanlar balkona büyük bir kırmızı bayrak asar.","Sabah çocuklar okulda şarkı söyler. Akşam aileler şehir merkezinde yürür ve ışıkları izler. Babam her zaman \"Bu, ülkemiz için harika bir gün\" der. Bu günü seviyorum."],"gloss":{"twenty-ninth":"yirmi dokuzuncu","republic":"cumhuriyet","turkey":"Türkiye","song":"şarkı"},"cat":"gundem"},{"id":"t002","title":"Autumn Weather","topic":"Hava durumu","date":"2026-10-27","paragraphs":["Autumn is here. The weather is cold and cloudy today. It rains a lot in October. The streets are wet, and the leaves fall from the trees.","I wear a warm jacket and take an umbrella to work. In the evening, I drink hot tea and read a book at home. My cat sleeps on the sofa. I like autumn because it is quiet."],"tr":["Sonbahar geldi. Bugün hava soğuk ve bulutlu. Ekim ayında çok yağmur yağar. Sokaklar ıslak ve yapraklar ağaçlardan düşüyor.","Sıcak bir ceket giyerim ve işe şemsiye alırım. Akşam sıcak çay içer ve evde kitap okurum. Kedim kanepede uyur. Sonbaharı severim çünkü sessiz."],"gloss":{"leaf":"yaprak","umbrella":"şemsiye","sofa":"kanepe","quiet":"sessiz","wet":"ıslak","autumn":"sonbahar"},"cat":"doga"},{"id":"t003","title":"My New Phone","topic":"Teknoloji","date":"2026-10-26","paragraphs":["I bought a new phone last week. It has a good camera and a big screen. I use it every day. I send messages to my friends, and I listen to music on the bus.","My sister uses it to learn English. She plays word games and reads short stories. But my father says, \"Do not look at the phone all day.\" He is right. I put it in my bag at dinner."],"tr":["Geçen hafta yeni bir telefon aldım. İyi bir kamerası ve büyük bir ekranı var. Her gün kullanırım. Arkadaşlarıma mesaj gönderirim ve otobüste müzik dinlerim.","Kız kardeşim onu İngilizce öğrenmek için kullanır. Kelime oyunları oynar ve kısa hikayeler okur. Ama babam \"Bütün gün telefona bakma\" der. Haklı. Akşam yemeğinde onu çantama koyarım."],"gloss":{"screen":"ekran","music":"müzik","story":"hikaye","phone":"telefon"},"cat":"teknoloji"},{"id":"t004","title":"The Weekend Match","topic":"Spor","date":"2026-10-25","paragraphs":["On Saturday, we watched a football match on television. Our team played very well. The goalkeeper stopped two important goals.","In the second half, a young player scored a great goal. The crowd stood up and shouted. At the end, we won three to one. My brother was so happy that he called all his friends."],"tr":["Cumartesi günü televizyonda bir futbol maçı izledik. Takımımız çok iyi oynadı. Kaleci iki önemli golü önledi.","İkinci yarıda genç bir oyuncu harika bir gol attı. Kalabalık ayağa kalktı ve bağırdı. Sonunda üçe bir kazandık. Kardeşim o kadar mutluydu ki bütün arkadaşlarını aradı."],"gloss":{"crowd":"kalabalık","shout":"bağırmak","stand":"ayakta durmak","stood":"ayağa kalktı","score":"gol atmak","won":"kazandı","win":"kazanmak","play":"oynamak","team":"takım","match":"maç","half":"yarı","saturday":"cumartesi"},"cat":"spor"},{"id":"t005","title":"A Healthy Breakfast","topic":"Sağlık","date":"2026-10-24","paragraphs":["A good breakfast gives you energy for the day. In my house, we eat white cheese, olives, tomatoes, and fresh bread. Sometimes my mother makes eggs.","I drink a glass of milk or a cup of tea. We do not eat too much sugar. Doctors say that breakfast is important for your health. I never skip it. What do you eat in the morning?"],"tr":["İyi bir kahvaltı size gün boyu enerji verir. Evimizde beyaz peynir, zeytin, domates ve taze ekmek yeriz. Bazen annem yumurta yapar.","Bir bardak süt ya da bir fincan çay içerim. Çok fazla şeker yemeyiz. Doktorlar kahvaltının sağlık için önemli olduğunu söyler. Onu asla atlamam. Sabahları ne yersin?"],"gloss":{"tomato":"domates","olive":"zeytin","milk":"süt","sugar":"şeker","skip":"atlamak","health":"sağlık","too":"çok fazla, de/da","never":"asla"},"cat":"saglik"},{"id":"t006","title":"At the Doctor","topic":"Sağlık","date":"2026-10-23","paragraphs":["It is the flu season. Many people have a cough and a headache. Yesterday, I felt tired and hot, so I went to the doctor.","He looked at my throat and listened to my heart. He said, \"You have a cold. Stay at home, drink warm water, and rest.\" He gave me some medicine. Today I feel better. Wash your hands often and keep warm."],"tr":["Grip mevsimi. Birçok insanın öksürüğü ve baş ağrısı var. Dün yorgun ve sıcak hissettim, bu yüzden doktora gittim.","Boğazıma baktı ve kalbimi dinledi. \"Üşütmüşsün. Evde kal, ılık su iç ve dinlen\" dedi. Bana biraz ilaç verdi. Bugün daha iyi hissediyorum. Ellerinizi sık sık yıkayın ve sıcak tutun."],"gloss":{"flu":"grip","headache":"baş ağrısı","throat":"boğaz","medicine":"ilaç","cold":"nezle, soğuk","stay":"kalmak","often":"sık sık","went":"gitti","wash":"yıkamak"},"cat":"saglik"},{"id":"t007","title":"Winter Shopping","topic":"Alışveriş","date":"2026-10-22","paragraphs":["Winter is coming, so I need new clothes. On Sunday, I went to the market with my mother. We looked at coats, hats, gloves, and warm socks. Everything was expensive.","At last, we found a nice brown coat at a cheap price. I paid at the cashier by card. We also bought a blue scarf for my father. We came home tired but happy."],"tr":["Kış geliyor, bu yüzden yeni kıyafetlere ihtiyacım var. Pazar günü annemle çarşıya gittim. Paltolara, şapkalara, eldivenlere ve sıcak çoraplara baktık. Her şey pahalıydı.","Sonunda ucuz bir fiyata güzel bir kahverengi palto bulduk. Kasada kartla öded   save(st){if(!K)return;mem=st;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}},

let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,d,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol||.15,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.03)}
function sfx(k){if(S.settings&&S.settings.sound===false)return;
 if(k==='ok'){tone(659,0,.12,'sine',.2);tone(880,.09,.22,'sine',.2)}
 else if(k==='bad'){tone(233,0,.16,'triangle',.22);tone(175,.12,.28,'triangle',.22);try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}}
 else if(k==='tap'){tone(1100,0,.04,'square',.035)}
 else if(k==='done'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.24,'sine',.17))}}

function orderIds(){const o=S.order||[],have=new Set(o);const add=WORDS.map(w=>w.id).filter(i=>!have.has(i));if(add.length||!S.order){S.order=o.concat(shuffle(add))}return S.order}
function migrate(){if(!curP()||(S.mig||0)>=2)return;S.mig=2;for(const id in S.progress){const p=S.progress[id],w=byId[id];if(p.status==='unseen'&&w&&hasData(w)&&(p.ok||0)>0){p.status='active';p.via='list';p.mastery=Math.min(3,Math.max(0,(p.ok||0)-(p.bad||0)));if(p.mastery>=3)learn(id)}}save()}
function ensureActive(){migrate();let n=setIds().length;for(const w of orderIds().map(i=>byId[i]).filter(Boolean)){if(n>=S.settings.activeSize)break;if(hasData(w)&&P(w.id).status==='unseen'){const p=PW(w.id);p.status='active';p.mastery=0;n++}}save()}
function bumpDay(){const t=today(),st=S.stats;st.hist=st.hist||{};st.hist[t]=(st.hist[t]||0)+1;const hk=Object.keys(st.hist).sort();while(hk.length>40)delete st.hist[hk.shift()];if(st.today.d!==t)st.today={d:t,n:0};st.today.n++;
 if(st.last!==t){const y=dkey(new Date(Date.now()-864e5));st.streak=(st.last===y)?st.streak+1:1;st.last=t}}
const SRI=[0,1,2,4,7,15,30];
const dueOf=p=>p.status==='learned'?(p.due||((p.learnedAt||0)+2*864e5)):Infinity;
const dueIds=()=>WORDS.filter(w=>hasData(w)&&dueOf(P(w.id))<=Date.now()).map(w=>w.id);
function learn(id){const p=PW(id);if(!p.due||p.due<Date.now()){p.step=Math.max(p.step||0,2);p.due=Date.now()+SRI[p.step]*864e5}p.status='learned';p.mastery=3;p.learnedAt=Date.now();ensureActive()}
function grade(id,ok,hardMode){const p=PW(id),w=byId[id];p.seen++;bumpDay();
 if(p.status==='unseen'&&w&&hasData(w)){p.status='active';p.mastery=0;p.via=p.via||'list'}
 p.step=ok?Math.min(6,(p.step||0)+1):0;p.due=Date.now()+SRI[p.step]*864e5;
 if(ok){p.ok++;if(p.isHard){p.hardOk=(p.hardOk||0)+1;if(p.hardOk>=3){p.isHard=false;p.hardOk=0;p.wr=0}}
  if(p.status==='active'){p.mastery=Math.min(3,p.mastery+1);if(p.mastery>=3)learn(id)}}
 else{p.bad++;p.hardOk=0;p.wr=(p.wr||0)+1;if(p.wr>=2)p.isHard=true;
  if(p.status==='learned'){p.status='active';p.mastery=1;p.lapses=(p.lapses||0)+1;p.due=Date.now()}
  else if(p.status==='active')p.mastery=Math.max(0,p.mastery-1)}
 save()}
