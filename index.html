<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d94f4f">
<title>Kelime Kartları</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f0ea;--card:#fffdfa;--ink:#23262f;--mute:#7a7f8c;--line:#e8e3da;--red:#e07a68;--red-soft:#fcebe6;--ok:#4f9b86;--ok-soft:#e2f1ec;--bad:#cf6457;--bad-soft:#fbe5e1;--blue:#6f80d0;--blue-soft:#e8ebfa;--amber:#c99530;--amber-soft:#fbf1da;--shadow:0 1px 2px rgba(40,30,20,.05),0 8px 24px rgba(40,30,20,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--card:#1e2027;--ink:#ecebe8;--mute:#9a9ea9;--line:#2c2f38;--red:#ee8e7c;--red-soft:#39282a;--ok:#6fc0a8;--ok-soft:#1d3530;--bad:#ef8174;--bad-soft:#3a2522;--blue:#93a3f0;--blue-soft:#262a45;--amber:#e3b455;--amber-soft:#3b3220;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#root{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:22px 18px 110px}
h1{font-size:32px;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:2px 0 16px}h2{font-size:21px;font-weight:800;letter-spacing:-.015em;margin:20px 0 8px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}.mute{color:var(--mute);font-size:14px}
.btn{appearance:none;border:1px solid var(--line);border-radius:18px;padding:15px 18px;font:700 16px inherit;font-family:inherit;background:var(--card);color:var(--ink);cursor:pointer;width:100%;text-align:center;transition:transform .12s}
.btn.primary{background:linear-gradient(135deg,#ec9080,#df7664);color:#fff;border:0;box-shadow:0 8px 20px rgba(224,122,104,.35)}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:active,.tile:active{transform:scale(.97)}.btn[disabled]{opacity:.45}.btn.opt[disabled]{opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{text-align:center}.stat b{display:block;font-size:30px;font-weight:800;color:var(--ink);line-height:1.1}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ee9a8a,#e07a68);border-radius:6px}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--red-soft);color:var(--red);font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.mute{background:var(--line);color:var(--mute)}.badge.hard{background:var(--amber-soft);color:var(--amber)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(40,30,20,.06);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav .in{display:flex;width:100%;max-width:560px;padding:8px 6px 6px}nav button{flex:1;background:none;border:0;padding:2px 0;color:var(--mute);font:700 12px inherit;font-family:inherit}
nav .pill{display:grid;place-items:center;width:60px;height:34px;border-radius:17px;margin:0 auto 3px;transition:background .15s}
nav button.on{color:var(--red)}nav button.on .pill{background:var(--red-soft)}nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(135deg,var(--red-soft),var(--blue-soft));border-radius:28px;padding:20px;margin-bottom:16px;display:flex;gap:18px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}.ring svg{width:96px;height:96px;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.tile{display:flex;gap:16px;align-items:center;padding:18px;border-radius:24px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px;cursor:pointer;transition:transform .12s;border:0;width:100%;text-align:left;font:inherit;color:inherit}
.tile .ib{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none}
.tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}.tile .mute{display:block;margin-top:1px}.tile[disabled]{opacity:.5}
.tile.sm{flex-direction:column;align-items:flex-start;gap:12px;margin:0}.tile.sm b{font-size:18px}
.t-red .ib{background:var(--red-soft);color:var(--red)}.t-ok .ib{background:var(--ok-soft);color:var(--ok)}.t-blue .ib{background:var(--blue-soft);color:var(--blue)}.t-amber .ib{background:var(--amber-soft);color:var(--amber)}
.tile.feat{padding:22px}.tile.feat.t-red{background:linear-gradient(135deg,var(--red-soft),var(--card) 70%)}.tile.feat.t-ok{background:linear-gradient(135deg,var(--ok-soft),var(--card) 70%)}
.fc{min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;border-radius:30px;padding:28px}
.fc .w{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0;word-break:break-word}.fc .ipa{color:var(--mute);font-size:19px}
.fc .tr{font-size:30px;font-weight:800;color:var(--red)}.fc .en{font-size:19px;margin-top:14px}.fc .en b{color:var(--red)}.fc .sentr{color:var(--mute);margin-top:4px}
.fc .tip{margin-top:14px;font-size:14px;background:var(--red-soft);padding:10px 12px;border-radius:14px;text-align:left}
.sp{border:0;background:var(--red-soft);color:var(--red);border-radius:50%;width:48px;height:48px;font-size:20px;margin-top:6px}
.prog{display:flex;gap:8px;align-items:center;margin-bottom:12px}.prog .bar{flex:1}
.opt{margin-bottom:10px}.opt.right{background:var(--ok);color:#fff;border-color:transparent}.opt.wrong{background:var(--bad);color:#fff;border-color:transparent}
.q{font-size:23px;line-height:1.55;margin:6px 0 4px}.q u{display:inline-block;min-width:80px;border-bottom:3px solid var(--red);text-decoration:none;color:var(--red);text-align:center;font-weight:800}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mt .btn{padding:16px 8px;font-size:15px}
.mt .btn.sel{outline:3px solid var(--blue)}.mt .btn.done{visibility:hidden}.mt .btn.shake{background:var(--bad-soft)}
.list .it{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border:0}.list .it .n{font-weight:700}
input[type=search],input[type=text],select{width:100%;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px}.hdr b{font-size:21px;font-weight:800}.hdr .back{background:var(--card);border:0;border-radius:50%;width:42px;height:42px;font-size:22px;color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#2b2d35;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:30}
.center{text-align:center}.big{font-size:54px}.tiny{font-size:12px}
.tx p{font-size:20px;line-height:1.85;margin:0 0 14px}.tx p.trp{font-size:15px;line-height:1.55;color:var(--mute);margin:-6px 0 14px;padding-left:10px;border-left:3px solid var(--line)}
.tk{cursor:pointer;border-radius:5px;padding:0 1px}.tk.l{background:var(--ok-soft)}.tk.a{background:var(--red-soft)}.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--red-soft);overflow:hidden;flex:none;line-height:1}.av img{width:100%;height:100%;object-fit:cover}.avb{border:0;background:none;padding:0;cursor:pointer}
.emg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 0}.emb{border:2px solid transparent;background:var(--card);border-radius:18px;font-size:32px;padding:10px 0;box-shadow:var(--shadow)}.emb.on{border-color:var(--red);background:var(--red-soft)}
.chs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}.chs::-webkit-scrollbar{display:none}.ch{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:700 14px inherit;font-family:inherit}.ch.on{background:var(--red);border-color:var(--red);color:#fff}
.lgb{border:0;border-radius:10px;padding:6px 12px;font:700 13px inherit;font-family:inherit;color:var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;font-size:12px;font-weight:600}.lg span{padding:3px 10px;border-radius:8px}
.sbg{position:fixed;inset:0;background:rgba(20,15,10,.4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.sheet .ctx{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div id="sheet"></div><div id="root"><main id="app"></main>
<nav><div class="in"></div></nav></div>
<script>
/* ===== DATA ===== */
const WORDS = [{"id":"a","word":"a","pos":"article","tr":"bir","en":"I bought a new coffee cup.","entr":"Yeni bir kahve fincanı aldım.","ipa":"/ə/","tip":"Tek bir harf, tek 'bir' şey demektir."},{"id":"a.m.","word":"a.m.","pos":"abbreviation","tr":"öğleden önce, sabah","en":"My work starts at 8 a.m.","entr":"İşim sabah saat 8'de başlıyor.","ipa":"/ˌeɪˈem/","tip":"a.m. = öğleden önce; \"AM\" sabah alarmı gibi düşün."},{"id":"ability","word":"ability","pos":"noun","tr":"yetenek, beceri","en":"She has great cooking ability.","entr":"Onun harika bir yemek yapma yeteneği var.","ipa":"/əˈbɪl.ə.ti/","tip":"'Aaa bilirdi!' — Çok yetenekli olduğu için her işi bilirdi."},{"id":"able","word":"able","pos":"adjective","tr":"yapabilen, -ebilir","en":"I am able to drive a car.","entr":"Araba kullanabiliyorum.","ipa":"/ˈeɪ.bəl/","tip":"\"Eybıl\" gibi okunur: \"Hey, bil!\" — yapabilen kişi bilir."},{"id":"about","word":"about","pos":"preposition","tr":"hakkında, yaklaşık","en":"We talked about our holiday plans.","entr":"Tatil planlarımız hakkında konuştuk.","ipa":"/əˈbaʊt/","tip":"\"Abaut\" — bu konu HAKKINDA konuşalım."},{"id":"absolutely","word":"absolutely","pos":"adverb","tr":"kesinlikle, tamamen","en":"This cake is absolutely delicious.","entr":"Bu pasta kesinlikle çok lezzetli.","ipa":"/ˌæb.səˈluːt.li/","tip":""},{"id":"accept","word":"accept","pos":"verb","tr":"kabul etmek","en":"We accept credit cards here.","entr":"Burada kredi kartı kabul ediyoruz.","ipa":"/əkˈsept/","tip":"'Ak cep' — Teklifi kabul edip parayı ak cebine koydu."},{"id":"accident","word":"accident","pos":"noun","tr":"kaza, tesadüf","en":"I spilled my tea by accident.","entr":"Çayımı kazara döktüm.","ipa":"/ˈæk.sɪ.dənt/","tip":"'Aksi' bir durum oldu ve kaza meydana geldi."},{"id":"achieve","word":"achieve","pos":"verb","tr":"başarmak, ulaşmak","en":"You can achieve your goals today.","entr":"Bugün hedeflerine ulaşabilirsin.","ipa":"/əˈtʃiːv/","tip":"'Aç ev' — Hedefini başardın, yeni evinin kapısını aç!"},{"id":"across","word":"across","pos":"preposition","tr":"karşısında, karşıdan karşıya","en":"The bakery is across the street.","entr":"Fırın caddenin karşısındadır.","ipa":"/əˈkrɒs/","tip":"\"Akros\" — caddenin karşısına geç."},{"id":"act","word":"act","pos":"verb","tr":"davranmak, rol yapmak","en":"We must act quickly now.","entr":"Şimdi hızlı hareket etmeliyiz.","ipa":"/ækt/","tip":"'Aktör' sahnede rol yapar ve davranır."},{"id":"action","word":"action","pos":"noun","tr":"hareket, eylem","en":"I like watching action movies.","entr":"Aksiyon filmleri izlemeyi severim.","ipa":"/ˈæk.ʃən/","tip":"Türkçedeki 'aksiyon' kelimesiyle aynı kökten gelir."},{"id":"activity","word":"activity","pos":"noun","tr":"etkinlik, faaliyet","en":"Swimming is a healthy weekend activity.","entr":"Yüzmek sağlıklı bir hafta sonu etkinliğidir.","ipa":"/ækˈtɪv.ə.ti/","tip":"Türkçedeki 'aktivite' kelimesidir."},{"id":"actually","word":"actually","pos":"adverb","tr":"aslında, gerçekten","en":"Actually, I prefer drinking hot tea.","entr":"Aslında sıcak çay içmeyi tercih ederim.","ipa":"/ˈæk.tʃu.ə.li/","tip":"'Ak çuval' — Aslında o çuval ak (beyaz) renktedir."},{"id":"add","word":"add","pos":"verb","tr":"eklemek, ilave etmek","en":"Please add some salt to the soup.","entr":"Lütfen çorbaya biraz tuz ekle.","ipa":"/æd/","tip":"'Et' — Yemeğe biraz da et ekle."},{"id":"address","word":"address","pos":"noun","tr":"adres","en":"Write your home address on paper.","entr":"Ev adresini kağıda yaz.","ipa":"/əˈdres/","tip":"Türkçedeki 'adres' kelimesiyle aynıdır."},{"id":"adjective","word":"adjective","pos":"noun","tr":"sıfat","en":"Big is an easy English adjective.","entr":"Big, kolay bir İngilizce sıfattır.","ipa":"/ˈædʒ.ek.tɪv/","tip":""},{"id":"advantage","word":"advantage","pos":"noun","tr":"avantaj, fayda","en":"Knowing English is a big advantage.","entr":"İngilizce bilmek büyük bir avantajdır.","ipa":"/ədˈvɑːn.tɪdʒ/","tip":"Türkçedeki 'avantaj' kelimesidir."},{"id":"aerial","word":"aerial","pos":"noun","tr":"anten","en":"The television aerial is on the roof.","entr":"Televizyon anteni çatıdadır.","ipa":"/ˈeə.ri.əl/","tip":""},{"id":"aeroplane","word":"aeroplane","pos":"noun","tr":"uçak","en":"The aeroplane landed at the airport.","entr":"Uçak havalimanına indi.","ipa":"/ˈeə.rə.pleɪn/","tip":"'Aero' hava demektir, havada süzülen uçak."},{"id":"affect","word":"affect","pos":"verb","tr":"etkilemek","en":"Cold weather can affect your health.","entr":"Soğuk hava sağlığınızı etkileyebilir.","ipa":"/əˈfekt/","tip":"Film 'efekt'leri izleyicileri çok etkiler."},{"id":"afraid","word":"afraid","pos":"adjective","tr":"korkmuş, korkan","en":"My cat is afraid of dogs.","entr":"Kedim köpeklerden korkar.","ipa":"/əˈfreɪd/","tip":"'Efrat' — Evdeki efrat karanlıktan korktu."},{"id":"after","word":"after","pos":"preposition","tr":"sonra, -den sonra","en":"I drink coffee after breakfast.","entr":"Kahvaltıdan sonra kahve içerim.","ipa":"/ˈɑːf.tər/","tip":"'Af ter' — Spor yaptıktan sonra ter atılır."},{"id":"afternoon","word":"afternoon","pos":"noun","tr":"öğleden sonra","en":"We have a meeting this afternoon.","entr":"Bu öğleden sonra bir toplantımız var.","ipa":"/ˌɑːf.təˈnuːn/","tip":"'After' (sonra) + 'noon' (öğle) = öğleden sonra."},{"id":"again","word":"again","pos":"adverb","tr":"tekrar, yine","en":"Please read this short sentence again.","entr":"Lütfen bu kısa cümleyi tekrar oku.","ipa":"/əˈɡen/","tip":"'Eee gene' mi aynı şey oldu? Tekrar, yine!"},{"id":"against","word":"against","pos":"preposition","tr":"karşı, zıt","en":"Put the table against the wall.","entr":"Masayı duvara yasla.","ipa":"/əˈɡenst/","tip":""},{"id":"age","word":"age","pos":"noun","tr":"yaş, çağ","en":"What is your brother's age?","entr":"Erkek kardeşinin yaşı kaç?","ipa":"/eɪdʒ/","tip":"\"Eyc!\" — Kaç yaşındasın? Yaşın = age."},{"id":"ago","word":"ago","pos":"adverb","tr":"önce","en":"The bus left ten minutes ago.","entr":"Otobüs on dakika önce kalktı.","ipa":"/əˈɡəʊ/","tip":"'Eee go (git)' — O çoktan, yıllar önce gitti."},{"id":"agree","word":"agree","pos":"verb","tr":"katılmak, aynı fikirde olmak","en":"I agree with your good idea.","entr":"Senin güzel fikrine katılıyorum.","ipa":"/əˈɡriː/","tip":"'Eee gri!' — İkimiz de rengin gri olduğunda hemfikiriz."},{"id":"agreement","word":"agreement","pos":"noun","tr":"anlaşma, sözleşme","en":"We signed the house rental agreement.","entr":"Ev kira sözleşmesini imzaladık.","ipa":"/əˈɡriː.mənt/","tip":"Agree (katılmak) kelimesinden türeyen 'anlaşma'."},{"id":"air","word":"air","pos":"noun","tr":"hava","en":"Open the window for fresh air.","entr":"Temiz hava için pencereyi aç.","ipa":"/eər/","tip":"'Eğer' temiz hava alırsan rahat nefes alırsın."},{"id":"air-conditioner","word":"air-conditioner","pos":"noun","tr":"klima","en":"Turn on the air-conditioner in summer.","entr":"Yazın klimayı aç.","ipa":"/ˈeə kənˌdɪʃ.ən.ər/","tip":"Air (hava) şartlandırıcı, yani klima."},{"id":"airhostess","word":"airhostess","pos":"noun","tr":"hostes, kabin memuru","en":"The airhostess brought water to passengers.","entr":"Hostes yolculara su getirdi.","ipa":"/ˈeəˌhəʊ.stəs/","tip":"Air (hava) + hostess (hostes) = uçak hostesi."},{"id":"airline","word":"airline","pos":"noun","tr":"havayolu","en":"This airline flies to Istanbul daily.","entr":"Bu havayolu her gün İstanbul'a uçuyor.","ipa":"/ˈeə.laɪn/","tip":"Air (hava) + line (hat) = havayolu hattı."},{"id":"airplane","word":"airplane","pos":"noun","tr":"uçak","en":"We saw a big white airplane.","entr":"Büyük beyaz bir uçak gördük.","ipa":"/ˈeə.pleɪn/","tip":"Air (hava) + plane (düzlem/kanat) = uçak."},{"id":"alike","word":"alike","pos":"adjective","tr":"benzer, aynı","en":"The two sisters look very alike.","entr":"İki kız kardeş birbirine çok benziyor.","ipa":"/əˈlaɪk/","tip":"Like (gibi/benzer) kelimesinden: birbirinin aynısı."},{"id":"alive","word":"alive","pos":"adjective","tr":"canlı, hayatta","en":"Keep the green plants alive with water.","entr":"Yeşil bitkileri suyla canlı tut.","ipa":"/əˈlaɪv/","tip":"Canlı yayınlarda 'Live' yazar; alive = canlı."},{"id":"all","word":"all","pos":"determiner","tr":"bütün, tüm, hepsi","en":"All rooms in the hotel are clean.","entr":"Oteldeki bütün odalar temiz.","ipa":"/ɔːl/","tip":"\"Ol\" gibi okunur: hepsi olsun, hepsini al."},{"id":"all right","word":"all right","pos":"adjective","tr":"iyi, tamam, pekala","en":"Everything is all right at home.","entr":"Evde her şey yolunda.","ipa":"/ˌɔːl ˈraɪt/","tip":"All (hepsi) + right (doğru/iyi) = her şey tamam."},{"id":"allow","word":"allow","pos":"verb","tr":"izin vermek","en":"They do not allow pets inside.","entr":"İçeride evcil hayvana izin vermiyorlar.","ipa":"/əˈlaʊ/","tip":"'Alev' — Kamp alanında alev yakmaya izin verdiler."},{"id":"almost","word":"almost","pos":"adverb","tr":"neredeyse, hemen hemen","en":"Dinner is almost ready on the table.","entr":"Akşam yemeği masada neredeyse hazır.","ipa":"/ˈɔːl.məʊst/","tip":"'Ol dost' — Neredeyse dost oluyorduk."},{"id":"alone","word":"alone","pos":"adjective","tr":"yalnız, tek başına","en":"He lives alone in a small flat.","entr":"Küçük bir dairede yalnız yaşıyor.","ipa":"/əˈləʊn/","tip":"'Al on' — Al on lirayı, tek başına sinemaya git."},{"id":"along","word":"along","pos":"preposition","tr":"boyunca","en":"We walked along the beach together.","entr":"Birlikte sahil boyunca yürüdük.","ipa":"/əˈlɒŋ/","tip":"'Long' (uzun) yol boyunca yürümek."},{"id":"aloud","word":"aloud","pos":"adverb","tr":"yüksek sesle, sesli","en":"Read the English words aloud every day.","entr":"Her gün İngilizce kelimeleri yüksek sesle oku.","ipa":"/əˈlaʊd/","tip":"'Loud' yüksek ses demektir; aloud = sesli olarak."},{"id":"alphabet","word":"alphabet","pos":"noun","tr":"alfabe","en":"The English alphabet has twenty-six letters.","entr":"İngiliz alfabesinde yirmi altı harf vardır.","ipa":"/ˈæl.fə.bet/","tip":"Türkçedeki 'alfabe' kelimesiyle aynıdır."},{"id":"already","word":"already","pos":"adverb","tr":"zaten, çoktan","en":"I have already paid the bill.","entr":"Fat const TEXTS = [{"id":"t001","title":"Republic Day","topic":"Bayram","date":"2026-10-28","paragraphs":["Tomorrow is the twenty-ninth of October. It is Republic Day in Turkey. Every school and office is closed. People put a big red flag on the balcony.","In the morning, children sing songs at school. In the evening, families walk in the city center and watch the lights. My father always says, \"This is a great day for our country.\" I love this day."],"tr":["Yarın ekimin yirmi dokuzu. Türkiye'de Cumhuriyet Bayramı. Her okul ve ofis kapalı. İnsanlar balkona büyük bir kırmızı bayrak asar.","Sabah çocuklar okulda şarkı söyler. Akşam aileler şehir merkezinde yürür ve ışıkları izler. Babam her zaman \"Bu, ülkemiz için harika bir gün\" der. Bu günü seviyorum."],"gloss":{"twenty-ninth":"yirmi dokuzuncu","republic":"cumhuriyet","turkey":"Türkiye","song":"şarkı"},"cat":"gundem"},{"id":"t002","title":"Autumn Weather","topic":"Hava durumu","date":"2026-10-27","paragraphs":["Autumn is here. The weather is cold and cloudy today. It rains a lot in October. The streets are wet, and the leaves fall from the trees.","I wear a warm jacket and take an umbrella to work. In the evening, I drink hot tea and read a book at home. My cat sleeps on the sofa. I like autumn because it is quiet."],"tr":["Sonbahar geldi. Bugün hava soğuk ve bulutlu. Ekim ayında çok yağmur yağar. Sokaklar ıslak ve yapraklar ağaçlardan düşüyor.","Sıcak bir ceket giyerim ve işe şemsiye alırım. Akşam sıcak çay içer ve evde kitap okurum. Kedim kanepede uyur. Sonbaharı severim çünkü sessiz."],"gloss":{"leaf":"yaprak","umbrella":"şemsiye","sofa":"kanepe","quiet":"sessiz","wet":"ıslak","autumn":"sonbahar"},"cat":"doga"},{"id":"t003","title":"My New Phone","topic":"Teknoloji","date":"2026-10-26","paragraphs":["I bought a new phone last week. It has a good camera and a big screen. I use it every day. I send messages to my friends, and I listen to music on the bus.","My sister uses it to learn English. She plays word games and reads short stories. But my father says, \"Do not look at the phone all day.\" He is right. I put it in my bag at dinner."],"tr":["Geçen hafta yeni bir telefon aldım. İyi bir kamerası ve büyük bir ekranı var. Her gün kullanırım. Arkadaşlarıma mesaj gönderirim ve otobüste müzik dinlerim.","Kız kardeşim onu İngilizce öğrenmek için kullanır. Kelime oyunları oynar ve kısa hikayeler okur. Ama babam \"Bütün gün telefona bakma\" der. Haklı. Akşam yemeğinde onu çantama koyarım."],"gloss":{"screen":"ekran","music":"müzik","story":"hikaye","phone":"telefon"},"cat":"teknoloji"},{"id":"t004","title":"The Weekend Match","topic":"Spor","date":"2026-10-25","paragraphs":["On Saturday, we watched a football match on television. Our team played very well. The goalkeeper stopped two important goals.","In the second half, a young player scored a great goal. The crowd stood up and shouted. At the end, we won three to one. My brother was so happy that he called all his friends."],"tr":["Cumartesi günü televizyonda bir futbol maçı izledik. Takımımız çok iyi oynadı. Kaleci iki önemli golü önledi.","İkinci yarıda genç bir oyuncu harika bir gol attı. Kalabalık ayağa kalktı ve bağırdı. Sonunda üçe bir kazandık. Kardeşim o kadar mutluydu ki bütün arkadaşlarını aradı."],"gloss":{"crowd":"kalabalık","shout":"bağırmak","stand":"ayakta durmak","stood":"ayağa kalktı","score":"gol atmak","won":"kazandı","win":"kazanmak","play":"oynamak","team":"takım","match":"maç","half":"yarı","saturday":"cumartesi"},"cat":"spor"},{"id":"t005","title":"A Healthy Breakfast","topic":"Sağlık","date":"2026-10-24","paragraphs":["A good breakfast gives you energy for the day. In my house, we eat white cheese, olives, tomatoes, and fresh bread. Sometimes my mother makes eggs.","I drink a glass of milk or a cup of tea. We do not eat too much sugar. Doctors say that breakfast is important for your health. I never skip it. What do you eat in the morning?"],"tr":["İyi bir kahvaltı size gün boyu enerji verir. Evimizde beyaz peynir, zeytin, domates ve taze ekmek yeriz. Bazen annem yumurta yapar.","Bir bardak süt ya da bir fincan çay içerim. Çok fazla şeker yemeyiz. Doktorlar kahvaltının sağlık için önemli olduğunu söyler. Onu asla atlamam. Sabahları ne yersin?"],"gloss":{"tomato":"domates","olive":"zeytin","milk":"süt","sugar":"şeker","skip":"atlamak","health":"sağlık","too":"çok fazla, de/da","never":"asla"},"cat":"saglik"},{"id":"t006","title":"At the Doctor","topic":"Sağlık","date":"2026-10-23","paragraphs":["It is the flu season. Many people have a cough and a headache. Yesterday, I felt tired and hot, so I went to the doctor.","He looked at my throat and listened to my heart. He said, \"You have a cold. Stay at home, drink warm water, and rest.\" He gave me some medicine. Today I feel better. Wash your hands often and keep warm."],"tr":["Grip mevsimi. Birçok insanın öksürüğü ve baş ağrısı var. Dün yorgun ve sıcak hissettim, bu yüzden doktora gittim.","Boğazıma baktı ve kalbimi dinledi. \"Üşütmüşsün. Evde kal, ılık su iç ve dinlen\" dedi. Bana biraz ilaç verdi. Bugün daha iyi hissediyorum. Ellerinizi sık sık yıkayın ve sıcak tutun."],"gloss":{"flu":"grip","headache":"baş ağrısı","throat":"boğaz","medicine":"ilaç","cold":"nezle, soğuk","stay":"kalmak","often":"sık sık","went":"gitti","wash":"yıkamak"},"cat":"saglik"},{"id":"t007","title":"Winter Shopping","topic":"Alışveriş","date":"2026-10-22","paragraphs":["Winter is coming, so I need new clothes. On Sunday, I went to the market with my mother. We looked at coats, hats, gloves, and warm socks. Everything was expensive.","At last, we found a nice brown coat at a cheap price. I paid at the cashier by card. We also bought a blue scarf for my father. We came home tired but happy."],"tr":["Kış geliyor, bu yüzden yeni kıyafetlere ihtiyacım var. Pazar günü annemle çarşıya gittim. Paltolara, şapkalara, eldivenlere ve sıcak çoraplara baktık. Her şey pahalıydı.","Sonunda ucuz bir fiyata güzel bir kahverengi palto bulduk. Kasada kartla ödedim. Babam için de mavi bir atkı aldık. Eve yorgun ama mutlu geldik."],"gloss":{"clothes":"kıyafet","coat":"palto","expensive":"pahalı","scarf":"atkı","winter":"kış","sunday":"pazar","paid":"ödedi","pay":"ödemek","bought":"satın aldı","last":"son"},"cat":"gunluk"},{"id":"t008","title":"Halloween Party","topic":"Eğlence","date":"2026-10-21","paragraphs":["This Friday is Halloween. My friend has a party at her house. We wear funny clothes and masks. I want to be a king, but my brother wants to be a doctor.","There is a big cake and a lot of candy. We play games and dance. At midnight, we tell scary stories. My mother says we must be home before twelve."],"tr":["Bu cuma Cadılar Bayramı. Arkadaşımın evinde bir parti var. Komik kıyafetler ve maskeler giyeriz. Ben kral olmak istiyorum ama kardeşim doktor olmak istiyor.","Büyük bir pasta ve bir sürü şeker var. Oyun oynar ve dans ederiz. Gece yarısı korkunç hikayeler anlatırız. Annem on ikiden önce evde olmamız gerektiğini söyler."],"gloss":{"halloween":"Cadılar Bayramı","party":"parti","funny":"komik","mask":"maske","dance":"dans etmek","midnight":"gece yarısı","scary":"korkunç","story":"hikaye","must":"-meli, -malı","tell":"anlatmak","clothes":"kıyafet","friday":"cuma"},"cat":"gunluk"},{"id":"t009","title":"By Train","topic":"Ulaşım","date":"2026-10-20","paragraphs":["I go to work by train every day. The station is five minutes from my house. I buy a ticket at the machine and wait on the platform.","The train is usually on time, but sometimes it is late because of heavy rain. On the train, I read the newspaper or listen to the radio. People are quiet and tired in the morning. I get off at the city center and walk to the office."],"tr":["Her gün işe trenle giderim. İstasyon evimden beş dakika uzaklıkta. Makineden bilet alır ve peronda beklerim.","Tren genellikle zamanında gelir ama bazen şiddetli yağmur yüzünden geç kalır. Trende gazete okur ya da radyo dinlerim. İnsanlar sabahları sessiz ve yorgun. Şehir merkezinde inerim ve ofise yürürüm."],"gloss":{"platform":"peron","quiet":"sessiz","minute":"dakika","station":"istasyon","usually":"genellikle","sometimes":"bazen","because":"çünkü","tired":"yorgun","get off":"inmek","off":"-den (inmek)"},"cat":"gezi"},{"id":"t010","title":"Learning English","topic":"Dil","date":"2026-10-19","paragraphs":["English is an important language. It is useful for travel, work, and the internet. I learn ten words every week. First, I read a short text.","Then I write new sentences in my notebook and say them aloud. I also watch a film in English with subtitles. It is not easy, but I enjoy it. Step by step, I understand more."],"tr":["İngilizce önemli bir dildir. Seyahat, iş ve internet için faydalıdır. Her hafta on kelime öğrenirim. Önce kısa bir metin okurum.","Sonra defterime yeni cümleler yazar ve yüksek sesle söylerim. Ayrıca İngilizce altyazılı film izlerim. Kolay değil ama keyif alırım. Adım adım daha çok anlarım."],"gloss":{"subtitle":"altyazı","step":"adım","travel":"seyahat","ten":"on","week":"hafta","useful":"faydalı","understand":"anlamak","write":"yazmak","text":"metin","say":"söylemek"},"cat":"gunluk"}];
/* ===== StorageService ===== */
const StorageService=(()=>{let K=null;let mem=null;
 const base=()=>({v:1,progress:{},settings:{activeSize:10},stats:{last:'',streak:0,today:{d:'',n:0}}});
 return{use(k){K=k;mem=null},base,load(){if(!K)return base();try{const s=localStorage.getItem(K);if(s){const o=JSON.parse(s);if(o&&o.v===1)return o}}catch(e){}return mem||base()},
  save(st){if(!K)return;mem=st;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}},
  reset(){mem=null;try{if(K)localStorage.removeItem(K)}catch(e){}return base()},drop(k){try{localStorage.removeItem(k)}catch(e){}}}})();
let S=StorageService.base();
const save=()=>StorageService.save(S);
/* ===== profiles ===== */
const LEGACY='kelime_state_v1';
const PS=(()=>{const K='kelime_profiles_v1';let m={v:1,active:null,list:[]};try{const s=localStorage.getItem(K);if(s){const o=JSON.parse(s);if(o&&o.v===1&&Array.isArray(o.list))m=o}}catch(e){}
 return{m:()=>m,save(){try{localStorage.setItem(K,JSON.stringify(m))}catch(e){}}}})();
const curP=()=>PS.m().list.find(x=>x.id===PS.m().active)||null;
function bootProfile(){const p=curP();if(p){StorageService.use(p.key);S=StorageService.load()}else{StorageService.use(null);S=StorageService.base()}}
function mkProfile(name,av){const m=PS.m(),id='p'+Date.now().toString(36);let legacy=false;try{legacy=localStorage.getItem(LEGACY)!==null}catch(e){}
 const key=(legacy&&!m.list.some(x=>x.key===LEGACY))?LEGACY:'kelime_p_'+id;
 m.list.push({id,name:(name||'').trim().slice(0,24)||'Ben',av,key,created:Date.now()});m.active=id;PS.save();bootProfile();ensureActive()}
function switchP(id){PS.m().active=id;PS.save();bootProfile();ensureActive()}
function delP(id){const m=PS.m(),p=m.list.find(x=>x.id===id);if(!p)return;StorageService.drop(p.key);m.list=m.list.filter(x=>x.id!==id);if(m.active===id)m.active=m.list[0]?m.list[0].id:null;PS.save();bootProfile();if(curP())ensureActive()}
bootProfile();
/* ===== sound ===== */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,d,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(vol||.15,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.03)}
function sfx(k){if(S.settings&&S.settings.sound===false)return;
 if(k==='ok'){tone(659,0,.12,'sine',.2);tone(880,.09,.22,'sine',.2)}
 else if(k==='bad'){tone(233,0,.16,'triangle',.22);tone(175,.12,.28,'triangle',.22);try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}}
 else if(k==='tap'){tone(1100,0,.04,'square',.035)}
 else if(k==='done'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.24,'sine',.17))}}
